<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>AI Dersleri Sınıfı</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script>window.__LOCAL=/*__LOCAL__*/null;</script></head><body>
<title>AI Dersleri Sınıfı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a classroom shell (module sidebar + lesson column + sticky lesson rail). Every module owns a hue; lessons are built from typed blocks; the flow is a zoomable node canvas like a Magnific Space. */
:root{
  --bg:#F2F2EE; --surface:#FFFFFF; --surface-2:#F8F8F5; --ink:#16171A; --muted:#5B5D65; --faint:#8A8C94; --line:#E0E0D9; --line-2:#ECECE6;
  --accent:#DD4F24; --accent-soft:#FBE6DD; --accent-ink:#FFFFFF;
  --teal:#0E857C; --teal-soft:#DCF1EE; --violet:#6A52C8; --violet-soft:#ECE8FA; --blue:#2E62D9; --blue-soft:#E3EBFB;
  --amber:#B7791F; --amber-soft:#FBF0DA; --rose:#C93A5E; --rose-soft:#FBE4EA; --good:#1F8A4C; --good-soft:#DFF3E7;
  --m1:#DD4F24; --m2:#2E62D9; --m3:#7A4FD0; --m4:#C93A5E; --m5:#0E857C; --m6:#B7791F; --m7:#3F7F2C; --m8:#1B7EAD; --m9:#5A5F6E; --m10:#A8432A;
  --canvas:#E7E7E1; --dot:#CBCBC3; --node:#FFFFFF; --node-line:#D8D8D1; --group:rgba(23,24,27,.035); --group-line:rgba(23,24,27,.14);
  --scrim:rgba(20,20,18,.32);
  --shadow:0 1px 2px rgba(20,20,15,.06),0 6px 18px rgba(20,20,15,.06);
  --shadow-lg:0 2px 6px rgba(20,20,15,.08),0 18px 40px rgba(20,20,15,.12);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --side:300px; --topH:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --surface:#191A1E; --surface-2:#1F2025; --ink:#EDEDEA; --muted:#A5A7AF; --faint:#7C7E86; --line:#2C2E34; --line-2:#24262B;
  --accent:#FF7B4F; --accent-soft:#3A2018; --accent-ink:#1A0E09;
  --teal:#43C8BC; --teal-soft:#132E2B; --violet:#A894FF; --violet-soft:#26213D; --blue:#7EA6FF; --blue-soft:#1A2540;
  --amber:#E9B45A; --amber-soft:#33281A; --rose:#FF7F9E; --rose-soft:#3A1A24; --good:#5BD08B; --good-soft:#163222;
  --m1:#FF7B4F; --m2:#7EA6FF; --m3:#B394FF; --m4:#FF7F9E; --m5:#43C8BC; --m6:#E9B45A; --m7:#8FD06B; --m8:#5EC2F0; --m9:#A9AEBD; --m10:#F08A6C;
  --canvas:#0D0E10; --dot:#26282D; --node:#1A1C20; --node-line:#2F3137; --group:rgba(255,255,255,.025); --group-line:rgba(255,255,255,.12);
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 18px 44px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#191A1E; --surface-2:#1F2025; --ink:#EDEDEA; --muted:#A5A7AF; --faint:#7C7E86; --line:#2C2E34; --line-2:#24262B;
  --accent:#FF7B4F; --accent-soft:#3A2018; --accent-ink:#1A0E09;
  --teal:#43C8BC; --teal-soft:#132E2B; --violet:#A894FF; --violet-soft:#26213D; --blue:#7EA6FF; --blue-soft:#1A2540;
  --amber:#E9B45A; --amber-soft:#33281A; --rose:#FF7F9E; --rose-soft:#3A1A24; --good:#5BD08B; --good-soft:#163222;
  --m1:#FF7B4F; --m2:#7EA6FF; --m3:#B394FF; --m4:#FF7F9E; --m5:#43C8BC; --m6:#E9B45A; --m7:#8FD06B; --m8:#5EC2F0; --m9:#A9AEBD; --m10:#F08A6C;
  --canvas:#0D0E10; --dot:#26282D; --node:#1A1C20; --node-line:#2F3137; --group:rgba(255,255,255,.025); --group-line:rgba(255,255,255,.12);
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 18px 44px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{flex:none}
.mc{--mc:var(--m1)}
.mc-soft{background:color-mix(in srgb,var(--mc) 13%,var(--surface))}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--topH);display:flex;align-items:center;gap:12px;padding:0 18px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.brand-mark svg{width:17px;height:17px}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-size:13.5px;color:var(--muted);overflow:hidden}
.crumbs a{text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--faint)}
.crumbs .last{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.prog-pill{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px 4px 5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.prog-pill svg{width:26px;height:26px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.menu-btn{display:none}
.back-btn{display:none}
html,body,button,a,input,textarea,label,.node,[role="button"]{touch-action:manipulation}
.read-prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0;transition:width .1s linear}

/* ---------- shell + sidebar ---------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.side{position:sticky;top:calc(var(--topH) + env(safe-area-inset-top,0px));height:calc(100vh - var(--topH) - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);padding:16px 12px 32px;background:var(--bg);overscroll-behavior:contain}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 10px;margin:0 2px 14px}
.search:focus-within{border-color:var(--ink)}
.search input{border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);width:100%;min-width:0}
.search svg{width:16px;height:16px;color:var(--faint)}
.search kbd{font-family:var(--f-mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.side-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--faint);margin:6px 8px 14px}
.side-legend span{display:inline-flex;align-items:center;gap:5px}
.mod{margin-bottom:4px;--mc:var(--m1)}
.mod-h{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:8px;border-radius:10px}
.mod-h:hover{background:var(--surface)}
.mod-dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11.5px;font-weight:500;color:var(--mc);background:color-mix(in srgb,var(--mc) 14%,var(--surface))}
.mod-t{min-width:0}
.mod-name{display:block;font-weight:600;font-size:14px;line-height:1.3}
.mod-bar{display:block;height:3px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}
.mod-bar i{display:block;height:100%;background:var(--mc);border-radius:9px}
.mod-count{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.mod-list{list-style:none;margin:2px 0 10px 21px;padding:0 0 0 10px;border-left:1px solid var(--line)}
.mod[data-open="false"] .mod-list{display:none}
.li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:start;gap:8px;padding:6px 8px;border-radius:9px;font-size:13.5px;line-height:1.38;text-decoration:none;color:var(--ink)}
.li:hover{background:var(--surface)}
.li.cur{background:var(--surface);box-shadow:inset 3px 0 0 var(--mc),var(--shadow)}
.li .si{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.li .si svg{width:11px;height:11px}
.li.st-pub .si{border:2px solid var(--mc)}
.li.st-done .si{background:var(--good);color:var(--surface)}
.li .si[data-tick]{cursor:pointer;position:relative;transition:transform .15s,background .15s}
.li .si[data-tick]::before{content:"";position:absolute;inset:-7px}
.li .si[data-tick]:hover{transform:scale(1.15)}
.li.st-pub .si[data-tick]:hover{background:color-mix(in srgb,var(--mc) 22%,transparent)}
.li.st-up{color:var(--muted)}
.li.st-up .si{border:1.5px dashed var(--faint);color:var(--faint)}
.li.st-up .si svg{width:10px;height:10px}
.li .ln{font-family:var(--f-mono);font-size:11px;color:var(--faint);padding-top:2px}
.li .bdg{font-size:12px;margin-left:3px}
.hit{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 1px}
.scrim{display:none}

/* ---------- main ---------- */
.main{min-width:0;padding:28px clamp(16px,3.6vw,44px) 90px}
.col{max-width:900px;margin:0 auto}
.col.wide{max-width:1120px}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.018em;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,4.2vw,46px);line-height:1.06;font-weight:800}
h2{font-size:clamp(21px,2.4vw,26px);line-height:1.2;font-weight:700}
h3{font-size:18px;line-height:1.3;font-weight:700}
p{margin:0 0 12px}
.lead{font-size:18px;color:var(--muted);max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:10px 16px;font-weight:600;font-size:14.5px;border:1px solid var(--line);background:var(--surface);text-decoration:none;line-height:1.2;transition:transform .15s,border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn svg{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;line-height:1.4;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);text-decoration:none;white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.mod-p{background:color-mix(in srgb,var(--mc) 13%,var(--surface));border-color:transparent;color:var(--mc)}
.pill.genhq{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.pill.new{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.pill.done{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pill.up{border-style:dashed}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--mc,var(--accent));transition:width .5s}
.bar>i.pub{background:color-mix(in srgb,var(--mc,var(--accent)) 30%,var(--line))}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:40px 0 14px}
.sec-title p{margin:0;color:var(--muted);font-size:14px}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.rise{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}

/* ---------- home ---------- */
.home-hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;margin-top:20px}
.hcard{position:relative;overflow:hidden;border-radius:22px;padding:26px;background:var(--ink);color:var(--bg);min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
.hcard::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 120% at 100% 0%,color-mix(in srgb,var(--mc) 55%,transparent),transparent 60%);opacity:.55;pointer-events:none}
.hcard>*{position:relative}
.hcard .eyebrow{color:color-mix(in srgb,var(--bg) 62%,var(--ink))}
.hcard h2{font-size:clamp(24px,2.8vw,32px);margin:10px 0 8px;line-height:1.12}
.hcard .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:color-mix(in srgb,var(--bg) 72%,var(--ink));margin-bottom:18px}
.hcard .meta span{display:inline-flex;align-items:center;gap:6px}
.hcard .meta svg{width:14px;height:14px}
.hcard .acts{display:flex;flex-wrap:wrap;gap:10px}
.hcard .btn.ghost{color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent)}
.hcard .btn.ghost:hover{border-color:var(--bg)}
.mini{width:190px;max-width:100%;height:auto;opacity:.95}
.mini .e{stroke:color-mix(in srgb,var(--bg) 40%,var(--ink));stroke-width:1.4;fill:none}
.mini rect{rx:3}
.mini .c-plan{fill:var(--amber)}.mini .c-txt{fill:var(--teal)}.mini .c-gen{fill:var(--accent)}.mini .c-edit{fill:var(--violet)}.mini .c-tool{fill:var(--blue)}.mini .c-out{fill:var(--good)}
.hside{display:grid;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.ringrow{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px}
.ring .bgc{stroke:var(--line)}.ring .pc{stroke:color-mix(in srgb,var(--accent) 35%,var(--line))}.ring .dc{stroke:var(--good)}
.ring text{font-family:var(--f-display);font-weight:800;fill:var(--ink)}
.kv{display:grid;gap:4px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv b{color:var(--ink);font-weight:700}
.kv i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.nextc{display:block;text-decoration:none}
.nextc:hover{border-color:var(--ink)}
.nextc .when{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--accent)}
.nextc .when svg{width:14px;height:14px}
.nextc h3{font-size:16.5px;margin:6px 0 4px}
.nextc small{color:var(--muted);font-size:13px}
.roadmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.rm{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;min-width:0;transition:transform .18s,box-shadow .18s,border-color .18s}
.rm:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--mc) 50%,var(--line))}
.rm .top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rm .num{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--mc)}
.rm .t{font-family:var(--f-display);font-weight:700;font-size:16.5px;line-height:1.22}
.rm .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rm.is-cur{border-color:var(--mc);box-shadow:0 0 0 3px color-mix(in srgb,var(--mc) 20%,transparent)}
.st-chip{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.st-chip.done{background:var(--good-soft);color:var(--good)}
.st-chip.cur{background:color-mix(in srgb,var(--mc) 15%,var(--surface));color:var(--mc)}
.st-chip.soon{border:1px dashed var(--line);color:var(--faint)}
.home-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row-a{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:13px;background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:border-color .15s}
.row-a:hover{border-color:var(--mc)}
.row-a .rn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--mc);background:color-mix(in srgb,var(--mc) 13%,var(--surface))}
.row-a .rn svg{width:16px;height:16px}
.row-a .rt{min-width:0}
.row-a .rt b{display:block;font-size:14.5px;line-height:1.3;font-weight:600}
.row-a .rt small{font-size:13px;color:var(--muted)}
.row-a .rr{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.row-a .rr svg{width:14px;height:14px}
.row-a .rt small .pill{font-size:12px;padding:0 7px;margin-left:4px;vertical-align:1px}
.row-a.up{background:transparent;border-style:dashed}
.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:h}
.howto li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:14px;color:var(--muted);min-width:0}
.howto li b{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;margin-bottom:4px}
.howto li b::before{counter-increment:h;content:counter(h);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500;flex:none}
.howto ol{margin:0;padding:0;display:contents}

/* ---------- module page ---------- */
.mhead{border-radius:22px;padding:26px;background:color-mix(in srgb,var(--mc) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--mc) 25%,var(--line));margin-bottom:22px}
.mhead .num{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--mc)}
.mhead h1{margin:6px 0 12px}
.mhead .stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);margin-bottom:14px;font-variant-numeric:tabular-nums}
.mhead .stats b{color:var(--ink)}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:26px}

/* ---------- upcoming page ---------- */
.upbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:18px;border-radius:18px;border:1px dashed color-mix(in srgb,var(--mc) 50%,var(--line));background:color-mix(in srgb,var(--mc) 7%,var(--surface));margin:20px 0}
.upbox .cal{width:64px;height:64px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--mc)}
.upbox .cal svg{width:28px;height:28px}
.upbox b{display:block;font-family:var(--f-display);font-size:20px}
.upbox span{color:var(--muted);font-size:14px}
.expect{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0 20px}
.expect div{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;color:var(--muted)}
.expect svg{width:18px;height:18px;color:var(--mc);margin-top:2px}
.expect b{display:block;color:var(--ink);font-size:14.5px}

/* ---------- lesson ---------- */
.lwrap{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:40px;max-width:1180px;margin:0 auto}
.lcol{min-width:0;max-width:880px}
.lh{margin-bottom:22px}
.lh .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.lh .no{font-family:var(--f-display);font-weight:800;color:var(--mc);font-size:clamp(16px,1.6vw,19px);display:block;margin-bottom:6px}
.summ{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
.summ a{display:flex;flex-direction:column;gap:2px;text-decoration:none;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0;transition:border-color .15s,transform .15s}
.summ a:hover{border-color:var(--mc);transform:translateY(-1px)}
.summ b{font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.summ span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.summ svg{width:14px;height:14px}
.toc-m{display:none;position:sticky;top:calc(var(--topH) + env(safe-area-inset-top,0px));z-index:20;margin:16px -4px 0;padding:8px 4px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.toc-m::-webkit-scrollbar{display:none}
.toc-m a{display:inline-flex;align-items:center;gap:6px;font-size:13px;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 11px;background:var(--surface);margin-right:6px}
.toc-m a.on{color:var(--accent-ink);background:var(--mc);border-color:var(--mc)}
.toc-m a svg{width:13px;height:13px}
.rail{position:sticky;top:calc(var(--topH) + 24px);align-self:start;display:grid;gap:14px}
.rail .rt{font-family:var(--f-mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 4px 10px}
.rail nav{display:grid;gap:2px;border-left:2px solid var(--line);margin-left:2px}
.rail nav a{display:flex;align-items:center;gap:9px;padding:6px 10px;margin-left:-2px;border-left:2px solid transparent;text-decoration:none;font-size:13.5px;color:var(--muted);line-height:1.3}
.rail nav a:hover{color:var(--ink)}
.rail nav a.on{color:var(--ink);font-weight:600;border-left-color:var(--mc)}
.rail nav a svg{width:15px;height:15px}
.rail nav a.on svg{color:var(--mc)}
.rail .card{padding:14px}
.rail .card p{font-size:13px;color:var(--muted);margin:6px 0 10px}
.done-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:10px 12px;font-weight:700;font-size:14px;border:1.5px solid var(--good);background:transparent;color:var(--good);transition:background .2s,color .2s,transform .15s}
.done-btn svg{width:16px;height:16px}
.done-btn.on{background:var(--good);color:var(--surface)}
.done-btn.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.05)}}
.sec{margin:46px 0;scroll-margin-top:calc(var(--topH) + 64px)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sh .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.sh .ic svg{width:18px;height:18px}
.sh .tx{flex:1;min-width:0}
.sh .tx small{display:block;font-size:13px;color:var(--muted);line-height:1.3;margin-top:2px}
.sh .act{margin-left:auto}
.c-accent{background:var(--accent-soft);color:var(--accent)}.c-teal{background:var(--teal-soft);color:var(--teal)}.c-violet{background:var(--violet-soft);color:var(--violet)}
.c-blue{background:var(--blue-soft);color:var(--blue)}.c-amber{background:var(--amber-soft);color:var(--amber)}.c-rose{background:var(--rose-soft);color:var(--rose)}
.c-good{background:var(--good-soft);color:var(--good)}.c-faint{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.prose{max-width:70ch}
.prose p,.prose li{font-size:16.5px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 14px}
.prose li{margin:5px 0}
.prose li::marker{color:var(--faint)}
.prose strong{font-weight:700}
.prose code,.code-i{font-family:var(--f-mono);font-size:.84em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;word-break:break-word}
.prose a{color:var(--accent);text-underline-offset:3px}
.prose h3,.prose h4{margin:20px 0 8px;font-size:17px}
.lead-k{font-weight:700}
.callout{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;border-radius:16px;padding:16px 18px;margin:18px 0;background:var(--amber-soft);max-width:70ch}
.callout .ci{width:30px;height:30px;border-radius:9px;background:var(--surface);display:grid;place-items:center;color:var(--amber)}
.callout .ci svg{width:16px;height:16px}
.callout .ck{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}
.callout p{margin:0;font-size:16px}
.callout.rule{background:var(--accent-soft)}
.callout.rule .ci,.callout.rule .ck{color:var(--accent)}
.tablewrap{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
/* quiz */
.quiz{display:grid;gap:10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.q .qt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;font-weight:600;font-size:16px}
.q .qn{width:28px;height:28px;border-radius:50%;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.q .qb{margin:10px 0 0 40px;background:none;border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.q .qb:hover{border-color:var(--violet);color:var(--violet)}
.q .qa{margin:10px 0 0 40px;padding:10px 14px;border-radius:12px;background:var(--surface-2);color:var(--ink);font-size:15px}
/* terms */
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.term .tn{font-weight:700;font-size:15.5px;line-height:1.3}
.term .td{font-size:14px;color:var(--muted);line-height:1.45;transition:filter .25s,opacity .25s}
.term .te{margin-top:auto;display:flex;flex-wrap:wrap;gap:4px;padding-top:4px}
.term .te span{font-family:var(--f-mono);font-size:11.5px;background:var(--teal-soft);color:var(--teal);border-radius:6px;padding:2px 6px}
.terms.memo .term{cursor:pointer}
.terms.memo .term:not(.rev) .td{filter:blur(6px);opacity:.55;user-select:none}
.terms.memo .term:not(.rev)::after{content:"Tanımı görmek için tıkla";font-size:11.5px;color:var(--faint)}
.tgl{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.tgl[aria-pressed="true"]{background:var(--teal-soft);border-color:transparent;color:var(--teal)}
.tgl svg{width:14px;height:14px}
/* prompts */
.prompts{display:grid;gap:14px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pc .ph{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.pc .ph .pn{font-family:var(--f-mono);font-size:11.5px;color:var(--teal);background:var(--teal-soft);border-radius:6px;padding:2px 7px}
.pc .ph b{font-size:14.5px;line-height:1.3;flex:1;min-width:0}
.pc pre{margin:0;padding:14px 16px;font-family:var(--f-mono);font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;background:var(--surface-2);max-height:260px;overflow:auto}
.pc pre .tg{color:var(--teal);font-weight:500}
.pc pre .qs{color:var(--accent)}
.pc .pd{padding:12px 16px;font-size:15px;color:var(--muted)}
.copy{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:600}
.copy:hover{border-color:var(--ink)}
.copy svg{width:14px;height:14px}
.copy.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
/* mistakes */
.mist{display:grid;gap:10px;list-style:none;padding:0;margin:0}
.mist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15.5px}
.mist .x{width:26px;height:26px;border-radius:8px;background:var(--rose-soft);color:var(--rose);display:grid;place-items:center}
.mist .x svg{width:14px;height:14px}
.mist strong{display:block;margin-bottom:2px}
/* genhq */
.gq-box{background:var(--blue-soft);border-radius:18px;padding:20px 22px}
.gq-box .prose a{color:var(--blue)}
/* homework */
.hw{background:var(--surface);border:1.5px solid var(--good);border-radius:18px;padding:20px 22px}
.hw-list{list-style:none;margin:6px 0 14px;padding:0;display:grid;gap:8px}
.hw-list label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:15.5px}
.hw-list input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--good)}
.hw-list label.ok{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.hw-list label.ok .t{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--good) 60%,transparent)}
.hw-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.endcard{margin-top:46px;border-radius:20px;padding:22px;background:var(--surface);border:1px solid var(--line);display:grid;gap:16px}
.endcard .navs{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.endcard .nx{font-size:14px;color:var(--muted)}
.endcard .nx b{color:var(--ink)}
.sources{font-size:14px;color:var(--muted)}
.sources .prose li{font-size:14px}
/* steps list */
.scen{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--mc);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.scen p{margin:0}
.steps{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .2s,background .2s}
.steps li:hover{border-color:var(--faint)}
.steps li.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.steps .sn{width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.steps li.on .sn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps .sb{font-size:15.5px;min-width:0}
.steps .sb p{margin:0}
.steps .nodes{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.steps .nodes span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:7px;padding:2px 7px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.steps .nodes span i{width:7px;height:7px;border-radius:2px}

/* ===== FLOW CANVAS ===== */
.flow{position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface);margin:6px 0 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;outline:0}
.flow-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 16px;border-bottom:1px solid var(--line)}
.flow-top .ft{flex:1 1 300px;min-width:0}
.flow-top .ft b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.25;letter-spacing:-.01em}
.flow-top .ft span{font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--surface-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:18px;height:3px;border-radius:2px}
.legend .sq{width:10px;height:10px;border-radius:3px}
.legend .gap{width:1px;height:14px;background:var(--line);margin:0 4px}
.fstage{position:relative;flex:1;min-height:0}
.cwrap{position:relative;display:flex;overflow:auto;height:clamp(400px,64vh,700px);background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:18px 18px;cursor:grab;overscroll-behavior:contain;touch-action:pan-x pan-y;scrollbar-width:thin}
.flow.engaged .cwrap{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
.cwrap.drag{cursor:grabbing;user-select:none}
.sizer{position:relative;margin:auto;flex:none}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0;display:grid;grid-auto-rows:auto;column-gap:84px;row-gap:42px;padding:64px 48px 48px;width:max-content}
.canvas svg.edges{position:absolute;left:0;top:0;pointer-events:none;z-index:1;overflow:visible}
.grp{position:relative;z-index:0;margin:-40px -24px -22px;border:1.5px dashed var(--group-line);background:var(--group);border-radius:18px;pointer-events:none}
.grp span{position:absolute;top:10px;left:14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--canvas);padding:0 6px;border-radius:5px}
.node{position:relative;z-index:2;align-self:start;background:var(--node);border:1px solid var(--node-line);border-radius:15px;box-shadow:var(--shadow);padding:0 0 12px;cursor:pointer;transition:opacity .35s,transform .35s,border-color .25s,box-shadow .25s;text-align:left;width:240px}
.node:hover{border-color:var(--faint);box-shadow:var(--shadow-lg)}
.node .nh{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.01em;border-radius:15px 15px 0 0}
.node .ico{width:22px;height:22px;border-radius:7px;display:grid;place-items:center}
.node .ico svg{width:13px;height:13px}
.node .sb{margin-left:auto;font-family:var(--f-mono);font-size:11px;min-width:22px;height:20px;padding:0 6px;border-radius:99px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.node .nt{padding:10px 12px 0;font-weight:700;font-size:14.5px;line-height:1.3}
.node .tool{padding:2px 12px 0;font-size:12px;color:var(--muted)}
.node .chips{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px 0}
.node .chips span{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.node .pv{padding:10px 12px 0}
.node .nx{padding:8px 12px 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.node .port{position:absolute;top:min(50%,60px);width:11px;height:11px;border-radius:50%;background:var(--node);border:2px solid var(--node-line);transform:translateY(-50%)}
.node .port.in{left:-6px}.node .port.out{right:-6px}
.node.end{border-color:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent),var(--shadow)}
.node.end .nh{color:var(--good)}
.node.sel{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 18%,transparent),var(--shadow-lg)}
.h-gen .ico{background:var(--accent-soft);color:var(--accent)}
.h-txt .ico{background:var(--teal-soft);color:var(--teal)}
.h-edit .ico{background:var(--violet-soft);color:var(--violet)}
.h-tool .ico{background:var(--blue-soft);color:var(--blue)}
.h-out .ico{background:var(--good-soft);color:var(--good)}
.h-plan .ico{background:var(--amber-soft);color:var(--amber)}
.h-gen .nh{box-shadow:inset 0 3px 0 var(--accent)}.h-txt .nh{box-shadow:inset 0 3px 0 var(--teal)}.h-edit .nh{box-shadow:inset 0 3px 0 var(--violet)}
.h-tool .nh{box-shadow:inset 0 3px 0 var(--blue)}.h-out .nh{box-shadow:inset 0 3px 0 var(--good)}.h-plan .nh{box-shadow:inset 0 3px 0 var(--amber)}
.flow.stepping .node{opacity:.25;transform:scale(.985)}
.flow.stepping .node.past{opacity:.6;transform:none}
.flow.stepping .node.on{opacity:1;transform:translateY(-3px);border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent),0 16px 34px rgba(0,0,0,.2)}
.flow.stepping .node.on .sb{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.edge{fill:none;stroke-width:2.2;transition:opacity .35s}
.edge.k-img{stroke:var(--accent)}.edge.k-txt{stroke:var(--teal)}.edge.k-ref{stroke:var(--violet);stroke-dasharray:7 5}.edge.k-f{stroke:var(--faint)}
.edge-flow{fill:none;stroke-width:2.2;stroke-dasharray:3 11;opacity:0;stroke:var(--surface)}
.flow.stepping .edge{opacity:.12}
.flow.stepping .edge.live{opacity:1}
.flow.stepping .edge-flow.live{opacity:.95;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.elabel{position:absolute;z-index:3;transform:translate(-50%,-50%);font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--node);border:1px solid var(--node-line);color:var(--muted);white-space:nowrap;pointer-events:none;transition:opacity .35s}
.elabel.k-img{color:var(--accent)}.elabel.k-txt{color:var(--teal)}.elabel.k-ref{color:var(--violet)}
.flow.stepping .elabel{opacity:.2}.flow.stepping .elabel.live{opacity:1}
.ftools{position:absolute;left:12px;bottom:12px;z-index:6;display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.ftools button{height:32px;min-width:32px;padding:0 8px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;font-size:12.5px;font-weight:600}
.ftools button:hover{background:var(--surface-2)}
.ftools button svg{width:16px;height:16px}
.ftools .zv{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:46px}
.ftools .sp{width:1px;height:20px;background:var(--line);margin:0 3px}
.mm{position:absolute;right:12px;bottom:12px;z-index:6;width:168px;height:104px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;cursor:crosshair}
.mm canvas{width:100%;height:100%;display:block}
.chint{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);padding:8px 14px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s}
.chint.show{opacity:1}
.chint svg{width:16px;height:16px}
.ndraw{position:absolute;top:12px;right:12px;bottom:126px;z-index:8;width:min(340px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
.ndraw .dh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ndraw .dh .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.ndraw .dh .ico svg{width:16px;height:16px}
.ndraw .dh small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.ndraw .dh b{display:block;font-size:15px;line-height:1.25}
.ndraw .dh .x{margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ndraw .dh .x svg{width:15px;height:15px}
.ndraw .db{padding:14px;overflow:auto;display:grid;gap:12px;align-content:start;font-size:14px}
.ndraw .lab{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.ndraw .full-txt{font-family:var(--f-mono);font-size:12px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;margin:0}
.ndraw .chips{display:flex;flex-wrap:wrap;gap:4px}
.ndraw .chips span{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.ndraw .conn{display:grid;gap:4px}
.ndraw .conn button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 9px;font-size:13px}
.ndraw .conn button:hover{border-color:var(--ink)}
.ndraw .conn i{width:14px;height:3px;border-radius:2px;flex:none}
.ndraw .conn small{color:var(--muted);margin-left:auto;font-size:11.5px}
.ndraw .stp{background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.ndraw .stp p{margin:0;font-size:14px}
.ndraw .pvbig .pv-txt{-webkit-line-clamp:unset;display:block}
.flow-bot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.ctrls{display:flex;gap:6px}
.ctrls button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ctrls button:hover{border-color:var(--ink)}
.ctrls button svg{width:16px;height:16px}
.ctrls button.play{background:var(--ink);color:var(--bg);border-color:var(--ink);width:auto;padding:0 14px;gap:7px;display:flex;align-items:center;font-size:13.5px;font-weight:600}
.stepinfo{min-width:0;font-size:14.5px;line-height:1.45}
.stepinfo .k{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);display:block;margin-bottom:2px}
.stepinfo p{margin:0}
.dots{grid-column:1/-1;display:flex;gap:4px}
.dots button{flex:1;height:6px;border-radius:99px;border:0;background:var(--line);padding:0}
.dots button:hover{background:var(--faint)}
.dots button.on{background:var(--accent)}
.dots button.past{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0;display:flex;flex-wrap:wrap;gap:4px 14px}
.hint span{display:inline-flex;align-items:center;gap:6px}
.hint svg{width:14px;height:14px}
body.flow-full{overflow:hidden}
.flow.full{position:fixed;inset:0;z-index:200;margin:0;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.flow.full .cwrap{height:100%}
.flow.full .fstage{display:flex}
.flow.full .fstage .cwrap{flex:1}

/* previews */
.pv-txt{font-family:var(--f-mono);font-size:11.5px;line-height:1.5;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.pv-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.pv-list li{display:flex;gap:7px;font-size:12px;line-height:1.35;color:var(--ink)}
.pv-list li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--faint);flex:none;margin-top:5px}
.thumb{position:relative;border-radius:9px;overflow:hidden;display:grid;place-items:center;margin:0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);max-width:100%}
.thumb .m{font-size:34px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.28))}
.thumb .tag{position:absolute;left:6px;right:6px;bottom:6px;font-size:10.5px;font-weight:600;line-height:1.25;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);border-radius:6px;padding:3px 6px}
.thumb .ar{position:absolute;top:6px;right:6px;font-family:var(--f-mono);font-size:9.5px;color:#fff;background:rgba(0,0,0,.42);border-radius:5px;padding:1px 5px}
.pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pv-grid .cell{display:flex;flex-direction:column;gap:3px;align-items:center}
.pv-grid .cell .thumb .m{font-size:22px}
.pv-grid .cell small{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2}
.pv-ba{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;gap:4px}
.pv-ba .arr{color:var(--faint);text-align:center;font-size:14px}
.pv-ba .thumb .m{font-size:24px}
.pv-rat{display:flex;align-items:flex-end;justify-content:center;gap:8px}
.pv-rat .fr{display:flex;flex-direction:column;align-items:center;gap:3px}
.pv-rat .fr small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.pv-rat .thumb .m{font-size:18px}
.pv-rat .thumb.new{outline:2px dashed var(--accent);outline-offset:-2px}
.pv-up{display:flex;align-items:flex-end;justify-content:center;gap:10px}
.pv-up .b{border:1.5px solid var(--faint);border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pv-up .b.big{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pv-sl{display:grid;gap:8px}
.pv-sl .r{display:grid;grid-template-columns:72px 1fr 34px;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.pv-sl .tr{height:4px;border-radius:99px;background:var(--line);position:relative}
.pv-sl .tr i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--node);border:2px solid var(--accent);transform:translate(-50%,-50%)}
.pv-sl .tr b{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.pv-sl .v{font-family:var(--f-mono);text-align:right;color:var(--ink)}
.pv-layers{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pv-layers div{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:5px 8px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.pv-layers div:last-child{border-bottom:0}
.pv-layers div:first-child{background:var(--blue-soft);color:var(--blue);font-weight:600}
.pv-layers svg{width:12px;height:12px;opacity:.7}
.pv-seed{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.pv-seed svg{width:14px;height:14px;color:var(--accent)}
.sk{position:relative;width:120px;height:150px;margin:0 auto;border:1.5px solid var(--faint);border-radius:6px;background:var(--surface-2)}
.sk .h{position:absolute;left:14px;right:14px;top:14px;height:16px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--faint) 0 6px,transparent 6px 9px);opacity:.6}
.sk .c{position:absolute;left:50%;bottom:22px;width:40px;height:46px;transform:translateX(-50%);border:1.5px dashed var(--accent);border-radius:6px 6px 14px 14px}
.sk .l{position:absolute;right:10px;bottom:8px;width:18px;height:10px;border:1.5px solid var(--faint);border-radius:2px}
.safe{position:relative;width:96px;height:170px;margin:0 auto;border-radius:9px;overflow:hidden}
.safe .band{position:absolute;left:0;right:0;height:28px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 4px,rgba(255,255,255,.15) 4px 8px);display:grid;place-items:center;font-size:9px;font-weight:700;color:#3a1d0f}
.cut{width:120px;height:110px;margin:0 auto;border-radius:9px;display:grid;place-items:center;background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0}
.cut span{font-size:38px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.mask{position:absolute;inset:16% 20% 24% 20%;border:2px dashed #fff;border-radius:46% 54% 50% 44%/52% 40% 60% 48%;box-shadow:0 0 0 999px rgba(0,0,0,.18)}
.mask.brush{border:0;inset:30% 14% 34% 18%;border-radius:40px;background:rgba(255,84,40,.45);box-shadow:none}
/* photo tones: image content, same in both themes */
.t-warm{background:radial-gradient(120% 90% at 70% 20%,#F6C98B 0,#C9783F 45%,#5E3018 100%)}
.t-gold{background:radial-gradient(120% 90% at 80% 10%,#FFE0A1 0,#E09A3B 40%,#6B3A12 100%)}
.t-day{background:linear-gradient(160deg,#F4F1EA 0,#D9E3EA 55%,#9FB2C1 100%)}
.t-hard{background:linear-gradient(135deg,#FFF8E1 0,#F2D27A 38%,#3B2A14 39%,#7A5A2A 100%)}
.t-dark{background:radial-gradient(70% 60% at 50% 30%,#5A4A3A 0,#1A1612 60%,#070605 100%)}
.t-grey{background:linear-gradient(160deg,#C9C9C5 0,#9D9D98 100%)}
.t-white{background:radial-gradient(90% 70% at 50% 40%,#FFFFFF 0,#ECECEA 70%,#D6D6D2 100%)}
.t-sea{background:linear-gradient(180deg,#BFD9E6 0,#7FA9C0 45%,#C79A62 46%,#8E5E34 100%)}
.t-blur{background:radial-gradient(14px 14px at 20% 25%,rgba(255,214,150,.9),transparent),radial-gradient(18px 18px at 75% 30%,rgba(255,190,120,.8),transparent),radial-gradient(12px 12px at 60% 15%,rgba(255,240,200,.9),transparent),linear-gradient(160deg,#6B4429,#2C1A10)}
.t-deco{background:repeating-conic-gradient(from 0deg at 50% 100%,#D4A84A 0 4deg,#111 4deg 14deg)}
.t-swiss{background:linear-gradient(90deg,#E8322B 0 62%,#F5F2EC 62% 100%)}
.t-pop{background:radial-gradient(#0000 38%,rgba(0,0,0,.25) 40%) 0 0/8px 8px,linear-gradient(135deg,#FFD12E,#FF4F7B)}
.t-riso{background:radial-gradient(circle at 30% 30%,#FF7F6B 0 34%,transparent 35%),linear-gradient(135deg,#1F9E9A,#13686A)}
.t-pastel{background:linear-gradient(135deg,#FCE3D3,#F6D7E8 50%,#D9EFE5)}
.t-marble{background:linear-gradient(115deg,transparent 40%,rgba(160,160,160,.35) 42%,transparent 46%),linear-gradient(160deg,#FAFAF8,#E4E2DD)}
.t-velvet{background:radial-gradient(60% 50% at 50% 25%,#3E7D5A 0,#163A28 55%,#08150E 100%)}
.t-rose{background:radial-gradient(120% 90% at 80% 10%,#FFD9CF 0,#D9927F 45%,#6B3A30 100%)}
.t-yellow{background:linear-gradient(160deg,#F3E2A6,#C9A55A 70%,#8A6A2A)}

/* loading / empty */
.empty{border:1px dashed var(--line);border-radius:18px;padding:30px;text-align:center;color:var(--muted)}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line) 0,var(--line-2) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}


/* quick links */
.qlinks{display:grid;gap:2px;margin:0 2px 10px}
.ql{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;color:var(--ink)}
.ql:hover{background:var(--surface)}
.ql.cur{background:var(--surface);box-shadow:var(--shadow)}
.ql svg{width:17px;height:17px;color:var(--muted)}
.ql.cur svg{color:var(--accent)}
.ql .badge{margin-left:auto;font-size:11.5px;font-weight:700;min-width:22px;text-align:center;border-radius:99px;padding:1px 7px;background:var(--accent);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.ql .badge.zero{background:var(--line);color:var(--muted)}
.side-sep{height:1px;background:var(--line);margin:2px 10px 12px}
/* text size */
.fs-btn{font-family:var(--f-display);font-weight:800;font-size:15px;width:auto;padding:0 10px}
body.fs-1 .prose p,body.fs-1 .prose li,body.fs-1 .steps .sb,body.fs-1 .callout p,body.fs-1 .mist li,body.fs-1 .q .qt,body.fs-1 .hw-list label,body.fs-1 .pc .pd{font-size:18px}
body.fs-2 .prose p,body.fs-2 .prose li,body.fs-2 .steps .sb,body.fs-2 .callout p,body.fs-2 .mist li,body.fs-2 .q .qt,body.fs-2 .hw-list label,body.fs-2 .pc .pd{font-size:19.5px}
body.fs-1 .term .td{font-size:15.5px}body.fs-2 .term .td{font-size:16.5px}
/* today row */
.home-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.card h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 svg{width:17px;height:17px;color:var(--muted)}
.streak{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.streak .fl{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.streak .fl svg{width:24px;height:24px}
.streak .fl.off{background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
.streak b{font-family:var(--f-display);font-size:26px;line-height:1}
.streak small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.goals{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.goals a{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;text-decoration:none;padding:8px 10px;border-radius:11px;border:1px solid var(--line);font-size:14px;line-height:1.3}
.goals a:hover{border-color:var(--ink)}
.goals .gc{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.goals .ok .gc{background:var(--good);border-color:var(--good);color:var(--surface)}
.goals .gc svg{width:12px;height:12px}
.goals small{color:var(--muted);font-size:12px;white-space:nowrap}
.goals .ok .gt{color:var(--muted);text-decoration:line-through}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:3px;overflow-x:auto;padding:2px 0}
.heat i{border-radius:3px;background:var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--good) 35%,var(--line))}
.heat i.l2{background:color-mix(in srgb,var(--good) 65%,var(--line))}
.heat i.l3{background:var(--good)}
.heat i.fut{background:transparent}
.heat i.tod{box-shadow:0 0 0 1.5px var(--ink)}
.heatlab{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.heatkey{display:inline-flex;align-items:center;gap:3px}
.heatkey i{width:10px;height:10px;border-radius:2px;display:inline-block}
.bignum{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.boxbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin:12px 0 6px}
.boxbar i{display:block;height:100%}
.boxlab{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);margin-bottom:12px}
.boxlab span{display:inline-flex;align-items:center;gap:4px}
.boxlab i{width:9px;height:9px;border-radius:2px;display:inline-block}
/* tool pages */
.ptop{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 6px}
.chipf{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chipf:hover{border-color:var(--ink)}
.chipf[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chipf small{font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.chipf svg{width:14px;height:14px}
.fsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;margin-top:18px}
.fsearch:focus-within{border-color:var(--ink)}
.fsearch input{border:0;outline:0;background:transparent;font:inherit;font-size:15.5px;color:var(--ink);width:100%;min-width:0}
.fsearch svg{width:17px;height:17px;color:var(--faint)}
.fcount{font-size:13px;color:var(--muted);margin:10px 0 0}
.gl-letter{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--faint);margin:24px 0 10px;scroll-margin-top:calc(var(--topH) + 20px)}
.az{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.az a{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;text-decoration:none;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.az a:hover{border-color:var(--ink)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gl .term{border-top:3px solid var(--mc)}
.from{font-size:12.5px;color:var(--muted);text-decoration:none;margin-top:6px;display:inline-flex;align-items:center;gap:5px}
.from:hover{color:var(--accent)}
.from svg{width:13px;height:13px}
.star{border:0;background:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--faint);flex:none}
.star:hover{background:var(--surface-2)}
.star.on{color:var(--amber)}
.star svg{width:18px;height:18px}
.pc .pfrom{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 16px 12px;font-size:12.5px;color:var(--muted)}
.cat{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
/* flashcards */
.fc-wrap{display:grid;gap:16px;max-width:700px;margin:22px auto 0}
.fc-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.fc-prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.fc-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.fc{position:relative;min-height:320px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:28px 30px;display:flex;flex-direction:column;gap:14px;cursor:pointer;border-top:6px solid var(--mc);outline-offset:4px}
.fc .kind{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mc)}
.fc .kind .bx{margin-left:auto;font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.fc .front{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.15;letter-spacing:-.015em}
.fc .front.q{font-size:clamp(19px,2.4vw,23px);font-weight:700;line-height:1.35;letter-spacing:0}
.fc .back{border-top:1px dashed var(--line);padding-top:16px;font-size:17px;line-height:1.55}
.fc .back .te{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.fc .back .te span{font-family:var(--f-mono);font-size:12.5px;background:var(--teal-soft);color:var(--teal);border-radius:6px;padding:2px 7px}
.fc .tap{margin-top:auto;font-size:13.5px;color:var(--faint);display:flex;align-items:center;gap:8px}
.fc .tap svg{width:16px;height:16px}
.fc .src{margin-top:auto}
.fc.flip{animation:flipin .35s ease}
@keyframes flipin{from{transform:perspective(900px) rotateX(8deg);opacity:.6}to{transform:none;opacity:1}}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rate button{border-radius:16px;padding:12px 8px;font-weight:700;font-size:15.5px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s,background .15s}

function inline(s) {

  t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>");
  t = t.replace(/\\([_*\[\]#])/g, "$1");

  return t;
}

    const ordered = isOl(lines[i]);

    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { if (i + 1 < lines.length && (isOl(lines[i + 1]) || isUl(lines[i + 1])) && indent(lines[i + 1]) >= base) { i++; continue; } break; }
      const ind = indent(l);
      if (ind < base) break;
      if (ind > base && (isOl(l) || isUl(l))) { h = h.replace(/<\/li>$/, "") + list(ind) + "</li>"; continue; }
      if (!(isOl(l) || isUl(l))) { h = h.replace(/<\/li>$/, " " + inline(l.trim()) + "</li>"); i++; continue; }
      h += "<li>" + inline(l.replace(/^\s*(\d+\.|[-*])\s+/, "")) + "</li>"; i++;
    }
    return h + (ordered ? "</ol>" : "</ul>");
  }
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^#{1,4}\s/.test(l)) { const lv = Math.min(4, l.match(/^#+/)[0].length + 1); out += `<h${lv}>${inline(l.replace(/^#+\s*/, ""))}</h${lv}>`; i++; continue; }
    if (/^\|/.test(l)) { const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]); out += table(rows); continue; }
    if (isOl(l) || isUl(l)) { out += list(indent(l)); continue; }
    if (RE_BA.test(l.trim())) { out += baHtml(l.trim()); i++; continue; }
    if (RE_IMG.test(l.trim())) { const figs = []; while (i < lines.length && RE_IMG.test(lines[i].trim())) figs.push(lines[i++].trim()); out += figsHtml(figs); continue; }

}

  const steps = get("Uygulama") ? listItems(get("Uygulama").body).length : 0;
  const prompts = get("Örnek prompt") ? get("Örnek prompt").body.split(/\n\s*\n/).filter(b => /^`[^`]+`$/.test(b.trim())).length : 0;
  return { terms: Math.max(0, terms), steps, prompts };
}
function miniFlow(F) {
  if (!F || !F.nodes || !F.nodes.length) return "";
  const cw = 26, rh = 22, w = 17, h = 12;
  const cols = Math.max(...F.nodes.map(n => n.c)) + 1, rows = Math.max(...F.nodes.map(n => n.r)) + 1;
  const P = id => { const n = F.nodes.find(x => x.id === id); return n ? { x: n.c * cw, y: n.r * rh } : null; };
  let e = "";
  for (const ed of F.edges || []) { const a = P(ed.a), b = P(ed.b); if (!a || !b) continue; e += `<path class="e" d="M${a.x + w} ${a.y + h / 2}C${a.x + w + 8} ${a.y + h / 2} ${b.x - 8} ${b.y + h / 2} ${b.x} ${b.y + h / 2}"/>`; }
  const r = F.nodes.map(n => `<rect class="c-${(TYPES[n.t] || TYPES.gen)[2]}" x="${n.c * cw}" y="${n.r * rh}" width="${w}" height="${h}" rx="3"/>`).join("");
  return `<svg class="mini" viewBox="-4 -4 ${cols * cw + 4} ${rows * rh + 4}" aria-hidden="true">${e}${r}</svg>`;
}

function parsePrompts(body) {
  const blocks = String(body).split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  let introB = [], cards = [], cur = null;
  for (const b of blocks) {
    const m = b.match(/^`([^`]+)`$/);
    if (m) { cur = { p: m[1], d: "" }; cards.push(cur); }
    else if (cur && !cur.d) cur.d = b;
    else if (!cards.length) introB.push(b);
    else cur.d += "\n\n" + b;
  }
  for (const c of cards) {
    const t = c.d.replace(/^Kullanım yeri\s*:\s*/, "");
    const lead = t.match(/^(.{2,90}?)[:.]\s+([\s\S]*)$/);
    c.h = lead ? lead[1] : ""; c.b = lead ? lead[2] : t;
  }
  return { intro: introB.join("\n\n"), cards };
}
