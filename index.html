lmez"], "id": "p2", "pv": {"k": "txt", "v": "Translate the chalkboard text \"Yağlı Pide · Kasım'a özel\" into English: \"Butter Pide · November special\". Same chalk lettering, size and position. Do not translate the neon sign \"KIYI PİDE\". Everything else stays exactly the same."}, "r": 0, "s": 6, "t": "prompt", "text": "Çeviriyi modele bırakma; İngilizce metin tırnak içinde hazır.", "title": "2. tur: çeviri prompt'u"}, {"c": 5, "chips": ["Low", "4 sonuç"], "id": "en", "pv": {"a": {"m": "🧈", "tag": "Yağlı Pide · Kasım'a özel", "tone": "warm"}, "b": {"m": "🧈", "tag": "Butter Pide · November special", "tone": "warm"}, "k": "ba"}, "r": 0, "s": 6, "t": "gen", "text": "Aynı tebeşir yazısı, aynı yer; neon tabela Türkçe kalır.", "title": "İngilizce sürüm", "tool": "Ideogram 4.5 · kaynak = Türkçe kazanan"}, {"c": 5, "chips": ["sadece 'November'"], "id": "fix", "pv": {"k": "mask", "m": "🧈", "shape": "brush", "tag": "maske: sadece 'November' kelimesi", "tone": "warm"}, "r": 1, "s": 7, "t": "retouch", "text": "Bütün görseli yeniden üretme; sadece bozuk kelimeyi işaretle.", "title": "Tek hatalı kelimeyi düzelt", "tool": "Ideogram maske ya da Magnific inpaint"}, {"c": 6, "chips": ["High", "2K", "2 görsel"], "id": "final", "pv": {"ar": "4:5", "items": [{"m": "🧈", "tag": "TR · High", "tone": "warm"}, {"m": "🧈", "tag": "EN · High", "tone": "warm"}], "k": "grid"}, "r": 0, "s": 8, "t": "upscale", "text": "16 deneme düşükte, sadece 2 final yüksekte: kredi burada korunur.", "title": "Kazananları High'da üret", "tool": "Ideogram 4.5"}, {"c": 7, "end": true, "id": "ps", "pv": {"items": ["logo (orijinal dosya)", "fiyat (gerçek font)", "AI görseli (tahta yazısı dahil)", "→ kiyipide_kasim_post_TR_4x5 / _EN_4x5"], "k": "layers"}, "r": 0, "s": 9, "t": "export", "text": "Fiyat gerçek fontla, logo orijinal dosyadan; İngilizceyi müşteriye onaylat.", "title": "Fiyat, logo ve teslim", "tool": "Photoshop"}], "title": "Görseli yeniden üretme: her turda sadece bir yazıyı değiştir, gerisini kilitle"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Önceki derste bir görseldeki yazıları hangi üç gruba ayırıyorduk ve müşterinin logosu hangi gruba giriyordu?\n2. \"Copy space\" (yazı alanı) ne demek, fon görselini üretirken prompt'a neden \"no text, no letters, no logos\" ekliyorduk?\n\n### Konu\n\nÖnceki derste yazıyı **sıfırdan** yazdırmayı konuştuk. Bu derste ajans işlerinde ondan bile sık karşılaşacağın bir durumdayız: elinde **hazır, onaylanmış bir görsel** var ve sadece içindeki yazının değişmesi gerekiyor. Restoran Ekim'de \"Kavurmalı Pide\" yazan tebeşir tahtalı fotoğrafı beğendi, şimdi Kasım geldi ve tahtada \"Yağlı Pide\" yazmalı. Otel turistler için aynı afişin İngilizcesini istiyor. Ambalaj fotoğrafında etikette bir yazım hatası çıktı. Eskiden üç yol vardı: görseli baştan üretmek (ışık, kompozisyon, her şey değişir), Photoshop'ta harfleri elle boyamak (tebeşir, neon ya da kabartma yazıda saatler sürer) ya da fotoğrafı yeniden çekmek.\n\n**Ideogram 4.5** tam bu iş için çıkmış bir model. Ideogram, yıllardır \"yazıyı en düzgün yazan model\" diye bilinen bir şirket. 30 Eylül 2026'da çıkan 4.5 sürümünde odak, üretmekten **düzenlemeye** kaydı. En önemli vaadi şu: bir görseli üst üste defalarca düzenlesen bile, dokunmadığın yerler bozulmuyor. Ideogram'a göre değişmeyen pikseller kaynak görselden birebir kopyalanıyor. Bu neden önemli? Çoğu düzenleme modelinde her turda görsel biraz kayar: renkler hafifçe solar, yüzler azıcık değişir, küçük lekeler birikir. Buna İngilizcede **\"edit drift\"** (düzenleme kayması) deniyor. Üç beş tur sonra görsel, müşterinin onayladığı görsel olmaktan çıkar. 4.5 bu kaymayı engellemek için tasarlanmış.\n\nYazı tarafında iki şey yapabiliyor: görseldeki bir yazıyı **başka bir yazıyla değiştirmek** ve aynı yazıyı **başka bir dile çevirmek**. İkisinde de fikir aynı: harflerin stili (tebeşir, neon, altın kabartma), boyutu, yeri ve sahnedeki ışığı korunuyor, sadece kelimeler değişiyor. Yani tabelayı söküp yenisini asmak yerine, aynı tabelanın üstündeki harfleri değiştiriyorsun.\n\nBirkaç teknik ayrıntıyı sade haliyle bil:\n\n- **Dört kalite seviyesi var:** çok düşük, düşük, orta, yüksek. Hepsi 2K çıktı veriyor; fark detayda ve fiyatta. Ideogram'ın kendi API fiyatlarında en düşük seviyede bir düzenleme yaklaşık 0,008 dolar, yüksek seviyede 0,22 dolar. Yani arada yaklaşık 27 kat fark var. Kural belli: **denemeleri düşükte yap, kazanan prompt'u yüksekte bir kere çalıştır.** Magnific'te de bu dört seviye kredi farkı olarak karşına çıkıyor.\n- **Referans görsel:** Düzenlerken en fazla 4 referans verebiliyorsun (bir ürün, bir doku, bir renk örneği gibi). Maske kullanırsan bu sayı 3'e iniyor.\n- **Maske:** Değişecek bölgeyi işaretlediğin siyah-beyaz bir harita. Ideogram'ın kendi sisteminde siyah \"burayı değiştir\", beyaz \"buraya dokunma\" demek. Dikkat: başka araçlarda renkler ters olabilir, emin olmadan maske dosyasını araçtan araca taşıma.\n- **Oran:** Kaynak görselin oranı korunuyor; çok uç oranları (1:6 ile 6:1 arası) bile kabul ediyor.\n\n**Magnific'te durum:** Magnific'in model listesinde Ideogram 4.5 görsel üretiminde **beta** olarak yer alıyor ve kaynak görseli referans olarak alabiliyor. Beta özellikler herkesin hesabında aynı anda açılmayabilir. Listende göremiyorsan aynı mantığı Ideogram'ın kendi sitesinde ya da Magnific'te Flux.1 Kontext Max veya GPT 2 gibi düzenleme modelleriyle uygulayabilirsin; bugün öğrendiğin prompt yapısı hepsinde işe yarar.\n\nPeki önceki dersteki \"fiyatı, tarihi ve logoyu her zaman Photoshop'ta koy\" kuralı geçersiz mi oldu? Hayır. Ideogram 4.5'in yeri **sahnenin parçası olan yazı**: tebeşir tahtası, neon tabela, ambalaj etiketi, vitrin camındaki yazı, kabartma başlık. Bunları elle yapmak çok zahmetli. Düz bir fon üstündeki fiyat ve telefon numarası ise hâlâ Photoshop'un işi.\n\nBenzetme: Ideogram 4.5 ile yazı düzenlemek, tabelacının dükkânına gelip sadece harfleri değiştirmesine benzer. Usta tabelayı sökmüyor, duvarı boyamıyor, ışıklandırmaya dokunmuyor; aynı fontta, aynı renkte yeni harfleri eskilerin yerine takıyor. Sen de ustaya ne istediğini net söylemelisin: \"Şu tabeladaki şu kelimeyi şununla değiştir, gerisine dokunma.\" \"Tabelayı biraz güzelleştir\" dersen usta kendi kafasına göre her şeyi değiştirir. Her seferinde tek bir değişiklik istersen, neyin bozulduğunu da hemen görürsün.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Düzenleme modeli | Görseli baştan üretmek yerine var olan görselde sadece istenen yeri değiştiren model | edit model / image editing |\n| Düzenleme kayması | Üst üste düzenlemelerde dokunulmayan yerlerin de yavaş yavaş bozulması (renk, yüz, leke) | edit drift |\n| Çok turlu düzenleme | Her turda tek değişiklik yapıp bir sonraki turu bir önceki sonucun üstüne kurmak | multi-turn editing |\n| Kaynak görsel | Düzenlenen asıl görsel; çıktının ölçüsü ve oranı ondan gelir | source image |\n| Maske | Değişecek bölgeyi gösteren siyah-beyaz harita | mask |\n| Yerelleştirme | Bir tasarımı başka bir dil ve pazar için uyarlamak; sadece çeviri değil, uzunluk ve okunabilirlik ayarı da | localization |\n| Harf stili | Yazının görünüşü: font, renk, doku, boyut ve yer | lettering / typeface |\n| Kalite seviyesi | Aynı modelin hız, detay ve fiyat dengesi farklı çalışma ayarları | quality tier |\n\n### Uygulama\n\nSenaryo: Turistlerin de sık geldiği bir pide restoranı, Ekim kampanyası için onayladığı vitrin fotoğrafını Kasım'da da kullanmak istiyor. Fotoğrafta camın arkasında bir tebeşir menü tahtası (\"Kavurmalı Pide · Ekim'e özel\"), tezgahta fırından yeni çıkmış pideler ve üstte \"KIYI PİDE\" yazan neon tabela var. İstenenler: tahtadaki yazı \"Yağlı Pide · Kasım'a özel\" olacak, neon tabela aynen kalacak, bir de yabancı misafirler için aynı görselin İngilizce sürümü (\"Butter Pide · November special\") lazım. Fiyat ve logo, önceki dersteki kurala göre sonradan Photoshop'ta eklenecek.\n\n1. **Değişiklik listesini çıkar.** Üretime başlamadan önce görseldeki her yazıyı üç sütunla yaz: eski metin, yeni metin, kalacak mı. Tahta: \"Kavurmalı Pide · Ekim'e özel\" → \"Yağlı Pide · Kasım'a özel\". Neon: \"KIYI PİDE\" → aynen kalacak. İngilizce sürüm için: \"Butter Pide · November special\". Yeni metnin eski metne yakın uzunlukta olması işini kolaylaştırır; çok daha uzun bir metin tahtaya sığmak için küçülür ya da taşar.\n2. **Kaynak görseli hazırla.** Müşterinin **en son onayladığı** dosyayı al; WhatsApp'tan gelen sıkıştırılmış kopyayı değil, en yüksek çözünürlüklü orijinali. Oranını not et (bu örnekte 4:5). Kaynak ne kadar temizse düzenleme o kadar temiz olur.\n3. **Magnific'te modeli ve ayarları kur.** Görsel üretimi aç, model olarak Ideogram 4.5'i seç, kaynak görseli referans olarak ekle, oranı kaynakla aynı (4:5) yap. Kaliteyi **düşük** (Low) ya da **çok düşük** (Very low) seç: şimdi deneme yapıyoruz, kredi harcamanın zamanı değil. 4 sonuç iste.\n4. **Birinci tur: sadece Türkçe yazıyı değiştir.** Prompt'u dört parçayla kur: **hedef** (hangi yazı), **değişiklik** (yeni metin tırnak içinde, Türkçe karakterleriyle tam olarak), **korunacaklar** (neon tabela, pideler, cam yansıması, ışık) ve **çerçeve** (\"kadrajı birebir aynı tut\"). Bir de harf stilinin aynı kalmasını açıkça söyle: aynı tebeşir dokusu, aynı el yazısı, aynı boyut ve yer. Tek turda tek değişiklik: neon tabelaya ya da başka bir şeye bu turda dokunma.\n5. **Harf harf kontrol et ve kazananı yeni kaynak yap.** 4 sonucu yan yana koy. Kontrol listesi: her harf doğru mu, \"ı\" ve \"ğ\" yerinde mi, kesme işareti (Kasım'a) doğru mu, tebeşir dokusu eskisiyle aynı mı, neon tabela, pideler ve yansımalar hiç değişmiş mi? Önce/sonra karşılaştırması yap: iki görseli Photoshop'ta üst üste koyup üstteki katmanın karışım modunu \"Difference\" yap. Değişen yerler parlar, değişmeyen yerler siyah kalır. Sadece tahta parlıyorsa model işini yapmış demektir. Kazanan görsel artık **yeni kaynağın**; bir sonraki tur onun üstüne kurulur, en baştaki görselin değil.\n6. **İkinci tur: İngilizce sürüm.** Türkçe kazananı kaynak olarak ver ve çeviri prompt'unu yaz: hangi yazının hangi metne çevrileceğini tırnak içinde söyle, harf stilinin aynı kalacağını ve neon tabelanın **çevrilmeyeceğini** ayrıca belirt. Marka adları çevrilmez; \"KIYI PİDE\" her dilde \"KIYI PİDE\" kalır. Yemek adlarında da dikkat: \"pide\" gibi yerel bir yemeğin adı çoğu zaman olduğu gibi kalır, yanına kısa bir açıklama eklenir. Yine düşük kalitede 4 sonuç al ve 5. adımdaki kontrolü İngilizce için tekrarla. İngilizce metin Türkçeden kısaysa modelin harfleri büyütüp boşluğu doldurduğunu görebilirsin; istemiyorsan prompt'a \"same text size as before\" ekle.\n7. **Kalan tek hatayı küçük bir bölgede düzelt.** Diyelim İngilizce sürümde her şey güzel ama \"November\" kelimesinde bir harf bozuk. Bütün görseli yeniden üretme. Ideogram'ın kendi düzenleme ekranında maske ile sadece o kelimeyi işaretleyip aynı prompt'u daralt, ya da Magnific'te Modül 2'deki parça düzeltme (inpaint) aracını kullan. İki denemede düzelmezse o tek kelimeyi Photoshop'ta tahtadaki diğer harflerden kopyalayarak onarmak daha hızlıdır.\n8. **Kazanan prompt'ları yüksek kalitede bir kere çalıştır.** Türkçe ve İngilizce için onayladığın prompt'ları, aynı kaynak görsellerle bu sefer **yüksek** (High) kalitede çalıştır. Deneme aşamasında belki 16 görsel ürettin ama yüksek kaliteye sadece 2 tane gitti; kredinin asıl tasarrufu burada. Yüksek kalitede sonuç biraz farklı çıkabilir, bu yüzden 5. adımdaki harf kontrolünü burada son bir kez yap.\n9. **Photoshop'ta bitir ve teslim et.** İki görseli de Photoshop'a al. Fiyatı gerçek fontla ayrı katman olarak, logoyu müşterinin orijinal dosyasından ekle (önceki dersin kuralı). Dosyaları \"kiyipide_kasim_post_TR_4x5\" ve \"kiyipide_kasim_post_EN_4x5\" diye adlandır. Müşteriye gönderirken İngilizce metni bir kez de çeviri açısından kontrol ettir: model harfleri çok iyi kopyalar ama çevirinin doğal olup olmadığını sen ya da müşteri onaylamalısın.\n\n### Örnek prompt'lar\n\n`On the chalkboard menu behind the window, replace the text \"Kavurmalı Pide · Ekim'e özel\" with \"Yağlı Pide · Kasım'a özel\". Keep the same chalk handwriting style, the same size, color and position. Keep the neon sign \"KIYI PİDE\", the pides on the counter, the window reflections and the lighting exactly the same. Keep the framing exactly the same.`\n\nKullanım yeri: Restoran tanıtımında menü tahtasındaki kampanya yazısını değiştirmek. Hedef, yeni metin, korunacaklar ve çerçeve tek tek söyleniyor; yeni metin Türkçe karakterleriyle birebir tırnak içinde.\n\n`Translate the chalkboard text \"Yağlı Pide · Kasım'a özel\" into English: \"Butter Pide · November special\". Keep the same chalk lettering style, size and position. Do not translate or change the neon sign \"KIYI PİDE\". Everything else in the image stays exactly the same.`\n\nKullanım yeri: Yabancı misafirler için menü tahtasının İngilizce sürümü. Çeviriyi modele bırakmıyoruz, İngilizce metni biz veriyoruz; marka adının çevrilmeyeceği ayrıca yazılıyor.\n\n`On the jar label, change only the word \"Çilek Reçeli\" to \"Vişne Reçeli\". Keep the same font, gold color and embossed effect. Do not change the logo, the small print, the lid, the jar or the background. Keep the framing exactly the same.`\n\nKullanım yeri: Ürün reklamında aynı ambalaj fotoğrafını farklı çeşit için kullanmak. Küçük yazılar (içindekiler, gramaj) ayrıca korunacaklar arasında sayılıyor; model bunları kendiliğinden yeniden yazmasın.\n\n`On the stadium LED screen, replace \"CUMARTESİ 19:00\" with \"PAZAR 20:30\". Same bright LED dot lettering, same white color, same position on the screen. Keep the crowd, the floodlights, the smoke and the football exactly the same.`\n\nKullanım yeri: Maç günü posterinde maç saati değişti. Yazı sahnenin içinde (LED ekran) olduğu için Ideogram'a uygun; düz bir bantta duran tarih olsaydı Photoshop'ta değiştirmek daha doğru olurdu.\n\n`On the kraft paper takeaway bag, replace the stamped text \"Afiyet olsun\" with \"Enjoy your meal\". Keep the same rough ink stamp style, the same dark brown color, the same size and the same position on the bag. Keep the restaurant logo, the paper wrinkles, the table and the lighting exactly the same.`\n\nKullanım yeri: Restoranın paket servis ambalajını yabancı misafirler için uyarlamak. Kâğıt torbaya basılmış mürekkep yazı hem kırışıklık hem doku içerdiği için elle yapması zor; tam Ideogram 4.5'in alanı.\n\n### Sık yapılan hatalar\n\n- **Tek prompt'ta her şeyi değiştirmek.** Yazıyı değiştir, ışığı ısıt, arka plana bir de bitki ekle... Üç değişiklik bir arada istenince hangisinin neyi bozduğunu anlayamazsın. Her turda tek değişiklik yap; her tur bir öncekinin kazananı üstüne kurulsun.\n- **Korunacakları söylememek.** Sadece \"yazıyı şununla değiştir\" dersen model fırsat bulup başka yerlere de dokunabilir. Değişmemesi gereken önemli şeyleri (logo, ürün, küçük yazılar, kadraj) prompt'ta adıyla say.\n- **Çeviriyi modele bırakmak.** \"Bunu İngilizceye çevir\" deyip çeviriyi modelin seçmesine izin vermek. Çeviriyi sen belirle (gerekirse Claude'a sor, müşteriye onaylat), modele tırnak içinde hazır metni ver. Marka adlarının çevrilmeyeceğini ayrıca yaz.\n- **Denemeleri yüksek kalitede yapmak.** Daha ilk denemede High seçmek, krediyi 20-25 kat hızlı bitirir. Düşük kalitede dene, kazanan prompt belli olunca yüksekte bir kere çalıştır.\n\n### Ödev\n\nSüre 25-30 dakika.\n\n1. Daha önce yaptığın işlerden ya da ekibin arşivinden içinde **sahnenin parçası olan bir yazı** bulunan bir görsel seç: restoran menü tahtası, tabela, ambalaj etiketi, paket servis torbası, vitrin yazısı ya da bir posterdeki kabartma başlık. Yoksa Magnific'te önceki dersin yöntemiyle böyle bir görsel üret.\n2. Değişiklik listesini çıkar: eski metin, yeni metin, kalacak olanlar.\n3. Ideogram 4.5'te (Magnific'te göremiyorsan Flux.1 Kontext Max ya da GPT 2 ile) düşük kalitede birinci turu yap: Türkçe yeni metin. Dört parçalı prompt yapısını kullan.\n4. Kazananı Photoshop'ta orijinalle üst üste koy ve \"Difference\" karışım modunda bak: sadece yazı mı değişmiş, başka bir yer de parlıyor mu? Not al.\n5. Kazananı yeni kaynak yapıp ikinci turda İngilizce sürümü üret. Marka adının çevrilmediğini kontrol et.\n6. Beğendiğin bir tanesini yüksek kalitede tekrar çalıştır ve düşük kaliteyle farkına bak.\n\nBitince orijinali, Türkçe ve İngilizce sonuçları ve \"Difference\" ekran görüntüsünü Claude'a göster ve şunu sor: \"Harf stilinde ve sahnede ne değişmiş, hangi harfler hatalı, İngilizce metin doğal mı?\"\n\n### Tekrar sorularının cevapları\n\n1. Üç grup: AI'ın yazacağı yazı (kısa, büyük, sahnenin parçası olan başlık), senin Photoshop ya da Illustrator'da koyacağın yazı (fiyat, tarih, adres, uzun açıklama) ve asla AI'a çizdirilmeyecek şey. Logo bu son gruba girer; her zaman müşterinin orijinal dosyasından, en son katman olarak eklenir.\n2. Copy space, görselde yazı konsun diye bilerek boş bırakılan alandır. \"No text, no letters, no logos\" ekliyorduk çünkü aksi halde model kendiliğinden ürünün üstüne ya da arka plana anlamsız yazılar koyabiliyor; o boş alanı tertemiz istiyoruz.\n\nSıradaki ders: Dergi kapağı tekniği: fotoğrafı ve grafik düzeni iki ayrı adımda üretmek, donmuş kare girişi\n\n### Kaynaklar\n\n- [Morphic – How to Use Ideogram 4.5: Edit Prompts, Masks & Multi-Turn](https://morphic.com/resources/how-to/ideogram-4-5-guide)\n- [Morphic – Ideogram 4.5: AI image editing that holds up edit after edit](https://morphic.com/resources/models/ideogram-4-5)\n- [Each Labs – Ideogram 4.5: Image Edits That Don't Drift](https://www.eachlabs.ai/blog/ideogram-4-5-edits-that-dont-drift)\n- [AlphaSignal – Ideogram 4.5 Fights Edit Drift With 27x Pricing Spread](https://alphasignal.ai/news/ideogram-4-5-fights-edit-drift-with-27x-pricing-spread-and-multi-turn-precision)\n- [Magnific Docs – Image models](https://www.magnific.com/ai/docs/image-ai-models)", "module": 3, "moduleName": "Tutarlılık", "n": 27, "summary": ["Ideogram 4.5 hazır bir görseldeki yazıyı stilini, yerini ve ışığını koruyarak değiştirebilir ya da başka dile çevirebilir.", "Her turda tek değişiklik iste; prompt'ta hedefi, yeni metni, korunacakları ve kadrajı ayrı ayrı yaz.", "Çeviriyi modele bırakma: hazır metni tırnak içinde ver, marka adlarının çevrilmeyeceğini ayrıca belirt.", "Denemeleri düşük kalitede yap, kazanan prompt'u yüksek kalitede bir kere çalıştır; arada yaklaşık 27 kat fiyat farkı var.", "Photoshop'ta Difference karışım moduyla sadece yazının değiştiğini kontrol et; fiyat ve logo yine elle eklenir."], "title": "Görseldeki yazıyı düzenleme ve çevirme: Ideogram 4.5"}, {"checked": "Ekim 2026", "date": "12 Ekim 2026", "flow": {"edges": [{"a": "brief", "b": "ref", "k": "f"}, {"a": "ref", "b": "photo", "k": "ref", "l": "image 1 + 2"}, {"a": "p1", "b": "photo", "k": "txt", "l": "prompt"}, {"a": "set", "b": "photo", "k": "f", "l": "ayarlar"}, {"a": "photo", "b": "chk", "k": "img", "l": "4 sonuç"}, {"a": "chk", "b": "cover", "k": "img", "l": "kazanan = zemin"}, {"a": "p2", "b": "cover", "k": "txt", "l": "prompt"}, {"a": "cover", "b": "fix", "k": "img", "l": "tek hata"}, {"a": "chk", "b": "angle2", "k": "ref", "l": "referans"}, {"a": "angle2", "b": "video", "k": "img", "l": "ilk kare"}, {"a": "chk", "b": "video", "k": "img", "l": "son kare (yazısız)"}, {"a": "fix", "b": "ae", "k": "img", "l": "kapak grafiği"}, {"a": "video", "b": "ae", "k": "img", "l": "video"}], "groups": [{"c1": 0, "c2": 1, "label": "Hazırlık", "r1": 0, "r2": 1}, {"c1": 2, "c2": 2, "label": "1. adım: Yazısız fotoğraf", "r1": 0, "r2": 1}, {"c1": 3, "c2": 5, "label": "2. adım: Dergi düzeni", "r1": 0, "r2": 0}, {"c1": 3, "c2": 4, "label": "3. adım: Hareket", "r1": 1, "r2": 1}, {"c1": 6, "c2": 6, "label": "Teslim", "r1": 0, "r2": 1}], "nodes": [{"c": 0, "id": "brief", "pv": {"items": ["Üst orta: dergi adı PARILTI", "Sağ üst: köşe bandı YENİ", "Sol: 3 kısa başlık", "Sağ alt: barkod", "Fiyat + marka logosu → en son Photoshop"], "k": "list"}, "r": 0, "s": 1, "t": "brief", "text": "Kapakta ne nereye gelecek, hangi "tool": "Nano Banana 2.1"}, {"c": 2, "id": "chk", "pv": {"items": ["Görselde yazı/harf var mı? (olmamalı)", "Başın üstünde logo boşluğu var mı?", "Bakış aşağıda, ürüne mi?", "Arkadaki kalabalık bulanık mı?", "Şişe gerçek ürüne benziyor mu?"], "k": "list"}, "r": 1, "s": 4, "t": "compare", "text": "Kazanan fotoğraf artık sabit zemin: bir daha değişmeyecek.", "title": "Seç ve kontrol et"}, {"c": 3, "chips": ["fotoğrafı kilitle", "4 parça", "logo saçın arkasında"], "id": "p2", "pv": {"k": "txt", "v": "Keep the photo exactly the same. Add a fashion magazine cover layout: the masthead \"PARILTI\" at the top in a tall elegant serif font, white, partly hidden behind her hair; a round coral corner flash at top right that says \"YENİ\"; three short cover lines on the left; a small barcode at bottom right. Do not change her face, the bottle, the droplets or the light."}, "r": 0, "s": 5, "t": "prompt", "text": "İlk cümle fotoğrafı kilitler; sonra her grafik parçası yeriyle ve fontuyla sayılır.", "title": "Düzen prompt'u"}, {"c": 4, "chips": ["3:4", "tek referans"], "id": "cover", "pv": {"a": {"m": "💧", "tag": "yazısız fotoğraf", "tone": "day"}, "b": {"m": "📰", "tag": "PARILTI kapağı: logo saçın arkasında, YENİ bandı, 3 başlık, barkod", "tone": "rose"}, "k": "ba"}, "r": 0, "s": 5, "t": "gen", "text": "Fotoğraf aynı kalır; üstüne logo, bant, başlıklar ve barkod gelir.", "title": "Kapak düzeni eklendi", "tool": "Nano Banana 2.1 ya da Ideogram 4.5 · referans = kazanan foto"}, {"c": 5, "chips": ["sadece 'ışıltısı'"], "id": "fix", "pv": {"k": "mask", "m": "📰", "shape": "brush", "tag": "maske: sadece 'ışıltısı' kelimesi", "tone": "rose"}, "r": 0, "s": 6, "t": "retouch", "text": "ı, ş, ğ kontrolü; bozuk kelimeyi maskele, kapağın geri kalanına dokunma.", "title": "Tek hatalı harfi düzelt", "tool": "Magnific inpaint ya da Ideogram maske"}, {"c": 3, "chips": ["3:4", "kamera daha geride"], "id": "angle2", "pv": {"ar": "3:4", "k": "img", "m": "🚶‍♀️", "tag": "aynı geçit, aynı kıyafet, bir saniye önce", "tone": "day"}, "r": 1, "s": 7, "t": "variation", "text": "Kadın yürüyor, saç henüz savrulmamış, damla yok: videonun ilk karesi.", "title": "İkinci açı: bir an öncesi", "tool": "Nano Banana 2.1 · referans = kazanan foto"}, {"c": 4, "chips": ["5 sn", "1080p", "3:4", "ilk-son kare"], "id": "video", "pv": {"a": {"m": "🚶‍♀️", "tag": "ilk kare: ikinci açı", "tone": "day"}, "b": {"m": "💧", "tag": "son kare: YAZISIZ kapak fotoğrafı", "tone": "day"}, "k": "ba"}, "r": 1, "s": 8, "t": "gen", "text": "Hareketle başlar, kapak fotoğrafında donar; arkadaki kalabalık akmaya devam eder.", "title": "Giriş videosu", "tool": "Magnific Video · Start + end destekli model (ör. Kling Omni)"}, {"c": 6, "end": true, "id": "ae", "pv": {"items": ["fiyat + marka logosu (orijinal dosya)", "PARILTI logosu, bant, başlıklar, barkod", "saç maskesi (logo arkada kalsın)", "AI videosu + 1-2 sn freeze frame", "→ ayvaskin_kapak_3x4.png / ayvaskin_giris_3x4.mp4"], "k": "layers"}, "r": 0, "s": 9, "t": "export", "text": "Kapak grafikleri donma anında belirir; logo saç maskesiyle başın arkasına geçer.", "title": "Grafik, kurgu ve teslim", "tool": "After Effects / Premiere + Photoshop"}], "title": "Kapağı iki adımda kur: önce yazısız donmuş an, sonra üstüne dergi düzeni, en son hareket"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. \"Edit drift\" (düzenleme kayması) ne demek ve müşterinin onayladığı bir görseli üst üste düzenlerken neden tehlikeli?\n2. Bir görseldeki yazıyı başka bir dile çevirirken neden çeviriyi modele bırakmıyorduk, marka adı için prompt'a ne ekliyorduk?\n\n### Konu\n\nÖnceki iki derste yazıyla uğraştık: önce görsele sıfırdan yazı yazdırdık, sonra hazır bir görseldeki yazıyı değiştirdik. Bu derste ikisini birleştiren, sosyal medyada çok iş gören bir formatı kuruyoruz: **dergi kapağı**. Ürünü ya da marka yüzünü, sanki bir moda veya güzellik dergisinin kapağındaymış gibi gösteren görsel. Üstte büyük dergi logosu, köşede \"YENİ\" yazan renkli bir bant, yanda iki üç kapak başlığı, altta barkod. İnsanlar bu düzeni bir saniyede tanır, bu yüzden akışta kaydırırken göz takılır. Lansman, yeni sezon, \"yılın ürünü\" gibi duyurular için çok uygun.\n\nAsıl numara şu: **fotoğrafı ve grafik düzeni tek prompt'ta istemiyoruz, iki ayrı adımda üretiyoruz.** Tek prompt'ta \"dergi kapağı yap\" dersen model iki işi aynı anda yapmaya çalışır: hem ışıklı, kaliteli bir fotoğraf, hem de doğru yazılmış bir sürü yazı. Genelde ikisi de yarım olur: yazılar bozulur, fotoğraf yazılara yer açmak için sıkışır, beğendiğin bir kareyi \"sadece başlığı değiştir\" diye düzeltmeye kalkınca fotoğraf da kayar. İki adımda ise önce yazısız, temiz bir fotoğraf alırsın; o fotoğraf onaylanınca sabit bir zemin olur. Sonra ikinci adımda o zeminin üstüne düzeni eklersin. Başlık beğenilmezse sadece ikinci adımı tekrar edersin, fotoğraf hiç bozulmaz.\n\nBu dersin ikinci parçası **donmuş an** (frozen moment). Fotoğrafta özne bir hareketin tam ortasında durmuş gibi görünür: saçını savurmuş, etrafa su damlaları saçılmış, damlalar havada asılı. Arkada yürüyen insanlar ise hareket bulanıklığıyla (motion blur) akıp gidiyor. Bu zıtlık, yani \"her şey hareket ediyor ama o durdu\" hissi, kapağı sıradan bir ürün fotoğrafından ayırır. Aynı fikri videoya da taşıyoruz: kısa bir giriş videosu, hareketle başlar ve kapak fotoğrafında donar. Kapak grafiği tam o anda belirir. Reels ya da hikaye için güçlü bir açılış olur.\n\nBenzetme: Bir dergi kapağını çekim günü düşün. Fotoğrafçı stüdyoda sadece fotoğrafı çeker, kapağa hiç yazı koymaz. Fotoğraf seçildikten sonra dergideki grafik tasarımcı o fotoğrafın üstüne logoyu, başlıkları ve barkodu yerleştirir. Kimse fotoğrafçıdan \"çekerken başlıkları da çek\" demez. AI ile de aynı iş bölümünü yapıyoruz: önce fotoğrafçı, sonra grafikçi.\n\nKapakta birkaç kural, hem fotoğraf hem düzen adımında işini kolaylaştırır:\n\n- **Üstte boşluk bırak.** Kapak fotoğrafında öznenin başının üstünde, karenin yaklaşık dörtte biri kadar boş alan olmalı; logo oraya oturacak. Fotoğraf prompt'unda bunu baştan iste.\n- **Logo başın arkasından geçebilir.** Gerçek dergilerde sık görülen bir hile: logonun bir kısmı öznenin saçının arkasında kalır. Bu derinlik hissi verir ve kapağı \"üstüne yazı yapıştırılmış fotoğraf\" olmaktan çıkarıp gerçek bir kapak gibi gösterir.\n- **Dergi adını uydur.** Gerçek bir derginin adı ve logosu başka bir şirketin markasıdır; müşteri işinde kullanılamaz. Kısa, akılda kalan, sahte ama inandırıcı bir ad seç.\n- **Kapak başlıkları kısa olsun.** Üç başlık yeterli. Her biri en fazla 3-5 kelime. Uzun cümleleri model bozar, okuyucu da okumaz.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n|---|---|---|\n| Dergi logosu | Kapağın en üstündeki büyük dergi adı | masthead |\n| Kapak başlıkları | Kapağın kenarındaki kısa haber başlıkları | cover lines |\n| Köşe bandı | Köşede \"YENİ\", \"ÖZEL SAYI\" gibi yazan renkli şerit ya da yuvarlak etiket | corner flash / corner banner |\n| Donmuş an | Hareketin tam ortasında durmuş gibi görünen kare | frozen moment, frozen in mid-air |\n| Hareket bulanıklığı | Hızlı hareket eden şeylerin fotoğrafta iz bırakarak bulanık görünmesi | motion blur |\n| Ultra geniş açı | Telefonların 0.5x kamerası gibi, çok geniş gören ve kenarları hafif esneten lens | ultra-wide lens, 0.5x |\n| Başlangıç ve bitiş karesi | Videonun ilk ve son karesini senin verdiğin iki görsel; model aradaki hareketi doldurur | start frame / end frame (first & last frame) |\n| Derinlik katmanı | Logonun öznenin arkasından geçmesi, yazı ile fotoğrafın iç içe görünmesi | masthead behind the subject |\n\n### Uygulama\n\nSenaryo: \"Ayva Skin\" adında küçük bir cilt bakımı markası yeni C vitamini serumunu çıkarıyor. Lansman için Instagram'da hem bir kapak görseli hem de kısa bir giriş videosu istiyor. Fikir: marka yüzü, kalabalık bir çarşı geçidinde saçını savururken donmuş; etrafında serumun ferahlığını anlatan su damlaları havada asılı; arkadaki insanlar bulanık akıyor. Görsel, uydurma bir güzellik dergisi olan \"PARILTI\"nın kapağı gibi duracak. Köşe bandında \"YENİ\", başlıklarda \"C vitamini ile sabah ışıltısı\", \"3 adımda parlak cilt\", \"Ayva Skin'in yeni serumu\". Ölçü: 3:4 (hem dergi kapağına benzer hem Instagram'ın 3:4 gönderi biçimine uyar).\n\n1. **Parça listesini çıkar.** Kapağı yazıya dökmeden önce neyin nereye geleceğini yaz: dergi adı (üstte, ortada), köşe bandı (sağ üst), üç başlık (solda alt alta), barkod (sağ alt), ürün (öznenin elinde). Fiyat ya da logo gibi \"birebir doğru olmak zorunda\" olan şeyleri ayrı bir satıra yaz: onlar en son Photoshop'ta eklenecek.\n2. **Referansları hazırla.** Magnific'te Image Generator'ı aç. Referans olarak marka yüzünün karakter kütüphanesindeki görselini ve serum şişesinin temiz ürün fotoğrafını ekle. Önceki derslerdeki gibi prompt'ta bunları numarayla an: \"the woman from image 1\", \"the serum bottle from image 2\".\n3. **Yazısız fotoğrafı üret.** Model olarak Nano Banana 2.1'i seç, oran 3:4, 2K, 4 sonuç. Prompt'ta beş şey olsun: özne ve ürün, mekan, donan olay (saç savrulması ve su damlaları), kamera (telefonun ultra geniş açısı, hafif aşağıdan), ve en önemlisi yasaklar: \"no text, no letters, no logos, no graphics\". Üstte boşluk iste: \"leave empty space above her head for a magazine title\".\n4. **Seç ve kontrol et.** Dört sonuca şu gözle bak: Görselde herhangi bir yazı ya da harf var mı (olmamalı)? Başın üstünde logo için yer var mı? Öznenin bakışı kameraya değil aşağıya, ürüne doğru mu (donmuş anı daha doğal gösterir)? Arka plandaki insanlar bulanık mı? Şişenin şekli ve kapak rengi gerçek ürüne benziyor mu? Kazananı indir; artık bu fotoğraf sabit zemin.\n5. **Düzeni ekle.** Yeni bir üretim aç ve kazanan fotoğrafı tek referans olarak ver. Bu sefer prompt sadece grafik ister: \"Keep the photo exactly the same\" ile başla, sonra parçaları tek tek say: dergi adı ve fontu, logonun başın arkasından geçmesi, köşe bandı ve rengi, üç başlık tırnak içinde, barkod. Oran yine 3:4. Bu adım için yazıyı iyi yazan bir model seç (Nano Banana 2.1 ya da Ideogram 4.5).\n6. **Harf harf kontrol et, tek hatayı düzelt.** Türkçe karakterler (ı, ş, ğ) doğru mu? Logo başın arkasından mı geçiyor, yoksa yüzün üstüne mi binmiş? Bir başlıkta tek harf bozuksa bütün kapağı baştan üretme; önceki dersteki gibi sadece o kelimeyi maskeleyip düzelt.\n7. **Video için ikinci açıyı üret.** Giriş videosunun ilk karesi lazım. Yazısız fotoğrafı referans verip aynı sahnenin bir an öncesini iste: kadın yürüyor, saçı henüz savrulmamış, şişe elinde, damlalar daha yok, kamera biraz daha geride. Bu kare videonun başlangıcı olacak.\n8. **Giriş videosunu üret.** Magnific'in Video Generator'ında başlangıç ve bitiş karesini destekleyen bir model seç (model listesinde \"Start + end\" etiketi olanlar; örneğin Kling'in Omni sürümü). Başlangıç karesi: 7. adımdaki görsel. Bitiş karesi: 4. adımdaki **yazısız** fotoğraf. Prompt'ta hareketi anlat: saç savrulur, damlalar patlar, kadın tam o anda donar, arkadaki kalabalık yürümeye devam eder, kamera yavaşça yaklaşır. 5 saniye, 1080p.\n9. **Grafikleri After Effects'te ekle ve teslim et.** Videoyu After Effects ya da Premiere'e al. Kapak grafiklerini (dergi adı, bant, başlıklar, barkod) videonun son karesinde, kadın donduğu anda belirecek şekilde koy; gerekirse son kareyi 1-2 saniye uzat (freeze frame). Logoyu başın arkasından geçirmek için kadının saçını basit bir maskeyle ayır. Çıktılar: kapak görseli 3:4 PNG ve giriş videosu 3:4 MP4. Fiyat ve gerçek marka logosu orijinal dosyalardan eklenir.\n\n### Örnek prompt'lar\n\n`A young woman from image 1 walking through a crowded covered bazaar passage, holding the serum bottle from image 2, frozen mid-motion as she flips her hair, water droplets suspended in mid-air around her, she looks down at the bottle, not at the camera, people behind her blurred with strong motion blur, shot on a phone ultra-wide lens from slightly below, soft daylight from the glass roof, leave empty space above her head for a magazine title, 3:4, no text, no letters, no logos, no graphics`\n\nKullanım yeri: Kozmetik lansmanının yazısız kapak fotoğrafı. \"Frozen mid-motion\" ve \"suspended in mid-air\" donmuş anı kurar, \"motion blur\" arka planın akmasını sağlar, sondaki dört yasak fotoğrafa tek harf bile girmemesi içindir.\n\n`Keep the photo exactly the same. Add a fashion magazine cover layout on top: the masthead \"PARILTI\" at the top in a tall elegant serif font, white, partly hidden behind her hair; a round coral corner flash at top right that says \"YENİ\"; three short cover lines on the left in a clean sans-serif: \"C vitamini ile sabah ışıltısı\", \"3 adımda parlak cilt\", \"Ayva Skin'in yeni serumu\"; a small barcode at bottom right. Do not change her face, the bottle, the droplets or the light.`\n\nKullanım yeri: Aynı fotoğrafın üstüne grafik düzeni eklemek. İlk cümle fotoğrafı kilitler, sonra her parça yeriyle ve fontuyla ayrı ayrı sayılır, son cümle korunacakları tekrar eder.\n\n`A female boxer in an old gym, frozen at the exact moment her glove hits the heavy bag, sweat drops and chalk dust suspended in the air, the bag deformed by the punch, other athletes training behind her with motion blur, phone ultra-wide lens, low angle, hard window light, empty space at the top for a magazine title, 3:4, no text, no letters, no logos`\n\nKullanım yeri: Bir spor salonu ya da spor giyim markası için \"sporcu kapağı\". Aynı iskelet, farklı sektör: değişen sadece özne, mekan ve donan olay.\n\n`Keep the photo exactly the same. Add a minimalist interior design magazine cover: masthead \"ODA\" in a thin wide sans-serif, black, at the top center; a small black rectangle corner banner at top left that says \"ÖZEL SAYI\"; two cover lines at the bottom left: \"Küçük salonlar için 7 fikir\", \"Işıkla büyüyen evler\"; a barcode at bottom right. Generous white margins, calm Swiss layout.`\n\nKullanım yeri: Emlak ya da iç mimari markası için, bir salon fotoğrafının üstüne sakin, sade bir dergi düzeni. Moda kapağından farklı olarak font ince, düzen ferah; kapak stilini markanın kişiliğine göre seçtiğini gösterir.\n\n`The woman walks through the crowded bazaar holding the serum, then flips her hair; water droplets burst around her and she freezes completely mid-motion, droplets hanging in the air, while the crowd behind her keeps walking with motion blur. The camera slowly pushes in. No text on screen.`\n\nKullanım yeri: 8. adımdaki giriş videosu. Başlangıç ve bitiş karesi zaten verildiği için prompt sadece aradaki hareketi ve \"özne donar, arka plan akmaya devam eder\" zıtlığını anlatır.\n\n### Sık yapılan hatalar\n\n- **Kapağı tek prompt'ta istemek.** Fotoğraf da yazılar da yarım olur; bir başlığı değiştirmek istediğinde fotoğraf da kayar. Önce yazısız fotoğraf, sonra düzen.\n- **Fotoğrafta yer bırakmamak.** Başın üstünde boşluk yoksa logo yüzün üstüne biner ya da model kadrajı daraltır. Boşluğu fotoğraf adımında iste.\n- **Videonun son karesine yazılı kapağı koymak.** Video modelleri yazıyı hareket ettirirken bozar; harfler titrer, eğrilir. Videoyu yazısız fotoğrafla bitir, grafikleri kurgu programında ekle.\n- **Gerçek bir derginin adını kullanmak.** Tanınmış bir derginin logosu başka bir şirketin markasıdır. Her zaman uydurma bir ad kullan ve müşteriye de bunu söyle.\n\n### Profesyonel yöntem\n\nDeneyimli üreticilerin bu formatta izlediği yol üç sabit adımdan oluşur: **fotoğraf, düzen, hareket.** Her adımın kendi prompt şablonu vardır ve bir adım bitmeden ötekine geçilmez. Bunun nedeni basit: bir adımda yapılan hata bir sonrakine taşınmasın. Fotoğraf onaylanmadan düzene geçersen, fotoğrafı değiştirmek istediğinde bütün yazıları da yeniden yaptırırsın. Düzen onaylanmadan videoya geçersen, kapak başlığı değişince video da çöpe gider.\n\nFotoğraf şablonunda **sabit kalan** kısım hissi kuran kamera dilidir: geniş açı, havada donmuş an, öznenin kameraya değil aşağıya bakması, arkada hareket bulanıklığıyla akan insanlar, telefonun ultra geniş açısı, 3:4 oran ve \"grafiksiz, yazısız\" yasağı. **Değişen** kısım üç boşluktur: karakter (kim), mekan (nerede) ve donan olay (ne oluyor: saç savrulması, yumruk anı, köpük patlaması, konfeti). Bu yüzden şablonu bir kez kurduktan sonra yeni bir marka için sadece üç boşluğu doldurursun. Kameranın değil aşağıya bakan bakış özellikle işe yarar: insan kameraya bakınca poz verdiği anlaşılır; aşağı bakan özne ise \"bir anı yakalanmış\" gibi durur ve donmuş an inandırıcı olur.\n\nDüzen şablonunda sabit kısım, fotoğrafı kilitleyen ilk cümle ile parçaların sırasıdır: dergi adı, köşe bandı, başlıklar, barkod. Değişen kısım dergi adı, renkler, fontun karakteri ve başlık metinleridir. Dergi adını her seferinde kendin uydurursun. Barkod ve köşe bandı küçük ayrıntılar gibi görünür ama gözün \"bu bir dergi kapağı\" demesini sağlayan şey tam olarak onlardır; atlama.\n\nHareket adımında aynı sahneden **ikinci bir açı** üretip onu videonun ilk karesi, kapak fotoğrafını son karesi yaparsın. Son karede özne donuk kalır, arka plan hareket etmeye devam eder. İzleyici videonun sonunda kapak fotoğrafını görür; kapak grafikleri de tam o anda belirir. Böylece bir kapak görseli, bir giriş videosu ve istersen aynı fotoğraftan farklı başlıklarla birkaç kapak versiyonu aynı üretimden çıkar.\n\n### Ödev\n\n20-30 dakika ayır ve kendi \"donmuş an\" kapağını yap. Üzerinde çalıştığın ya da yakında gelecek bir işin ürününü kullanabilirsin; yoksa bir içecek ya da spor ayakkabı seç.\n\n1. Fotoğraf şablonundaki üç boşluğu doldur: karakter, mekan, donan olay. Yazısız fotoğrafı Nano Banana 2.1 ile 3:4'te dört sonuçla üret, birini seç.\n2. Kendi uydurduğun bir dergi adıyla düzeni ikinci adımda ekle: dergi adı, köşe bandı, üç başlık, barkod. Logoyu başın arkasından geçirmeyi dene.\n3. Vaktin kalırsa ikinci açıyı üret ve başlangıç-bitiş kareli kısa bir giriş videosu dene; son kare yazısız fotoğraf olsun.\n\nSonucu Claude'a gösterip şunu sorabilirsin: \"Bu bir dergi kapağı gibi duruyor mu? Logo, başlıklar ve fotoğraf arasındaki denge nasıl, hangi başlık fazla uzun?\"\n\n### Tekrar sorularının cevapları\n\n1. Edit drift, bir görseli her düzenleyişte dokunmadığın yerlerin de azar azar değişmesidir: renkler solar, yüzler hafifçe başkalaşır, küçük lekeler birikir. Birkaç tur sonra görsel, müşterinin onayladığı görsel olmaktan çıkar; bu yüzden her turda tek değişiklik isteyip gerisini açıkça kilitliyorduk.\n2. Model çeviriyi kendisi yapınca anlamı ya da tonu kaydırabilir, marka adını da çevirmeye kalkabilir. Bu yüzden yeni metni tırnak içinde hazır veriyor ve marka adının çevrilmeyeceğini ayrıca yazıyorduk (örneğin \"Do not translate the neon sign\").\n\nSıradaki ders: AI + Photoshop/Illustrator: katmanlara ayırma, SVG, vektör\n\n### Kaynaklar\n\n- [Video models – Magnific](https://www.magnific.com/ai/docs/video-ai-models)\n- [How to create a time-freeze effect video – Morphic](https://morphic.com/resources/how-to/create-time-freeze-effect-video)\n", "module": 3, "moduleName": "Tutarlılık", "n": 28, "summary": ["Dergi kapağı formatı, ürünü ya da marka yüzünü tanıdık bir düzenle sunduğu için sosyal medyada gözü hemen yakalar.", "Kapağı tek prompt'ta isteme: önce yazısız fotoğrafı üret, onaylanınca düzeni ayrı bir adımda üstüne ekle.", "Fotoğraf prompt'unda üstte logo boşluğu iste ve sonuna mutlaka 'no text, no letters, no logos' ekle.", "Donmuş an için özne hareketin ortasında durur, kameraya değil aşağı bakar, arkadaki kalabalık hareket bulanıklığıyla akar.", "Giriş videosunu yazısız fotoğrafla bitir; dergi adını ve başlıkları kurgu programında ekle, gerçek dergi adı kullanma."], "title": "Dergi kapağı tekniği: fotoğrafı ve grafik düzeni iki ayrı adımda üretmek, donmuş kare girişi"}], "outline": {"modules": [{"items": [{"n": 1, "title": "AI görsel üretimi nasıl çalışır + araç haritası"}, {"n": 2, "title": "Prompt'un anatomisi (özne, ortam, ışık, stil, kamera)"}, {"n": 3, "title": "Prompt pratiği: aynı fikri farklı şekillerde yazmak"}, {"n": 4, "title": "Modeller: hangisi neyde iyi (Magnific'teki modeller üzerinden)"}, {"n": 5, "ti <style>
/* Layout: a classroom shell (module sidebar + lesson column + sticky lesson rail). Every module owns a hue; lessons are built from typed blocks; the flow is a zoomable node canvas like a Magnific Space. */
:root{
  --bg:#F2F2EE; --surface:#FFFFFF; --surface-2:#F8F8F5; --ink:#16171A; --muted:#5B5D65; --faint:#8A8C94; --line:#E0E0D9; --line-2:#ECECE6;
  --accent:#DD4F24; --accent-soft:#FBE6DD; --accent-ink:#FFFFFF;
  --teal:#0E857C; --teal-soft:#DCF1EE; --violet:#6A52C8; --violet-soft:#ECE8FA; --blue:#2E62D9; --blue-soft:#E3EBFB;
  --amber:#B7791F; --amber-soft:#FBF0DA; --rose:#C93A5E; --rose-soft:#FBE4EA; --good:#1F8A4C; --good-soft:#DFF3E7;
  --m1:#DD4F24; --m2:#2E62D9; --m3:#7A4FD0; --m4:#C93A5E; --m5:#0E857C; --m6:#B7791F; --m7:#3F7F2C; --m8:#1B7EAD; --m9:#5A5F6E; --m10:#A8432A;
  --canvas:#E7E7E1; --dot:#CBCBC3; --node:#FFFFFF; --node-line:#D8D8D1; --group:rgba(23,24,27,.035); --group-line:rgba(23,24,27,.14);
  --scrim:rgba(20,20,18,.32);
  --shadow:0 1px 2px rgba(20,20,15,.06),0 6px 18px rgba(20,20,15,.06);
  --shadow-lg:0 2px 6px rgba(20,20,15,.08),0 18px 40px rgba(20,20,15,.12);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --side:300px; --topH:58px;
}

  --bg:#111214; --surface:#191A1E; --surface-2:#1F2025; --ink:#EDEDEA; --muted:#A5A7AF; --faint:#7C7E86; --line:#2C2E34; --line-2:#24262B;

  --canvas:#0D0E10; --dot:#26282D; --node:#1A1C20; --node-line:#2F3137; --group:rgba(255,255,255,.025); --group-line:rgba(255,255,255,.12);
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 18px 44px rgba(0,0,0,.5); color-scheme:dark}}
