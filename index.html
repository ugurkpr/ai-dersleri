t": "Gözünü kısıp bak: dördü aynı kişi mi? Kayan sahneyi master'dan yeniden üret.", "title": "Yüz testi", "tool": "kontakt sayfası"}, {"c": 7, "end": true, "id": "save", "pv": {"items": ["defne_master.png", "defne_sayfa_5panel.png", "Kimlik kartı (metin)", "Sahne şablonu + Spaces şablonu"], "k": "list"}, "r": 0, "s": 8, "t": "export", "text": "Bu dört parça Defne'nin kimliği; yeni post = sadece sahne şablonunu doldurmak.", "title": "Oyuncuyu kaydet"}], "title": "Oyuncuyu bir kere beyaz fonda kur, her sahnede o fotoğrafı referans ver; yazı sadece sahneyi anlatsın"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Önceki derste kampanya setini kurarken kullandığımız üç katman neydi: kural kitabı, kimlik kartları ve sahne listesi neyi tutuyordu?\n2. Sette bir kare \"yabancı\" duruyorsa neyi düzeltirsin, görseli mi şablonu mu? Neden?\n\n### Konu\n\nModül 3'e hoş geldin. Bu modülün tek bir derdi var: tutarlılık. Önceki derste tutarlılığı ürün ve stil üzerinden öğrendik; bilerek insan yüzü kullanmadık. Bu derste en zor kısma giriyoruz: aynı kişinin her karede aynı kişi olarak kalması. Buna karakter tutarlılığı diyoruz.\n\nNeden zor? Çünkü AI modeli bir insanı hatırlamaz. Her üretim sıfırdan başlar. \"Kıvırcık saçlı, çilli, 29 yaşında kadın\" yazdığında model her seferinde bu tarife uyan başka birini çizer. Tarif aynı, kişi farklı. Bir spor salonu için 10 postluk seri yapıyorsan ve \"markanın yüzü\" olan antrenör her postta başka biriyse, izleyici bunu hemen fark eder ve seri amatör görünür. Ajansta bunun karşılığı şu işler: markanın sosyal medya yüzü, bir reklam filminin kahramanı, maskot, bir kampanyada her karede görünen aynı manken.\n\nBenzetme: Bir dizi çekimini düşün. Çekimler başlamadan önce oyuncu kostüm provasına girer, makyajı yapılır ve önden, yandan, arkadan fotoğrafı çekilir. Bu fotoğraflar seti dolaşır. Aylar sonra başka bir şehirde çekilen sahnede bile ekip o fotoğraflara bakıp \"saçı bu tarafa ayrılıyordu, küpesi gümüştü\" der. Bizim yöntemimiz de tam bu: önce oyuncuyu bir kere ve düzgünce kuruyoruz, sonra her sahnede o fotoğrafları modele gösteriyoruz.\n\nKarakter tutarlılığının üç temel kuralı var:\n\n1. Karakteri yazıyla değil görselle taşı. Yazı her seferinde yeniden yorumlanır, görsel ise modelin bakabileceği somut bir kanıttır. Bu yüzden karakteri bir kere üretip o görseli referans (Ders 12'de öğrendiğin görselden görsel mantığı) olarak kullanıyoruz.\n2. Karakteri boş, beyaz fonda kur. Arka planda spor salonu, sokak, ağaç varsa model bunları da karakterin parçası sanar ve her sahneye taşımaya çalışır. Beyaz fon \"sadece bu kişiye bak\" demektir.\n3. Her açıdan göster. Sadece önden bir fotoğrafın varsa, profilden bir sahne istediğinde model yüzün yan tarafını uydurur. Uydurduğu yerde de kişi değişir. Bu yüzden karakter sayfası çıkarıyoruz: aynı kişinin önden, yandan, arkadan, yakından görünümleri tek görselde.\n\nBunu profesyonel ekiplerin kullandığı sırayla, üç adımda yapıyoruz:\n\n- Adım 1, oyuncu: Karakterin boydan, önden, beyaz fonda tek bir fotoğrafı. Buna \"master\" diyeceğiz; her şeyin kaynağı bu.\n- Adım 2, karakter sayfası: Master'ı referans verip aynı kişinin 5 açılı kolajını üretmek.\n- Adım 3, sahne: Master ve sayfayı referans verip karakteri gerçek bir sahneye koymak. Burada sadece aksiyon, mekan, ışık ve kadraj değişir; kişi değişmez.\n\nBir de \"kimlik çapası\" kavramını bilmen lazım. Bunlar karakteri tanıtan, her karede görünmesi gereken 5-7 belirgin özellik: saç şekli ve rengi, çiller, bir küpe, gözlük, belli bir ceket rengi gibi. Çok fazla özellik yazarsan model hangisinin önemli olduğunu karıştırır; çok az yazarsan karakter \"herhangi biri\" olur. İyi bir başlangıç ölçüsü: 3 yüz özelliği, 2 aksesuar, 1-2 kıyafet parçası.\n\nMagnific'te bu işin iki yolu var, bu derste birincisini öğreniyoruz:\n\n- Referansla tutarlılık (bu ders): Image Generator'da Nano Banana Pro gibi referans kabul eden bir modele master ve sayfayı verirsin. Hızlıdır, eğitim gerektirmez, tek kampanyalık işler için yeter.\n- Özel karakter eğitimi (sonraki ders): Magnific'in Custom Characters özelliği, yüklediğin 12-24 fotoğraftan karakteri öğrenen küçük bir ek model (LoRA) eğitir. Eğitim yaklaşık 15-30 dakika sürer, ücretli planlarda ve 5.500 kredi tutar. Aylarca kullanılacak bir marka yüzü ya da maskot için değer. İşin güzel yanı, bu derste çıkaracağın karakter sayfası ve sahneler o eğitim için gereken fotoğrafların ilk partisi olacak.\n\nBir uyarı: Bu derste tamamen hayali bir kişi üretiyoruz. Gerçek birinin yüzünü (bir çalışan, bir müşteri, ünlü biri) kullanacaksan o kişinin yazılı izni şart. Bunu Modül 6'daki telif ve ticari kullanım dersinde ayrıntılı konuşacağız.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Karakter tutarlılığı | Aynı kişinin farklı görsellerde aynı yüz, saç ve kıyafetle görünmesi | character consistency |\n| Karakter sayfası | Aynı karakterin birkaç açıdan görünümünü tek görselde toplayan kolaj | character sheet, turnaround |\n| Master görsel | Karakterin her şeye kaynak olan temiz, boydan, beyaz fonlu ilk fotoğrafı | master reference |\n| Kimlik çapası | Karakteri tanıtan ve her karede görünmesi gereken 5-7 belirgin özellik | defining traits, identity anchors |\n| Karakter kayması | Karelerde yüzün ya da detayların yavaş yavaş başka birine dönüşmesi | identity drift, character drift |\n| Sahne şablonu | Karakter sabit kalırken sadece aksiyon, mekan, ışık ve kadrajın değiştiği prompt kalıbı | scene template |\n| Özel karakter (LoRA) | Fotoğraflardan bir karakteri öğrenip her üretimde onu hatırlayan küçük ek model | custom character, LoRA |\n| Kontakt sayfası | Kareleri yan yana koyup yüzleri karşılaştırdığın kontrol sayfası | contact sheet |\n\n### Görsel örnek\n\n![Master: beyaz fonda boydan Defne](img/d20-1.jpg)\n![Karakter sayfası: 5 panel](img/d20-2.jpg)\n\nKarakter tutarlılığı: önce tek bir master görsel kuruluyor, sonra aynı kişinin her açıdan görünümü referansla çıkarılıyor.\n\nNasıl üretildi: Nano Banana 2 Lite, 9:16: dersteki master prompt'u (kıvırcık yüksek topuz, burunda çil, kalın kaş, gümüş halka küpe, sol bilekte siyah saat, petrol mavisi fermuarlı ceket, siyah tayt, beyaz fon). Sayfa: master'ı referans verip 16:9, dersteki 5 panelli 'character reference sheet … no text, no labels' prompt'u.\n\n### Uygulama\n\nSenaryo: Üç şubesi olan bir spor salonu markası, Instagram için bir \"marka yüzü\" istiyor: her hafta paylaşılacak postlarda hep aynı antrenör görünecek. Adı Defne olsun. İlk ay için üç sahne isteniyor: sabah salonda kettlebell hareketini gösteren Defne, sahilde gün batımında koşu sonrası esneyen Defne ve kış kayıt kampanyası için salonun girişinde iki su şişesi uzatan Defne. Biz önce Defne'yi \"kuracağız\", sonra üç sahneye koyacağız. Hepsini Magnific Spaces'te tek tuvalde yapacağız.\n\n1. Kimlik kartını yaz. Claude'a \"Bir spor salonu için hayali bir antrenör karakteri tasarla. 3 yüz özelliği, 2 aksesuar, 2 kıyafet parçası ver; hepsi uzaktan bile fark edilecek kadar belirgin olsun\" de. Örnek kart: yüksek topuz yapılmış sıkı kıvırcık koyu saç, burnunda hafif çiller, kalın kaşlar; küçük gümüş halka küpe, sol bilekte siyah spor saati; petrol mavisi fermuarlı antrenman ceketi, siyah tayt. Bu kartı Spaces'te bir Text kutusuna yapıştır. Bundan sonra her prompt bu kartla aynı kelimeleri kullanacak.\n2. Master portreyi üret. Text kutusunu bir Image Generator'a bağla. Model: Nano Banana Pro (ürün ve karakter sadakati iyi). Oran 9:16 (boydan duruş için dikey), çözünürlük deneme için 1K, 4 varyasyon. Aşağıdaki ilk örnek prompt'u kullan: boydan, önden, düz duruş, kollar yanda, nötr ifade, saf beyaz stüdyo fonu, yumuşak eşit ışık, yazı yok.\n3. Master'ı seç ve temizle. Dört sonuçtan yüzü en net, kıyafeti en düzgün olanı seç. Elde altı parmak, yamuk küpe gibi bir hata varsa Ders 13'teki inpaint ya da Retouch ile sadece o bölgeyi düzelt. Beğendiğini 2K'ya yeniden üret ya da büyüt ve adını \"defne_master\" koy. Bundan sonra hiçbir sahneyi başka bir sahneden değil, hep bu görselden türeteceksin.\n4. Karakter sayfasını üret. Yeni bir Image Generator aç, master'ı referans girişine bağla. Oran 16:9 (beş paneli yan yana sığdırmak için), Nano Banana Pro. İkinci örnek prompt'u kullan: beş panel, yakın yüz ve omuzlar, sağ profil, sol profil, boydan önden, boydan arkadan; hepsinde aynı yüz, aynı saç, aynı küpe; yazı ve etiket yok.\n5. Sayfayı kontrol et. Beş paneli tek tek kimlik kartınla karşılaştır: çiller her yakın planda var mı, küpe iki profilde de aynı mı, ceketin rengi kaymış mı, arkadan topuz doğru mu? Bir panel bozuksa bütün sayfayı çöpe atma; 2-3 kez daha üretip en iyisini seç. Bu sayfa senin \"oyuncu fotoğrafın\" olacak, burada titiz olmak sonraki bütün işi kurtarır.\n6. Sahne şablonunu kur ve üç sahneyi üret. Bir Text kutusuna şu kalıbı yaz: \"Using the woman from the reference images: [aksiyon], [mekan], [kadraj ve lens], [ışık], [renk ve atmosfer].\" Kalıbın başı hiç değişmez, köşeli parantezler her sahnede dolar. Master ve sayfayı üç ayrı Image Generator'a referans olarak bağla, oran 4:5 (Instagram post), 1K. Salon, sahil ve kayıt kampanyası için üç prompt'u yaz (aşağıda örnekleri var). Önemli: sahne prompt'unda yüzü yeniden tarif etme; yüzü referans taşır, yazı sadece sahneyi anlatır. Sadece sahneye göre değişebilecek şeyleri yaz (örneğin kampanya sahnesindeki kırmızı havlu).\n7. Yüz testi yap. Üç sahneyi ve master'ı yan yana koy (kontakt sayfası). Kendine üç soru sor: Gözlerini kısıp baktığında dördü aynı kişi mi? Kimlik çapalarının hepsi her karede var mı? Işık değişince yüz şekli de değişmiş mi? Bir sahne kaymışsa, o sahneyi yeniden üret ve prompt'taki kişiyle ilgili fazladan kelimeleri sil.\n8. Oyuncuyu kaydet. Master, karakter sayfası, kimlik kartı ve sahne şablonunu bir klasöre koy, Spaces'i şablon olarak kaydet. Beğenilen sahneleri sonra 2K'da yeniden üretip büyütürsün. Bu dört dosya artık Defne'nin \"kimliği\"; gelecek hafta yeni post istendiğinde sadece sahne şablonunu doldurman yetecek.\n\n### Örnek prompt'lar\n\n`Full-body fashion photo of a 29-year-old woman personal trainer, tight dark curly hair tied in a high bun, light freckles across the nose, thick eyebrows, small silver hoop earrings, black sports watch on the left wrist, teal zip-up training jacket, black leggings, white training shoes. Standing straight facing the camera, arms relaxed at her sides, neutral calm expression. Seamless pure white studio background, soft even studio light, 50mm lens, sharp focus, no text.`\n\nKullanım yeri: Adım 1, master portre. Kimlik kartındaki her özellik açıkça yazılı; duruş düz, ifade nötr, fon bembeyaz. Ayakkabıyı da yazdık: boydan çekimde ayak tarif edilmezse model her seferinde başka bir ayakkabı uydurur. Nötr ifade önemli: sonra sahnelerde gülümsetmek kolay ama abartılı bir gülüşle kurulan yüz her yerde o gülüşü taşımaya çalışır.\n\n`Character reference sheet of the woman in the reference image. One image with five panels side by side on a pure white background: close-up of face and shoulders, right profile, left profile, full body front view, full body back view. Keep her face, hair, freckles, earrings, sports watch and outfit exactly identical in every panel. Same soft even studio light in all panels. No text, no labels, no logos.`\n\nKullanım yeri: Adım 2, karakter sayfası. \"Exactly identical in every panel\" vurgusu ve hangi detayların aynı kalacağının tek tek sayılması kaymayı azaltır. Yazı ve etiket yasağı, modelin panellerin altına anlamsız harfler basmasını engeller.\n\n`Using the woman from the reference images: candid lifestyle photo, she is demonstrating a kettlebell swing on a black rubber gym floor, medium shot at eye level, 35mm lens, cool morning light from tall windows on the left, dumbbell racks and training equipment softly blurred in the background, teal and charcoal color palette, natural film grain.`\n\nKullanım yeri: Salon tanıtım postu (4:5). Şablonun sabit başı korunuyor, kişi tarifi yok; sadece aksiyon, mekan, kadraj, ışık ve renk var. Ceketin petrol mavisi ile renk paletinin uyumlu olması seriyi de tutarlı yapar.\n\n`Using the woman from the reference images: she stretches her legs on a seaside stone wall at sunset after a run, a water bottle beside her, the sea and a long promenade behind her, medium wide shot, 50mm lens, golden hour backlight with a soft rim light on her hair, gentle sea breeze, relaxed smile, warm golden tones.`\n\nKullanım yeri: Hafta sonu postu, sahil sahnesi. Arkadan gelen ışık yüzü karartabilir; \"soft rim light\" ile saç kenarını aydınlatıp yüzün okunmasını sağlıyoruz. Esneme pozunda yüz profilden görünür, bu yüzden sayfadaki yan panellerin işe yaradığı yer burası.\n\n`Using the woman from the reference images: she has a red gym towel over the shoulder of her teal training jacket, holding two water bottles toward the camera at the gym entrance on a winter evening, a glowing neon gym sign above the door, medium close-up, 35mm lens, warm practical light, energetic smile, shallow depth of field, space at the top for a headline.`\n\nKullanım yeri: Kış kayıt kampanyası. Havlu sahneye eklenen tek parça; ceketi koruduğumuz için kimlik bozulmuyor. \"Space at the top for a headline\" ile kampanya tarihini ve başlığı Photoshop'ta koyacağın boşluğu baştan bırakıyorsun.\n\n### Sık yapılan hatalar\n\n- **Karakteri sahnenin içinde kurmak.** İlk görseli salonda üretip onu referans yaparsan model salonu da karakterin parçası sanar; sahil sahnesinde bile arkada dambıl rafı belirebilir. Oyuncu her zaman beyaz fonda kurulur.\n- **Sahne prompt'unda yüzü yeniden tarif etmek.** Referansta çilli, kıvırcık saçlı bir kadın varken prompt'a \"beautiful woman with long straight hair\" yazarsan model ikisinin arasında bir yerde başka birini çizer. Yüzü referansa bırak, yazıyı sahneye ayır.\n- **Hep son kareden devam etmek.** Sahil sahnesini salon sahnesinden, kampanya sahnesini sahilden türetirsen her adımda küçük bir kayma birikir ve beşinci karede kişi değişmiş olur; üst üste düzenleme kaliteyi de düşürür. Her sahne master'dan ve sayfadan doğar.\n- **Kimlik çapalarını belirsiz bırakmak.** \"Güzel, genç, sportif\" gibi özellikler herkese uyar. Uzaktan bile görünen, ölçülebilir detaylar seç: gümüş halka küpe, petrol mavisi ceket, burunda çiller.\n\n### Profesyonel yöntem\n\nKarakterle çalışan profesyonel ekiplerin ortak kuralı tek cümle: önce oyuncu, sonra sahne. Karakter bir kere, beyaz fonda ve her açıdan düzgünce kurulur; ondan sonra her sahnede ve ileride her videoda o hazır \"oyuncu\" referans olarak kullanılır. Bu yöntemin gücü, işi üç ayrı şablona bölmesinden ve her şablonda neyin sabit, neyin değişken olduğunun önceden belli olmasından geliyor.\n\n1. **Karakter şablonu: sen sadece kişiyi doldurursun.** Prompt'un bir kısmı hep aynı kalır: düz, önden duruş; beyaz stüdyo fonu; moda çekimi gibi temiz kamera ve ışık ayarları. Senin değiştirdiğin tek kısım kişinin tarifi ve kıyafeti. Başlangıç noktası yazı da olabilir, elindeki bir yüz fotoğrafı da (izinli olmak şartıyla). Neden işe yarıyor: sabit kısımlar her karakteri aynı \"stüdyo koşullarında\" doğurur, böylece sonradan karşılaştırması ve kullanması kolay olur.\n2. **Karakter sayfası şablonu: burada hiçbir şey yazmazsın.** Sabit bir kompozisyon tarifi (beş kare: yakın yüz ve omuzlar, sağ profil, sol profil, boydan önden, boydan arkadan) ve master görsel referans olarak verilir. Şablonun kilitli parçaları \"her açıda birebir aynı kişi\" vurgusu ile \"yazı ve logo yok\" yasağıdır. Neden işe yarıyor: her yeni karakterde aynı sayfa düzeni çıkar; ekipte herkes sayfaya bakınca neyi nerede arayacağını bilir.\n3. **Sahne şablonu: dokuz boşluk doldurursun.** Görüntü türü, aksiyon, kadraj, kamera açısı, lens, ışık, mekan, renk ve atmosfer. Kişiyle ilgili tek kelime yazmazsın, onu referans taşır. Mekanı ne kadar net anlatırsan karakter sahneye o kadar doğru oturur: \"spor salonu\" yerine \"siyah kauçuk zemin, solda yüksek pencereler, arkada dambıl rafı\" gibi.\n\nDeneyimli üreticilerin iki ek ipucu var. Birincisi, boydan çekimde ayakkabıyı mutlaka tarif et; tarif edilmeyen ayak her seferinde başka bir ayakkabıyla çıkar ve karakter sayfası \"eksik\" kalır. İkincisi, hep temiz ana görselden yola çık: aynı görseli üst üste düzenledikçe kalite düşer ve yüz yavaş yavaş kayar. Bu yüzden her sahne master ve sayfadan doğar, bir önceki sahneden değil.\n\nYöntemin özü karakter sayfasıdır. Onu bir kere titizlikle çıkarıp kaydedersen sonraki bütün sahneler, bir sonraki dersteki eğitim seti ve Modül 4'te göreceğimiz video tutarlılığı (video modellerinde karakteri kayıtlı bir \"öğe\" olarak her çekime bağlamak) hep ona dayanır. Büyük ekiplerde bu üç şablon bir kere yazılır, sonra sahne prompt'larını toplu halde bir yapay zeka asistanına yazdırırlar: \"bu kurallara uyan 8 sahne yaz\" gibi. Sen de sahne şablonunu Claude'a verip aynı karakter için bir haftalık sahne listesi isteyebilirsin.\n\n### Ödev\n\nSüre 25-30 dakika.\n\n1. Kendi karakterini seç: üzerinde çalıştığın ya da yakında gelecek bir iş için bir marka yüzü (bir fırının ustası, bir butiğin mankeni, bir spor salonunun antrenörü). Claude'dan 3 yüz özelliği, 2 aksesuar, 2 kıyafet parçası olan bir kimlik kartı iste.\n2. İlk prompt'un yapısıyla master portreyi 9:16, 1K, beyaz fonda üret; en iyisini seç.\n3. İkinci prompt'un yapısıyla 5 panelli karakter sayfasını üret. En az bir kez yeniden deneyip ikisini karşılaştır.\n4. Karakteri iki farklı sahneye koy: biri iç mekan (örneğin salonun ya da dükkanın içi), biri dış mekan (örneğin sahil ya da bir sokak). Sahne prompt'larında yüzü tarif etme.\n5. Master ve iki sahneyi yan yana koy, yüz testinin üç sorusunu sor.\n\nBitince master'ı, sayfayı ve iki sahneyi Claude'a gösterip \"bu üç görselde aynı kişi mi, hangi kimlik çapası kaybolmuş ve prompt'ta neyi değiştirmeliyim?\" diye yorum isteyebilirsin. Sayfayı ve kimlik kartını sakla; bir sonraki derste aynı karakteri farklı açılarla genişleteceğiz.\n\n### Tekrar sorularının cevapları\n\n1. Kural kitabı, marka rehberi ve ana prompt şablonuydu; ışık, renk paleti, kamera, doku ve ruh hali bir kere yazılıp kilitleniyordu. Kimlik kartları, ürünün gerçek fotoğraflarından çıkan ürün sayfasıydı; ürünü yazıyla değil fotoğrafla tarif ediyorduk. Sahne listesi ise şablonun sadece değişken kısımları (sahne, ürün, kadraj) doldurularak yazılan prompt'lardı.\n2. Şablonu. Bir kare yabancı duruyorsa sebebi çoğu zaman şablonun bir yerinin boş ya da belirsiz kalmasıdır. Tek görseli düzeltirsen sorun bir sonraki karede tekrar çıkar; şablonu sıkılaştırınca bütün set birlikte düzelir. Bu derste de aynı mantık geçerli: bir sahnede kişi kaymışsa önce sahne şablonuna ve kimlik kartına bak.\n\nSıradaki ders: Karakter kütüphanesi ve farklı açılar\n\n### Kaynaklar\n\n- [Magnific – Custom Characters](https://www.magnific.com/ai/custom-characters)\n- [Nano Banana Pro: Consistent Character Sheets Guide](https://selfielabstudio.com/blog/nano-banana-pro-consistent-character-sheets-guide-20260220)", "module": 3, "moduleName": "Tutarlılık", "n": 20, "summary": ["AI modeli kişiyi hatırlamaz; aynı yazılı tarif her üretimde başka bir yüz çıkarır, bu yüzden karakteri görselle taşırız.", "Önce oyuncuyu kur: karakteri boydan, önden, nötr ifadeyle ve saf beyaz fonda tek bir master görsel olarak üret.", "Master'dan beş açılı bir karakter sayfası çıkar: yakın yüz, sağ ve sol profil, boydan önden ve arkadan.", "Sahne prompt'unda yüzü asla yeniden tarif etme; yüzü referans taşır, yazı sadece aksiyon, mekan, ışık ve kadrajı anlatır.", "Her sahneyi master ve sayfadan üret, bir önceki sahneden değil; sonunda kareleri yan yana koyup yüz testi yap."], "title": "Karakter tutarlılığının temelleri"}, {"checked": "Ekim 2026", "date": "9 Ekim 2026", "flow": {"edges": [{"a": "master", "b": "vang", "k": "img"}, {"a": "master", "b": "vexp", "k": "img"}, {"a": "master", "b": "outfit", "k": "ref", "l": "referans"}, {"a": "master", "b": "camlow", "k": "img"}, {"a": "master", "b": "camtop", "k": "img"}, {"a": "card", "b": "outfit", "k": "txt", "l": "korunacaklar"}, {"a": "vang", "b": tag": "sakin gülümseme", "tone": "white"}], "k": "grid"}, "r": 1, "s": 3, "t": "variation", "text": "Nötr yüzle eğitilen karakter hep nötr bakar; ifade ekle.", "title": "İfade ızgarası", "tool": "Variations · Expressions"}, {"c": 1, "chips": ["9:16", "1K", "2 kıyafet"], "id": "outfit", "pv": {"k": "txt", "v": "Same woman from the reference images, keep her face, hair bun, freckles, silver hoop earrings and black sports watch exactly the same. Change only the outfit: a heather grey hoodie and black jogger pants..."}, "r": 2, "s": 5, "t": "gen", "text": "Model ceketi yüzün parçası sanmasın diye.", "title": "Kıyafet değişikliği", "tool": "Nano Banana Pro"}, {"c": 2, "id": "camlow", "pv": {"items": [["Dönüş", 20], ["Dikey", -25], ["Yakınlık", 4]], "k": "sl"}, "r": 0, "s": 4, "t": "adjust", "text": "Kayıt kampanyası posteri için; küçük adımlarla ilerle.", "title": "Alttan kahraman açısı", "tool": "Change Camera"}, {"c": 2, "id": "camtop", "pv": {"items": [["Dönüş", 0], ["Dikey", 60], ["Yakınlık", 5]], "k": "sl"}, "r": 1, "s": 4, "t": "adjust", "text": "Esneme rehberi postu için; 90'a çekme, en çok orada uydurur.", "title": "Tepeden bakış", "tool": "Change Camera"}, {"c": 3, "id": "set", "pv": {"items": ["Master 1 + sayfa panelleri 4", "Açı ızgarası 5 + Change Camera 2", "İfadeler 3 + kıyafet 2", "Önceki dersin gerçek sahneleri 3"], "k": "list"}, "r": 0, "s": 5, "t": "compare", "text": "Bozuk kare sete girmez; 16 temiz kare, 24 karışık kareden iyidir.", "title": "Eğitim seti: 20 kare"}, {"c": 4, "chips": ["High", "5.500 kredi", "15-30 dk"], "id": "train", "pv": {"k": "cutout", "m": "👩"}, "r": 0, "s": 6, "t": "ref", "text": "Adı: Defne_Antrenor_SporSalonu. Artık listeden tek tıkla seçilir.", "title": "Karakteri eğit", "tool": "Image Generator › Character › New character"}, {"c": 5, "chips": ["4:5", "Tepeden"], "id": "test", "pv": {"ar": "4:5", "k": "img", "m": "🧘", "tag": "tepeden: matta esneme yapıyor", "tone": "day"}, "r": 0, "s": 7, "t": "gen", "text": "Prompt'ta yüz yok; kişiyi kütüphanedeki karakter taşır.", "title": "Zor açıda test", "tool": "Image Generator + Defne seçili"}, {"c": 6, "id": "face", "pv": {"a": {"m": "👩", "tag": "referans yöntemi", "tone": "day"}, "b": {"m": "👩", "tag": "eğitilmiş Defne", "tone": "day"}, "k": "ba"}, "r": 0, "s": 7, "t": "compare", "text": "Aynı sahne iki yöntemle: referansla mı, eğitimle mi daha tutarlı?", "title": "Yüz testi"}, {"c": 7, "end": true, "id": "lib", "pv": {"items": ["defne_egitim_seti/", "defne_master + kimlik kartı", "Açı haritası: defne_alttan_d-25", "Sahne şablonu"], "k": "list"}, "r": 0, "s": 8, "t": "export", "text": "Gelecek hafta sadece sahne şablonunu doldurman yeter.", "title": "Kütüphaneyi düzenle"}], "title": "Açıları master'dan çoğalt, en iyi 20 kareyle karakteri eğit; sonra sadece sahneyi yaz"}, "genhq": false, "level": "İleri", "md": "### Hızlı tekrar\n\n1. Önceki dersteki yöntemin üç adımı neydi ve her adımda neyi üretiyorduk?\n2. Sahne prompt'unu yazarken karakterin yüzünü neden yeniden tarif etmiyorduk?\n\n### Konu\n\nÖnceki derste antrenör karakterimiz Defne'yi kurduk: beyaz fonda bir master portre, beş panelli bir karakter sayfası ve üç sahne. Bu derste iki eksiği kapatıyoruz. Birincisi açılar. Karakter sayfasında sadece beş açı var; ama ajans işi bundan fazlasını ister. Kayıt kampanyası posterinde Defne'yi alttan, \"kahraman\" gibi görmek istersin. Esneme rehberi postunda tepeden, matta uzanırken. Reels kapağında omzunun üstünden. Model bu açıları hiç görmediği için uydurur, uydurduğu yerde de yüz kayar. İkinci eksik kalıcılık. Önceki dersteki yöntemde her üretimde master'ı ve sayfayı tekrar tekrar referans olarak yüklüyorsun. Bir kampanya için yeter; ama Defne altı ay boyunca her hafta postlarda görünecekse bu hem yorucu hem de hataya açık.\n\nBu dersteki çözüm iki parçalı. Önce Magnific'in iki aracıyla Defne'nin açı ve ifade arşivini çoğaltıyoruz: Variations (tek görselden ızgara halinde açı, ifade ya da storyboard kareleri çıkarır) ve Change Camera (sanal kamerayı karakterin etrafında döndürüp tek bir yeni açı üretir). Sonra bu arşivden en iyi 16-24 kareyi seçip Magnific'in Custom Characters özelliğiyle Defne'yi eğitiyoruz. Eğitilen karakter, Image Generator'daki Character menüsünde adıyla duran bir kayıt olur. Biz buna karakter kütüphanesi diyoruz: her seferinde referans yüklemek yerine listeden \"Defne\"yi seçip sadece sahneyi yazıyorsun.\n\nBenzetme: Önceki derste oyuncunun kostüm provasını yapıp önden, yandan, arkadan fotoğrafını çektik. Bu derste oyuncu ajansının dosyasını hazırlıyoruz. O dosyada sadece beş poz olmaz; güldüğü, ciddi baktığı, alttan ve üstten çekilmiş, farklı kıyafetli onlarca kare olur. Yönetmen dosyayı bir kere görür ve oyuncuyu artık tanır. Custom Character eğitimi de modelin bu dosyayı ezberlemesi demek.\n\nNeden eğitmek bu kadar fark yaratıyor? Referansla çalışırken model her seferinde fotoğrafa bakıp \"bu kişiye benzet\" der; yeni bir açıda tahmin yapar. Eğitimde ise karakteri gerçekten öğrenen küçük bir ek model (LoRA) çıkar. Yüzün farklı açılardan nasıl göründüğünü setten öğrendiği için alttan ya da tepeden bir sahnede daha az uydurur. Ama bir kural var: model sete ne koyarsan onu öğrenir. Sette Defne hep aynı petrol mavisi ceketle duruyorsa, ceketi de yüzün bir parçası sanar ve her sahneye taşır. Sette hep beyaz fon varsa, sahnelerde ışık yapay kalır. Bu yüzden iyi bir eğitim seti çeşitlidir: farklı açılar, farklı ifadeler, iki üç farklı kıyafet, beyaz fonun yanında birkaç gerçek sahne.\n\nMagnific'in kendi sayfasındaki bilgiler: eğitim için 5 ile 35 arası görsel yüklenebiliyor, en az 12, ideali 12-24 kare. Eğitim yaklaşık 15-30 dakika sürüyor. Kalite seviyesi seçiyorsun; High ve Ultra seviyelerinin ikisi de 5.500 kredi. Özellik sadece ücretli planlarda var, karakter sayısı sınırsız. Yüklediğin fotoğraflar Magnific'in kendi modellerini eğitmekte kullanılmıyor. 5.500 kredi az değil; bu yüzden eğitime basmadan önce seti titizlikle seçmek, bu dersin en önemli kısmı.\n\nNe zaman referans, ne zaman eğitim? Tek kampanyalık, 3-5 görsellik bir iş için önceki dersteki referans yöntemi yeter. Aylarca kullanılacak bir marka yüzü, maskot ya da her hafta görünen bir karakter için eğitim kendini öder.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Karakter kütüphanesi | Eğittiğin karakterlerin adıyla durduğu, tek tıkla seçtiğin liste | custom characters, character library |\n| Açı varyasyonu | Tek görselden aynı kişinin farklı açılarını ızgara halinde üretmek | angle variations |\n| Kamera değiştirme | Sanal kamerayı karakterin etrafında döndürüp, eğip, yaklaştırıp yeni bir açı üretmek | change camera, reframe |\n| Üç çeyrek açı | Yüzün tam önden değil, hafif yandan (yaklaşık 45 derece) göründüğü açı | three-quarter view |\n| Alttan / tepeden çekim | Kameranın karakterin altında ya da tam üstünde durduğu açı | low angle / overhead shot |\n| Eğitim seti | Modelin karakteri öğrendiği, seçilmiş 12-24 görsellik paket | training dataset |\n| Eğitim (LoRA) | Fotoğraflardan karakteri öğrenip her üretimde onu hatırlayan küçük ek model | fine-tuning, LoRA |\n| Ezberleme | Modelin setteki tekrar eden detayı (aynı kıyafet, aynı fon) karakterin parçası sanması | overfitting |\n\n### Uygulama\n\nSenaryo: Spor salonu markası Defne'yi beğendi ve \"markanın yüzü olsun, altı ay boyunca her hafta postlarda olacak\" dedi. İlk ay listesinde önceki dersteki sahnelerin dışında üç zor açı var: kayıt kampanyası posteri için alttan kahraman çekimi, esneme rehberi postu için tepeden mat çekimi ve Reels kapağı için omuz üstünden bakış. Bu derste Defne'nin açı arşivini çoğaltıp onu karakter kütüphanesine kaydedeceğiz. Hepsini tek bir Spaces tuvalinde yapıyoruz; eğitimi ise Image Generator'daki Character menüsünden.\n\n1. Malzemeyi tuvale al. Önceki dersteki defne_master görselini, karakter sayfasını ve kimlik kartını yeni bir Spaces tuvaline koy. Kimlik kartı bir Text kutusunda dursun: yüksek topuzlu sıkı kıvırcık koyu saç, çiller, kalın kaşlar, gümüş halka küpe, siyah spor saati, petrol mavisi antrenman ceketi, siyah tayt. Bütün kontrolleri bu karta bakarak yapacaksın.\n2. Açı ızgarası üret. Master'ı Variations aracına ver. Mod: Angles (açılar), ızgara 3x3, oran 3:4, çözünürlük 2K. Sonuç dokuz karelik bir ızgara: alttan, üstten, üç çeyrek, profil gibi açılar. Her kare ayrı bir görsel olarak kaydedilir, yani tek tek seçebilirsin. Dokuzunu kimlik kartıyla karşılaştır; çillerin kaybolduğu, küpenin değiştiği kareleri çıkar. Genelde 5-6 kare kullanılır kalır.\n3. İfade ızgarası üret. Bu sefer Variations'ı Expressions (ifadeler) modunda, 2x2 ızgarayla çalıştır. Gülen, ciddi, şaşkın, sakin dört Defne çıkar. Önceki dersteki master nötr ifadeliydi; eğitim setine ifade koymazsan eğitilen Defne de hep nötr bakar, güldürdüğünde yüzü değişir.\n4. Eksik açıları Change Camera ile tamamla. Izgarada istediğin açı yoksa Change Camera ile tek tek üret. Bu araçta üç ayar var: yatay dönüş (0-360 derece), dikey eğim (-30 ile 90 arası; eksi değer kamerayı alta indirir, 90 tam tepeden bakar) ve yakınlık (0-10). Alttan kahraman çekimi için dönüş 20, dikey -25, yakınlık 4 dene. Tepeden bakış için dönüş 0, dikey 60, yakınlık 5. Büyük sıçramalardan kaçın: 180 derece arkaya dönmek ya da dikeyi 90'a çekmek modelin en çok uydurduğu yerlerdir. Önizlemeye bakıp adım adım ilerle.\n5. Kıyafet çeşitliliği ekle ve seti seç. Nano Banana Pro ile master'ı referans verip sadece kıyafeti değiştiren iki görsel üret (aşağıdaki üçüncü prompt): biri gri kapüşonlu sweatshirt ve eşofman altı, biri kışlık mont. Sonra eğitim setini topla. Önerilen dağılım: master 1, karakter sayfasından kırpılmış paneller 4, açı ızgarasından 5, ifadelerden 3, Change Camera'dan 2, kıyafet değişikliğinden 2, önceki dersteki sahnelerden 3. Toplam 20 kare. Her kareyi büyütüp yüze bak; altı parmak, eriyen küpe, bulanık göz olan kareyi sete koyma. Bozuk kare, eğitime bozukluğu öğretir.\n6. Karakteri eğit. Magnific'te Image Generator'a gir, Character menüsünden New character'a bas. Adı net koy: \"Defne_Antrenor_SporSalonu\". 20 görseli yükle, kalite olarak High seç (5.500 kredi). Eğitim 15-30 dakika sürer; bu sürede sahne prompt'larını yaz.\n7. Zor açılarda test et. Eğitim bitince Character menüsünden Defne'yi seç ve sadece sahneyi yaz: aşağıdaki dördüncü ve beşinci prompt'larla tepeden esneme sahnesini ve alttan kampanya sahnesini üret, oran 4:5. Karşılaştırma için aynı sahneyi bir kere de önceki dersteki yöntemle, master ve sayfayı referans vererek üret. İki sonucu master'ın yanına koy ve yüz testini yap: gözünü kısınca üçü aynı kişi mi, çiller ve küpe her karede var mı?\n8. Kütüphaneyi düzenle. Defne için bir klasör aç ve içine dört şey koy: eğitim setinin kendisi (ileride yeniden eğitmek gerekirse), master, kimlik kartı ve bir açı haritası notu (hangi açı için hangi Change Camera ayarı iyi çalıştı). Dosya adlarını açıya göre ver: defne_alttan_d-25, defne_tepeden_d60 gibi. Gelecek hafta yeni bir post istendiğinde Character menüsünden Defne'yi seçip sahne şablonunu doldurman yetecek.\n\n### Örnek prompt'lar\n\n`Same woman from the reference images, low-angle shot from waist height looking up at her, she stands confidently with arms crossed, same face, hair bun, freckles, silver hoop earrings and teal training jacket, seamless white studio background, soft even light, no text.`\n\nKullanım yeri: Change Camera istediğin açıyı veremediğinde Nano Banana Pro ile aynı açıyı yazıyla istemek. Hangi detayların aynı kalacağını tek tek sayıyoruz, fonu beyaz tutuyoruz ki kare eğitim setine girebilsin.\n\n`Same woman from the reference images, head and shoulders, white background, four expressions in a 2x2 grid: warm open laugh, focused concentration, pleasant surprise, calm closed-mouth smile. Identical face, hair, freckles and earrings in every panel. No text, no labels.`\n\nKullanım yeri: Variations'ın ifade modu yerine kendi seçtiğin ifadeleri istemek. Spor salonu markasının enerjik ama samimi tonuna uyan ifadeleri seçiyoruz; abartılı, karikatür gibi ifadelerden kaçınıyoruz çünkü onları da öğrenir.\n\n`Same woman from the reference images, keep her face, hair bun, freckles, silver hoop earrings and black sports watch exactly the same. Change only the outfit: a heather grey hoodie and black jogger pants. Full body, three-quarter view, seamless white studio background, soft even light.`\n\nKullanım yeri: Eğitim setine kıyafet çeşitliliği eklemek. \"Change only the outfit\" komutu ve korunacak detayların listesi, modelin yüzü de değiştirmesini engeller. Böylece eğitilen Defne petrol mavisi ceketi ezberlemez.\n\n`Overhead shot from directly above a yoga mat on a wooden gym floor: the trainer lies on her back in a hamstring stretch with one leg raised and looks up at the camera with a warm smile, soft morning window light, teal and charcoal color palette, natural film grain.`\n\nKullanım yeri: Esneme rehberi postu (4:5), eğitilmiş Defne seçiliyken. Yüz hiç tarif edilmiyor, Defne'nin adı bile geçmiyor; kişiyi kütüphanedeki karakter taşıyor, yazı sadece açıyı ve sahneyi anlatıyor.\n\n`Low-angle hero shot from waist height: the trainer stands at the gym entrance on a winter evening with a red gym towel over her shoulder, raising a water bottle like a trophy, a glowing neon gym sign above the door, dramatic evening sky, empty space at the top for a headline.`\n\nKullanım yeri: Kayıt kampanyası posteri, eğitilmiş Defne ile. Alttan açı karakteri güçlü gösterir; üstte bırakılan boşluk Photoshop'ta kampanya tarihini ve başlığı koyacağın yer.\n\n### Sık yapılan hatalar\n\n- **Seti tek kıyafetle doldurmak.** 20 karenin hepsinde aynı ceket varsa model ceketi Defne'nin yüzü gibi ezberler; kışlık mont giydirmek istediğinde petrol mavisi ceket yine belirir. En az iki üç farklı kıyafet koy.\n- **Bozuk kareleri sete koymak.** \"Biri bozuk ama diğer 19'u iyi\" deme. Eriyen küpe ya da kaymış göz, eğitilen karakterde kalıcı bir kusura dönüşebilir. Şüpheli kareyi çıkar; 16 temiz kare, 24 karışık kareden iyidir.\n- **Change Camera'yı tek seferde zorlamak.** Önden bir görselden direkt arkaya ya da tam tepeye gitmek en çok uydurmanın olduğu yer. Küçük adımlarla ilerle; arka görünüm için zaten karakter sayfasındaki panel var.\n- **Eğitilmiş karakteri uzun prompt'la boğmak.** Kütüphaneden karakteri seçip bir de yüzünü uzun uzun anlatırsan ikisi çatışır ve yüz bozulur. Magnific de bunu söylüyor: karakter bozulursa prompt'taki detayı azalt. Yazı sahneyi anlatır, kişiyi karakter taşır.\n\n### Profesyonel yöntem\n\nProfesyonel ekipler yeni açı üretmeyi \"sıfırdan çizmek\" olarak değil, \"var olan kareyi döndürmek\" olarak görür. Yani bir açıyı prompt'la baştan tarif etmek yerine, elindeki temiz bir kareyi açı üreten araçlara verirler. Bunun nedeni basit: yazıyla tarif edilen her yeni açı yeni bir yorum demektir, ama var olan kareden türetilen açı o karedeki yüzü ve kıyafeti yanında taşır. Magnific'teki Variations ve Change Camera bu mantığın araçları; benzer işi yapan \"story panels\" (tek kareden storyboard kareleri çıkaran) araçlar da aynı fikre dayanır.\n\nBu yöntemi kurarken uyulan kurallar:\n\n1. **Her açı master'dan doğar.** Alttan açıyı üç çeyrek açıdan, tepeden açıyı alttan açıdan üretmek zincir oluşturur; her halkada kalite biraz düşer ve yüz biraz kayar. Bütün açılar tek bir temiz kaynaktan, master'dan çıkar.\n2. **Hazır akışlarla zaman kazan.** Magnific'te tek görselden karakter sayfası çıkaran (\"one click character sheet\" türü) ve tek görselden farklı kamera açıları çıkaran (\"camera angle\" türü) hazır Spaces şablonları paylaşılıyor. Bunlar önceki dersteki yöntemi ve bu dersteki açı işini otomatik yapar; çalıştırmak kredi harcadığı için önce düşük çözünürlükte dene.\n3. **Detay kareleri ekle.** Gelişmiş karakter sayfası akışları tek fotoğraftan 3 boy görünüm, 6 kafa açısı ve 6 detay yakın çekimi (ayakkabı, saat, küpe, kemer gibi) çıkarır. Deneyimli üreticilerin gözlemi şu: böyle bir sayfa referans verildiğinde küçük detaylar sahnelerde kaybolmuyor. Eğitim setine 1-2 detay karesi koymak da aynı işi görür; örneğin Defne'nin spor saatinin yakın çekimi.\n4. **Çekim tiplerini listeyle düşün.** Tek bir görselden 9 farklı çekim tipi (geniş plan, Dutch açı yani yatık kadraj, arkadan, kuş bakışı, alttan ve benzerleri) çıkaran akışlar da var. Bu liste, setin hangi açıları kapsadığını kontrol etmek için de iyi bir kontrol listesi.\n5. **Eğitim seti için cömert ve temiz ol.** Karakter eğitimi yapan farklı platformlarda da öneri benzer: iyi ışıklı, farklı açı ve kıyafetli 20-30 ya da daha fazla fotoğraf. Magnific'in kendi sınırı 35 görsel olduğu için 20-24 temiz kare iyi bir hedef.\n\nSon olarak zor açılarda mekanı net anlatmayı unutma. Tepeden çekimde matın ve zeminin ne olduğunu, alttan çekimde kapının ve ışığın nerede durduğunu yazmak, karakterin sahneye doğru oturmasını sağlar. Kişiyi karakter taşır, mekanı ise senin cümlelerin.\n\n### Ödev\n\nBu dersin ödevi önceki derste çıkardığın karakter sayfasını tekrar kullanılabilir bir oyuncuya dönüştürmek: önceki derste sayfayı çıkarmıştık, bu derste oyuncuyu kütüphaneye koyuyoruz. Süre 25-30 dakika (eğitim süresi hariç).\n\n1. Önceki derste kurduğun karakterin master'ını Variations'a ver: Angles, 3x3, 2K. Kimlik kartına göre bozuk kareleri ele.\n2. Change Camera ile iki zor açı üret: alttan (dikey -25 civarı) ve tepeden (dikey 60 civarı). Hangi ayarın işe yaradığını not et.\n3. Üçüncü prompt'un yapısıyla bir kıyafet değişikliği üret.\n4. 16-20 karelik eğitim setini seç ve bir klasöre koy. Kredin ve planın uygunsa karakteri eğit; değilse seti hazır tut, eğitimi gerçek bir iş geldiğinde yaparsın.\n5. Ek ödev: karakteri iki farklı sahnede dene, biri iç mekanda (örneğin salonda) biri sokakta. Eğittiysen kütüphaneden seçerek, eğitmediysen referansla.\n\nBitince eğitim setinin küçük bir kolajını ve iki sahneyi Claude'a gösterip \"bu set eğitim için yeterince çeşitli mi, hangi kareyi çıkarmalıyım, iki sahnede aynı kişi mi?\" diye yorum isteyebilirsin. 5.500 kredi harcamadan önce bu kontrol iyi bir sigorta.\n\n### Tekrar sorularının cevapları\n\n1. Birinci adım oyuncuydu: karakterin beyaz fonda, önden, boydan, 9:16 tek fotoğrafı, yani master. İkinci adım karakter sayfasıydı: master'ı referans verip aynı kişinin beş açılı kolajını (yakın yüz, sağ ve sol profil, boydan önden ve arkadan) ürettik. Üçüncü adım sahneydi: master ve sayfayı referans verip karakteri gerçek bir mekana koyduk; sadece aksiyon, mekan, ışık ve kadraj değişti.\n2. Çünkü yüzü referans görsel taşıyor. Prompt'ta farklı kelimelerle yüzü yeniden anlatırsan model referans ile yazı arasında kalır ve ikisinin ortasında başka birini çizer. Bu derste de aynı kural geçerli, hatta daha da önemli: eğitilmiş karakter seçiliyken yazı sadece sahneyi anlatır.\n\nSıradaki ders: Nano Banana 2.1 ile banner ve uç formatlar\n\n### Kaynaklar\n\n- [Magnific – Custom Characters](https://www.magnific.com/ai/custom-characters)\n- [Magnific – Change Camera](https://magnific.com/ai/change-camera)", "module": 3, "moduleName": "Tutarlılık", "n": 21, "summary": ["Karakter sayfasındaki beş açı yetmez; Variations ve Change Camera ile master'dan yeni açılar ve ifadeler çoğaltılır.", "Change Camera'da küçük adımlarla ilerle; tam arkaya ya da tam tepeye tek seferde gitmek yüzün kaymasına yol açar.", "Custom Characters ile 12-24 temiz kareden karakter eğitilir, sonra listeden seçilip sadece sahne yazılır.", "Eğitim seti çeşitli olmalı: farklı açı, ifade, iki üç kıyafet ve birkaç gerçek sahne; yoksa model kıyafeti ezberler.", "Bozuk kareyi sete koyma ve eğitilmiş karakteri seçince yüzü yeniden tarif etme; 16 temiz kare 24 karışık kareden iyidir."], "title": "Karakter kütüphanesi ve farklı açılar"}, {"checked": "Ekim 2026", "date": "9 Ekim 2026", "flow": {"edges": [{"a": "brief", "b": "zones", "k": "f"}, {"a": "safe", "b": "zones", "k": "f", "l": "kural"}, {"a": "prod", "b": "g8", "k": "ref", "l": "Image 1"}, {"a": "prod", "b": "g4", "k": "ref"}, {"a": "prod", "b": "g1", "k": "ref"}, {"a": "style", "b": "g8", "k": "ref", "l": "Image 2"}, {"a": "style", "b": "g4", "k" ve başlık ortaya yakın; uçlar sadece atmosfer.", "title": "Güvenli alan"}, {"c": 3, "chips": ["8:1", "1K", "Nano Banana 2.1", "2 deneme"], "id": "g8", "pv": {"ar": "16:9", "k": "img", "m": "🥣", "tag": "solda mikser, ortada boş, sağda hediye kutuları", "tone": "pastel"}, "r": 0, "s": 4, "t": "gen", "title": "Ana sayfa şeridi", "tool": "Image Generator"}, {"c": 3, "chips": ["4:1", "1K", "Nano Banana 2.1", "2 deneme"], "id": "g4", "pv": {"ar": "16:9", "k": "img", "m": "🥣", "tag": "solda mikser, sağ yarı başlık alanı", "tone": "warm"}, "r": 1, "s": 4, "t": "gen", "title": "Kategori üst bandı", "tool": "Image Generator"}, {"c": 3, "chips": ["1:4", "1K", "Nano Banana 2.1", "2 deneme"], "id": "g1", "pv": {"ar": "9:16", "k": "img", "m": "🥣", "tag": "üst boş, ortada mikser, alt indirim rozeti alanı", "tone": "pastel"}, "r": 2, "s": 4, "t": "gen", "text": "Görünmüyorsa Nano Banana 2 aynı oranları destekler.", "title": "Yan banner", "tool": "Image Generator"}, {"c": 4, "id": "chk", "pv": {"items": ["Aynı nesne tekrar etmiş mi?", "Mikser referansla aynı mı?", "Başlık alanı boş mu?", "Sağ ve sol doğru yerde mi?"], "k": "list"}, "r": 0, "s": 5, "t": "compare", "text": "Hatalıyı at, iyi olanın seed'ini not et.", "title": "4 soruyla kontrol"}, {"c": 5, "chips": ["8:1 → 4K", "4:1 → 2K", "1:4 → 2K"], "id": "big", "pv": {"a": "1K", "b": "4K", "k": "up"}, "r": 0, "s": 6, "t": "seed", "text": "4K'da 8:1 yaklaşık 11.000 piksel geniş çıkar.", "title": "Kilitle ve büyüt", "tool": "Aynı prompt + aynı seed"}, {"c": 6, "id": "ps", "pv": {"items": ["Logo", "Başlık: KASIM İNDİRİMİ", "İndirim rozeti: %40", "AI görsel"], "k": "layers"}, "r": 0, "s": 7, "t": "ps", "text": "Kısa başlık modelle de olur; küçük yazılar katmanda.", "title": "Başlık, indirim rozeti, logo", "tool": "Photoshop"}, {"c": 7, "end": true, "id": "exp", "pv": {"items": ["mikser_kasim_anasayfa_5760x720", "mikser_kasim_kategori_1920x480", "mikser_kasim_yan_300x1200", "Tuvali şablon olarak kaydet"], "k": "list"}, "r": 0, "s": 8, "t": "export", "title": "Tam piksele kırp ve teslim", "tool": "Photoshop + Spaces şablonu"}], "title": "Uzun ya da ince formatta ürünü değil, bütün masayı tarif et: önce 1K'da yerleşimi bul, sonra büyüt"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Karakteri eğitmek için kaç karelik bir set öneriyorduk ve set neden çeşitli olmalıydı?\n2. Change Camera'nın üç ayarı neydi ve alttan \"kahraman\" çekimi için hangi değerleri denedik?\n\n### Konu\n\nAjansta en sevilmeyen işlerden biri şudur: güzel bir 4:5 post hazırlarsın, müşteri onaylar, sonra arkasından bir liste gelir. \"Bunu sitenin ana sayfa şeridine de koyalım, kategori sayfasının üst bandına da, bir de pazaryerindeki ince yan bannera.\" Bu ölçülerin ortak özelliği aşırı uzun ya da aşırı ince olmaları. E-ticaret sitelerinin tam genişlik kampanya şeritleri ve AVM'lerdeki uzun LED ekranlar boyunun 8-10 katı genişliktedir. Web'deki klasik üst banner 728x90 piksel, yani yaklaşık 8'e 1. LinkedIn kapak görseli 1584x396, tam 4'e 1. Sitelerin yanında duran dikey bannerlar ise 1'e 4 civarı. Şimdiye kadar bu işleri ya Photoshop'ta kırparak ya da Image Extender ile kenarları uzatarak çözdük. İkisi de çalışır ama kırpınca ürün sıkışır, uzatınca kenarlar boş ve tekrarlı görünür.\n\nGoogle 6 Ekim 2026'da Nano Banana 2.1'i yayınladı. Gemini 3.6 Flash üzerine kurulu, yani hızlı ve ucuz \"Flash\" ailesinden. Bizi ilgilendiren üç yenilik var. Birincisi uç oranlar: 1:1, 4:5, 16:9 gibi bildiğimiz oranların yanında 4:1, 1:4, 8:1 ve 1:8 seçenekleri doğrudan üretimde var; bunlar 1K, 2K ve 4K çözünürlükte çalışıyor. İkincisi, Google geniş ve panoramik oranlarda 2K ve 4K'da görülen \"döşeme\" hatasını düzelttiğini söylüyor. Bu hata, modelin çok uzun bir kareyi doldururken aynı parçayı yan yana tekrar etmesiydi: üç aynı mikser, iki kez çizilmiş aynı hediye kutusu gibi. Üçüncüsü yazı: görsel içindeki yazılar önceki sürüme göre daha düzgün. Ama model kartı açıkça uyarıyor: küçük yazı 1K'da bulanık çıkabiliyor, uzun paragraflarda hâlâ zorlanıyor.\n\nMagnific tarafında durum şöyle: Nano Banana 2.1 Magnific'in model listesine eklendi ama yeni olduğu için şu an herkesin hesabında görünmeyebilir. Görmüyorsan üzülme; Magnific'teki Nano Banana 2 de aynı uç oranları (8:1, 4:1, 1:4, 1:8) ve 1K/2K/4K çözünürlüğü destekliyor. Bu dersteki yöntem ikisinde de aynı; 2.1 sadece geniş karelerde daha temiz ve yazıda daha iyi.\n\nPeki bu neden \"Tutarlılık\" modülünde? Çünkü uç format işi aslında bir set işidir. Müşteri tek bir banner değil, aynı kampanyanın beş farklı ölçüsünü ister ve hepsinde aynı ürün, aynı renk, aynı ışık olmalı. Bu dersin asıl becerisi, aynı kampanyayı farklı ölçülerde birbirinin kardeşi gibi üretmek.\n\nBenzetme: Uzun bir masaya sofra kurduğunu düşün. Dört kişilik masada yemeği ortaya koyarsın, iş biter. Ama on iki kişilik upuzun bir masada \"ortaya koy\" dersen iki ucu bomboş kalır. Ya her yere aynı tabağı dizersin (bu, döşeme hatası) ya da baştan plan yaparsın: sol uçta salatalar, ortada ana yemek, sağ uçta tatlılar. Uç formatta prompt yazmak da bu plan yapmaktır. Modele sadece \"bir mikser\" demezsen, masanın her bölgesine ne konacağını sen söylersen sonuç dolu ve düzenli olur.\n\nBu yüzden bu dersin en önemli kuralı bölge haritası: geniş ya da ince bir görselde kompozisyonun tamamını tarif et. Sadece ana nesneyi yazarsan model boşlukları kendi kafasına göre doldurur. Bunu Google'ın kendi kullanım notları da öneriyor.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Uç format | Çok geniş ya da çok ince, alışılmışın dışındaki en-boy oranı (8:1, 1:8 gibi) | extreme aspect ratio |\n| Banner | Web sitesinde, sosyal medyada ya da sahada kullanılan uzun şerit reklam görseli | banner, leaderboard |\n| Panoramik | Gözün yatayda gezdiği, çok geniş görüş alanı veren kadraj | panoramic, ultra-wide |\n| Döşeme hatası | Modelin uzun kareyi doldurmak için aynı parçayı yan yana tekrar etmesi | tiling artifacts, repetition |\n| Bölge haritası | Görseli sol, orta, sağ (ya da üst, orta, alt) bölgelere ayırıp her bölgeye ne geleceğini yazmak | zone layout, left third / center / right third |\n| Boş alan | Yazının ve logonun sonradan konacağı, bilerek temiz bırakılan yer | negative space, copy space |\n| Güvenli alan | Kırpılsa ya da farklı ekranda gösterilse bile kaybolmaması gereken orta bölge | safe area |\n| Düşünme seviyesi | Modelin çizmeden önce ne kadar \"plan yaptığı\"; yüksek seviye karmaşık düzenlerde daha iyi ama yavaş | thinking level |\n\n### Uygulama\n\nSenaryo: Ev ve mutfak ürünleri satan bir e-ticaret sitesi, Kasım indirimi için bir kampanya istiyor. Kampanyanın yıldız ürünü pastel mint renkli bir stand mikser. 4:5 Instagram postu onaylandı. Şimdi aynı kampanyanın üç uç formatı lazım: sitenin ana sayfasındaki tam genişlik kampanya şeridi için 8:1 (ajansa gelen ölçü 5760x720 piksel), kategori sayfasının üst bandı için 4:1 (1920x480) ve bir pazaryerinin yan sütununda duracak 1:4 dikey banner (300x1200). Hepsini tek bir Spaces tuvalinde kuruyoruz.\n\n1. Ölçüleri orana çevir. Ajansa gelen her ölçüde genişliği yüksekliğe böl. 5760÷720 = 8, yani 8:1. 1920÷480 = 4, yani 4:1. 300÷1200 = 0,25, yani 1:4. Sonuç listede yoksa en yakın oranı seç; farkı sonda kırparak kapatırsın (örneğin 728x90 yaklaşık 8,1:1'dir, 8:1 üretip birkaç piksel kırparsın). Bu listeyi bir Text kutusuna yaz, tuvalin solunda dursun.\n2. Referansları hazırla. Tuvale iki görsel koy: dekupe edilmiş mikser fotoğrafı (ürün referansı) ve onaylanan 4:5 post (stil referansı: renk, ışık, atmosfer). Nano Banana tek seferde 14'e kadar referans alabiliyor ama burada iki tanesi yeter. Referansları prompt'ta numarayla an: \"Image 1 ürün, Image 2 stil\". Bir referansa tek görev ver; ürün referansından stil, stil referansından ürün almasın.\n3. Bölge haritasını yaz. Her oran için kompozisyonu bölgelere ayır. 8:1 ana sayfa şeridi için: sol üçte bir mikser ve yanında birkaç mutfak ürünü, orta üçte bir sade pastel boş alan (indirim başlığı gelecek), sağ üçte bir hediye kutuları ve uçuşan konfeti. 1:4 dikey için yukarıdan aşağıya düşün: üstte boş alan, ortada mikser, altta indirim rozeti için boş alan. Ayrıca bir güvenli alan notu yaz: önemli olan her şey ortadaki bölgede dursun, uçlar kırpılabilir.\n4. Üç ölçüyü 1K'da ucuza dene. Image Generator node'unu üç kez kopyala, hepsine aynı iki referansı bağla. Model: Nano Banana 2.1 (görünmüyorsa Nano Banana 2). Oranlar: 8:1, 4:1, 1:4. Çözünürlük: 1K. Her birinden 2 deneme al. Bu turun amacı kompozisyonu bulmak, kalite değil; bu yüzden en ucuz çözünürlükte çalışıyoruz.\n5. Kontrol et. Altı denemeyi yan yana koy ve dört soruya bak: Aynı nesne yan yana tekrar edilmiş mi (döşeme hatası)? Mikser referansla aynı mı (renk, kase, kol şekli)? Başlık alanı gerçekten boş mu? Sol ve sağ doğru yerde mi (model zaman zaman sağı solu karıştırabiliyor)? Hatalı olanı at, iyi olanın seed numarasını not et.\n6. Kilitle ve yüksek çözünürlükte üret. Beğendiğin her oranı aynı prompt ve aynı seed ile 2K ya da 4K'da yeniden üret. Ana sayfa şeridi 5760 piksel genişlik istediği için 8:1'i 4K'da üret; 4K'da 8:1 kare yaklaşık 11.000 piksel geniş çıkar, rahatça küçültürsün. Kategori bandı için 2K yeter. 2K'da yetmeyen yer olursa Upscale'e ver.\n7. Yazıyı ekle. İki yol var. Kısa bir başlıksa (\"KASIM İNDİRİMİ\") Nano Banana 2.1'e tırnak içinde, 2K ya da 4K'da yazdırabilirsin. Ama indirim oranı, fiyat, logo ve küçük yazılar için en güvenli yol Photoshop: görseli al, başlığı, indirim rozetini ve logoyu kendi katmanlarında ekle. Böylece müşteri indirim oranını değiştirse bile görseli yeniden üretmezsin.\n8. Tam piksele kırp ve teslim et. Photoshop'ta her dosyayı ajansa verilen tam ölçüye getir: 5760x720, 1920x480, 300x1200. Kırparken güvenli alanı koru. Dosya adlarını ölçüyle ver: mikser_kasim_anasayfa_5760x720, mikser_kasim_kategori_1920x480, mikser_kasim_yan_300x1200. Spaces tuvalini de şablon olarak kaydet; gelecek kampanyada sadece referansları değiştirirsin.\n\n### Örnek prompt'lar\n\n`Ultra-wide 8:1 e-commerce homepage sale banner. Image 1 is the product, Image 2 is the style reference. Left third: the stand mixer from Image 1 with a few pastel kitchen bowls, three-quarter view, soft studio light with a gentle shadow. Center third: clean pastel mint background with no objects, empty space for a headline. Right third: wrapped gift boxes and floating confetti, slightly blurred. Colors and mood from Image 2. Each element appears only once, no repetition, no text.`\n\nKullanım yeri: Kasım indirimi kampanyasının ana sayfa şeridi. Masayı üçe bölüp her bölgeye ne geleceğini yazıyoruz; \"each element appears only once\" cümlesi döşeme hatasına karşı ek sigorta.\n\n`Wide 4:1 website header for an online bookstore's autumn sale. Left: a neat stack of hardcover books with a steaming mug and a knitted blanket on a wooden table, soft afternoon window light. Center and right: warm blurred cozy reading corner with plants and a bookshelf, calm and uncluttered, generous empty space on the right half for text. Shot on 35mm, shallow depth of field, natural colors, no text, no logos.`\n\nKullanım yeri: Bir online kitapçının web sitesi üst bandı ya da LinkedIn kapağı. Yazı sağa geleceği için sağ yarıyı bilerek sade tutuyoruz.\n\n`Tall 1:4 vertical display banner for a jewelry brand. Top quarter: plain soft beige background, empty for a headline. Middle: a thin gold necklace with a small pearl pendant hanging in the air, macro detail, soft studio light, subtle shadow. Bottom quarter: plain beige background, empty for a price tag. Minimal luxury style, no text.`\n\nKullanım yeri: Bir pazaryerinin yan sütunundaki takı reklamı. Dikey formatta bölgeleri yukarıdan aşağıya tarif ediyoruz; üst ve alt bilerek boş.\n\n`Wide 4:1 banner. Use the stand mixer from Image 1 exactly as it is. Left half: the mixer on a light marble kitchen counter with a bowl of whipped cream. Right half: the headline \"KASIM İNDİRİMİ\" in bold condensed white letters, and below it in smaller letters \"Tüm mutfak ürünlerinde %40'a varan\". Pastel mint background, soft daylight. Render the text exactly as written.`\n\nKullanım yeri: Yazıyı modele yaptırmak istediğinde. Yazıyı tırnak içine alıyoruz, kısa tutuyoruz ve 2K ya da 4K'da üretiyoruz. Türkçe karakterleri (İ, Ü, Ş) ve yüzde işaretini mutlaka büyütüp kontrol et.\n\n`Same campaign as Image 2, new format: 1:8 tall vertical banner. Keep the exact stand mixer from Image 1 and the exact colors and lighting from Image 2. Top: empty pastel space. Middle: the mixer, centered. Bottom: a small stack of wrapped gift boxes. Only one mixer in the whole image.`\n\nKullanım yeri: Onaylı bir görseli çok ince bir dikey formata taşırken. Görseli kırpmak yerine aynı kampanyayı yeni oranda yeniden kuruyoruz; böylece ürün sıkışmıyor.\n\n### Sık yapılan hatalar\n\n- **Sadece ürünü yazmak.** \"A stand mixer, 8:1\" dersen model kalan alanı ya boş ve sıkıcı bırakır ya da aynı mikseri yan yana dizer. Her bölgeye ne geleceğini sen yaz.\n- **Küçük yazıyı 1K'da istemek.** 1K'da küçük yazılar bulanık çıkabiliyor. Yazı modelden geliyorsa 2K ya da 4K kullan; indirim oranı, fiyat ve logo gibi küçük şeyleri Photoshop'a bırak.\n- **Doğrudan 4K'da denemeye başlamak.** Kompozisyon belli olmadan her deneme pahalıya gelir. Önce 1K'da yerleşimi bul, seed'i not et, sonra yüksek çözünürlükte bir kez üret.\n- **Uçlara önemli şey koymak.** Kampanya şeritleri ve banner alanları farklı ekranlarda biraz kırpılabilir. Ürün ve başlık güvenli alanda, yani ortaya yakın dursun; uçlar sadece atmosfer taşısın.\n\n### Ödev\n\n1. Üzerinde çalıştığın ya da hayali bir müşteriden bir indirim kampanyası seç (bir e-ticaret sitesi, butik, elektronik mağazası). Elinde onaylı ya da beğendiğin bir 4:5 görsel olsun; yoksa önce onu üret.\n2. Üç uç format belirle: bir 8:1, bir 4:1, bir 1:4. Her biri için 3 satırlık bir bölge haritası yaz (sol/orta/sağ ya da üst/orta/alt).\n3. Spaces'te üç Image Generator node'u kur, 4:5 görseli stil referansı olarak bağla, Nano Banana 2.1 (yoksa Nano Banana 2) ile 1K'da her orandan 2 deneme al.\n4. Altı denemeyi dört kontrol sorusuyla ele: tekrar, ürün doğruluğu, boş alan, sağ-sol. En iyi üçünü 2K'da yeniden üret.\n5. Birine Photoshop'ta indirim başlığı ekle, diğerine aynı başlığı modelle tırnak içinde yazdır. Hangisi daha temiz, not et.\n\nBitince üç banneri ve 4:5 orijinali yan yana bir kolaj yapıp Claude'a gösterebilirsin: \"Bu dört görsel aynı kampanyanın kardeşi gibi duruyor mu, hangisinde döşeme hatası ya da sıkışma var, yazı alanı yeterli mi?\" diye yorum iste.\n\n### Tekrar sorularının cevapları\n\n1. 16-24 kare civarı (Magnific en az 12, ideali 12-24 diyor; biz 20 karelik bir dağılım yaptık). Set çeşitli olmalıydı çünkü model sete ne koyarsan onu öğrenir: hep aynı kıyafet ya da hep beyaz fon olursa onları da karakterin parçası sanır ve her sahneye taşır. Bu yüzden farklı açı, ifade, kıyafet ve birkaç gerçek sahne koyduk.\n2. Yatay dönüş (0-360 derece), dikey eğim (-30 ile 90 arası; eksi değer kamerayı alta indirir) ve yakınlık (0-10). Alttan kahraman çekimi için dönüş 20, dikey -25, yakınlık 4 denedik.\n\nSıradaki ders: Nano Banana ile çoklu referans düzenleme: referansları numarayla anmak, \"sadece X'i değiştir\" komutu ve oranı boş tuvalle kilitlemek\n\n### Kaynaklar\n\n- [each::labs – Nano Banana 2.1: Wider Frames, Sharper Text, Same Speed](https://www.eachlabs.ai/blog/nano-banana-2-1-wider-frames-sharper-text)\n- [fal – Nano Banana 2.1 (Text to Image) API](https://fal.ai/models/google/nano-banana-2.1)\n- [Let's Data Science – Google Releases Nano Banana 2.1 Image Model](https://letsdatascience.com/news/google-rolls-out-nano-banana-21-image-model-c6ac3b89)", "module": 3, "moduleName": "Tutarlılık", "n": 22, "summary": ["Nano Banana 2.1 ve 2, 8:1, 4:1, 1:4 ve 1:8 gibi uç oranları doğrudan 1K, 2K ve 4K'da üretebiliyor.", "Uzun ya da ince formatta sadece ürünü yazma; bölge haritasıyla sol, orta ve sağa ne geleceğini tek tek tarif et.", "Önce 1K'da ucuza yerleşimi bul, seed'i not et, sonra aynı prompt ve seed ile 2K ya da 4K'da üret.", "Ürün ve başlık güvenli alanda, ortaya yakın dursun; fiyat, indirim oranı ve logo gibi küçük yazıları Photoshop'ta ekle.", "Aynı kampanyanın bütün ölçüleri aynı ürün ve stil referanslarıyla üretilir, böylece set birbirinin kardeşi gibi görünür."], "title": "Nano Banana 2.1 ile banner ve uç formatlar"}, {"checked": "Ekim 2026", "date": "10 Ekim 2026", "flow": {"edges": [{"a": "brief", "b": "m", "k": "f"}, {"a": "brief", "b": "cup", "k": "f"}, {"a": "brief", "b": "cafe", "k": "f"}, {"a": "m", "b": "gen", "k": "ref", "l": "Image 1"}, {"a": "cup", "b": "gen", "k": "ref", "l": "Image 2"}, {"a": "cafe", "b": "gen", "k": "ref", "l": "Image 3"}, {"a": "prompt", "b": "gen", "k": "txt", "l": "prompt"}, {"a": "gen", "b": "chk", "k": "img"}, {"a": "chk", "b": "e1", "k": "img", "l": "onaylı kare"}, {"a": "chk", "b": "e2", "k": "img", "l": "onaylı kare"}, {"a": "e1", "b": "story", "k": "img", "l": "Image 2"}, {"a": "canvas", "b": "story", "k": "ref", "l": "Image 1"}, {"a": "story", "b": "exp", "k": "img"}, {"a": "e1", "b": "exp", "k": "img", "l": "4:5"}], "groups": [{"c1": 0, "c2": 2, "label": "Hazırlık", "r1": 0, "r2": 2}, {"c1": 3, "c2": 4, "label": "Üretim", "r1": 0, "r2": 0}, {"c1": 5, "c2": 5, "label": "Sadece X'i değiştir", "r1": 0, "r2": 1}, {"c1": 5, "c2": 6, "label": "Oran kilidi", "r1": 2, "r2": 2}, {"c1": 7, "c2": 7, "label": "Teslim", "r1": 0, "r2": 0}], "nodes": [{"c": 0, "id": "brief", "pv": {"items": ["1 → manken (sadece yüz, saç, beden)", "2 → deri çanta (şekil, renk, toka)", "3 → butik iç mekanı (arka plan)", "En fazla 3 referans"], "k": "list"}, "r": 0, "s": 1, "t": "brief", "text": "Her görsele tek bir görev ver; fazladan ne varsa model onu da taşır.", "title": "Referansları seç ve numarala"}, {"c": 1, "chips": ["yüz", "saç", "1. sıra"], "id": "m", "pv": {"ar": "4:5", "k": "img", "m": "👩", "tag": "markanın mankeninin master portresi", "tone": "day"}, "r": 0, "s": 2, "t": "ref", "text": "Kişi buradan gelir; fotoğrafta başka çanta ya da aksesuar olmasın.", "title": "Image 1: manken", "tool": "Karakter kütüphanesindeki master"}, {"c": 1, "chips": ["şekil", "renk", "toka", "2. sıra"], "id": "cup", "pv": {"k": "cutout", "m": "👜"}, "r": 1, "s": 2, "t": "ref", "text": "Çantanın şekli, dikişi ve tokası buradan gelir.", "title": "Image 2: ürün", "tool": "Beyaz fonlu ürün fotoğrafı"}, {"c": 1, "chips": ["arka plan", "ışık", "3. sıra"], "id": "cafe", "pv": {"ar": "4:5", "k": "img", "m": "🪟", "tag": "vitrin camı, boş butik, gün ışığı", "tone": "day"}, "r": 2, "s": 2, "t": "ref", "text": "İnsansız mekan fotoğrafı; ışığın yönünü de taşır.", "title": "Image 3: mekan", "tool": "Butiğin iç mekan fotoğrafı"}, {"c": 2, "chips": ["Image 1/2/3", "ya da @img1 @img2 @img3"], "id": "prompt", "pv": {"k": "txt", "v": "Image 1 is the woman, use only her face, hair and body. Image 2 is the leather shoulder bag, keep its shape, color, stitching and buckle exactly. Image 3 is the boutique interior, use it as the background. The woman from Image 1 stands by the shop window carrying the bag from Image 2, front of the bag facing the camera."}, "r": 0, "s": 3, "t": "prompt", "text": "Önce her referansın görevi, sonra sahne.", "title": "Numaralı prompt"}, {"c": 3, "chips": ["4:5", "2K", "Nano Banana Pro", "2 deneme"], "id": "gen", "pv": {"ar": "4:5", "k": "img", "m": "👜", "tag": "manken vitrin camının yanında çantayı omzunda taşıyor", "tone": "day"}, "r": 0, "s": 4, "t": "gen", "text": "Kredi için ilk denemeyi 1K'da yapıp beğenince 2K'ya geçebilirsin.", "title": "Post üret", "tool": "Image Generator"}, {"c": 4, "id": "chk", "pv": {"items": ["Yüz Image 1'deki kişi mi?", "Çanta ve toka Image 2 ile aynı mı?", "Mekan Image 3'ü andırıyor mu?", "Işık tek yönden mi geliyor?"], "k": "list"}, "r": 0, "s": 5, "t": "compare", "text": "En iyi kareyi seç; küçük logo bozuksa Photoshop'ta düzeltilir.", "title": "4 soruyla kontrol"}, {"c": 5, "chips": ["tek değişiklik", "kilitleme cümlesi"], "id": "e1", "pv": {"a": {"m": "🧥", "tag": "gri ceket", "tone": "grey"}, "b": {"m": "🧥", "tag": "bordo ceket, gerisi aynı", "tone": "rose"}, "k": "ba"}, "r": 0, "s": 6, "t": "retouch", "text": "Change only the jacket color to deep burgundy. Keep everything else exactly the same.", "title": "Sadece ceket rengi", "tool": "Onaylı kare tek referans"}, {"c": 5, "chips": ["ikinci tur", "üst üste düzenleme yok"], "id": "e2", "pv": {"k": "txt", "v": "Add only a soft beam of daylight from the shop window. Keep her face, jacket, pose, the bag and the background exactly the same."}, "r": 1, "s": 6, "t": "adjust", "text": "İkinci düzeltmeyi aynı prompt'a sıkıştırma; temiz kareden ayrı yap.", "title": "Ayrı turda: ışık huzmesi", "tool": "Yine onaylı temiz kare"}, {"c": 5, "chips": ["9:16", "1. sıraya koy"], "id": "canvas", "pv": {"ar": "9:16", "k": "img", "m": "⬜", "tag": "bomboş dikey tuval", "tone": "grey"}, "r": 2, "s": 7, "t": "ref", "text": "Çerçeveyi ilk görsel belirler; oran kaymasın diye boş tuval en başa.", "title": "Boş tuval = Image 1", "tool": "Photoshop'ta 1080x1920 düz gri"}, {"c": 6, "chips": ["9:16", "2K", "Image 1 tuval", "Image 2 onaylı kare"], "id": "story", "pv": {"items": ["4:5", "9:16"], "k": "ratios", "m": "👜", "tone": "day"}, "r": 2, "s": 7, "t": "gen", "text": "Use Image 1 only for the frame. Rebuild the scene from Image 2 inside it; empty top third for a headline.", "title": "Story versiyonu", "tool": "Image Generator"}, {"c": 7, "end": true, "id": "exp", "pv": {"items": ["Logo", "Başlık: YENİ SEZON", "AI görsel (4:5 / 9:16)"], "k": "layers"}, "r": 0, "s": 8, "t": "ps", "text": "Logo ve yazı katmanda; bir sonraki üründe sadece Image 2'yi değiştir.", "title": "Logo, başlık, teslim", "tool": "Photoshop + prompt kütüphanesi"}], "title": "Her referansa numara ve tek görev ver, düzeltmede sadece bir şeyi değiştir, oranı boş tuvalle sabitle"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Uzun ya da ince formatlarda görülen \"döşeme hatası\" nedir ve bölge haritası bu hatayı nasıl önler?\n2. 728x90'lık klasik web bannerını hangi oranda üretip nasıl teslim ediyorduk?\n\n### Konu\n\nBugüne kadar referans görseli hep tek tek kullandık: bir stil referansı, bir karakter, bir ürün. Ama ajansta gelen işler çoğu zaman bir karışım. Müşteri diyor ki: \"Geçen ay çektirdiğimiz mankeni al, yeni sezon deri çantamızı omzuna ver, bizim butiğin içinde dursun.\" Bu cümlede üç ayrı görsel var: manken, ürün ve mekan. Bu dersin konusu, birden fazla referansı aynı anda modele verip hepsini tek bir kareye doğru biçimde yerleştirmek ve sonra o kareyi bozmadan küçük değişiklikler yapmak.\n\nBu işte en iyi çalışan model ailesi şu an Nano Banana. Magnific'te üç sürümünü görebilirsin. Nano Banana Pro en titiz olanı, karakterleri en iyi koruyan. Nano Banana 2 ve 6 Ekim'de çıkan 2.1 daha hızlı ve ucuz; 2.1 şimdilik herkesin hesabında görünmeyebilir. Teknik olarak üçü de tek seferde 14'e kadar referans görsel kabul ediyor. Ama Google'ın verdiği sınırlar başka bir şey söylüyor: Nano Banana 2 ve 2.1 aynı anda en fazla 4 kişinin yüzünü, Pro ise 5 kişinin yüzünü tutarlı tutabiliyor. Yani \"14 görsel yükleyebilirsin\" demek, \"14 görseli de mükemmel korur\" demek değil. Magnific'in kendi önerisi en iyi sonuç için 3 referansı geçmemek. Deneyimli prompt yazarları da Nano Banana için 2-3 referans öneriyor. Bizim kuralımız da bu olacak: işe yarayan en az referansla çalış.\n\nÇoklu referansın üç püf noktası var ve bu dersin başlığı tam olarak bunlar.\n\nBirincisi, referansları numarayla anmak. Modele üç görsel verip \"kadın butikte çantayı taşısın\" dersen model hangi kadının, hangi çantanın, hangi butiğin kastedildiğini tahmin etmek zorunda kalır. Tahmin ettiği her yerde hata çıkar: çantanın rengini mekandan alır, kadının saçını başka bir görselden karıştırır. Bunun yerine her görseli yükleme sırasıyla anarsın: \"Image 1'deki kadın, Image 2'deki çantayı omzunda taşıyor, Image 3'teki butikte duruyor.\" Magnific'in Image Generator'ında bunun kısa yolu da var: prompt'a @img1, @img2 yazarak yüklediğin görselleri çağırabiliyorsun. Hangisini kullanırsan kullan, mantık aynı: her görsele tek bir görev ver ve o görevi adıyla yaz.\n\nİkincisi, \"sadece X'i değiştir\" komutu. İlk kare güzel çıktı ama müşteri \"ceketi bordo olsun\" dedi. Burada en büyük hata prompt'u baştan yazıp yeniden üretmek; o zaman yüz, ışık, çanta, her şey değişir. Bunun yerine çıkan görseli tekrar referans verip tek bir şeyi değiştirirsin ve geri kalanı kilitlediğini açıkça söylersin: \"Sadece ceketin rengini bordo yap. Yüz, saç, poz, çanta, ışık ve arka plan aynı kalsın.\" Google'ın kendi kullanım notları da aynı şeyi öneriyor: neyin değişip neyin kalacağını net yaz, karmaşık düzeltmeyi tek seferde değil sırayla yap.\n\nÜçüncüsü, oranı boş tuvalle kilitlemek. Deneyimli üreticilerin sık verdiği bir uyarı şu: referanslı üretimde çıkan görselin oranı bazen senin seçtiğin orana değil, yüklediğin ilk görselin oranına kayar. Mesela ilk referans kare bir ürün fotoğrafıysa 9:16 story isterken kare görsel çıkabilir. Magnific'te oran seçicin varsa önce onu ayarla. Yine de kayıyorsa çözümü basit: istediğin oranda bomboş bir görsel hazırla (Photoshop'ta 1080x1920 beyaz ya da gri bir tuval) ve onu ilk referans olarak yükle. Model \"çerçevem bu\" diye anlar ve diğer referansları bu tuvalin içine yerleştirir.\n\nBenzetme: Bir ressama üç fotoğraf verip \"bunlardan bir tablo yap\" dediğini düşün. \"Şunu, şununla, şurada\" dersen ressam şaşırır. Ama fotoğrafların arkasına 1, 2, 3 yazıp \"1 numaradaki kadını, 2 numaradaki çantayla, 3 numaradaki butiğe koy\" dersen tam istediğini yapar. Tablo bitince \"sadece ceketi boya, başka hiçbir yere dokunma\" dersin. Boş tuval de ressamın şövalesine koyduğun bez gibi: bezin boyu ne ise tablonun boyu o olur.\n\nBu ders neden \"Tutarlılık\" modülünde? Çünkü çoklu referans, karakter tutarlılığının günlük kullanımı. Karakter kütüphanesi dersinde ürettiğimiz master görseli bundan sonra her işte \"Image 1\" olarak kullanacaksın. Ürün ve mekan değişecek, kişi hep aynı kalacak.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Çoklu referans | Tek bir üretimde birden fazla görseli modele kaynak olarak vermek | multi-image reference, multi-image input |\n| Referans sırası | Görselleri yüklediğin sıra; prompt'ta onları bu numaralarla anarsın | Image 1, Image 2 / @img1, @img2 |\n| Görev ataması | Her referansa tek bir iş vermek: yüz, ürün, mekan, poz ya da stil | use only for the face / product / background |\n| Kilitleme cümlesi | Değişmeyecek her şeyi tek tek sayan cümle | keep everything else exactly the same |\n| Hedefli düzenleme | Görselin sadece bir parçasını değiştirip gerisini korumak | targeted edit, change only |\n| Boş tuval | İstenen oranda hazırlanmış, içi boş görsel; çıktının çerçevesini belirler | blank canvas, empty frame |\n| Kaynaştırmak | Farklı yerden gelen parçaların ışığını, gölgesini ve rengini birbirine uydurmak | blend, match lighting, cohesive |\n\n### Uygulama\n\nSenaryo: Bir kadın giyim markası yeni sezon taba rengi deri omuz çantasını tanıtmak istiyor. Elinde üç şey var: karakter kütüphanesine koyduğun markanın mankeninin master görseli, çantanın beyaz fonlu ürün fotoğrafı ve markanın butiğinin iç mekan fotoğrafı. İstenen: önce 4:5 Instagram postu, müşteri onayından sonra ceket rengi düzeltmesi ve aynı karenin 9:16 story versiyonu.\n\n1. Referansları hazırla. Üç görseli bir klasöre koy ve sıra numarası ver: 1 manken, 2 çanta, 3 mekan. Her görseli tek bir iş için seç: mankenin fotoğrafında başka çanta ya da aksesuar olmasın, çanta fotoğrafı temiz beyaz fonda olsun, mekan fotoğrafında insan olmasın. Referansta fazladan ne varsa model onu da taşımaya çalışır.\n2. Magnific'te Image Generator'ı aç, modeli Nano Banana Pro seç (2.1 görünüyorsa onu da deneyebilirsin). Referans alanına görselleri sırayla yükle: önce manken, sonra çanta, sonra mekan. Sıra burada önemli, çünkü prompt'taki numaralar bu sıraya göre okunur.\n3. Prompt'u numaralarla yaz. Her referansa görevini ver, sonra sahneyi anlat: \"Image 1'deki kadın, Image 2'deki deri çantayı omzunda taşıyor, Image 3'teki butikte büyük vitrin camının yanında duruyor.\" Çantanın ön yüzünün ve metal tokasının kameraya dönük olmasını ve ışığın mekandan gelmesini ayrıca yaz. Üç referansı geçme; dördüncü bir şey lazımsa (mesela ayakkabı) bunu ikinci turda ekle.\n4. 4:5 oranında, 2K çözünürlükte 2 deneme üret. Düşük kredi istiyorsan ilk denemeyi 1K'da yapıp beğenince 2K'da tekrarlayabilirsin.\n5. Çıkan kareleri dört soruyla kontrol et: Yüz Image 1'deki kişi mi? Çantanın şekli, rengi, dikişleri ve tokası Image 2 ile aynı mı? Mekan Image 3'ü andırıyor mu? Işık ve gölge tek bir kaynaktan mı geliyor? En iyi kareyi seç. Çantadaki küçük marka yazısı ya da logo bozuksa üzülme; küçük logolar genelde bozulur, onu sonra Photoshop'ta ekleyeceğiz.\n6. Müşteri düzeltmesini \"sadece X'i değiştir\" ile yap. Seçtiğin kareyi tek referans olarak yükle ve tek değişikliği yaz: \"Sadece ceketin rengini bordo yap, geri kalan her şey aynı kalsın: yüz, saç, poz, çanta, ışık, arka plan.\" İkinci bir düzeltme varsa (mesela pencereden gelen ışık huzmesi) bunu aynı prompt'a ekleme, ayrı bir turda yap. Ama her turda bir önceki çıktıyı değil, onaylı temiz kareyi kullan; aynı görseli üst üste düzenledikçe kalite düşer.\n7. Story versiyonu için oranı boş tuvalle kilitle. Photoshop'ta 1080x1920 piksellik düz açık gri bir görsel kaydet. Image Generator'da referansları şu sırayla yükle: 1 boş tuval, 2 onaylı kare. Prompt: \"Image 1'in oranını ve çerçevesini kullan. Image 2'deki sahneyi bu dikey çerçeveye yeniden kur; üstte başlık için boş alan bırak.\" Oranı 9:16 seç. Çıkan görsel kare ya da 4:5'e kaydıysa tuvalin gerçekten ilk sırada olduğunu kontrol et.\n8. Teslim. Photoshop'ta logoyu ve başlığı katman olarak ekle, iki görseli müşterinin istediği ölçüde dışa aktar. Kullandığın üç referansı ve prompt'u prompt kütüphanene kaydet; bir sonraki ürün geldiğinde sadece Image 2'yi değiştireceksin.\n\n### Örnek prompt'lar\n\n`Image 1 is the woman, use only her face, hair and body. Image 2 is the leather shoulder bag, keep its shape, color, stitching and buckle exactly. Image 3 is the boutique interior, use it as the background. The woman from Image 1 stands by the large shop window in the boutique from Image 3, carrying the bag from Image 2 on her shoulder, front of the bag facing the camera, soft daylight from the window, 4:5`\n\nKullanım yeri: Moda ve aksesuar tanıtımında manken + ürün + mekan birleştirme. Her görselin görevi önce tek tek yazılıyor, sonra sahne anlatılıyor.\n\n`Change only the jacket color to deep burgundy. Keep everything else exactly the same: her face, hair, pose, the bag, the lighting and the background.`\n\nKullanım yeri: Müşterinin \"sadece şunu değiştirelim\" revizyonu. Onaylı kareyi tek referans olarak verip kullanılır; değişmeyecek her şey tek tek sayılıyor.\n\n`Use Image 1 only for the aspect ratio and frame. Rebuild the scene from Image 2 inside this vertical frame. Keep the woman, the bag and the boutique the same. Leave clean empty space in the top third for a headline.`\n\nKullanım yeri: Onaylanmış bir postun story versiyonu. Image 1 boş 9:16 tuval, Image 2 onaylı kare.\n\n`Image 1 is the model, use only her face and hair. Image 2 is the tortoiseshell sunglasses, keep the frame shape and color exactly as shown. She wears the sunglasses from Image 2, close-up portrait from shoulders up, warm beige background, single soft key light, premium eyewear advertising, 4:5`\n\nKullanım yeri: Gözlük gibi küçük moda aksesuarlarının reklamı. Küçük ürünlerde kadraj yakın tutuluyor, çünkü geniş kadrajda ürünün detayı bozuluyor.\n\n`Image 1 is the football player, keep his face and kit. Image 2 is the stadium at night. Image 3 is our burger box, keep the logo area. The player from Image 1 stands in the stadium from Image 2 holding the burger box from Image 3 toward the camera, dramatic floodlights, match day poster, 4:5`\n\nKullanım yeri: Farklı bir sektörden örnek: maç günü restoran posteri. Üç referans sınırında kalıyor; yazıları ve logoyu sonra Photoshop'ta ekle.\n\n### Sık yapılan hatalar\n\n- **Referansları isimsiz bırakmak.** \"Kadın çantayı taşısın\" deyince model hangi görselden ne alacağını tahmin eder; renkler ve detaylar karışır. Her referansı numarasıyla ve göreviyle yaz.\n- **Ne kadar çok referans o kadar iyi sanmak.** Model 14 görsel kabul etse de yüzleri ve ürünleri koruma gücü sınırlı. 2-3 referansla başla; fazlası gerekiyorsa işi turlara böl.\n- **Düzeltme için prompt'u baştan yazmak.** Yeniden üretince yüz, ışık ve ürün de değişir. Onaylı kareyi referans verip \"sadece X\" komutunu kullan ve kalanları tek tek say.\n- **Üst üste düzenleme yapmak.** Her düzenlemeyi bir önceki çıktının üstüne yaparsan görüntü yavaş yavaş yumuşar ve bozulur. Hep onaylı temiz kareye geri dön, değişiklikleri mümkünse tek turda topla.\n- **Oran kayınca modeli suçlamak.** Çoğu zaman sebep ilk sıradaki referansın oranıdır. İstediğin oranda boş tuvali ilk sıraya koy.\n\n### Profesyonel yöntem\n\nÜrün ve manken işinde profesyonel ekipler aynı iki aşamalı akışı kullanır: önce bir ana görsel, sonra hassas düzenleme. Ana görsel (sahnenin genel havası, kompozisyonu, ışığı) çoğu zaman güçlü bir görsel modelde, örneğin Midjourney'de ya da Nano Banana'nın kendisinde üretilir. Sonra bu ana görsel, yüz, ürün, poz ya da kıyafet referanslarıyla birlikte Nano Banana'ya verilir ve tek bir net komut yazılır: \"X'i değiştir, geri kalan her şeyi aynı tut.\" Bu ayrım neden işe yarıyor? Çünkü her model en iyi yaptığı işi yapıyor: biri güzel ve atmosferik kareyi kuruyor, diğeri o kareye sadakatle dokunuyor. Tek bir prompt'la hem sahneyi kurup hem ürünü birebir korumaya çalışmak, ikisinden de taviz vermek demek.\n\nBu akışın içinde uyulan kurallar:\n\n1. **Referansları sırayla an.** \"Birinci görseldeki kadın\", \"ikinci görseldeki çanta\" gibi sıralı anmak modelin karıştırmasını önler. Kısa yol olarak @img1, @img2 da olur; önemli olan her numaranın tek bir görevi olması.\n2. **Az referansla başla.** Sektörde yaygın öneri Nano Banana'ya 2-3 referans vermek. Daha fazla öğe gerekiyorsa (ayakkabı, ikinci bir ürün, poz referansı) işi turlara böl: önce manken + ürün + mekan, onaylanınca ayrı turda ayakkabı.\n3. **Oranı ilk görsel belirler.** Çıktının oranı çoğu zaman ilk yüklenen görselden gelir. Oran kayıyorsa istediğin oranda boş bir tuvali ilk referans yap; bu küçük hile story, banner ve post setlerini aynı kareden çıkarmanın en güvenli yolu.\n4. **Yazı ve etiket için yakın çekim.** Çanta üzerindeki marka plakası, ambalaj ya da etiket yazısı geniş kadrajda bozulur. Ürünün yazısı önemliyse ayrıca yakın bir detay karesi üret ya da yazıyı Photoshop'ta katman olarak ekle.\n5. **Kilitleme cümlesini kalıp haline getir.** Her düzeltme prompt'u aynı yapıda olsun: önce tek değişiklik, sonra \"keep everything else exactly the same\" ve korunacakların listesi. Ekipte herkes aynı kalıbı kullanınca revizyonlar öngörülebilir olur.\n\nBu yöntem büyük ekiplerde bir \"üretim hattı\" gibi kurulur: karakter, ürün ve mekan ayrı ayrı üretilir ya da çekilir, sonra Nano Banana ile tek kareye kaynaştırılır, en son büyütülür ve gerekirse videoya çevrilir. Senin Spaces tuvalin de bu hattın küçük bir hali: bir sonraki üründe sadece Image 2'yi değiştirip aynı hattı tekrar çalıştırırsın.\n\n### Ödev\n\nSüre 25-30 dakika: üç referanslı bir kare, bir \"sadece X\" düzeltmesi ve bir oran kilidi.\n\n1. Üzerinde çalıştığın ya da yakında gelecek bir moda/aksesuar işinden bir ürün fotoğrafı seç (çanta, ayakkabı, ceket, gözlük). Manken olarak karakter kütüphanendeki master görseli, mekan olarak da bir iç mekan fotoğrafı kullan.\n2. Üç görseli sırayla yükle ve ilk örnek prompt'un yapısıyla 4:5 kare üret. Her referansın görevini yazmayı unutma.\n3. Beğendiğin kareye bir \"sadece X'i değiştir\" düzeltmesi yap: ceket rengi, saç ya da çantanın rengi. Önce ve sonrayı yan yana koy, değişmemesi gereken bir şey değişmiş mi bak.\n4. Boş 9:16 tuvali ilk sıraya koyup aynı karenin story versiyonunu üret.\n5. Bonus deney: aynı işi bir de numarasız prompt'la (\"kadın butikte çantayı taşıyor\") üret ve farkı gör.\n\nBitince dört görseli (4:5, düzeltilmiş, story ve numarasız deneme) Claude'a göster ve şunu sor: \"Referanslar doğru taşınmış mı, düzeltmede neler istemeden değişmiş, prompt'ta neyi daha net yazmalıyım?\"\n\n### Tekrar sorularının cevapları\n\n1. Döşeme hatası, modelin çok uzun ya da ince bir kareyi doldurmak için aynı parçayı yan yana tekrar etmesi: aynı ürünün üç kez yan yana çizilmesi gibi. Bölge haritasında görseli sol, orta ve sağ (ya da üst, orta, alt) bölgelere ayırıp her bölgeye ne geleceğini yazıyoruz. Böylece model boşluğu kendi kafasına göre aynı nesneyle doldurmuyor.\n2. 728x90 yaklaşık 8,1'e 1 ettiği için 8:1 oranında ürettik, sonra Photoshop'ta tam piksel ölçüsüne kırptık. Başlık, fiyat ve logoyu da katman olarak ekledik.\n\nSıradaki ders: Marka görsel dili ve stil tutarlılığı\n\n### Kaynaklar\n\n- [Apidog – Nano Banana 2.1 vs Nano Banana 2 vs Nano Banana Pro](https://apidog.com/blog/nano-banana-2-1-vs-nano-banana-2-vs-pro/)\n- [Magnific Blog – 8 Creative Use Cases for Nano Banana Pro](https://www.magnific.com/blog/nano-banana-pro-use-cases/)\n- [Scenario Help – Gemini Image Models (Nano Banana Family)](https://help.scenario.com/articles/7568607761-gemini-image-models-nano-banana-family)", "module": 3, "moduleName": "Tutarlılık", "n": 23, "summary": ["Nano Banana 14 referans kabul etse de en iyi sonuç 2-3 referansla alınır; fazlası gerekiyorsa işi turlara böl.", "Her referansı yükleme sırasındaki numarasıyla an ve ona tek bir görev ver: yüz, ürün ya da mekan.", "Revizyonda prompt'u baştan yazma; onaylı kareyi referans verip sadece tek şeyi değiştir, kalanları tek tek say.", "Çıktının oranı ilk referanstan gelir; oran kayıyorsa istediğin oranda boş bir tuvali ilk sıraya koy.", "Hep onaylı temiz kareden düzenle; üst üste düzenleme görüntüyü yavaş yavaş bozar."], "title": "Nano Banana ile çoklu referans düzenleme: referansları numarayla anmak, \"sadece X'i değiştir\" komutu ve oranı boş tuvalle kilitlemek"}, {"checked": "Ekim 2026", "date": "10 Ekim 2026", "flow": {"edges": [{"a": "brief", "b": "dna", "k": "ref", "l": "en iyi 3-4 foto"}, {"a": "dna", "b": "block", "k": "txt", "l": "paragraf"}, {"a": "brief", "b": "board", "k": "ref", "l": "eski işler"}, {"a": "block", "b": "g1", "k": "txt", "l": "stil bloğu"}, {"a": "block", "b": "g2", "k": "txt", "l": "stil bloğu"}, {"a": "block", "b": "g3", "k": "txt", "l": "stil bloğu"}, {"a": "board", "b": "g1", "k": "ref"}, {"a": "board", "b": "g2", "k": "ref"}, {"a": "board", "b": "g3", "k": "ref"}, {"a": "g1", "b": "cmp", "k": "img"}, {"a": "g2", "b": "cmp", "k": "img"}, {"a": "g3", "b": "cmp", "k": "img"}, {"a": "cmp", "b": "fix", "k": "img", "l": "sapan kare"}, {"a": "fix", "b": "card", "k": "f"}, {"a": "card", "b": "lora", "k": "f", "l": "isteğe bağlı"}, {"a": "fix", "b": "out", "k": "img", "l": "onaylı 3 kare"}, {"a": "card", "b": "out", "k": "f"}], "groups": [{"c1": 0, "c2": 1, "label": "Hazırlık", "r1": 0, "r2": 0}, {"c1": 2, "c2": 2, "label": "Marka dili", "r1": 0, "r2": 1}, {"c1": 3, "c2": 3, "label": "Üretim: 3 konu, 1 stil", "r1": 0, "r2": 2}, {"c1": 4, "c2": 5, "label": "Karşılaştır ve düzelt", "r1": 0, "r2": 0}, {"c1": 6, "c2": 7, "label": "Kalıcı hale getir ve teslim", "r1": 0, "r2": 1}], "nodes": [{"c": 0, "id": "brief", "pv": {"items": ["Logo + renkler: zeytin yeşili, taş rengi", "6 eski telefon fotoğrafı", "Müşterinin cümlesi: doğal, aile işi, Ege sofrası"], "k": "list"}, "r": 0, "s": 1, "t": "brief", "text": "Müşterinin elindeki her şey tek panoda, her görselin yanında bir satır not.", "title": "Marka dosyasını topla", "tool": "Magnific Spaces · ön hazırlık sayfası"}, {"c": 1, "id": "dna", "pv": {"k": "txt", "v": "Extract the shared visual language from these photos: color palette, light, camera, framing, texture, mood. Write it as one English paragraph… Ask me questions first."}, "r": 0, "s": 2, "t": "claude", "text": "Ortak renk, ışık, kadraj ve dokuyu tek
