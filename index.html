 paragrafa döker, önce soru sorar.", "title": "Marka DNA'sını çıkart", "tool": "Claude · 3-4 görsel yükle"}, {"c": 2, "chips": ["5 karar", "kelimesi kelimesine aynı"], "id": "block", "pv": {"items": ["Renk: zeytin yeşili, taş rengi, yumuşak krem", "Işık: soldan alçak ikindi güneşi", "Kamera: 35mm film, 50mm lens, sığ alan derinliği", "Doku: hafif grain, solgun kontrast", "Kompozisyon: konu altta, üstte boşluk"], "k": "layers"}, "r": 0, "s": 3, "t": "prompt", "text": "Her prompt'un sonuna aynen eklenir; hiç değişmez.", "title": "Stil bloğu (kilitli)"}, {"c": 2, "chips": ["2 görsel", "sadece ışık·renk·doku"], "id": "board", "pv": {"ar": "4:5", "items": [{"m": "🫒", "tag": "ikindi ışığı, zeytin ağacı", "tone": "warm"}, {"m": "🪨", "tag": "taş + zeytin yeşili", "tone": "day"}], "k": "grid"}, "r": 1, "s": 4, "t": "ref", "text": "Nesneye değil ışığa ve renge bakarak seçilir; içinde yazı ve yüz olmasın.", "title": "Stil referans panosu"}, {"c": 3, "chips": ["Nano Banana Pro", "4:5", "1K"], "id": "g1", "pv": {"ar": "4:5", "k": "img", "m": "🫒", "tag": "koyu cam şişe, taş masa", "tone": "warm"}, "r": 0, "s": 5, "t": "gen", "text": "Sadece ilk cümle yeni, gerisi stil bloğu.", "title": "Konu 1: Şişe", "tool": "Image Generator"}, {"c": 3, "chips": ["Nano Banana Pro", "4:5", "1K"], "id": "g2", "pv": {"ar": "4:5", "k": "img", "m": "🍞", "tag": "köy ekmeğine dökülen yağ, keten", "tone": "warm"}, "r": 1, "s": 5, "t": "gen", "text": "Aynı blok, aynı 2 referans.", "title": "Konu 2: Ekmek ve yağ", "tool": "Image Generator"}, {"c": 3, "chips": ["Nano Banana Pro", "4:5", "1K"], "id": "g3", "pv": {"ar": "4:5", "k": "img", "m": "🧑‍🌾", "tag": "zeytin toplayan eller — biraz soğuk çıktı", "tone": "day"}, "r": 2, "s": 5, "t": "gen", "text": "Sapma riski en yüksek kare: insan + açık hava.", "title": "Konu 3: Hasat", "tool": "Image Generator"}, {"c": 4, "id": "cmp", "pv": {"ar": "4:5", "items": [{"m": "🫒", "tag": "uyumlu", "tone": "warm"}, {"m": "🍞", "tag": "uyumlu", "tone": "warm"}, {"m": "🧑‍🌾", "tag": "SAPIYOR: soğuk", "tone": "day"}], "k": "grid"}, "r": 0, "s": 6, "t": "compare", "text": "Telefon boyutunda 4 soru: renk sıcaklığı, ışık yönü, grain, kadraj kuralı.", "title": "Seriyi yan yana kontrol et"}, {"c": 5, "chips": ["sapan = Image 1", "iyi 2 kare = stil ref"], "id": "fix", "pv": {"a": {"m": "🧑‍🌾", "tag": "önce: soğuk, parlak", "tone": "day"}, "b": {"m": "🧑‍🌾", "tag": "sonra: seriyle aynı", "tone": "warm"}, "k": "ba"}, "r": 0, "s": 7, "t": "adjust", "text": "Sadece renk, kontrast ve grain diğerlerine uydurulur.", "title": "Sapanı düzelt, bloğu değil"}, {"c": 6, "id": "card", "pv": {"items": ["Stil bloğu", "2 referans görsel", "Model: Nano Banana Pro · 4:5 · 2K", "Yasak: neon renk, beyaz stüdyo fonu"], "k": "list"}, "r": 0, "s": 8, "t": "card", "text": "Üç hafta sonra yeni ürün gelince sadece konu cümlesini yazarsın.", "title": "Stil kartını kaydet", "tool": "Spaces not kutusu + ekip prompt kütüphanesi"}, {"c": 6, "chips": ["10-50 görsel", "Mystic / Flux.1", "2.300+ kredi"], "id": "lora", "pv": {"items": ["Onaylı görselleri biriktir", "En az 2000 px", "Orta kalite: 2.300 kredi"], "k": "list"}, "r": 1, "s": 8, "t": "note", "text": "Uzun soluklu müşteride stil her üretime otomatik girer; önce elle yöntemi otur.", "title": "İleride: Custom Style eğit", "tool": "Magnific Custom Styles"}, {"c": 7, "chips": ["2K", "logo katmanı", "Instagram ızgarası"], "end": true, "id": "out", "pv": {"ar": "4:5", "items": [{"m": "🫒", "tag": "post 1", "tone": "warm"}, {"m": "🍞", "tag": "post 2", "tone": "warm"}, {"m": "🧑‍🌾", "tag": "post 3", "tone": "warm"}], "k": "grid"}, "r": 0, "s": 9, "t": "export", "text": "Müşteriye ızgara önizlemesiyle gönder.", "title": "3'lü seri teslim", "tool": "2K'da yeniden üret + Photoshop"}], "title": "Markanın görünüşünü bir kere kararlaştır, her üretimde sadece konuyu değiştir"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Çoklu referanslı üretimde görselleri neden \"Image 1, Image 2\" diye numarayla anıyoruz ve bunu yapmazsak ne olur?\n2. Story versiyonu üretirken oran 9:16 yerine kareye kayıyorsa ne yapıyorduk?\n\n### Konu\n\nŞu ana kadar tutarlılığı hep bir \"şey\" üzerinden konuştuk: aynı kişi, aynı ürün, aynı mekan. Bu derste bir adım geriye çekilip daha büyük resme bakıyoruz: aynı **his**. Bir markanın Instagram sayfasını açtığında logoya bakmadan \"bu onların paylaşımı\" diyebiliyorsan, o markanın bir görsel dili var demektir. Renkleri, ışığı, kadrajı, dokusu, hatta görselin ne kadar boş ya da dolu olduğu hep aynı aileden gelir.\n\nAI ile çalışınca bu dil çok kolay dağılır. Pazartesi ürettiğin zeytinyağı şişesi görseli sıcak ve filmsi çıkar, çarşamba ürettiğin zeytin hasadı görseli soğuk ve parlak bir stok fotoğrafı gibi. İkisi de tek başına güzeldir ama yan yana konunca aynı markanın işi gibi durmaz. Sebep basit: her seferinde prompt'u biraz farklı yazıyorsun, model de her seferinde kendi zevkini biraz farklı ekliyor. Müşteri bunu \"bir şey olmamış ama ne olduğunu bilmiyorum\" diye hisseder.\n\nBu dersteki yöntemin özü şu: markanın görsel dilini bir kere kararlaştırıp **yazıya ve görsele dökmek**, sonra her üretimde aynı paketi kullanmak. Bu paketin üç parçası var.\n\nBirincisi **stil bloğu**. Prompt'unu ikiye ayırıyorsun: değişen kısım (bu görselde ne çekiyoruz: şişe, ekmek ve yağ, hasat) ve kilitli kısım (marka nasıl görünür: renk paleti, ışık, kamera ve film hissi, doku, kompozisyon kuralı). Kilitli kısım tek bir paragraf olur ve her prompt'un sonuna kelimesi kelimesine aynı yapıştırılır. Bir kelimesini bile \"bugün canım öyle istedi\" diye değiştirmezsin.\n\nİkincisi **stil referans panosu**. Kelimeler her şeyi anlatamaz; \"sıcak\" senin için bir şey, model için başka bir şey ifade eder. Bu yüzden markanın dilini en iyi temsil eden 3-6 görseli (müşterinin en sevdiği eski paylaşımlar ya da senin onayladığın ilk üretimler) seçip bir panoda toplarsın. Üretim yaparken bunlardan bir ya da ikisini **stil referansı** olarak verirsin ve modele açıkça \"bu görselden sadece ışığı, rengi ve dokuyu al, içindeki nesneleri alma\" dersin. Önceki dersteki görev ataması mantığının aynısı.\n\nÜçüncüsü **stil kartı**. Bu, işin hafızası. Stil bloğunu, referans görselleri, kullandığın modeli, oranı ve \"yapılmayacaklar\" listesini (mesela \"neon renk yok, beyaz stüdyo fonu yok\") tek bir yerde tutarsın. Üç hafta sonra müşteri yeni bir ürünle geldiğinde sıfırdan düşünmezsin; kartı açar, sadece değişen kısmı yazarsın.\n\nBunun bir de ileri versiyonu var. Magnific'te **Custom Styles** denen bir özellik, markanın 10-50 görselinden ona özel küçük bir stil modeli (LoRA) eğitiyor. Seçtiğinde o stil her üretime otomatik giriyor. Ama bedeli yüksek: Magnific'in sayfasına göre orta kalitede bir stil eğitmek 2.300, yüksek kalitede 5.500 kredi tutuyor ve şimdilik sadece Mystic ve Flux.1 modellerinde çalışıyor. Bu yüzden önce bu dersteki elle yöntemi otur, marka uzun soluklu bir müşteriyse ve her ay onlarca görsel çıkıyorsa eğitmeyi düşün. Magnific'in yeni Brand Kit özelliği de aynı fikri daha da otomatik yapıyor; onu bir sonraki derste ayrıca göreceğiz.\n\nBenzetme: Bir restoranın mutfağını düşün. Aşçı her gün değişebilir, malzeme her gün farklı gelebilir ama tarif kartı mutfağın duvarında asılıdır: kaç gram, kaç derece, hangi tabak, nasıl süsleme. O kart olduğu için müşteri her gelişinde \"aynı tat\" der. Stil bloğu o tarif kartıdır, referans panosu duvara asılmış \"tabak böyle görünmeli\" fotoğrafıdır. Sen de her üretimde aynı tarifle pişiriyorsun, sadece malzemeyi değiştiriyorsun.\n\nBu dersin bir ajans ekibi için en büyük kazancı şu: iş kişiye bağlı olmaktan çıkıyor. Stil kartı olan bir markayı ekipten kim üretirse üretsin, sonuç yine aynı aileden çıkar.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Görsel dil | Bir markanın görsellerini birbirine benzeten renk, ışık, kadraj ve doku kuralları bütünü | visual language, visual identity |\n| Stil bloğu | Her prompt'un sonuna aynen eklenen, markanın görünüşünü anlatan sabit paragraf | style block, locked style prompt |\n| Stil referansı | Modele sadece görünüşü (ışık, renk, doku) almak için verilen görsel | style reference, use only for style |\n| Renk paleti | Markanın kullandığı ana ve yardımcı renklerin listesi | color palette, muted olive green and warm stone tones |\n| Doku / grain | Görselin yüzeyindeki ince film tanesi ya da kumlanma; analog his verir | film grain, subtle texture |\n| Stil kartı | Stil bloğu, referanslar, model, oran ve yasakların durduğu tek sayfalık not | style guide, brand sheet |\n| Özel stil (LoRA) | Markanın görsellerinden eğitilen, stili otomatik ekleyen küçük ek model | custom style, LoRA |\n| Sapma | Seride bir görselin diğerlerinden farklı görünmesi (daha soğuk, daha parlak vb.) | style drift, off-brand |\n\n### Uygulama\n\nSenaryo: Ege'de aile işletmesi olarak zeytinyağı üreten \"Taşbahçe\" adında yerel bir marka ajansa geldi. Bir aylık Instagram içeriği istiyorlar. Ellerinde logo, iki renk (zeytin yeşili ve taş rengi) ve telefonla çekilmiş, ikindi güneşinde güzel duran 6 eski fotoğraf (bahçe, şişe, sofra) var. Senden istenen: önce markanın görsel dilini kurmak, sonra bu dille üç görsellik bir test serisi (şişe, ekmek ve yağ, hasat) çıkarmak.\n\n1. **Marka dosyasını topla.** Magnific Spaces'te yeni bir Space aç ve adını \"Taşbahçe – ön hazırlık\" koy. Logoyu, müşterinin 6 eski fotoğrafını, renk kodlarını ve müşterinin kendi cümlelerini (\"doğal, aile işi, Ege sofrası\") buraya diz. Her görselin yanına kısa bir not yaz: \"ışığı güzel\", \"rengi tam marka\", \"kadrajı fazla kalabalık\".\n2. **Marka DNA'sını Claude'a çıkart.** En iyi 3-4 fotoğrafı Claude'a yükle ve şunu iste: \"Bu görsellerin ortak renk paletini, ışık tipini, kamera ve kadraj alışkanlığını, dokusunu ve genel hissini çıkar; bunu bir görsel prompt'unun sonuna eklenecek tek bir İngilizce paragraf olarak yaz. Başlamadan bana soru sorabilirsin.\" Claude'un soruları çoğu zaman senin aklına gelmeyen kararları ortaya çıkarır (mesela \"insanlar yüzleriyle mi görünsün, sadece elleriyle mi?\").\n3. **Stil bloğunu kilitle.** Claude'un paragrafını beş başlıkta kontrol et ve düzelt: renk paleti, ışık, kamera ve film hissi, doku, kompozisyon kuralı. Her başlık tek ve net bir karar olsun; \"sıcak ya da soğuk\" gibi kararsız ifade kalmasın. Bu paragrafı Space'te bir not kutusuna yapıştır. Artık bu metin dokunulmaz.\n4. **Stil referans panosunu seç.** Eski fotoğraflardan markayı en iyi anlatan 2 tanesini \"stil referansı\" olarak işaretle. Seçerken nesneye değil, ışığa ve renge bak; içinde ne olduğunun önemi yok, nasıl göründüğü önemli. Referansta yazı, logo ya da insan yüzü olmaması daha iyi; model onları da taşımaya çalışır.\n5. **Üç farklı konuyla test et.** Image Generator'ı (ya da Space'te bir görsel üretim node'unu) aç, modeli Nano Banana Pro seç, oranı 4:5, çözünürlüğü önce 1K yap (kredi tasarrufu). Referans alanına iki stil görselini yükle. Üç ayrı üretim yap: taş masada şişe, ekmeğe dökülen yağ, hasatta zeytin toplayan eller. Her birinde sadece baştaki konu cümlesi değişsin, sonuna aynı stil bloğunu ve \"referans görsellerden sadece ışığı, rengi ve dokuyu al\" cümlesini ekle.\n6. **Seriyi yan yana koy ve karşılaştır.** Üç görseli Spaces'te ya da Photoshop'ta yan yana diz, biraz uzaklaşıp telefon boyutunda bak. Dört soru sor: Renk sıcaklığı aynı mı? Işık aynı yönden ve aynı sertlikte mi geliyor? Grain ve kontrast aynı mı? Kadraj kuralı (mesela \"konu altta, üstte boşluk\") üçünde de var mı? Bir görsel diğerlerinden kopuyorsa ona \"sapan görsel\" de. İnsan ve açık hava içeren hasat karesi genelde en çok sapan karedir.\n7. **Sapmayı düzelt, bloğu değil.** Sapan görseli bloğu değiştirerek düzeltme; yoksa diğer ikisini de bozarsın. Önce sapan görseli tek referans olarak verip \"sadece renk sıcaklığını ve kontrastı diğer iki görsele uydur\" de, iki iyi görseli de stil referansı olarak ekle. Aynı sapma iki üç kez tekrar ediyorsa o zaman sorun bloktadır: bloğa eksik olan kararı (mesela \"no cool blue tones\") ekle ve üçünü yeniden üret.\n8. **Stil kartını kaydet ve kalıcı hale getir.** Space'te bir \"Stil kartı\" kutusu oluştur: stil bloğu, iki referans görsel, model adı, oran, çözünürlük ve yasaklar listesi. Bu kartı ekibin ortak prompt kütüphanesine de kopyala. Marka uzun soluklu bir müşteriyse ve elinde 10'dan fazla onaylı görsel biriktiyse, bunlarla Custom Styles'ta özel stil eğitmeyi düşünebilirsin.\n9. **Seriyi bitir ve teslim et.** Onaylanan üç görseli 2K'da yeniden üret (aynı prompt, aynı referanslar), gerekirse büyüt. Photoshop'ta logoyu ve kısa yazıları katman olarak ekle; yazı fontu ve rengi de stil kartında yazdığın gibi olsun. Üç görseli Instagram ızgarasında yan yana göreceğin bir önizlemeyle müşteriye gönder.\n\n### Örnek prompt'lar\n\n`Extract the shared visual language from these photos: color palette, light type and direction, camera and lens habit, framing, texture and overall mood. Write it as one English paragraph I can paste at the end of every image prompt. Ask me questions before you start if anything is unclear.`\n\nKullanım yeri: Yeni bir müşterinin eski görsellerinden stil bloğu çıkarmak. Claude'a 3-4 görsel ile birlikte verilir; sonucu sen beş başlıkta kontrol edip kilitlersin. Her sektörde aynen kullanılabilir.\n\n`A dark glass bottle of extra virgin olive oil on a rough stone table under an olive tree, a small bowl of green olives beside it. Brand style: warm muted palette of olive green, warm stone and soft cream, low late-afternoon sunlight from the left, gentle long shadows, shot on 35mm film, 50mm lens, shallow depth of field, subtle film grain, slightly faded contrast, subject in the lower half with calm empty space above, no neon colors, no white studio backdrop. Use the reference images only for light, color and texture, not for objects. 4:5`\n\nKullanım yeri: Zeytinyağı markası serisinin ilk görseli. \"Brand style:\" ile başlayan kısım stil bloğu; seri boyunca hiç değişmez.\n\n`Golden olive oil being poured over a torn piece of village bread on a linen cloth. Brand style: warm muted palette of olive green, warm stone and soft cream, low late-afternoon sunlight from the left, gentle long shadows, shot on 35mm film, 50mm lens, shallow depth of field, subtle film grain, slightly faded contrast, subject in the lower half with calm empty space above, no neon colors, no white studio backdrop. Use the reference images only for light, color and texture, not for objects. 4:5`\n\nKullanım yeri: Aynı serinin ikinci görseli. Sadece ilk cümle değişti; bu, stil bloğunun nasıl çalıştığını görmenin en kolay yolu.\n\n`Match this image to the other two references: change only the color temperature, contrast and grain so it feels like the same photo series. Keep the subject, composition and objects exactly the same.`\n\nKullanım yeri: Seride sapan bir görseli düzeltmek (örneğin fazla soğuk çıkan hasat karesi). Sapan görsel ilk referans, iki iyi görsel stil referansı olarak verilir.\n\n`A small amber glass serum bottle with a dropper resting on a smooth white pebble. Brand style: soft sage and ivory palette, diffused window light from above, macro lens, very shallow depth of field, smooth creamy background, minimal composition with the product in the center, no harsh reflections, no busy props. Use the reference images only for light, color and texture. 4:5`\n\nKullanım yeri: Bir cilt bakımı markası için stil bloğu örneği. Aynı mantık farklı bir sektörde: konu değişir, \"Brand style:\" kısmı o markanın kartından gelir.\n\n### Sık yapılan hatalar\n\n- **Stil bloğunu her seferinde \"biraz\" değiştirmek.** \"Bugün biraz daha canlı olsun\" diye eklenen tek bir kelime seriyi bozar. Değişiklik gerekiyorsa bloğu bilinçli olarak güncelle, karta yaz ve eski görselleri de yeniden üret.\n- **Stil referansından nesne kaçması.** Referanstaki şişe, zeytin dalı ya da logo yeni görsele de girer. Referansı ışığı ve rengi iyi ama içi sade olan görsellerden seç ve \"sadece ışık, renk, doku\" cümlesini mutlaka yaz.\n- **Görseli tek başına değerlendirmek.** Bir görsel tek başına harika görünüp seride kopuk durabilir. Her yeni görseli öncekilerle yan yana, telefon boyutunda kontrol et.\n- **Farklı modellerle aynı seriyi üretmek.** Aynı stil bloğu Nano Banana'da başka, Seedream'de başka sonuç verir. Bir seriye hangi modelle başladıysan onunla bitir ve modeli stil kartına yaz.\n- **Kararsız sıfatlar kullanmak.** \"Modern, şık, güzel\" gibi kelimeler model için neredeyse boştur. \"Zeytin yeşili ve taş rengi, soldan alçak ikindi ışığı\" gibi ölçülebilir kararlar yaz.\n\n### Profesyonel yöntem\n\nDeneyimli üretim ekiplerinin ortak alışkanlığı şu: **üretime geçmeden önce her şeyi tek bir panoda toplamak.** Buna ön hazırlık (pre-production) panosu deniyor. Film çekilmeden önce yönetmenin duvarına asılan moodboard ve sahne kartları gibi düşün. Referans görseller, ürün ve mekan görselleri, stil bloğu ve kullanılacak prompt'lar aynı yerde durur; her birinin yanında \"bu ne için\" diyen kısa bir not vardır. Bunun için ayrı bir araç öğrenmen gerekmiyor: Magnific Spaces'te bir \"ön hazırlık\" sayfası ya da FigJam aynı işi görür. Önemli olan araç değil, pano mantığı. Neden işe yarar? Çünkü bir üretimde karar verirken başka bir sekmeye, telefona ya da hafızana gitmezsin; doğru referans ve doğru metin hep gözünün önündedir. Ekipte ikinci bir kişi işe girdiğinde de panoya bakıp beş dakikada markayı anlar.\n\nProfesyonel akış genelde şu sırayla ilerler:\n\n1. **Önce marka rehberi ve ana prompt şablonu.** Bir sohbet asistanına markanın eski görsellerini (ve varsa web sitesini) verip bir marka rehberi ile tüm üretimleri yönetecek tek bir ana prompt şablonu yazdırırsın; \"başlamadan bana soru sorabilirsin\" diye bitirirsin. Sonraki her görsel bu şablondan türer. Bu dersteki stil bloğu tam olarak bu şablondur.\n2. **Stil kararı bir kere verilir.** Mimari bir tarz, bir renk ailesi ya da bir film hissi seçilip panoya konduktan sonra bütün sahneler ona uyar. Karar her görselde yeniden tartışılmaz. Bu, prompt'u bir \"kural kitabı\" gibi kurmak demek: kurallar (stil, ışık, kadraj) sabit, içerik (ürün, kişi, mekan) değişken. Böyle yazılan prompt tek bir görsel için değil, toplu üretim için tasarlanmış olur.\n3. **Işığı değiştir, dili koru.** Aynı markanın sabah ve akşam versiyonu gerektiğinde (mesela hasat sabahı ve gün batımında sofra) bütün bloğu yeniden yazmazsın. Mevcut prompt'u bir sohbet asistanına verip \"sadece ışık satırını değiştir, gerisine dokunma\" dersin. Böylece renk, doku ve kadraj aynı kalır, sadece günün saati değişir.\n4. **Onaylı tek bir kareden aile üret.** Önce bir \"ana kare\" onaylanır; diğer mekan ve açılar bu onaylı kareyi referans alarak üretilir. Örneğin onaylanmış bahçe karesinden aynı ışıkta bir sofra, bir depo ve bir hasat sahnesi türetirsin. Hepsi aynı kaynaktan geldiği için aile gibi durur. Midjourney kullanan ekipler aynı işi stil kodlarıyla (sref) yapar.\n\nKısacası profesyonel fark yetenekte değil düzende: karar bir kere verilir, bir yere yazılır ve herkes aynı karttan üretir.\n\n### Ödev\n\nBir proje panosu açmayı bu dersteki yöntemle birleştiriyoruz. Süre 25-30 dakika.\n\n1. Üzerinde çalıştığın ya da yakında gelecek gerçek bir müşteri işi seç (yerel bir gıda markası, kozmetik, spor kulübü, ne varsa). Magnific Spaces'te \"Müşteri adı – ön hazırlık\" diye bir Space aç; logoyu, 4-6 eski görseli ve renkleri koy, her birine bir satır not yaz. Panonun bitmiş olması gerekmiyor, var olması yeterli.\n2. En iyi 3 görseli ilk örnek prompt ile Claude'a ver ve bir stil bloğu çıkart. Beş başlıkta kontrol et (renk, ışık, kamera, doku, kompozisyon) ve kararsız kelimeleri temizle.\n3. İki stil referansı seç ve aynı stil bloğuyla üç farklı konu üret (1K, 4:5, aynı model). Zeytinyağı örneğindeki gibi biri ürün, biri kullanım anı, biri insan ve mekan olsun.\n4. Üçünü yan yana koy, dört soruyla karşılaştır ve sapan bir görsel varsa \"sadece rengi uydur\" prompt'uyla düzelt.\n5. Space'te bir stil kartı kutusu oluştur.\n\nBitince üç görseli ve stil bloğunu Claude'a göster ve şunu sor: \"Bu üç görsel aynı markanın serisi gibi duruyor mu, hangisi sapıyor, stil bloğuma hangi karar eksik?\"\n\n### Tekrar sorularının cevapları\n\n1. Model hangi görselden ne alacağını tahmin etmek zorunda kalmasın diye. Numara vermezsek renkleri, detayları ve kişileri karıştırır: ürünün rengini mekandan alır, saçı başka bir görselden taşır. Her referansı numarasıyla ve tek göreviyle yazınca bu karışıklık biter.\n2. İstediğimiz oranda (1080x1920 gibi) boş bir tuval hazırlayıp onu ilk referans olarak yüklüyorduk. Çıktının çerçevesini çoğu zaman ilk referansın oranı belirlediği için model sahneyi bu dikey çerçevenin içine kuruyor.\n\nSıradaki ders: Magnific One: taslak/final modları, stil referansı ve Brand Kit\n\n### Kaynaklar\n\n- [Magnific – Custom Styles](https://www.magnific.com/ai/custom-styles)\n- [Magnific Docs – Brand Kit](https://www.magnific.com/ai/docs/brand-kit)\n- [Magnific – AI Image Generator](https://www.magnific.com/ai/images)", "module": 3, "moduleName": "Tutarlılık", "n": 24, "summary": ["Markanın görsel dili renk, ışık, kadraj ve dokudan oluşur; bir kere kararlaştırılıp yazıya dökülürse seri dağılmaz.", "Prompt'u ikiye böl: değişen konu cümlesi ve her prompt'un sonuna kelimesi kelimesine eklenen kilitli stil bloğu.", "Markayı en iyi anlatan 2 görseli stil referansı ver ve modele sadece ışığı, rengi ve dokuyu almasını söyle.", "Seriyi hep yan yana, telefon boyutunda kontrol et; sapan görseli düzelt, bloğu ancak aynı hata tekrar ederse değiştir.", "Stil bloğu, referanslar, model, oran ve yasakları bir stil kartına yaz; böylece ekipte kim üretirse üretsin sonuç aynı aileden çıkar."], "title": "Marka görsel dili ve stil tutarlılığı"}, {"checked": "Ekim 2026", "date": "11 Ekim 2026", "flow": {"edges": [{"a": "src", "b": "kit", "k": "f", "l": "kaynak"}, {"a": "kit", "b": "test", "k": "f", "l": "öneri"}, {"a": "test", "b": "fin", "k": "ref", "l": "Brand kit (sadece Final)"}, {"a": "pr", "b": "draft", "k": "txt", "l": "prompt"}, {"a": "sty", "b": "draft", "k": "ref", "l": "Style"}, {"a": "sty", "b": "fin", "k": "ref", "l": "Style"}, {"a": "draft", "b": "pick", "k": "img", "l": "16 › 2"}, {"a": "pick", "b": "fin", "k": "img", "l": "Final'e taşı"}, {"a": "fin", "b": "off", "k": "f", "l": "kontrol"}, {"a": "fin", "b": "lay", "k": "img", "l": "onaylı"}, {"a": "off", "b": "lay", "k": "f"}, {"a": "lay", "b": "out", "k": "img"}], "groups": [{"c1": 0, "c2": 2, "label": "Hazırlık: Brand Kit", "r1": 0, "r2": 0}, {"c1": 3, "c2": 5, "label": "Taslak: ucuz keşif", "r1": 0, "r2": 1}, {"c1": 6, "c2": 6, "label": "Final: marka kurallarıyla", "r1": 0, "r2": 1}, {"c1": 7, "c2": 7, "label": "Teslim", "r1": 0, "r2": 1}], "nodes": [{"c": 0, "id": "src", "pv": {"items": ["Logo + 6 eski kampanya görseli", "Web sitesi / Instagram adresi", "Stil bloğu ve yasaklar (Text)", "Renkler: gece mavisi, nane yeşili"], "k": "list"}, "r": 0, "s": 1, "t": "brief", "text": "Brand Kit'e ne verirsen onu öğrenir.", "title": "Marka kaynakları"}, {"c": 1, "chips": ["Rota", "~10-15 dk"], "id": "kit", "pv": {"items": ["Palet: gece mavisi #14213D, nane yeşili", "Tarz: gerçek şehir anları, yumuşak gün ışığı", "Ton: sade, yardımsever, hızlı", "Tipografi: yuvarlak serifsiz başlık"], "k": "list"}, "r": 0, "s": 1, "t": "card", "text": "Asistan kaynaklardan palet, tarz, ton ve tipografi çıkarır.", "title": "Brand Kit'i kur", "tool": "Library › References › Brand Kit › Create"}, {"c": 2, "chips": ["renk kodlarını kontrol et"], "id": "test", "pv": {"ar": "4:5", "items": [{"m": "📱", "tag": "✓ marka", "tone": "day"}, {"m": "📱", "tag": "✗ stüdyo fonu", "tone": "white"}, {"m": "🚌", "tag": "✓ marka", "tone": "day"}, {"m": "📱", "tag": "✗ fazla karanlık", "tone": "dark"}], "k": "grid"}, "r": 0, "s": 2, "t": "compare", "text": "Her cevabın kalıcı kurala dönüşür; yanlış renk burada düzeltilir.", "title": "Test görsellerini onayla"}, {"c": 3, "id": "pr", "pv": {"k": "txt", "v": "Photo. A hand holding a smartphone with a plain glowing screen at a seaside ferry stop, early morning, commuters softly blurred in the background, empty space at the top for a headline."}, "r": 0, "s": 3, "t": "prompt", "text": "Her bilgi bir kere; sıfat yerine sebep.", "title": "Taslak prompt'u", "tool": "sıra: ortam › konu › hikaye › ışık/kadraj"}, {"c": 3, "chips": ["Style", "2 görsel"], "id": "sty", "pv": {"ar": "4:5", "items": [{"m": "📱", "tag": "sabah ışığı, gerçek an", "tone": "day"}, {"m": "🌃", "tag": "gece mavisi tonlar", "tone": "dark"}], "k": "grid"}, "r": 1, "s": 4, "t": "ref", "text": "Sadece ışık, renk, doku alınır; nesneler kopyalanmaz.", "title": "Stil referansı"}, {"c": 4, "chips": ["Draft", "16 seçenek", "4:5", "≈1 görsel kredisi"], "id": "draft", "pv": {"ar": "4:5", "items": [{"m": "📱", "tag": "iskele, sabah", "tone": "day"}, {"m": "📱", "tag": "üstte boşluk", "tone": "day"}, {"m": "📱", "tag": "fazla ortada", "tone": "grey"}, {"m": "📱", "tag": "kalabalık", "tone": "blur"}], "k": "grid"}, "r": 0, "s": 3, "t": "gen", "text": "Brand Kit burada YOK: renge değil, fikre ve kadraja bak.", "title": "Taslak ızgarası", "tool": "Magnific One"}, {"c": 5, "id": "pick", "pv": {"ar": "4:5", "items": [{"m": "📱", "tag": "A: iskele, sabah ✓", "tone": "day"}, {"m": "📱", "tag": "B: başlık boşluğu ✓", "tone": "day"}], "k": "grid"}, "r": 0, "s": 5, "t": "compare", "text": "Ortak sorun varsa tek düzeltme cümlesiyle bir tur daha.", "title": "2 aday seç"}, {"c": 6, "chips": ["Final", "2K High", "180 kredi", "Brand kit: Rota"], "id": "fin", "pv": {"ar": "4:5", "k": "img", "m": "📱", "tag": "gece mavisi-nane, sabah ışığı, üstte başlık yeri", "tone": "day"}, "r": 0, "s": 6, "t": "gen", "text": "Seçilen yön teslim kalitesinde, marka kurallarıyla yeniden üretilir.", "title": "Final + Brand Kit", "tool": "Magnific One · References › Brand kit"}, {"c": 6, "id": "off", "pv": {"items": ["Renk sıcaklığı seriyle aynı mı?", "Beyazlar sarı mı? › 5500K cümlesi", "Hep aynı hata › Off-brand + sebep", "Kit bunu kalıcı kural yapar"], "k": "list"}, "r": 1, "s": 7, "t": "note", "text": "Tek seferlik: düzeltme cümlesi. Tekrar eden: marka dışı işareti.", "title": "Kontrol ve düzeltme"}, {"c": 7, "id": "lay", "pv": {"items": ["Logo (stil kartından)", "\"Haftanın Özelliği\" başlığı", "Gerçek uygulama ekranı (telefona)", "El, telefon ve fon"], "k": "layers"}, "r": 0, "s": 8, "t": "ps", "text": "Font, logo ve uygulama ekranı senin işin; kit font dosyası taşımaz.", "title": "Auto Layers + yazı", "tool": "Auto Layers › Designer / Photoshop"}, {"c": 7, "end": true, "id": "out", "pv": {"items": ["4:5", "9:16"], "k": "ratios", "m": "📱", "tone": "day"}, "r": 1, "s": 9, "t": "export", "text": "Tarif stil kartına eklenir, seri aynı yoldan devam eder.", "title": "Story + tarif kaydı", "tool": "Image Extender"}], "title": "Taslakta 16 fikri ucuza dene, sadece seçtiğini Brand Kit açıkken Final'de üret"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Stil bloğu yazarken prompt'u hangi iki parçaya ayırıyorduk ve hangisine asla dokunmuyorduk?\n2. Bir seride tek bir görsel diğerlerinden \"sapınca\" ilk ne yapıyorduk, bloğu ne zaman değiştiriyorduk?\n\n### Konu\n\nÖnceki derste bir markanın görsel dilini elle kurduk: stil bloğu, stil referans panosu ve stil kartı. Bu derste aynı işi Magnific'in 8 Ekim'de çıkardığı yeni modelle, **Magnific One** ile yapıyoruz. Bunu ayrı bir ders yapmamızın sebebi şu: Magnific One sadece \"bir model daha\" değil, çalışma şeklini değiştiren bir model. İçinde üç yenilik var ve üçü de doğrudan bizim tutarlılık modülümüzün konusu.\n\nBirincisi **sanat yönetimi**. Normal bir modele prompt yazdığında model kelimelerini olduğu gibi resme çevirmeye çalışır. Magnific One ise araya bir adım koyuyor: önce senin prompt'unu ve referanslarını okuyup \"bu görsel nasıl çekilmeli, ışık nereden gelmeli, kadraj nasıl olmalı\" diye bir karar veriyor, sonra görseli üretiyor. Magnific bunu \"odada iyi bir sanat yönetmeni varken varacağın görsel\" diye anlatıyor. Haberlere göre altta OpenAI'ın GPT Image 2 modeli çalışıyor, Magnific bu karar katmanını üstüne eklemiş. Sonuç: kısa ve sade prompt'larda bile \"AI görseli\" havası daha az çıkıyor.\n\nİkincisi **iki mod: Taslak (Draft) ve Final**. Taslak modunda tek prompt'tan 4, 8 ya da 16 farklı yön içeren bir ızgara alıyorsun. VentureBeat'in haberine göre bu ızgara, tek bir görselin kredisine geliyor. Yani fikir aşaması neredeyse bedava hale geliyor. Beğendiğin yönü seçip **Final**'e taşıyorsun; Final tek bir görseli teslim kalitesinde üretiyor: varsayılan 2K High, istersen 4K ya da daha pahalı \"Max\" kalite. Aynı habere göre Final kredileri kabaca şöyle: High 2K 180, High 4K 250, Max 2K 600, Max 4K 1.000 kredi. Kısacası taslakta bol bol dene, sadece bir iki görsel için Final'e para ver. Bu, kredi tasarrufu dersinde konuşacağımız \"önce ucuz dene, sonra pahalı üret\" fikrinin modele gömülmüş hali.\n\nÜçüncüsü **stil referansı ve Brand Kit**. Referans panelinde artık \"Style\" diye ayrı bir seçenek var. Normal referans yüklersen model onu **içerik** olarak okur (içindeki telefonu, masayı alır); Style olarak yüklersen sadece **görünüşünü** alır (renk, doku, teknik). 1 ile 5 arası görsel verebiliyorsun, Magnific'in kendi önerisi 2 görsel. Stil referansı hem Taslak'ta hem Final'de çalışıyor. **Brand Kit** ise önceki dersteki stil kartımızın otomatik hali: markanın PDF'ini, web sitesini, görsellerini ya da kendi yazdığın tarifi veriyorsun, Magnific'in asistanı bunlardan renk paleti, görsel tarzı, ses tonu ve tipografi kurallarını çıkarıp sana onaylatıyor. Kaydettikten sonra o markanın projesindeki her Final görsel bu kurallara göre üretiliyor; ekipte kim üretirse üretsin.\n\nBurada çok önemli bir ayrıntı var: **Brand Kit sadece Magnific One'ın Final modunda çalışıyor.** Taslak ızgarasında gördüğün görseller henüz marka kurallarından geçmemiş. Yani taslakta renge değil, fikre ve kompozisyona bakarsın; marka renkleri Final'de gelir. Bu ayrımı bilmeyen kişi taslağa bakıp \"renkler tutmamış, Brand Kit çalışmıyor\" diye vazgeçer.\n\nBir de Brand Kit'in sınırlarını bil. Magnific'in kendi dokümanı açıkça söylüyor: Brand Kit yön verir, birebir kesinlik vermez. Tam renk kodunu, tam fontu ve logonun piksel piksel yerini garanti etmez. Font dosyası yükleyemiyorsun, CMYK/Pantone gibi baskı renkleri de henüz yok. Bu yüzden yazı ve logo hâlâ son aşamada senin işin: Magnific'in **Auto Layers** aracı görseli katmanlara (yazı, logo, ürün, fon) ayırıyor, sen de Designer'da ya da Photoshop'ta bitiriyorsun. Ayrıca beğenmediğin bir sonucu \"marka dışı\" diye işaretleyip sebebini yazarsan (yanlış renk, yanlış his, istenmeyen yazı) kit bunu kalıcı bir kural olarak öğreniyor.\n\nBenzetme: Magnific One'ı bir fotoğraf stüdyosunda çalışan, işini bilen bir asistan gibi düşün. Taslak modu, asistanın sana masaya dizdiği 16 polaroid: hızlı, ucuz, \"hangi yöne gidelim\" diye konuşmak için. Final modu, seçtiğin polaroidin profesyonel kamerayla, doğru ışıkla yeniden çekilmesi. Brand Kit de stüdyonun duvarındaki marka kılavuzu: asistan son çekimi yaparken o kılavuza bakıyor, polaroidleri çekerken bakmıyor. Polaroidde renge takılırsan haksızlık etmiş olursun.\n\nAjans açısından en büyük kazanç: müşteri başına ayrı kit tutabiliyorsun. Bir gün bir mobil uygulama, ertesi gün bir gıda markası, öbür gün bir spor kulübü. Projeyi değiştirince kit de değişiyor; yeni gelen bir stajyer bile ilk gün markanın dilinde üretmeye başlıyor. Not: lansman döneminde (8-15 Ekim 2026) masaüstü uygulamasında üst paketlere sınırsız Taslak ve Final (2K ve 4K High) kampanyası vardı; Max kalite yine kredi yiyordu. Benzer kampanyalar tekrar gelebilir, hesabında görürsen denemek için iyi bir fırsat.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Magnific One | Önce görsele nasıl bakılacağına karar verip sonra üreten, Magnific'in yeni görsel modeli | Magnific One |\n| Sanat yönetimi | Bir görselin ışığına, kadrajına, rengine ve havasına karar verme işi | art direction |\n| Taslak modu | Tek prompt'tan 4, 8 ya da 16 farklı yön veren ucuz keşif ızgarası | Draft mode |\n| Final modu | Seçilen yönü teslim kalitesinde (2K, 4K) tek görsel olarak üreten mod | Final mode, 2K High, Max |\n| Stil referansı | Sadece görünüşü (renk, doku, teknik) aktarmak için verilen görsel; içerik alınmaz | style reference |\n| Brand Kit | Markanın renk, görsel tarzı, ton ve tipografi kurallarını tutan, Final'e otomatik uygulanan paket | Brand Kit |\n| Marka dışı | Görselin markanın kurallarına uymaması; işaretleyince kalıcı kurala dönüşür | off-brand |\n| Auto Layers | Görseli yazı, logo, ürün, fon gibi düzenlenebilir katmanlara ayıran araç | Auto Layers |\n\n### Uygulama\n\nSenaryo: \"Rota\" adında, şehir içi toplu taşıma ve rota planlama uygulaması geliştiren bir teknoloji girişimi ajansla çalışmaya başladı. Önceki dersteki yöntemle markanın stil kartı hazırlandı: stil bloğu, iki stil referansı, renkler (gece mavisi ve nane yeşili) ve yasaklar listesi (\"parlak stok fotoğraf havası yok, sahte uygulama ekranı yok\"). Bu derste bu kartı Magnific'te bir Brand Kit'e dönüştürüyorsun, sonra Magnific One ile \"Haftanın özelliği\" serisinin ilk görselini taslaktan finale götürüyorsun.\n\n1. **Brand Kit'i kur.** Magnific'te Library'yi aç, References altındaki Brand Kit'e gir ve Create de. Marka adına \"Rota\" yaz (zorunlu tek alan bu). Kaynak olarak üçünü birden ekle: logo ile 6 eski kampanya görselini dosya olarak, varsa uygulamanın web sitesi ya da Instagram adresini, Text alanına da önceki dersteki yöntemle yazılmış stil bloğunu ve yasaklar listesini yapıştır. \"Set it up manually\" de ve asistanın okumasını bekle.\n2. **Asistanın önerisini satır satır kontrol et.** Asistan sana bir renk paleti, görsel tarzı, ses tonu ve tipografi kuralları önerecek, bir de test görselleri gösterecek. Önce renk kodlarına bak: nane yeşili yanlış çıkarılmışsa şimdi düzelt, çünkü yanlış bir renk sonraki her görsele taşınır. Sonra test görsellerine tek tek \"bu marka, bu değil\" diye cevap ver ve nedenini yaz (\"fazla karanlık\", \"stüdyo fonu var, biz gerçek şehir hayatını anlatıyoruz\"). Bu adım 10-15 dakika sürer ama kitin kalitesi tam burada belirlenir.\n3. **Taslak modunda ilk prompt'u yaz.** Image Generator'ı aç, modeli Magnific One seç, modu Draft yap, seçenek sayısını 16, oranı 4:5 ayarla. Prompt'u yeni kurala göre yaz: önce ortamı söyle (\"Photo.\"), sonra konuyu, sonra hikayeyi, en son ışık ve kadrajı. Her bilgiyi bir kere söyle. \"Premium, çok güzel, profesyonel\" gibi sıfatlar yerine o hissi yaratan sebebi yaz (vapur iskelesi, sabah ışığı, elde tutulan telefon). Görselde yazı olacaksa tırnak içine al.\n4. **Stil referansını doğru yere koy.** Referans panelinde Style seçeneğini işaretle ve stil kartındaki iki görseli buraya yükle. Normal referans alanına koyarsan model içlerindeki telefonu, kişiyi ve mekanı kopyalamaya çalışır; Style'a koyunca sadece ışığı, rengi ve dokuyu alır. Brand Kit taslakta çalışmadığı için taslak aşamasında markanın havasını sana bu iki görsel verir.\n5. **Izgarayı fikir için oku, renk için değil.** 16 görseli yan yana gör. Kendine sadece şunları sor: Kadraj üstte başlık için yer bırakıyor mu? Telefon ve onu tutan el net mi? Mekan \"sabah işe gidiş\" hissi veriyor mu? Renklerin tam tutmamasını şimdilik dert etme. En iyi 2 adayı seç; beğenmediklerinin ortak sorunu varsa (hepsi fazla ortada, hepsi fazla kalabalık) prompt'a tek bir düzeltme cümlesi ekleyip bir tur daha taslak al.\n6. **Seçtiğin yönü Final'e taşı ve Brand Kit'i aç.** Önce Library'de kitin üstünde Use deyip aktif projeyi Rota seç. Sonra Image Generator'da References satırından Brand kit'i işaretle, iki stil referansını yerinde bırak. Modu Final, kaliteyi 2K High yap ve seçtiğin adayı Final'e taşı. Instagram için 2K yeter; 4K'yı sadece baskı (billboard, durak afişi) gerekirse, Max'i de sadece çok kritik bir kapak görseli için kullan.\n7. **Final'i kontrol et, sapmayı kitte düzelt.** Final görseli markanın daha önce onaylanmış görselleriyle yan yana koy. Renk sıcaklığı, ışığın yönü, grain ve kadraj aynı aileden mi? Bir şey tutmuyorsa iki yol var. Tek seferlik küçük bir şeyse prompt'un sonuna bir \"düzeltme cümlesi\" ekle (mesela beyazlar sararmışsa nötr gün ışığı cümlesi). Aynı hata tekrar ediyorsa görseli marka dışı diye işaretle ve sebebini yaz; kit bunu kalıcı kural olarak saklar, bir daha aynı hatayı yapmaz.\n8. **Yazıyı ve logoyu katmanlarla bitir.** Onayladığın Final görseli Auto Layers'a gönder; görsel yazı, ürün ve fon katmanlarına ayrılsın. \"Haftanın Özelliği\" başlığını, logoyu ve telefon ekranına gerçek uygulama ekran görüntüsünü Designer'da ya da katmanlı dosya olarak Photoshop'ta yerleştir (AI'ın çizdiği ekran arayüzü uydurmadır, gerçeği yerine koyulur); fontu ve rengi kendi stil kartından al, çünkü Brand Kit font dosyası taşımıyor ve tam renk kodunu garanti etmiyor.\n9. **Story versiyonunu çıkar ve tarifi kaydet.** Aynı görselin 9:16 story versiyonunu Image Extender ile genişlet ya da aynı prompt ve kitle 9:16 Final üret. Son olarak stil kartına üç satır ekle: \"Model: Magnific One, Taslak 16 → Final 2K High\", \"Brand Kit: Rota\", \"Stil referansı: 2 görsel (Style)\". Böylece serinin kalan görselleri bu tarifle çıkar.\n\n### Örnek prompt'lar\n\n`Photo. A hand holding a smartphone with a plain glowing screen at a seaside ferry stop, early morning, commuters softly blurred in the background, a folded city map on the bench beside it, empty space at the top for a headline.`\n\nKullanım yeri: Mobil uygulama markası için Taslak modunda ilk keşif prompt'u. Önce ortam (\"Photo.\"), sonra konu ve hikaye, en sonda kadraj kuralı var. \"Modern, yenilikçi\" gibi sıfat yok; o havayı iskele, sabah ve gerçek bir işe gidiş anı yaratıyor. Ekran bilerek sade bırakılıyor, gerçek arayüz sonra eklenecek. Stil referanslarıyla birlikte 16 seçenekli ızgarada kullan.\n\n`Photo. A young woman checking her phone while standing in a city bus, soft daylight from the left at about 5500K with no color cast. Place her on the right third and blur the foreground.`\n\nKullanım yeri: Aynı uygulamanın kullanım anı görseli. Sondaki iki cümle Magnific'in önerdiği türden \"düzeltme cümleleri\": biri beyazların sararmasını önlüyor, diğeri kişinin ortaya yığılmasını engelleyip yazıya yer açıyor.\n\n`Poster. Match day design for a football club: a football on wet grass under stadium lights at night, bold headline \"MAÇ GÜNÜ\" at the top. The text must match exactly, with no other logos or text.`\n\nKullanım yeri: Maç günü posteri taslağı. Yazı tırnak içinde, sonra \"sadece bu yazı olsun\" kuralı var. Kulübün Brand Kit'i varsa Final'de kulüp renkleri otomatik gelir; logoyu yine Auto Layers sonrası sen eklersin.\n\n`Use the brand kit colors and mood only, not its typography. Photo of a minimal skincare bottle on a pale stone, morning side light, a few water drops around it, top-down angle.`\n\nKullanım yeri: Bir cilt bakımı markasında Brand Kit'in sadece bir kısmını kullanmak istediğinde. Görselde yazı olmayacaksa ya da müşteri bu postta farklı bir başlık fontu istiyorsa, prompt'ta kitin hangi kısmını kullanacağını açıkça söylersin.\n\n`Keep everything else exactly the same: camera angle, crop and object positions. Change only the lighting to warm late-afternoon sun from the right with long soft shadows.`\n\nKullanım yeri: Final görselin kompozisyonunu beğendin ama müşteri \"akşamüstü havası olsun\" dedi. Hiçbir şeyi oynatmadan sadece ışığı değiştirmek için kullanılır; aynı cümle kalıbıyla sadece rengi ya da sadece arka planı da değiştirebilirsin.\n\n### Sık yapılan hatalar\n\n- **Taslakta renge bakmak.** Brand Kit taslak ızgarasına uygulanmaz. Taslakta renkler tutmadı diye iyi bir kompozisyonu elemek, sonra da \"Brand Kit çalışmıyor\" demek en sık yapılan hata. Taslakta fikre ve kadraja bak, rengi Final'de değerlendir.\n- **Stil görselini normal referans olarak yüklemek.** O zaman model görselin içindeki nesneleri, kişiyi, telefonu kopyalamaya çalışır. Sadece havasını istiyorsan referans panelinde mutlaka Style seçeneğini kullan; 2 görsel çoğu zaman en iyisi.\n- **Aynı şeyi üç farklı şekilde yazmak.** \"Warm, cozy, inviting, warm tones\" gibi tekrarlar Magnific One'ı karıştırır, detay kaybettirir. Her bilgiyi bir kere, sebebiyle söyle: \"sıcak\" yerine \"sabah güneşi pencereden giriyor\".\n- **Brand Kit'i kontrol etmeden kaydetmek.** Asistanın çıkardığı renk kodu ya da tipografi kuralı yanlışsa o hata her Final görsele taşınır. Kaydetmeden önce renk kodlarını müşterinin kılavuzuyla karşılaştır, test görsellerine mutlaka geri bildirim ver.\n\n### Ödev\n\nSüre 25-30 dakika. Üzerinde çalıştığın ya da yakında gelecek gerçek bir müşteri işiyle (ya da bu dersteki uygulama örneğiyle) çalış.\n\n1. Library'den bir Brand Kit oluştur: logo, 4-6 görsel ve önceki dersteki yöntemle yazdığın stil bloğunu kaynak olarak ver. Asistanın önerdiği renkleri kontrol et, en az 3 test görseline \"marka / marka değil\" geri bildirimi yaz.\n2. Magnific One'da Taslak modunda, 4:5 oranında, 2 stil referansıyla bir 16'lık ızgara al. Bu derste öğrendiğin sırayla (ortam, konu, hikaye, ışık ve kadraj) kendi prompt'unu yaz.\n3. Izgaradan sadece kompozisyona bakarak 2 aday seç ve ikisini de Brand Kit açıkken 2K High Final'e taşı.\n4. İki Final'i taslak hallerinin yanına koy ve Brand Kit'in neyi değiştirdiğini üç maddede not et (renk, ışık, doku ya da başka bir şey).\n5. Birinde ufak bir sorun varsa bir düzeltme cümlesiyle, tekrar eden bir sorun varsa \"marka dışı\" işaretiyle düzelt.\n\nBitince taslak ızgarasının ekran görüntüsünü, iki Final görseli ve Brand Kit'in renk ekranını Claude'a göster ve şunu sor: \"Brand Kit taslaktan finale neyi doğru değiştirmiş, neyi kaçırmış? Kitime hangi kuralı eklemeliyim?\"\n\n### Tekrar sorularının cevapları\n\n1. Değişen kısım (o görselde ne üretiyoruz: ürün, kullanım anı, mekan gibi konu cümlesi) ve kilitli kısım (marka nasıl görünür: renk paleti, ışık, kamera ve film hissi, doku, kompozisyon kuralı). Kilitli kısım her prompt'un sonuna kelimesi kelimesine aynı yapıştırılır, hiç değiştirilmez. Bu derste gördüğümüz Brand Kit, bu kilitli kısmın otomatik hali.\n2. Önce sadece sapan görseli düzeltiyorduk: onu tek referans olarak verip \"sadece renk sıcaklığını ve kontrastı diğer iki görsele uydur\" diyor, iki iyi görseli de stil referansı olarak ekliyorduk. Aynı sapma iki üç kez tekrar ederse sorun bloktaydı; o zaman bloğa eksik kararı ekleyip seriyi yeniden üretiyorduk. Brand Kit'teki \"marka dışı\" işareti bu ikinci adımın karşılığı.\n\nSıradaki ders: Yazı içeren görseller ve tipografi\n\n### Kaynaklar\n\n- [Magnific One – Art direction, built in](https://www.magnific.com/one)\n- [Magnific One prompting guide](https://www.magnific.com/prompts/magnific-one)\n- [Magnific Docs – Brand Kit](https://www.magnific.com/ai/docs/brand-kit)\n- [VentureBeat – Magnific One launches](https://venturebeat.com/orchestration/magnific-one-launches-to-give-teams-an-image-generator-that-avoids-the-ai-look-and-automatically-upholds-their-brand-kit)\n- [Eigen Radar – Choosing a draft and approving the final image in Magnific One](https://eigenradar.com/en/ai/ai-04/2026-10-09/)", "module": 3, "moduleName": "Tutarlılık", "n": 25, "summary": ["Magnific One önce görsele nasıl bakılacağına karar verip sonra üretir; kısa ve sade prompt'larda bile daha az yapay görünür.", "Taslak modunda 16 fikri yaklaşık tek görsel kredisine dene, sadece seçtiğin bir iki yönü Final'de 2K High üret.", "Brand Kit sadece Final modunda çalışır; taslakta renge değil, fikre ve kadraja bak.", "Stil görsellerini referans panelinde Style seçeneğiyle yükle; yoksa model içlerindeki nesneleri de kopyalar.", "Brand Kit tam font ve renk kodunu garanti etmez; yazıyı ve logoyu Auto Layers sonrası kendin eklersin."], "title": "Magnific One: taslak/final modları, stil referansı ve Brand Kit"}, {"checked": "Ekim 2026", "date": "11 Ekim 2026", "flow": {"edges": [{"a": "brief", "b": "bgp", "k": "f"}, {"a": "bgp", "b": "bg", "k": "txt", "l": "prompt"}, {"a": "brief", "b": "hp", "k": "txt", "l": "başlık metni"}, {"a": "bg", "b": "m1", "k": "img", "l": "referans"}, {"a": "bg", "b": "m2", "k": "img", "l": "referans"}, {"a": "bg", "b": "m3", "k": "img", "l": "referans"}, {"a": "hp", "b": "m1", "k": "txt"}, {"a": "hp", "b": "m2", "k": "txt"}, {"a": "hp", "b": "m3", "k": "txt"}, {"a": "m1", "b": "cmp", "k": "img"}, {"a": "m2", "b": "cmp", "k": "img"}, {"a": "m3", "b": "cmp", "k": "img"}, {"a": "cmp", "b": "fix", "k": "img", "l": "kazanan"}, {"a": "fix", "b": "ps", "k": "img"}, {"a": "ps", "b": "ext", "k": "img"}, {"a": "ext", "b": "out", "k": "img", "l": "2 ölçü"}], "groups": [{"c1": 0, "c2": 1, "label": "Hazırlık", "r1": 0, "r2": 1}, {"c1": 2, "c2": 3, "label": "Başlığı AI'a yazdır", "r1": 0, "r2": 2}, {"c1": 4, "c2": 5, "label": "Karşılaştır ve düzelt", "r1": 0, "r2": 0}, {"c1": 6, "c2": 7, "label": "Teslim", "r1": 0, "r2": 1}], "nodes": [{"c": 0, "id": "brief", "pv": {"items": ["AI'a: \"BAL ŞENLİĞİ\" (tek kısa başlık)", "Sana: 18-20 Ekim · Kent Meydanı + tadım cümlesi", "Gerçek dosyadan: markanın logosu"], "k": "list"}, "r": 0, "s": 1, "t": "brief", "text": "Hangi yazıyı kim yazacak, üretimden önce karar ver.", "title": "Yazıları üçe ayır"}, {"c": 1, "id": "bgp", "pv": {"k": "txt", "v": "A glass jar of golden honey with a wooden dipper on a rustic wooden table at an outdoor festival stall, warm low evening light from the left, 50mm. Jar in the lower half; top third calm, dark and empty, copy space. No text, no letters, no logos. 4:5"}, "r": 0, "s": 2, "t": "prompt", "text": "Üst üçte bir boş kalsın, kendiliğinden yazı çıkmasın.", "title": "Fon prompt'u"}, {"c": 1, "chips": ["Nano Banana 2", "4:5", "4 sonuç"], "id": "bg", "pv": {"ar": "4:5", "k": "img", "m": "🍯", "tag": "kavanoz altta, üstte boş koyu alan", "tone": "warm"}, "r": 1, "s": 2, "t": "gen", "text": "Üst kısmı en temiz olanı seç.", "title": "Yazı alanlı fon", "tool": "Görsel üretimi"}, {"c": 2, "id": "hp", "pv": {"k": "txt", "v": "Add the headline \"BAL ŞENLİĞİ\" in the empty area at the top of this image. Large bold condensed sans-serif, honey yellow color, centered. Keep the photo exactly as it is. Do not add any other text."}, "r": 0, "s": 3, "t": "prompt", "text": "Yazı tırnakta, büyük harf; yer, font tarifi ve renk ayrı ayrı.", "title": "Başlık prompt'u"}, {"c": 3, "chips": ["Nano Banana 2", "4:5"], "id": "m1", "pv": {"ar": "4:5", "k": "img", "m": "🍯", "tag": "BAL SENLIGI (Ş ve Ğ işaretleri yok)", "tone": "warm"}, "r": 0, "s": 3, "t": "gen", "text": "Kısa başlıkta güçlü, çok yazıda zorlanır.", "title": "Deneme 1", "tool": "Görsel referansla düzenleme"}, {"c": 3, "chips": ["GPT 2", "4:5"], "id": "m2", "pv": {"ar": "4:5", "k": "img", "m": "🍯", "tag": "BAL ŞENLİĞİ, harfler doğru", "tone": "warm"}, "r": 1, "s": 3, "t": "gen", "text": "Fotoğraf gerçekliğinde en doğru yazıyı hedefler.", "title": "Deneme 2", "tool": "Görsel referansla düzenleme"}, {"c": 3, "chips": ["Flux.1 Kontext Max", "4:5"], "id": "m3", "pv": {"ar": "4:5", "k": "img", "m": "🍯", "tag": "başlık iyi, L ile İ yapışık", "tone": "warm"}, "r": 2, "s": 3, "t": "gen", "text": "Yazı ve yerleşimde ince kontrol veren düzenleme modeli.", "title": "Deneme 3", "tool": "Görsel referansla düzenleme"}, {"c": 4, "id": "cmp", "pv": {"ar": "4:5", "items": [{"m": "🍯", "tag": "1: Ş/Ğ hatası", "tone": "warm"}, {"m": "🍯", "tag": "2: kazanan", "tone": "warm"}, {"m": "🍯", "tag": "3: aralık hatası", "tone": "warm"}], "k": "grid"}, "r": 0, "s": 4, "t": "compare", "text": "Her harf, Ş-İ-Ğ işaretleri, harf aralığı, kavanoz ve etiket bozulmuş mu.", "title": "Harf harf kontrol"}, {"c": 5, "chips": ["sadece hatalı harf", "2 deneme"], "id": "fix", "pv": {"k": "mask", "m": "🍯", "shape": "brush", "tag": "capital letter Ğ with a breve, same font", "tone": "warm"}, "r": 0, "s": 5, "t": "retouch", "text": "Bütün görseli değil, sadece işaretli harfi yeniden üret.", "title": "Tek harfi onar", "tool": "Parça düzeltme (inpaint)"}, {"c": 6, "chips": ["gerçek font", "orijinal logo"], "id": "ps", "pv": {"items": ["Logo (müşterinin SVG dosyası)", "18-20 Ekim · Kent Meydanı", "Yayla Balı standında tadım", "AI görseli + BAL ŞENLİĞİ"], "k": "layers"}, "r": 0, "s": 6, "t": "ps", "text": "Hiyerarşi: önce başlık, sonra tarih ve yer, en son tadım cümlesi.", "title": "Kalan yazılar + logo", "tool": "Photoshop"}, {"c": 7, "chips": ["9:16", "yazılar kapalı"], "id": "ext", "pv": {"items": ["4:5", "9:16"], "k": "ratios", "m": "🍯", "tone": "warm"}, "r": 0, "s": 7, "t": "expand", "text": "Önce görseli uzat, sonra yazıları güvenli alana yeniden yerleştir.", "title": "Hikaye ölçüsü", "tool": "Image Extender"}, {"c": 7, "end": true, "id": "out", "pv": {"items": ["Başlık 1 saniyede okunuyor mu?", "Türkçe harfler doğru mu?", "yaylabali_festival_post_4x5", "yaylabali_festival_story_9x16"], "k": "list"}, "r": 1, "s": 8, "t": "export", "text": "Telefonda bak, birine sesli okut, katmanlı PSD'yi sakla.", "title": "Kontrol ve teslim"}], "title": "Kısa başlığı AI yazar; fiyat, açıklama ve logo senin katmanında kalır"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Magnific One'daki Taslak (Draft) ve Final modları arasındaki fark neydi, kredi açısından neden önemliydi?\n2. Bir referans görseli \"Style\" olarak yüklemekle normal referans olarak yüklemek arasında ne fark vardı?\n\n### Konu\n\nBu derste ajans işinin belki de en can sıkıcı noktasına geliyoruz: görselin içindeki **yazı**. Bir festival afişi, maç günü posteri, ambalaj görseli, indirim afişi; hepsinde bir başlık, bir tarih, bir fiyat ya da bir logo var. Birkaç yıl önce AI modelleri harf yerine anlamsız şekiller çiziyordu. Bugün durum çok farklı: Magnific'teki bazı modeller kısa bir başlığı neredeyse kusursuz yazabiliyor. Ama \"neredeyse\" kelimesi müşteri işinde çok pahalı. Bir harfi yanlış bir afiş baskıya giderse sorun sende kalır.\n\nÖnce modelin yazıyı neden zor yazdığını anlayalım. Model kelimeleri okuyup yazan bir dizgi programı değil; harfleri de tıpkı bir kavanoz ya da yaprak gibi \"şekil\" olarak çiziyor. Kısa ve sık görülen bir kelimeyi (SALE, OPEN, COFFEE) çok düzgün çizer, çünkü binlerce kez görmüştür. Uzun cümlelerde, çok sayıda ayrı yazı bölgesinde ve özellikle **Türkçe karakterlerde** (İ, ı, ğ, ş, ç, ö, ü) hata ihtimali artar. \"EKİM\" yazarken İ'nin noktası kaybolabilir, \"ŞUBAT\"taki Ş'nin çengeli düşebilir. Kural basit: görselde ne kadar çok yazı bölgesi varsa o kadar çok hata şansı var. Başlık, alt başlık, fiyat ve tarih dört ayrı bölge demek; dördünün birden doğru çıkma ihtimali tek bir başlığa göre çok daha düşük.\n\nBu yüzden bu dersin ana fikri şu: **her yazıyı AI'a yazdırmak zorunda değilsin.** Bir görseldeki yazıları üç gruba ayırıyoruz:\n\n- **AI'ın yazacağı yazı:** Kısa, büyük, görselin bir parçası olan başlık. Özellikle yazının sahneyle iç içe olduğu durumlar: neon tabela, buğulu cama yazılmış kelime, pasta kremasıyla yazılmış harfler, 3D harflerden oluşan bir başlık. Bunu Photoshop'ta yapmak saatler alır; AI ise ışığı ve dokuyu otomatik oturtur.\n- **Senin koyacağın yazı:** Fiyat, tarih, adres, telefon, uzun açıklama, yasal not. Bunlar tek harf hatası kaldırmaz ve sık değişir. Bunları her zaman Photoshop ya da Illustrator'da gerçek fontla eklersin.\n- **Asla AI'a çizdirilmeyecek şey:** Müşterinin logosu. Logo bir çizim değil, markanın imzası. AI \"benzerini\" çizer ama aynısını değil. Gerçek logo dosyası her zaman en son, katman olarak eklenir.\n\nBunun yanında bir de **boşluk bırakma** tekniği var. Görseli üretirken prompt'a \"üst üçte bir boş kalsın, yazı için yer olsun\" dersen, sonradan oraya istediğin yazıyı koyabilirsin. Profesyonel reklam fotoğrafçıları da böyle çeker: buna İngilizcede \"copy space\" (yazı alanı) denir. Böylece hem AI'ın güzel ışığını alırsın, hem de yazı üzerinde tam kontrol sende kalır.\n\nModel seçimi de önemli. Magnific'in kendi model sayfasına göre yazı ve tipografide öne çıkanlar şunlar: **Ideogram 4.5** (temiz, okunaklı yazı ve yerleşim kontrolü; poster, ambalaj, reklam), **GPT 2** (fotoğraf gerçekliğinde çok doğru yazı), **Recraft V4.1** (tasarım düzeni ve tipografi hassasiyeti) ve düzenleme tarafında **Flux.1 Kontext Max** (yazı ve yerleşim üzerinde ince kontrol). Ağustos 2026'da yapılan bağımsız bir karşılaştırma da benzer bir tablo çiziyor: GPT Image 2 aynı görselde dört ve daha fazla yazı bölgesini temiz tutabilen tek model çıkmış; Nano Banana 2 ise fotoğraf gerçekliğindeki sahnelerde bir iki kısa yazıda iyi, üç ve üzeri bölgede hata yapmaya başlıyor. Önceki derste konuştuğumuz Magnific One'ın altında da GPT Image 2 çalıştığı biliniyor, yani o da yazıda güçlü bir seçenek. Önemli not: modeller her ay değişiyor. Bu yüzden ezber yerine yöntem öğreniyoruz: **aynı prompt'u 2-3 modelde dene, harf harf kontrol et, kazananı seç.**\n\nBenzetme: AI'a yazı yazdırmak, tabelacı ustaya tabela sipariş etmeye benzer. Usta \"KÖY FIRINI\" gibi iki kelimelik bir tabelayı harika yapar; ışığı, gölgeyi, eskitmeyi ustalıkla verir. Ama aynı ustaya menünün tamamını, fiyatları ve telefon numarasını elle yazdırırsan bir yerde mutlaka bir rakam kayar. Akıllı esnaf tabelayı ustaya yaptırır, fiyat listesini bilgisayardan basar, logosunu da matbaadan gelen orijinal dosyadan koyar. Biz de aynısını yapıyoruz.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Tipografi | Yazının görünüşüyle ilgili her şey: font seçimi, boyut, aralık, yerleşim | typography |\n| Başlık | Görseldeki en büyük, ilk okunan yazı | headline |\n| Gövde metni | Başlığın altındaki küçük açıklama yazıları | body copy |\n| Yazı alanı | Görselde yazı konsun diye bilerek boş bırakılan yer | copy space / negative space |\n| Serifli / serifsiz font | Harf uçlarında küçük çıkıntılar olan (klasik, şık) ya da olmayan (modern, sade) yazı tipi | serif / sans-serif |\n| Dar kalın font | Harfleri ince uzun, kalın; poster ve spor işlerinde sık kullanılan yazı tipi | bold condensed sans-serif |\n| Harf aralığı | İki harf arasındaki boşluk; AI'da en sık bozulan ayrıntılardan biri | kerning / letter spacing |\n| Yazı bölgesi | Görselde ayrı duran her yazı parçası (başlık, fiyat, tarih ayrı ayrı sayılır) | text region / text block |\n\n### Uygulama\n\nSenaryo: Yerel bir bal üreticisi \"Yayla Balı\", şehirde düzenlenecek bal festivalinde stant açıyor ve festival için hem 4:5 Instagram postu hem 9:16 hikaye istiyor. Görselde markanın kavanozu ve büyük bir başlık olacak: \"BAL ŞENLİĞİ\". Altında \"18-20 Ekim · Kent Meydanı\", \"Yayla Balı standında tadım\" cümlesi ve markanın logosu duracak. Başlığı AI'a yazdıracağız (içinde Ş, İ ve Ğ var, Türkçe karakter testi için ideal), gerisini biz koyacağız.\n\n1. **Yazıları ayır.** Üretime başlamadan önce kâğıda ya da notlara görseldeki bütün yazıları yaz ve üç gruba böl. AI'a giden: \"BAL ŞENLİĞİ\". Sana kalan: \"18-20 Ekim · Kent Meydanı\" ve tadım cümlesi. Gerçek dosyadan: logo (ve gerekirse kavanozun gerçek etiketi). Bu tek dakikalık iş, sonradan saatlerce düzeltme yapmanı engeller.\n2. **Yazı alanı bırakan fon görselini üret.** Magnific'te görsel üretimi aç, model olarak Nano Banana 2'yi seç, oranı 4:5 yap. Prompt'ta iki şey çok önemli: kavanozun görselin alt yarısında durması ve üst üçte birin \"boş, sakin, nesnesiz\" kalması. Bir de \"no text, no letters, no logos\" de; yoksa model kendiliğinden kavanoza ya da arka plana anlamsız yazılar koyabilir. 4 sonuç al, üst kısmı en temiz olanı seç.\n3. **Başlığı üç modelde dene.** Seçtiğin fon görselini referans olarak ver ve başlık prompt'unu yaz: yazıyı tırnak içinde, büyük harfle, tam olarak görünmesini istediğin şekilde yaz; yerini (üstte, ortada), font tarifini (dar, kalın, serifsiz), rengini (bal sarısı) söyle ve \"fotoğrafın geri kalanını olduğu gibi koru, başka yazı ekleme\" de. Aynı prompt'u ve aynı referansı Nano Banana 2, GPT 2 ve Flux.1 Kontext Max ile ayrı ayrı çalıştır. Font adı yazmak yerine fontu **tarif et**: model \"Bebas Neue\" adını tanımayabilir ama \"bold condensed sans-serif\" tarifini anlar.\n4. **Harf harf karşılaştır.** Üç sonucu yan yana koy ve kontrol listesini sırayla uygula: Her harf doğru mu? İ'lerin noktası yerinde mi? Kesme işareti (') doğru yerde mi? Harf aralıkları eşit mi, iki harf birbirine yapışmış mı? Kavanoz, etiketi ve ışık bozulmuş mu? En az hatalı olanı seç; tasarım olarak beğendiğin ama tek harfi hatalı olan da seçilebilir, çünkü bir sonraki adımda tek harf düzeltilebilir.\n5. **Tek hatalı harfi parça düzeltmeyle onar.** Modül 2'de öğrendiğimiz parça düzeltmeyi (inpaint) kullan: Magnific'te sadece hatalı harfin çevresini fırçayla işaretle, prompt'a o harfin ne olması gerektiğini yaz (örneğin noktası eksik İ için \"capital letter İ with a dot, same font, same color\"). Bütün görseli yeniden üretme; sadece maskeli bölge değişir. İki denemede düzelmezse o harfi Photoshop'ta elle onarmak daha hızlıdır.\n6. **Kalan yazıları ve logoyu Photoshop'ta ekle.** Görseli Photoshop'a al. Tarih ve yer bilgisini ve tadım cümlesini gerçek bir fontla ayrı katmanlar halinde yaz; başlığın fontuna yakın, ama daha ince bir aile seç ki hiyerarşi (önce başlık, sonra tarih ve yer, en son tadım cümlesi) net olsun. Logoyu müşterinin orijinal dosyasından (SVG ya da PNG) yerleştir. Katman sırası yukarıdan aşağıya: logo, tarih ve yer, tadım cümlesi, AI görseli (başlık dahil).\n7. **Hikaye ölçüsüne taşı.** 9:16 için yazı katmanlarını kapatıp sadece AI görselini Magnific'in görsel genişletme (Image Extender) aracıyla üstten ve alttan uzat. Sonra yazıları yeniden yerleştir; Instagram arayüzü üstte ve altta yaklaşık %14'lük alanı kapattığı için hiçbir yazıyı bu güvenli alanın dışına koyma.\n8. **Son kontrol ve teslim.** Görseli telefona at ve gerçek boyutta bak: başlık bir saniyede okunuyor mu, tarih ve yer seçiliyor mu? Bir de yazıyı müşteriye göndermeden önce birine sesli okut; göz kendi yazdığı hatayı görmez. Dosyaları \"yaylabali_festival_post_4x5\" ve \"yaylabali_festival_story_9x16\" diye adlandır, katmanlı PSD'yi de sakla; tarih ya da yer değişirse 30 saniyede güncellersin.\n\n### Örnek prompt'lar\n\n`A glass jar of golden honey with a wooden dipper on a rustic wooden table at an outdoor festival stall, a few honeycomb pieces around it, warm string lights softly blurred in the background, warm low evening light from the left, 50mm lens, shallow depth of field. The jar sits in the lower half; the top third is calm, dark and completely empty, clean copy space for a headline. No text, no letters, no logos. 4:5`\n\nKullanım yeri: Festival afişi için yazı alanı bırakan fon görseli. \"No text, no letters\" kısmı modelin kendiliğinden anlamsız yazı eklemesini engeller.\n\n`Add the headline \"BAL ŞENLİĞİ\" in the empty area at the top of this image. Large bold condensed sans-serif, honey yellow color, centered, letters softly lit by the warm light of the scene. Keep the photo, the jar and the lighting exactly as they are. Do not add any other text.`\n\nKullanım yeri: Hazır bir görsele başlık eklemek. Yazı tırnak içinde ve büyük harfle; yer, font tarifi, renk ve \"başka yazı ekleme\" kuralı tek tek söyleniyor.\n\n`Match day poster: a football flying toward the camera in a packed night stadium under bright floodlights, red and white smoke in the stands, dramatic low angle. Huge bold condensed 3D metallic headline \"MAÇ GÜNÜ\" at the top, slightly tilted, catching the stadium lights. Only this one text, nothing else written. 4:5`\n\nKullanım yeri: Maç günü posteri. Yazı sahnenin bir parçası (3D, ışığı yansıtan), bu yüzden AI'a yazdırmaya değer. Tarih, saat, rakip ve kulüp logosu Photoshop'ta eklenir.\n\n`Elegant jewelry ad: a thin gold necklace with a small pearl pendant on cream silk, soft diffused daylight, macro detail. Small refined serif text \"Yeni Koleksiyon\" in gold at the bottom center, wide letter spacing. Clean, minimal, lots of empty space. 4:5`\n\nKullanım yeri: Takı reklamı. Şık işlerde ince serifli font ve geniş harf aralığı istenir; küçük yazıda Türkçe karakterlerin (bu örnekte yok ama \"Işıltı\" gibi kelimelerde olur) mutlaka kontrol edilmesi gerekir.\n\n`Use the reference photo of the honey jar. Keep the label, the logo and every letter on the package exactly as in the reference; do not redraw, translate or change any text. Place the jar on a sunny kitchen counter next to a plate of warm toast, morning light, 35mm lens. 4:5`\n\nKullanım yeri: Gıda ambalajı için etiketli ürün görseli. Ürün fotoğrafı referans verilip etiketin \"olduğu gibi\" korunması isteniyor; yine de sonuçta etiket yazısını gerçek ürünle karşılaştır, gerekirse gerçek etiketi Photoshop'ta üstüne yerleştir.\n\n### Sık yapılan hatalar\n\n- **Her şeyi tek prompt'a yığmak.** Başlık, alt başlık, fiyat, tarih ve adresi tek seferde yazdırmaya çalışmak. Her yazı bölgesi ayrı bir hata şansı; AI'a sadece bir, en fazla iki kısa yazı ver, gerisini kendin koy.\n- **Türkçe karakteri kontrol etmeden teslim etmek.** İ'nin noktası, ğ'nin şapkası, ş ve ç'nin çengeli en sık kaybolan ayrıntılar. Teslimden önce her harfi tek tek oku; mümkünse başka birine sesli okut.\n- **Logoyu AI'a çizdirmek.** \"Logosu da görselde olsun\" deyip modelin benzer bir logo çizmesine izin vermek. Logo her zaman müşterinin orijinal dosyasından, en son katman olarak eklenir.\n- **Font adı yazıp aynısını beklemek.** \"Helvetica\" ya da \"Bebas Neue\" yazınca birebir o fontu alacağını sanmak. Model font adını bilmeyebilir; fontu tarif et (kalın, dar, serifsiz, yuvarlak köşeli). Birebir font gerekiyorsa o yazı zaten Photoshop'a aittir.\n\n### Profesyonel yöntem\n\nÜrün ve yazı işinde deneyimli ekiplerin kullandığı yöntem tek bir fikre dayanıyor: **karakter için ne yapıyorsan ürün için de onu yap.** Yani ürünü modele bir kere, her açıdan ve yazıları okunur şekilde \"öğret\", sonra hep aynı kaynaktan üret. Yazı ve logo bu işin en hassas parçası; model onları özellikle açı değiştiğinde ya da videoda hareket sırasında bozar. Bu yüzden profesyonel akışta yazı hiçbir zaman şansa bırakılmaz.\n\n1. **Ürün sayfası kur.** Elindeki ürün fotoğrafından başlayıp ürünü tek bir görselde birkaç açıdan gösteren bir sayfa hazırlanır. Tipik yerleşim beş karedir: etiket karesi, kuşbakışı, alttan görünüm, önden boydan ve arkadan boydan. Eksik açıları (arka, alt, üst) Magnific ile üretirsin. Sayfa hazır olunca model ürünü 360 derece tanır; sonraki her sahnede bu sayfayı referans verirsin. Bu yerleşim hazır bir kalıp değil, kendi ürününe göre uyarlanır: bir bal kavanozunda kapak ve etiket önemlidir, bir granola kutusunda arka yüzdeki içerik listesi.\n2. **Etiket karesini ayrıca çek.** Sayfanın en değerli karesi, ürünün ön ve arka etiketinin düz yatırılmış (flat lay), yazıları net okunur şekilde göründüğü karedir. Modele etiketi en net haliyle bir kere gösterirsen, sonraki sahnelerde yazıyı koruması çok kolaylaşır. Ambalaj yazısının önemli olduğu karelerde yakın çekim tercih edilir; geniş kadrajda etiket küçüldükçe harfler bozulur.\n3. **Sahne şablonu hep aynı sırayla yazılır.** Ürün çekimi prompt'ları sabit bir sırayı izler: görüntü türü, kompozisyon, mekan, ışık, kamera ve lens. Yazı talimatı bu sıranın en sonuna ayrı bir cümle olarak eklenir (\"Keep the label exactly as in the reference\" gibi). Böylece bir kampanyadaki bütün görseller aynı aileden çıkar, yazı kuralı da hiçbir prompt'ta unutulmaz.\n4. **Logo ve yazı en son, aynı şekilde basılır.** Logoyu AI'a çizdirmek yerine bütün sete sonradan, her görselde aynı boyut ve konumda eklenir. Büyütme gerekirse yazılı ve logolu işlerde detayı koruyan \"Precision\" tür büyütme seçilir; yeni detay uyduran \"Creative\" büyütme harfleri değiştirebilir.\n5. **Videoda yazıyı korumak.** Ürün videoya taşınacaksa logonun ve etiketin net göründüğü kareler başlangıç ve bitiş karesi yapılır, hareket kısa tutulur. Yine de bozulursa logo kurguda (After Effects'te) üstüne eklenir. Bozuk bir videonun temiz kısmından bir kare alıp yeni çekimin başlangıcı yapmak da sık kullanılan bir kurtarma yöntemidir.\n\nNeden işe yarar? Çünkü model yazıyı \"okumaz\", şekil olarak hatırlar. Ona doğru şekli ne kadar net ve ne kadar tutarlı gösterirsen o kadar az uydurur; uydurmasına izin verilmeyen yerleri (logo, fiyat, tarih) de baştan ondan alırsın.\n\n### Ödev\n\nGerçek bir ürünle ürün sayfası mantığını bu dersteki yazı yöntemiyle birleştiriyoruz. Süre 25-30 dakika.\n\n1. Etiketinde yazı olan gerçek bir ürün seç (reçel ya da bal kavanozu, granola kutusu, kozmetik şişesi; üzerinde çalıştığın bir müşteri ürünü olursa daha iyi). Etiketin net bir fotoğrafını çek.\n2. Son örnek prompt'u kullanarak bu ürünü bir sahneye yerleştir. Sonuçtaki etiket yazısını gerçek ürünle harf harf karşılaştır ve hataları not et.\n3. Aynı ürün için bir kampanya postu planla: görseldeki bütün yazıları \"AI'a / bana / gerçek dosyadan\" diye üç gruba ayır.\n4. Yazı alanı bırakan bir fon üret, sonra içinde en az bir Türkçe karakter olan kısa bir başlığı (örneğin \"KIŞA HAZIR\", \"YENİ SEZON\") aynı prompt'la iki farklı modelde dene. Hangisi harfleri daha doğru yazdı?\n5. Kazananda hatalı bir harf varsa parça düzeltmeyle onar, kalan yazıları ve logoyu Photoshop'ta ekle.\n\nBitince iki modelin başlık sonuçlarını ve bitmiş postu Claude'a göster ve şunu sor: \"Hangi harflerde hata var, yazı hiyerarşisi okunuyor mu, telefonda bir saniyede ne anlaşılıyor?\"\n\n### Tekrar sorularının cevapları\n\n1. Taslak modu tek prompt'tan 4, 8 ya da 16 farklı yön içeren bir ızgara veriyor ve bu ızgara yaklaşık tek bir görselin kredisine geliyor; yani fikir aşaması çok ucuz. Final ise seçtiğin tek yönü teslim kalitesinde üretiyor (varsayılan 2K High, kabaca 180 kredi). Taslakta bol dene, sadece beğendiğin bir iki görsel için Final'e kredi harca.\n2. Normal referansta model görseli içerik olarak okur; içindeki nesneleri (ürünü, masayı) alıp kullanır. Style olarak yüklersen sadece görünüşünü alır: renk, doku, teknik. 1 ile 5 arası görsel verilebiliyor, Magnific'in önerisi 2 görsel.\n\nSıradaki ders: Görseldeki yazıyı düzenleme ve çevirme: Ideogram 4.5\n\n### Kaynaklar\n\n- [Magnific Docs – Image models](https://www.magnific.com/ai/docs/image-ai-models)\n- [AIReiter – Best AI image model for text rendering 2026](https://aireiter.com/blog/best-ai-image-model-text-rendering-2026)", "module": 3, "moduleName": "Tutarlılık", "n": 26, "summary": ["AI harfleri şekil olarak çizer; yazı bölgesi arttıkça ve Türkçe karakter geldikçe hata ihtimali büyür.", "Yazıları üçe ayır: kısa başlığı AI yazar, tarih, fiyat ve açıklamayı sen eklersin, logo her zaman orijinal dosyadan gelir.", "Fon görselinde yazı için boş alan bırak ve prompt'a no text, no letters, no logos ekle.", "Aynı başlık prompt'unu 2-3 modelde dene, harf harf kontrol et, tek hatalı harfi parça düzeltmeyle onar.", "Ürün yazısını korumak için ürünü etiket karesi dahil bir ürün sayfasıyla modele bir kere net şekilde öğret."], "title": "Yazı içeren görseller ve tipografi"}, {"checked": "Ekim 2026", "date": "12 Ekim 2026", "flow": {"edges": [{"a": "brief", "b": "src", "k": "f"}, {"a": "src", "b": "tr", "k": "img", "l": "kaynak"}, {"a": "set", "b": "tr", "k": "f", "l": "ayarlar"}, {"a": "p1", "b": "tr", "k": "txt", "l": "prompt"}, {"a": "tr", "b": "chk", "k": "img", "l": "4 sonuç"}, {"a": "chk", "b": "en", "k": "img", "l": "kazanan = yeni kaynak"}, {"a": "p2", "b": "en", "k": "txt", "l": "prompt"}, {"a": "en", "b": "fix", "k": "img", "l": "tek hata"}, {"a": "chk", "b": "final", "k": "img", "l": "TR prompt"}, {"a": "fix", "b": "final", "k": "img", "l": "EN prompt"}, {"a": "final", "b": "ps", "k": "img"}], "groups": [{"c1": 0, "c2": 1, "label": "Hazırlık", "r1": 0, "r2": 1}, {"c1": 2, "c2": 3, "label": "1. tur: Türkçe", "r1": 0, "r2": 1}, {"c1": 4, "c2": 5, "label": "2. tur: Çeviri + düzeltme", "r1": 0, "r2": 1}, {"c1": 6, "c2": 7, "label": "Teslim", "r1": 0, "r2": 0}], "nodes": [{"c": 0, "id": "brief", "pv": {"items": ["Tahta: Kavurmalı Pide · Ekim'e özel → Yağlı Pide · Kasım'a özel", "Neon: KIYI PİDE → aynen kalır", "EN sürüm: Butter Pide · November special", "Fiyat + logo → sonra Photoshop"], "k": "list"}, "r": 0, "s": 1, "t": "brief", "text": "Her yazı için eski → yeni → kalacak mı.", "title": "Değişiklik listesi"}, {"c": 1, "chips": ["4:5", "en yüksek çözünürlük"], "id": "src", "pv": {"ar": "4:5", "k": "img", "m": "🫓", "tag": "vitrin: tebeşir menü tah
