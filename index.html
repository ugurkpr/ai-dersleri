tesi aşağı yukarı şu on soruyu sorar:\n\n1. Etiket ya da damga yazısı okunaklı ve doğru mu?\n2. Marka ve ürün renkleri doğru mu (sırın gerçek rengi kaymış mı)?\n3. Logo bozulmamış mı?\n4. Ürün yüzeye gerçekçi bir temas gölgesiyle oturuyor mu?\n5. Ölçek ve oran doğru mu?\n6. Cam, metal ve parlak sırda yansıma temiz mi?\n7. AI izi var mı (fazla parmak, eğrilmiş kenar, anlamsız desen)?\n8. Işık yönü her yerde tutarlı mı?\n9. Ürün keskin mi?\n10. Arka plan brief'e uygun mu?\n\nBu listeyi her işte aynı sırayla uygulamak, ekipte kimin rötuş yaptığından bağımsız olarak aynı kaliteyi sağlar. Listeyi bir kez yazıp herkesin kullandığı bir yere koymak yeterli.\n\nİkinci profesyonel alışkanlık, her kusur için aracı baştan seçmek: Tek pikselde kalan küçük lekeler için Photoshop'taki Clone Stamp (damga) ya da Content-Aware Fill çoğu zaman AI'dan daha hızlı ve kontrollüdür; daha büyük ve karmaşık kusurlarda AI araçları öne çıkar. Rötuş planı yaparken her kusurun yanına \"silinecek\", \"boyanacak\" ya da \"yamanacak\" diye not düşmek, hangi aracı açacağını önceden belirler.\n\nÜçüncüsü hibrit netleştirme: Deneyimli üreticiler bazen görselin geneli için daha fazla doku ekleyen Creative upscale, ürün, logo ve yüz için ise Precision upscale kullanır, sonra ikisini Photoshop'ta maskeyle birleştirir. Böylece arka plan zengin dokulu olurken ürün ve damga birebir korunur. Bu, özellikle seramik gibi dokusu önemli ürünlerde işe yarar; ama emin değilsen tamamen Precision ile kalmak her zaman güvenli yoldur.\n\n### Ödev\n\nÜzerinde çalıştığın ya da yakında gelecek bir işten gerçek bir ürün fotoğrafı seç; uygun bir görsel yoksa Magnific'te bilerek kusurlu bir el yapımı ürün fotoğrafı üret (seramik kupa, tabak, vazo ya da mum).\n\n1. Önce kusur listesini çıkar; ürünün kendi doğal özelliklerini (el yapımı izler gibi) listeden ayır.\n2. Dört katmanlı rötuşu uygula: Eraser ile temizlik, Retouch ile en az bir \"yerine koy\" düzeltmesi, Adjust panelinde beyaz dengesi ve pozlama, en son Precision upscale.\n3. Fotoğrafta insan varsa Skin Enhancer'ı Faithful ve Flexible ile karşılaştır.\n4. Aynı kusurlardan birini Photoshop'ta Remove tool ile de temizle ve iki sonucu kıyasla. Son olarak sonucu yukarıdaki on maddelik kontrol listesinden geçir.\n5. Toplam 20-30 dakika ayır. Orijinali, sonucu ve kusur listeni Claude'a göster; ürünün değişip değişmediği, kalan kusurlar ve rötuşun fazla kaçıp kaçmadığı üzerine yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Mekân ve manzara fotoğraflarında. Change background açıkken AI arka planı yeni ışığa göre baştan üretir; mekânın kendisi fotoğrafın konusuysa mekân değişir ve artık o yer olmaz. Ürün ve portrede açık bırakılır.\n2. Işığın yanlış yönden gelmesi ve nesnenin altında temas gölgesi olmaması. Fonda ışık soldan geliyorsa üründeki parlama da solda olmalı; yüzeye oturan nesnenin altında kısa, koyu bir gölge olmalı.\n\nSıradaki ders: E-ticaret ve reklam için ürün görseli\n\n### Kaynaklar\n\n- [Magnific: Image Editor dokümanı](https://www.magnific.com/ai/docs/image-editor)\n- [Magnific: AI Object Remover](https://www.magnific.com/ai/remove-objects)\n- [Magnific: Skin Enhancer ile plastik cildi düzeltmek](https://www.magnific.com/blog/how-to-fix-plastic-skin-ai-skin-enhancer/)\n- [Adobe: Photoshop'ta kablo, insan ve dikkat dağıtan şeyleri kaldırma](https://helpx.adobe.com/photoshop/desktop/repair-retouch/remove-objects-fill-space/remove-wires-people-distractions.html)\n", "module": 2, "moduleName": "Görseli kontrol etmek", "n": 16, "summary": ["Rötuş, fotoğrafı yeniden üretmeden temizler ve güzelleştirir; ürünün kendisi asla değişmez.", "Sıra her zaman aynıdır: önce temizlik, sonra ışık ve renk, sonra güzelleştirme, en son upscale.", "Işık ve renk düzeltmesi için Adjust paneli yeter, kredi harcamaz; ürün netleştirmede Precision upscale kullan.", "Aşırı rötuştan kaçın: biraz doku ve gren bırak, el yapımı ürünün doğal izlerini silme.", "Teslimden önce logo, renk, gölge, ışık yönü ve keskinliği bir kontrol listesiyle gözden geçir."], "title": "Rötuş ve ürün fotoğrafı iyileştirme"}, {"checked": "Ekim 2026", "date": "7 Ekim 2026", "flow": {"edges": [{"a": "brief", "b": "clean", "k": "f"}, {"a": "clean", "b": "sheet", "k": "ref", "l": "dekupe ürün"}, {"a": "sheet", "b": "pack", "k": "ref", "l": "referans"}, {"a": "sheet", "b": "scale", "k": "ref", "l": "referans"}, {"a": "sheet", "b": "life", "k": "ref", "l": "referans"}, {"a": "tpl", "b": "scale", "k": "txt", "l": "prompt"}, {"a": "tpl", "b": "life", "k": "txt", "l": "prompt"}, {"a": "sheet", "b": "hero", "k": "ref", "l": "referans"}, {"a": "hero", "b": "ext", "k": "img"}, {"a": "ext", "b": "chk", "k": "img", "l": "3 ölçü"}, {"a": "pack", "b": "chk", "k": "f"}, {"a": "chk", "b": "up", "k": "f"}], "groups": [{"c1": 0, "c2": 1, "label": "Hazırlık", "r1": 0, "r2": 0}, {"c1": 2, "c2": 2, "label": "Ürün kimliği", "r1": 0, "r2": 0}, {"c1": 3, "c2": 4, "label": "Beş görsellik set", "r1": 0, "r2": 3}, {"c1": 5, "c2": 7, "label": "Teslim", "r1": 0, "r2": 0}], "nodes": [{"c": 0, "id": "brief", "pv": {"items": ["His: temiz, sakin, doğal ama premium", "Palet: kırık beyaz, adaçayı, açık ahşap", "Set: packshot, detay, ölçek, lifestyle, hero"], "k": "list"}, "r": 0, "s": 1, "t": "brief", "title": "Brief'i sabitle"}, {"c": 1, "id": "clean", "pv": {"k": "cutout", "m": "🫙"}, "r": 0, "s": 2, "t": "bg", "text": "Bundan sonraki her şeyin ana referansı.", "title": "Temizle ve dekupe", "tool": "Retouch + Background Remover"}, {"c": 2, "chips": ["Nano Banana 2", "referans"], "id": "sheet", "pv": {"ar": "1:1", "items": [{"m": "🫙", "tag": "önden", "tone": "white"}, {"m": "🫙", "tag": "yandan", "tone": "white"}, {"m": "🫙", "tag": "kapak açık", "tone": "white"}, {"m": "🫙", "tag": "etiket", "tone": "white"}], "k": "grid"}, "r": 0, "s": 3, "t": "ref", "text": "Gerçek ürünle karşılaştır; yanlış açıyı çıkar.", "title": "Ürün sayfası"}, {"c": 3, "id": "pack", "pv": {"ar": "1:1", "k": "img", "m": "🫙", "tag": "saf beyaz fon + temas gölgesi", "tone": "white"}, "r": 0, "s": 4, "t": "gen", "text": "Çoğu zaman rötuş + dekupe yeter.", "title": "Packshot"}, {"c": 3, "id": "scale", "pv": {"ar": "4:5", "k": "img", "m": "🫙", "tag": "sahne şablonu", "tone": "warm"}, "r": 1, "s": 5, "t": "gen", "title": "Ölçek: avuç içinde"}, {"c": 3, "id": "life", "pv": {"ar": "4:5", "k": "img", "m": "🫙", "tag": "lavabo kenarı, havlu yanında", "tone": "white"}, "r": 2, "s": 5, "t": "gen", "text": "Işık ve kamera iki prompt'ta aynı.", "title": "Lifestyle"}, {"c": 2, "id": "tpl", "pv": {"items": ["görüntü türü", "kompozisyon", "mekan", "ışık", "kamera ve lens"], "k": "list"}, "r": 1, "s": 5, "t": "prompt", "text": "Sadece mekan ve aksiyon değişir.", "title": "Sahne şablonu"}, {"c": 4, "chips": ["Relight"], "id": "hero", "pv": {"ar": "4:5", "k": "img", "m": "🫙", "tag": "tek spot, ıslak taş, sağda başlık boşluğu", "tone": "dark"}, "r": 0, "s": 6, "t": "relight", "title": "Hero görseli"}, {"c": 5, "id": "ext", "pv": {"items": ["4:5", "9:16", "16:9"], "k": "ratios", "m": "🫙", "tone": "dark"}, "r": 0, "s": 7, "t": "expand", "title": "Ölçülere taşı", "tool": "Image Extender"}, {"c": 6, "id": "chk", "pv": {"items": ["Kavanoz şekli", "Kapak rengi ve dokusu", "Etiket yazısı", "Krem rengi"], "k": "list"}, "r": 0, "s": 8, "t": "ps", "title": "Logo ve detay kontrolü", "tool": "Photoshop"}, {"c": 7, "chips": ["Precision"], "end": true, "id": "up", "pv": {"items": ["markaadi_urunadi_packshot_1x1", "Tarif kartı: Ürün seti"], "k": "list"}, "r": 0, "s": 9, "t": "upscale", "title": "Bitir"}], "title": "Gerçek ürün referans olur; AI sadece sahneyi, ışığı ve açıyı kurar"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Rötuşta doğru sıra nedir ve upscale neden en sona bırakılır?\n2. Magnific Image Editor'da Eraser ile Retouch arasındaki fark nedir; hangisini ne zaman kullanırsın?\n\n### Konu\n\nŞimdiye kadar görseli tek tek kontrol etmeyi öğrendik: ışık, kamera, referans, inpaint, expand, arka plan, relight, rötuş. Bu derste bunların hepsini tek bir gerçek iş için birleştiriyoruz: bir ürünü satmak için gereken görsel setini AI ile çıkarmak. Ajansa en sık gelen işlerden biri bu: \"Ürünün fotoğrafı var ama kötü; sitemize, pazar yeri mağazamıza ve Instagram reklamımıza görsel lazım.\"\n\nÖnce iki dünyayı ayıralım. E-ticaret görseli bilgi verir: ürün nasıl görünüyor, rengi ne, arkası nasıl, boyutu ne kadar. Sade, net, dürüst olmalı. Reklam görseli his verir: bu ürün bana nasıl bir hayat vaat ediyor? Işık, mekan, atmosfer ve hikâye öndedir. İyi bir ürün seti ikisini de içerir.\n\nBenzetme: Bir ev satışını düşün. İlan sayfasındaki fotoğraflar (her oda, kat planı, banyo) e-ticaret görselidir; alıcı \"ne alıyorum\" diye bakar. Emlakçının vitrindeki gün batımında çekilmiş balkon fotoğrafı ise reklam görselidir; \"orada oturmak istiyorum\" dedirtir. Ev ikisinde de aynı ev olmak zorunda. Biri bile başka bir ev gösterirse müşteri kandırılmış olur.\n\nBir ürün seti genelde şu görsellerden oluşur:\n\n1. Packshot (ana görsel): Beyaz ya da çok sade fonda, önden, ürünün tamamı. Amazon gibi büyük pazar yerleri ana görselde saf beyaz fon ister ve ürünün karenin büyük kısmını (yaklaşık %85) kaplamasını bekler.\n2. Açı görselleri: Arkadan, yandan, üstten. Müşteri ürünü elinde çeviriyormuş gibi görmeli.\n3. Detay (makro) görseli: Doku, dikiş, etiket, kapak, pompa. Kaliteyi gösteren yakın plan.\n4. Ölçek görseli: Ürün avuç içinde, masada, bir lavabonun kenarında. \"Ne kadar büyük?\" sorusunun cevabı.\n5. Lifestyle (yaşam) görseli: Ürün kullanıldığı ortamda: nemlendirici banyo rafında, spor ayakkabı koşu yolunda, kahve makinesi mutfakta.\n6. Hero / kampanya görseli: Reklamın yıldızı. Dramatik ışık, güçlü kompozisyon, başlık için boş alan.\n\nBu derste en önemli kural şu: AI'a ürünü uydurtma, ürünü göster. Ürünü sadece yazıyla tarif edersen AI \"benzer\" bir ürün çizer; logo, şekil, renk tonu kayar. Doğru yol, gerçek ürün fotoğrafını referans olarak vermek ve AI'a sadece sahneyi, ışığı ve açıyı yaptırmak. Bu, Ders 10'daki referans görsel, Ders 14'teki arka plan ve relight, Ders 16'daki rötuşun birleştiği yer.\n\nProfesyonel ekiplerin bu işteki yöntemi de tam olarak bunun üzerine kurulu: önce ürünün \"kimlik kartını\" çıkarırsın (ürün sayfası), sonra her sahneyi aynı sırayla yazılan bir şablonla üretirsin. Böylece bir kampanyadaki on görsel, on farklı fotoğrafçının işi gibi değil, aynı çekimin kareleri gibi durur.\n\nÜrün sayfası (product sheet), ürünün tek görselde birkaç açıdan görünümüdür: etiket, üstten, alttan, önden boydan, arkadan boydan. Bunu bir kere düzgün çıkarırsan sonraki her üretimde referans olarak kullanırsın; model ürünü 360 derece \"tanır\". Eksik açıları (çoğu müşteri sadece önden fotoğraf gönderir) Magnific'te referans görsel kabul eden bir modelle üretebilirsin. Ama üretilen açılar mutlaka gerçek ürünle karşılaştırılmalı; müşteri onaylamadan \"arkası böyle\" diye yayınlanmaz.\n\nSahne şablonu ise her ürün prompt'unu aynı sırayla yazmaktır: görüntü türü → kompozisyon → mekan → ışık → kamera ve lens. Sadece mekanı ya da ışığı değiştirirsin, gerisi sabit kalır. Bu, Ders 2'deki prompt anatomisinin ürün işine uyarlanmış hâli.\n\nMagnific'te bu işte kullanacağın araçlar:\n\n- AI Image Generator: Referans görsel kabul eden modellerle (örneğin Nano Banana 2) ürünü yeni sahnelere yerleştirmek. 1K, 2K ya da 4K çıktı seçebilirsin.\n- Background Remover: Ürünü dekupe etmek, beyaz fon packshot'ı hazırlamak.\n- Relight: Ürünü yerleştirdiğin sahnenin ışığına uydurmak.\n- Image Extender (Expand): Aynı görseli kare, dikey (story) ve yatay (banner) ölçülere taşımak.\n- Mockup Generator: Ambalaj, tişört, telefon ekranı gibi yüzeylere tasarım yerleştirmek.\n- Image Editor + Upscaler: Son rötuş ve Precision upscale.\n\nYazı ve logo meselesi: AI hâlâ küçük yazıları ve logoları bozmaya meyillidir. Cilt bakım ürünlerinde bu daha da önemli, çünkü etikette içerik, ml bilgisi ve marka adı yazar. Çözüm basit: etiketi AI'ın ürettiği hâliyle bırakma. Sonucu Photoshop'ta orijinal ürün fotoğrafının üstüne koy, etiketi orijinalden maskeyle geri getir ya da logoyu vektörden yeniden yerleştir. Müşterinin logosu tek piksel bile değişmemeli.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Packshot | Sade (genelde beyaz) fonda, ürünün tamamını önden gösteren ana ürün fotoğrafı | packshot, product shot on white background |\n| Lifestyle görseli | Ürünün kullanıldığı gerçek hayat ortamında gösterildiği görsel | lifestyle shot, in-context product photo |\n| Hero görseli | Kampanyanın ana, en etkileyici görseli; genelde başlık için boş alan bırakılır | hero shot, hero image |\n| Ürün sayfası | Aynı ürünün tek görselde birkaç açıdan görünümü; AI için ürünün kimlik kartı | product reference sheet, object reference sheet |\n| Flat lay | Ürünlerin bir yüzeye dizilip tam tepeden çekildiği kompozisyon | flat lay, top-down view |\n| Dekupe | Ürünü arka plandan temiz şekilde ayırmak | cutout, background removal |\n| Temas gölgesi | Ürünün oturduğu yüzeye düşen, onu \"yere basıyor\" gibi gösteren kısa koyu gölge | contact shadow, grounded shadow |\n| Negatif alan | Görselde yazı ve logo için bilerek boş bırakılan alan | negative space, copy space |\n\n### Uygulama\n\nSenaryo: Yerel bir cilt bakım markası, yeni nemlendirici kremi için e-ticaret sitesi, pazar yeri mağazası ve Instagram reklamı istiyor. Ürün buzlu cam bir kavanozda, ahşap kapaklı ve ön yüzünde marka etiketi var. Elinde sadece telefonla, mutfak masasında çekilmiş tek bir önden fotoğraf var. Hedef: 1 packshot, 1 detay, 1 ölçek (avuç içinde), 1 lifestyle ve 1 hero görseli; hepsi aynı ürün, aynı marka hissi.\n\n1. Brief'i sabitle: İşe başlamadan bir not aç ve üç şeyi yaz: marka hissi (ör. \"temiz, sakin, doğal ama premium\"), renk paleti (ör. kırık beyaz, adaçayı yeşili, açık ahşap) ve görsel listesi (yukarıdaki beş görsel). Bu not, profesyonel ekiplerin kullandığı \"ön hazırlık panosu\" mantığının küçük hâli; istersen Magnific Spaces'te bir sayfa açıp oraya koy.\n2. Orijinali temizle: Ders 16'daki gibi önce rötuş: toz, parmak izi, sarı ışık. Sonra Background Remover ile kavanozu dekupe et. Bu temiz, dekupe görsel bundan sonraki her şeyin ana referansı. Orijinali ayrı klasörde sakla.\n3. Ürün sayfasını çıkar: AI Image Generator'da referans görsel kabul eden bir model seç (Nano Banana 2 gibi), dekupe görseli referans olarak yükle ve aynı kavanozun beyaz fonda önden, yandan, kapağı açık hâlde tepeden ve etiket yakın planı görünüşünü tek görselde istemeyi dene. Çıkan açıları gerçek ürünle karşılaştır; yanlış olan açıyı sayfadan çıkar. Emin olmadığın açıyı (ör. arka etiket) müşteriye sor ya da gerçek fotoğrafını iste.\n4. Packshot: Dekupe görseli saf beyaz fona yerleştir, ürün karenin büyük kısmını kaplasın. Altına hafif bir temas gölgesi ekle (Photoshop'ta ya da Relight ile). Bu görsel için yeni üretim bile gerekmeyebilir; çoğu zaman temiz rötuş + dekupe yeterli.\n5. Lifestyle ve ölçek: Ürün sayfasını referans verip sahne şablonuyla yaz: görüntü türü → kompozisyon → mekan → ışık → kamera. İlk görseli bir avuç içinde (ölçek), ikincisini banyo lavabosunun kenarında, katlanmış beyaz havlunun yanında (lifestyle) üret. Sadece mekan ve aksiyon değişsin; ışık ve kamera kısmını iki prompt'ta da aynı bırak.\n6. Hero: Kampanya görselinde dramatik ışık (ör. tek spot, ıslak taş yüzey, su damlaları) ve başlık için sağda ya da üstte negatif alan iste. Kavanoz Relight ile sahnenin ışığına uymuyorsa düzelt: buzlu camdaki parlamalar ışığın geldiği yönde olmalı.\n7. Ölçülere taşı: Hero görselini Image Extender ile 4:5 (Instagram akışı), 9:16 (story) ve 16:9 (site banner) yap. Ürünü kesmeden, sadece fonu genişlet.\n8. Logo ve detay kontrolü: Her görseli Photoshop'ta orijinal ürün fotoğrafıyla yan yana koy. Kavanozun şekli, kapağın rengi ve ahşap dokusu, etiket yazısı, kremin rengi aynı mı? Etiket bozulduysa orijinalden maskeyle geri getir.\n9. Son: Precision upscale ile netleştir ve dosyaları \"markaadi_urunadi_packshot_1x1\" gibi düzenli isimlerle kaydet. Kullandığın prompt'ları tarif kartına \"Ürün seti\" başlığıyla not et; bir sonraki ürün için sadece referansı değiştirmen yetecek.\n\n### Örnek prompt'lar\n\nBu prompt'ların hepsi ürün fotoğrafını referans görsel olarak yüklediğini varsayar. Prompt ürünü uzun uzun tarif etmez; \"the product from the reference\" der ve asıl işi sahneye, ışığa ve kameraya bırakır.\n\n`product photography, the frosted glass moisturizer jar with wooden lid from the reference image, centered on a pure white seamless background, soft even studio lighting, subtle contact shadow, front view, 100mm macro lens, sharp focus, e-commerce packshot`\n\nKullanım yeri: Cilt bakım e-ticaret ana görseli. Pazar yeri için temiz packshot. \"pure white seamless background\" fonu dikişsiz bembeyaz ister; \"subtle contact shadow\" ürünün havada uçuyormuş gibi durmasını engeller.\n\n`lifestyle product photography, the moisturizer jar from the reference image on the edge of a white bathroom sink next to a folded white towel and a small eucalyptus sprig, morning sunlight from a window on the left, soft steam in the air, eye level, 50mm lens, calm clean tones`\n\nKullanım yeri: Cilt bakım lifestyle görseli; ürün sayfasının ikinci ya da üçüncü karesi, Instagram akışı. Işığın yönünü (left) yazmak, sonradan relight gerektiğinde işini kolaylaştırır.\n\n`advertising hero shot, the perfume bottle from the reference image standing on a dark wet stone surface, single dramatic spotlight from above, soft reflections, deep black background, large empty space on the right for headline text, low angle, 85mm lens, luxury mood`\n\nKullanım yeri: Ürün reklamı (parfüm ya da kozmetik). Kampanyanın ana görseli. \"large empty space on the right for headline text\" başlık için negatif alan bırakır; tasarımı sonra Photoshop'ta kurarsın.\n\n`flat lay product photography, the sneakers from the reference image arranged with a football, a team scarf and a match ticket on green turf, top-down view, bright even daylight, crisp shadows, bold sporty colors`\n\nKullanım yeri: Maç günü kampanyası; bir spor mağazasının maç haftası paylaşımı. Flat lay, birden fazla ürünü tek karede düzenli göstermenin en kolay yolu.\n\n`close-up macro product photography, the open moisturizer jar from the reference image with a smooth swirl of white cream on the surface and a small cream swatch beside it, shallow depth of field, soft side light revealing the cream texture, neutral sage green background`\n\nKullanım yeri: Cilt bakım detay görseli. Kremin dokusunu ve kalitesini gösteren yakın plan. \"shallow depth of field\" (sığ alan derinliği) gözü tek detaya kilitler.\n\n### Sık yapılan hatalar\n\n- **Ürünü yazıyla tarif edip referans vermemek.** AI \"benzer\" bir ürün çizer; kavanozun kapağı, pompanın şekli, logonun harfleri değişir. Her zaman gerçek ürün fotoğrafını referans ver.\n- **AI'ın ürettiği açıları kontrol etmeden yayınlamak.** Ürünün arkasını ya da altını AI tahmin eder; müşteri gerçek ürünü aldığında farklı çıkarsa bu iade ve güven kaybı demek. Üretilen her açıyı müşteriye onaylat.\n- **Setteki görsellerin birbirini tutmaması.** Biri sıcak, biri soğuk ışık; biri 35mm, biri 85mm. Sahne şablonunu kullan, ışık ve kamera kısmını sabit tut, sadece mekanı değiştir.\n- **Logo ve etiketi AI'a bırakmak.** Küçük yazılar neredeyse her zaman bozulur. Son adımda orijinalden maskeyle geri getir ya da vektörden yeniden koy.\n\n### Profesyonel yöntem\n\nProfesyonel ürün ekipleri işe \"güzel bir görsel üretelim\" diye değil, \"ürünü sabitleyelim\" diye başlar. Mantık, karakter tutarlılığında yapılanın aynısı: önce ürünün her açıdan göründüğü bir kimlik kartı kurulur, sonra her sahnede bu kart referans olarak verilir. Model ürünü bir kere 360 derece \"tanıyınca\" yeni sahnelerde kapağı, etiketi ya da şişenin boyunu uydurmaya çok daha az ihtiyaç duyar.\n\nÜrün sayfası için sektörde sık önerilen yerleşim beş karelidir:\n\n1. Etiket, düz yatırılmış: Ön ve arka etiket, yazılar okunur şekilde. Logonun ve yazının \"doğru hâli\" burada durur.\n2. Kuşbakışı: Ürünün tepeden görünüşü (kavanozun kapağı, şişenin ağzı).\n3. Alttan: Alt yüz; ürün eğik ya da elde gösterilecekse işe yarar.\n4. Boydan önden: Ürünün tamamı önden.\n5. Boydan arkadan: Ürünün tamamı arkadan.\n\nBu yerleşim hazır bir kalıp değil; kendi ürününe göre uyarlarsın. Bir krem kavanozunda \"alttan\" kare çok önemli değilse yerine \"kapağı açık, krem görünür\" kareyi koyabilirsin. Önemli olan, sahnede ihtiyaç duyacağın her yüzün sayfada bir kere doğru hâliyle bulunması.\n\nİkinci adım sahne şablonu. Her prompt aynı sırayla yazılır: görüntü türü → kompozisyon → mekan → ışık → kamera ve lens. Neden işe yarıyor? Çünkü sıra sabit kalınca neyin değiştiğini net görürsün. Banyo sahnesinden taş yüzey sahnesine geçerken sadece \"mekan\" satırı değişir; ışık ve lens aynı kalır, böylece iki görsel aynı çekim gününden çıkmış gibi durur. Pratik bir ipucu: beğendiğin bir ürün fotoğrafını (rakip markanın reklamı, bir dergi sayfası) Claude'a ver ve \"bunun prompt'unu bu sıraya göre çıkar\" de. Elinde tekrar tekrar kullanabileceğin bir tarif olur; sadece ürünü ve mekanı değiştirirsin.\n\nÜçüncüsü, setin omurgası olan dört temel kare: beyaz fon (e-ticaret ana görseli), gradyan ya da stüdyo fonu (premium his), yüzey ya da kahraman karesi (dokunun ve temas gölgesinin göründüğü, ürünün bir yüzeye oturduğu kare) ve lifestyle (ürün kullanım anında). Bir müşteriye \"neler çıkaracağız\" diye anlatırken bu dördü iyi bir başlangıç listesidir.\n\nSon olarak teslimden önce kısa bir kalite kontrol listesinden geç. Deneyimli üreticilerin kullandığı on madde şunlar: etiket yazısı okunaklı ve doğru mu, marka renkleri doğru mu, logo bozulmamış mı, temas gölgesi gerçekçi mi, ölçek ve oran doğru mu, cam ve metalde yansıma temiz mi, AI izi (eğrilmiş kenar, fazla parmak) var mı, ışık yönü tutarlı mı, ürün keskin mi, arka plan brief'e uygun mu. Yazı ve logo için ek kural: logonun net göründüğü kareleri koru; bu görselleri ileride videoya çevireceksen logonun net olduğu kareyi başlangıç ve bitiş karesi yap, hareketi kısa tut, gerekirse logoyu kurguda (After Effects) sonradan ekle.\n\n### Ödev\n\nElinde fotoğrafı olan gerçek bir ürün seç: üzerinde çalıştığın ya da yakında gelecek bir işten bir cilt bakım ürünü (krem, tonik, serum) ideal; yoksa evdeki bir krem kavanozu, şampuan şişesi ya da parfüm de olur. Telefonla tek bir önden fotoğraf çek. Sonra:\n\n1. Rötuş ve dekupe yap (10 dk).\n2. Magnific'te referans görselle ürün sayfasını çıkar: en az önden, yandan, üstten ve bir detay (etiket ya da doku). Gerçek ürünle karşılaştır, yanlış açıları not et (10 dk).\n3. Sahne şablonuyla aynı ürünü iki farklı mekanda üret: bir beyaz fon packshot, bir lifestyle (ör. banyo rafı). Işık ve kamera kısmı iki prompt'ta da aynı kalsın (10 dk).\n\nToplam 25-30 dakika. Orijinal fotoğrafı, ürün sayfasını ve iki sahneyi Claude'a göster; ürünün değişip değişmediği, iki görselin aynı setten gibi durup durmadığı ve packshot'ın pazar yeri için uygun olup olmadığı üzerine yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Önce temizlik, sonra ışık ve renk, sonra güzelleştirme, en son upscale. Upscale başa alınırsa toz ve çizikler de büyür ve netleşir; sonra daha büyük bir dosyada daha zor temizlersin.\n2. Eraser seçtiğin alanı prompt yazmadan siler ve çevresine bakarak doldurur; toz, kırıntı, kablo gibi küçük kusurlar için. Retouch'ta alanı seçip oraya ne olması gerektiğini yazarsın; \"yerine şunu koy\" demek istediğinde, örneğin çizikli bir yüzey yerine pürüzsüz bir yüzey.\n\nSıradaki ders: Kutu çizerek kompozisyon kontrolü: FLUX 3 ile yerleşimi belirlemek\n\n### Kaynaklar\n\n- [Magnific: ürün ve e-ticaret araçları](https://www.magnific.com/ai/product)\n- [Magnific: Nano Banana 2](https://www.magnific.com/nano-banana/nano-banana-2)", "module": 2, "moduleName": "Görseli kontrol etmek", "n": 17, "summary": ["E-ticaret görseli ürünü dürüstçe gösterir, reklam görseli his verir; iyi bir ürün seti ikisini de içerir.", "Ürünü yazıyla tarif etme; gerçek fotoğrafını referans ver, AI'a sadece sahneyi, ışığı ve açıyı yaptır.", "Önce ürünün birkaç açıdan göründüğü bir ürün sayfası çıkar ve AI'ın ürettiği her açıyı gerçek ürünle karşılaştır.", "Her prompt'u aynı sırayla yaz: görüntü türü, kompozisyon, mekan, ışık, kamera; setin tutarlı olması için ışık ve kamerayı sabit tut.", "Etiket ve logoyu AI'a bırakma; son adımda Photoshop'ta orijinal fotoğraftan ya da vektörden geri getir."], "title": "E-ticaret ve reklam için ürün görseli"}, {"checked": "Ekim 2026", "date": "7 Ekim 2026", "flow": {"edges": [{"a": "brief", "b": "sketch", "k": "f"}, {"a": "sketch", "b": "claude", "k": "img", "l": "kroki"}, {"a": "grid", "b": "claude", "k": "ref", "l": "kural"}, {"a": "claude", "b": "draft", "k": "txt", "l": "kutu listesi"}, {"a": "caption", "b": "draft", "k": "txt", "l": "sahne cümlesi"}, {"a": "draft", "b": "check", "k": "img"}, {"a": "check", "b": "edit", "k": "img", "l": "seçilen taslak"}, {"a": "check", "b": "story", "k": "f", "l": "yeni oran"}, {"a": "edit", "b": "final", "k": "img"}, {"a": "final", "b": "ps", "k": "img"}, {"a": "story", "b": "ps", "k": "img", "l": "9:16"}], "groups": [{"c1": 0, "c2": 2, "label": "Hazırlık", "r1": 0, "r2": 1}, {"c1": 3, "c2": 4, "label": "Taslak tur", "r1": 0, "r2": 0}, {"c1": 5, "c2": 5, "label": "Revizyon", "r1": 0, "r2": 1}, {"c1": 6, "c2": 7, "label": "Teslim", "r1": 0, "r2": 0}], "nodes": [{"c": 0, "chips": ["16:9", "site banner"], "id": "brief", "pv": {"items": ["Başlık: ERKEN REZERVASYON (sol üstte)", "Şezlong ve şemsiye sağda, havuz sol altta", "Başlığın altında alt başlık + buton alanı", "Ek iş: 9:16 story"], "k": "list"}, "r": 0, "s": 1, "t": "brief", "text": "Sadece yeri önemli olan öğelere kutu açılacak.", "title": "Brief'i ölçüyle yaz"}, {"c": 1, "id": "sketch", "pv": {"k": "sketch"}, "r": 0, "s": 2, "t": "paper", "text": "Mizanpaj gibi: önce boş çerçeveler, içerik sonra.", "title": "Kutu krokisi", "tool": "Illustrator ya da kağıt"}, {"c": 1, "id": "grid", "pv": {"items": ["Sıra: [üst, sol, alt, sağ]", "Yüzde × 10 = koordinat", "Başlık [120, 60, 380, 480]", "Şezlong [560, 560, 900, 960]", "Havuz [700, 0, 1000, 540]"], "k": "list"}, "r": 1, "s": 3, "t": "note", "text": "Oran ne olursa olsun en ve boy 0'dan 1000'e gider.", "title": "0–1000 ızgarası"}, {"c": 2, "id": "claude", "pv": {"k": "txt", "v": "Convert my sketch into a FLUX 3 layout prompt. Aspect ratio 16:9. Use a 0-1000 grid with boxes written as [top, left, bottom, right]..."}, "r": 0, "s": 3, "t": "claude", "text": "Hesapla uğraşmadan kutu listesi hazır gelir.", "title": "Krokiyi kutu listesine çevir", "tool": "Claude"}, {"c": 2, "id": "caption", "pv": {"k": "txt", "v": "Bright boutique seaside hotel advertisement photo, warm afternoon sun from the right: <title> at the top left, a <lounger> on the pool deck on the right, a white <umbrella> open above it, the turquoise <pool> in the lower left..."}, "r": 1, "s": 4, "t": "prompt", "text": "Bütünün havası; her öğe <etiket> ile işaretli.", "title": "Sahne cümlesi"}, {"c": 3, "chips": ["Flux.3 Image", "16:9", "768p", "~1,5 dk"], "id": "draft", "pv": {"ar": "16:9", "items": [{"m": "🏖️", "tag": "taslak 1", "tone": "day"}, {"m": "🏖️", "tag": "taslak 2", "tone": "day"}, {"m": "⛱️", "tag": "taslak 3", "tone": "day"}], "k": "grid"}, "r": 0, "s": 5, "t": "gen", "text": "Sahne cümlesi + kutu listesi tek prompt olarak, ucuz çözünürlükte.", "title": "Taslak tur", "tool": "Magnific · AI Image Generator"}, {"c": 4, "id": "check", "pv": {"items": ["Her öğe kendi kutusunda mı?", "Buton alanı gerçekten boş mu?", "Başlık okunuyor mu?", "Kayan öğe → kutuyu büyüt, tarifi netleştir"], "k": "list"}, "r": 0, "s": 6, "t": "compare", "text": "Bu turda sadece yerleşim değerlendirilir; ışık ve renk sonra.", "title": "Kutulara uydu mu?"}, {"c": 5, "chips": ["referans: ref_image_0", "şezlong = yeni", "diğerleri = sabit"], "id": "edit", "pv": {"a": {"m": "🪑", "tag": "ahşap şezlong", "tone": "day"}, "b": {"m": "🛏️", "tag": "gölgelikli daybed", "tone": "day"}, "k": "ba"}, "r": 0, "s": 7, "t": "retouch", "text": "Sadece şezlongun yeri değişir; başlık, şemsiye ve havuz yerinde kalır.", "title": "Tek kutuyu değiştir", "tool": "Flux.3 Image · düzenleme"}, {"c": 5, "chips": ["9:16", "768p"], "id": "story", "pv": {"items": ["16:9", "9:16"], "k": "ratios", "m": "🏖️", "tone": "day"}, "r": 1, "s": 8, "t": "gen", "text": "Aynı sayılar kullanılmaz: ızgara esner, kutular yeniden çizilir.", "title": "Story için yeni kroki"}, {"c": 6, "chips": ["aynı prompt", "2K", "gerekirse 4K"], "id": "final", "pv": {"a": "768p", "b": "2K", "k": "up"}, "r": 0, "s": 9, "t": "upscale", "text": "Yerleşim kilitlenince yeniden üret; upscale değil, doğrudan büyük çıktı.", "title": "Final çözünürlük", "tool": "Flux.3 Image"}, {"c": 7, "end": true, "id": "ps", "pv": {"items": ["ERKEN REZERVASYON (gerçek yazı, otel fontu)", "Alt başlık + Hemen rezervasyon yap butonu", "Logo (vektör)", "Flux.3 görseli 2K"], "k": "layers"}, "r": 0, "s": 9, "t": "ps", "text": "AI'ın yazdığı başlık yerine gerçek yazı katmanı; prompt tarif kartına.", "title": "Yazı, logo, teslim", "tool": "Photoshop"}], "title": "Önce kutuları çiz, sonra model içini doldursun: yerleşim senin, detay AI'ın"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. E-ticaret görseli ile reklam (hero) görseli arasındaki temel fark nedir?\n2. Ürün görseli üretirken ürünü neden yazıyla tarif etmek yerine gerçek fotoğrafını referans veriyoruz; \"ürün sayfası\" bu işte ne işe yarıyor?\n\n### Konu\n\nŞimdiye kadar bir görselde \"neyin nerede duracağını\" hep cümleyle söyledik: \"başlık solda, şezlong sağda, altta buton için boşluk bırak\". Model bunu çoğu zaman anlar ama yerleşimi kendi kafasına göre yapar. Şezlong bazen ortaya kayar, başlık boşluğu küçülür, üç denemede üç farklı kompozisyon çıkar. Grafik tasarımcı için bu can sıkıcıdır, çünkü senin işin tam olarak yerleşimdir.\n\nBu dersin konusu bu sorunu çözen yeni bir yöntem: kutu çizerek kompozisyon kontrolü. Black Forest Labs (Flux modellerini yapan şirket) Ekim 2026'nın başında FLUX 3 Image'ı çıkardı. Bu modelin en önemli yeniliği şu: her öğe için ayrı bir kutu tanımlıyorsun, model o öğeyi o kutunun içine yerleştiriyor. Yani \"şezlong sağ altta\" demek yerine \"şezlong tam şu dikdörtgende\" diyorsun.\n\nBenzetme: Gazetede ya da dergide sayfa tasarlayan bir mizanpajcıyı düşün. Fotoğraflar daha çekilmeden sayfaya boş çerçeveler çizer: \"manşet buraya, büyük fotoğraf buraya, küçük haber şu köşeye.\" Sonra her çerçeveye içeriği döker. InDesign'da ya da Illustrator'da yaptığın şey de bu. FLUX 3'te kutular senin boş çerçevelerin, model de çerçeveleri dolduran fotoğrafçı ve illüstratör.\n\nKutular nasıl tarif ediliyor? Model her görseli, oranı ne olursa olsun, eni ve boyu 0'dan 1000'e kadar giden bir ızgara gibi görüyor. Bir kutuyu dört sayıyla yazıyorsun: üstten, soldan, alttan, sağdan. Mesela [120, 60, 380, 480], \"üstten 120'den başla, soldan 60'tan başla, 380'de bit, sağda 480'de bit\" demek. Kafanda tutmanın en kolay yolu: yüzdeyi 10 ile çarp. Görselin üstten %12'si 120, %38'i 380 olur. Ölçü piksel değil, oran; bu yüzden 768 piksellik taslakta da 4K finalde de aynı kutular aynı yere düşer.\n\nBir yerleşim prompt'u iki parçadan oluşur. Birincisi sahne cümlesi: bütün görseli tek paragrafta anlatırsın ve kontrol etmek istediğin her öğenin adını açılı parantez içinde etiketlersin, mesela `<lounger>` ya da `<title>`. İkincisi kutu listesi: her etiket için bir satır; satırda etiketin adı (id), kutusu ve o öğenin ayrıntılı tarifi (desc) olur. Sahne cümlesi bütünün havasını verir, kutu listesi her parçanın yerini ve görünüşünü.\n\nBu modelin ikinci gücü düzenleme. Bitmiş bir görselde sadece bir kutuyu değiştirebiliyorsun: \"ahşap şezlongu gölgelikli bir daybed'e çevir, gerisine dokunma.\" Bunun için her öğeye bir rol veriyorsun: sabit (yerinde kalsın), yeni (bu kutuya yeni bir şey üret) ya da taşı (bu öğeyi şuradan şuraya götür). Black Forest Labs, kutuların dışındaki piksellerin genelde aynı kaldığını söylüyor; ama gölge, yansıma ve ışık gibi komşu şeyler biraz değişebiliyor. Bu, Ders 13'teki inpaint'in kutuyla yapılan, daha planlı hali gibi düşünülebilir.\n\nDiğer özellikler kısaca: en fazla 10 referans görseli tek seferde kullanabiliyor, çıktı 768 pikselden 4K'ya kadar çıkabiliyor (yaklaşık 5456×3072) ve 21:9'dan 9:21'e kadar 15 farklı oran destekliyor. Yazı için de ayrı kutu açabiliyorsun; tırnak içinde tam metni, yazı yönünü, rengini ve yazı stilini yazıyorsun.\n\nMagnific tarafı: Magnific'in görsel üretici model listesinde \"Flux.3 Image\" adıyla, beta etiketiyle duruyor. Oranlarda \"auto\" seçeneği de var; auto, düzenlemede ilk referans görselin oranını kullanır. Üretim yaklaşık 1,5 dakika sürüyor, diğer modellerden yavaş. Beta olduğu için hesabında henüz görünmeyebilir. Magnific ekranında kutu çizme paneli göremezsen sorun değil: Black Forest Labs'in belgelerine göre kutu listesi zaten prompt'un içinde yazı olarak gönderiliyor. Yani kutuları prompt alanına yazman yeterli. Black Forest Labs'in kendi deneme ekranında (Playground) ise kutuları fareyle sürükleyerek çizebiliyorsun.\n\nFiyat mantığı: Magnific'te her üretim kredi harcar ve bu model yeni, büyük bir model. Bu yüzden yerleşimi her zaman 768p taslakta dene, kutular oturduktan sonra 2K ya da 4K'da final al. Bu derste bunu adım adım yapacağız.\n\nNe zaman kullanılır? Yerleşimin önemli olduğu her işte: başlığın, butonun ve logonun yeri belli olan site banner'ları ve sosyal medya şablonları, maç günü posterleri, birkaç ürünün tek karede dizildiği kampanyalar, dergi kapağı düzenleri, kolajlar ve \"aynı görselde sadece şunu değiştir\" revizyonları. Tek ürünlü, serbest bir atmosfer görseli için ise klasik prompt hâlâ daha hızlı.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Yerleşim (mizanpaj) | Görseldeki öğelerin nerede, ne büyüklükte duracağının planı | layout, composition |\n| Sınırlayıcı kutu | Bir öğenin görselde kaplayacağı dikdörtgen alan | bounding box, bbox |\n| 0–1000 ızgarası | Görselin eni ve boyunun 0'dan 1000'e ölçeklendiği koordinat sistemi; oran değişse de aynı kalır | normalized coordinates, 0–1000 grid |\n| Sahne cümlesi | Bütün görseli anlatan ve öğeleri `<etiket>` ile işaretleyen paragraf | scene caption, scene prompt |\n| Etiket (id) | Bir öğeye verdiğin kısa ad; sahne cümlesindeki etiket ile kutu listesindeki satır aynı olmalı | id, tag |\n| Sabit öğe | Düzenlemede yerinde ve aynı kalması istenen öğe | anchor |\n| Yeni öğe / taşıma | Kutuya yeni şey üretmek / bir öğeyi başka kutuya götürmek | new element / move |\n| Taslak çözünürlük | Yerleşimi ucuza denemek için kullanılan düşük çözünürlük | draft, 768p preview |\n\n### Uygulama\n\nSenaryo: Sahil kenarında bir butik otel, web sitesinin ana sayfası için \"ERKEN REZERVASYON\" banner'ı istiyor (16:9). Kurallar net: solda üstte büyük başlık, sağda havuz başında bir şezlong ve üstünde açık bir şemsiye, sol altta havuzun mavisi, başlığın hemen altında alt başlık ve \"Hemen rezervasyon yap\" butonu için boş bir alan. Müşteri bir de Instagram için 9:16 story versiyonu istiyor. Normal prompt'la bu yerleşimi tutturmak beş on deneme alır; kutularla ilk taslakta yaklaşırsın.\n\n1. Brief'i ölçüyle yaz: İşin oranı (16:9), öğe listesi (başlık, şezlong, şemsiye, havuz) ve boş kalacak alan (başlığın altında alt başlık ve buton alanı). Hangi öğenin yeri gerçekten önemli? Sadece onlara kutu açacaksın.\n2. Kroki çiz: Kağıda ya da Illustrator'da 16:9 bir çerçeve çiz ve öğeleri dikdörtgenlerle yerleştir. Bu, alışık olduğun mizanpaj işi. Kutuları öğenin tamamını alacak kadar geniş tut; şemsiyenin kenarı ya da şezlongun gölgesi kutudan taşmasın.\n3. Kutuları sayıya çevir: Her kutu için üst, sol, alt, sağ değerlerini 0–1000 ızgarasında yaz (yüzde × 10). Bizim örnekte başlık [120, 60, 380, 480], şezlong [560, 560, 900, 960], şemsiye [60, 600, 560, 920], havuz [700, 0, 1000, 540]. Hesapla uğraşmak istemezsen krokinin fotoğrafını Claude'a ver ve kutu listesine çevirmesini iste (aşağıda prompt'u var).\n4. Sahne cümlesini yaz: Görselin bütününü tek paragrafta anlat ve her öğeyi etiketle: `<title>`, `<lounger>`, `<umbrella>`, `<pool>`. Işığı da burada söyle: \"öğleden sonra güneşi sağdan.\" Her etiketin kutu listesinde bir satırı olmalı, her satırın da sahne cümlesinde bir etiketi.\n5. Magnific'te taslak al: AI Image Generator'da modeli Flux.3 Image seç, oranı 16:9, çözünürlüğü 768p yap. Sahne cümlesi ile kutu listesini tek prompt olarak yapıştır ve 2-3 taslak al. Üretim yaklaşık 1,5 dakika sürer; bu sürede bir sonraki denemeyi hazırla.\n6. Kutulara bak, karar ver: Taslakları yan yana koy. Her öğe kendi kutusunda mı? Buton alanı gerçekten boş mu? Başlık okunuyor mu? Bir öğe kaymışsa önce kutusunu biraz büyüt ya da tarifini netleştir, sonra yeniden dene. Bu turda ışık ve renk değil, sadece yerleşim değerlendirilir.\n7. Tek kutuyu değiştir: Müşteri \"ahşap şezlong yerine beyaz minderli, gölgelikli bir daybed olsun\" dedi diyelim. Beğendiğin taslağı referans olarak yükle, değişecek öğeyi yeni, diğerlerini sabit olarak yaz ve \"gerisini aynen koru\" de. Böylece sadece şezlongun yeri değişir, başlık, şemsiye ve havuz yerinde kalır.\n8. Story için yerleşimi yeniden kur: 9:16'ya geçerken aynı sayıları kullanma; ızgara görselle birlikte esner, yuvarlak şemsiye uzun, basık bir elipse dönüşebilir. Story için yeni bir kroki çiz: başlığı biraz aşağı al (üstteki profil alanı kapanmasın), havuz ve şezlongu ortaya topla, altta mesaj kutusu ve bağlantı çıkartması için boşluk bırak.\n9. Final ve teslim: Yerleşim kilitlenince aynı prompt'la 2K'da (gerekirse 4K) final al. Başlık yazısını AI'ın yazdığı haliyle bırakma; Türkçe karakterleri ve otelin yazı tipini Photoshop'ta gerçek yazıyla kur, butonu ve logoyu vektörden yerleştir. Prompt'u ve kutu listesini tarif kartına \"Otel banner'ı 16:9 yerleşimi\" adıyla kaydet; bir sonraki kampanyada sadece tarifleri değiştirirsin.\n\n### Örnek prompt'lar\n\nBu prompt'larda sahne cümlesi ile kutu listesi tek satırda, art arda yazılı. Magnific'in prompt alanına olduğu gibi yapıştırabilirsin. Koordinatların sırası hep [üst, sol, alt, sağ].\n\n`Bright boutique seaside hotel advertisement photo, warm afternoon sun from the right: <title> at the top left, a <lounger> on the pool deck on the right, a white <umbrella> open above it, the turquoise <pool> in the lower left, calm sea on the horizon, clean empty area below the title for a subheadline and a button. [{\"id\":\"title\",\"bbox\":[120,60,380,480],\"desc\":\"bold white serif text 'ERKEN REZERVASYON', horizontal, left aligned\"},{\"id\":\"lounger\",\"bbox\":[560,560,900,960],\"desc\":\"natural teak sun lounger with a folded white towel, soft shadow on the stone deck\"},{\"id\":\"umbrella\",\"bbox\":[60,600,560,920],\"desc\":\"open white canvas beach umbrella, slightly tilted\"},{\"id\":\"pool\",\"bbox\":[700,0,1000,540],\"desc\":\"clear turquoise pool water with gentle ripples and sun reflections\"}]`\n\nKullanım yeri: Otel ve turizm, 16:9 site ana sayfa banner'ı. Başlığın altındaki alan hiçbir kutuya dahil edilmedi ve sahne cümlesinde \"clean empty area\" olarak yazıldı; alt başlığı ve butonu Photoshop'ta oraya koyacaksın.\n\n`Dramatic match day poster, stadium at night under floodlights: <headline> at the top, a <player> in a red and white kit kicking on the left, the <ball> flying toward the upper right, a blurred <crowd> behind them, empty dark area at the bottom for date and sponsor logos. [{\"id\":\"headline\",\"bbox\":[40,60,180,940],\"desc\":\"huge bold condensed white sans-serif text 'MAÇ GÜNÜ', horizontal\"},{\"id\":\"player\",\"bbox\":[220,40,820,620],\"desc\":\"athletic football player in red and white kit, mid-kick, motion blur on the kicking leg\"},{\"id\":\"ball\",\"bbox\":[200,640,360,860],\"desc\":\"white football with slight motion blur\"},{\"id\":\"crowd\",\"bbox\":[150,0,600,1000],\"desc\":\"stadium crowd and floodlights, out of focus\"}]`\n\nKullanım yeri: Maç günü posteri, 9:16 story. Kalabalık kutusu oyuncunun kutusuyla bilerek üst üste biniyor; arka plan öğeleri ön plandakilerle çakışabilir. Alttaki %18'lik alan tarih ve sponsor logoları için boş.\n\n`Clean skincare ad on pale sage green stone, single soft light from the left: the <jar> from image 1 standing in the center left, the <serum> bottle from image 2 resting on the lower right, a <leaf> sprig of eucalyptus at the top left, large empty area on the right for text. [{\"id\":\"jar\",\"bbox\":[300,120,720,600],\"desc\":\"the frosted glass moisturizer jar from image 1, exact lid, label and shape\"},{\"id\":\"serum\",\"bbox\":[560,620,880,800],\"desc\":\"the dropper serum bottle from image 2, same glass color and label\"},{\"id\":\"leaf\",\"bbox\":[60,40,300,320],\"desc\":\"small sprig of fresh eucalyptus leaves\"}]`\n\nKullanım yeri: Cilt bakım reklamı, iki ürünlü kampanya görseli. Ders 17'deki kuralı burada da uyguluyoruz: ürünler yazıyla değil, referans görselle (image 1, image 2) geliyor; kutular sadece nereye konacaklarını söylüyor.\n\n`Replace the <lounger> with a white cushioned daybed with a light linen canopy on the same pool deck, keep the <title>, <umbrella> and <pool> exactly unchanged. [{\"id\":\"lounger\",\"from\":null,\"src_bbox\":null,\"tgt_bbox\":[560,560,900,960],\"desc\":\"white cushioned daybed with a light linen canopy, soft shadow on the stone deck\"},{\"id\":\"title\",\"from\":\"ref_image_0\",\"src_bbox\":[120,60,380,480],\"tgt_bbox\":[120,60,380,480],\"desc\":\"text 'ERKEN REZERVASYON'\"},{\"id\":\"umbrella\",\"from\":\"ref_image_0\",\"src_bbox\":[60,600,560,920],\"tgt_bbox\":[60,600,560,920],\"desc\":\"open white canvas beach umbrella\"},{\"id\":\"pool\",\"from\":\"ref_image_0\",\"src_bbox\":[700,0,1000,540],\"tgt_bbox\":[700,0,1000,540],\"desc\":\"turquoise pool water\"}]`\n\nKullanım yeri: Müşteri revizyonu, tek öğe değiştirme. Beğenilen banner referans olarak yüklenir (ilk referans \"ref_image_0\" diye anılır). Şezlong \"yeni\" öğe (from: null), diğerleri \"sabit\" (kaynak ve hedef kutusu aynı).\n\n`Convert my sketch into a FLUX 3 layout prompt. Aspect ratio 16:9. Use a 0-1000 grid with boxes written as [top, left, bottom, right]. Give each element a short id and a detailed desc, keep boxes a little larger than the objects, and write one scene caption that tags every id in angle brackets. Leave the marked empty areas without boxes.`\n\nKullanım yeri: Claude'a yardım isteme. Kağıttaki ya da Illustrator'daki krokinin ekran görüntüsünü bu prompt'la Claude'a ver; hesap yapmadan kutu listesi hazır gelir. Oranı kendi işine göre değiştir, sonra sadece tarifleri düzelt.\n\n### Sık yapılan hatalar\n\n- **Etiket ile satırın tutmaması.** Sahne cümlesinde `<lounger>` yazıp kutu listesinde \"sunbed\" demek ya da bir satırı cümlede hiç anmamak. Model hangi kutunun neye ait olduğunu karıştırır. Her etiketin tam bir eşi olmalı.\n- **Kutuyu çok küçük ya da çok dar çizmek.** Black Forest Labs'in denemelerinde çok küçük kutulara (40×25 piksel civarı) konan yeni öğeler çoğu zaman hiç çıkmamış. Kutuyu öğenin tamamını, gölgesi ve yansımasıyla birlikte alacak kadar geniş tut.\n- **Aynı sayılarla oranı değiştirmek.** Izgara görselle birlikte esner; 16:9 için çizilmiş geniş bir kutu 9:16'da dar ve uzun bir dikdörtgene döner. Her oran için krokiyi yeniden çiz.\n- **Düzenlemede korunacakları yazmamak.** Sadece değişecek öğeyi yazarsan model komşu alanları da yeniden yorumlayabilir. Kalacak öğeleri sabit satır olarak ekle ve \"gerisini aynen koru\" de.\n- **Başlığı AI'ın yazdığı haliyle teslim etmek.** Kutu yazının yerini ve boyutunu ayarlamak için harika; ama Türkçe karakterler ve markanın yazı tipi için son yazıyı Photoshop'ta gerçek yazı katmanıyla kur.\n\n### Ödev\n\nÜzerinde çalıştığın ya da yakında gelecek bir işi seç ya da otel banner'ı senaryosunu kullan (20-30 dakika):\n\n1. Illustrator'da ya da kağıtta 16:9 bir kroki çiz: bir başlık kutusu, iki öğe kutusu (ör. şezlong ve şemsiye ya da oda içinden yatak ve pencere), bir de buton için bilerek boş bırakılan alan (5 dk).\n2. Kutuları 0–1000 ızgarasına çevir. Önce kendin hesapla, sonra krokiyi Claude'a verip aynı işi yaptır ve sonuçları karşılaştır (5 dk).\n3. Magnific'te Flux.3 Image ile 768p'de 2 taslak al. Aynı sahneyi kutusuz, sadece cümleyle yazılmış bir prompt'la da 2 kez üret (10 dk).\n4. Kutulu ve kutusuz sonuçları yan yana koy: hangisi krokiye daha yakın? Sonra beğendiğin kutulu taslakta tek bir öğeyi değiştirmeyi dene (5-10 dk).\n\nModel hesabında henüz görünmüyorsa 1. ve 2. adımları yine yap; kutu listesi ve kroki model açıldığında hazır olur. Krokini, kutu listeni ve dört sonucu Claude'a gösterip yerleşimin ne kadar tuttuğu, hangi kutunun büyütülmesi gerektiği ve boş alanın gerçekten kullanılabilir olup olmadığı üzerine yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. E-ticaret görseli bilgi verir: ürünün nasıl göründüğünü, rengini, boyutunu sade ve dürüst bir şekilde gösterir (packshot, açılar, detay, ölçek). Reklam ya da hero görseli his verir: ışık, mekan ve atmosferle \"bu ürün sana nasıl bir hayat vaat ediyor\" sorusunu cevaplar ve genelde başlık için boş alan bırakır.\n2. Ürünü yazıyla tarif edersen AI \"benzer\" bir ürün çizer; logo, şekil ve renk tonu kayar. Gerçek fotoğrafı referans verince AI'a sadece sahneyi, ışığı ve açıyı yaptırırsın. Ürün sayfası, ürünün tek görselde birkaç açıdan görünümüdür; bir kere çıkarınca her sahnede referans olarak kullanırsın ve model ürünü her açıdan \"tanır\".\n\nSıradaki ders: Mini proje: bir marka için kampanya görsel seti\n\n### Kaynaklar\n\n- [FLUX 3 Image Editing (bounding box layout) – Black Forest Labs](https://docs.bfl.ai/flux_3/flux3_image_layout)\n- [Bounding boxes with FLUX 3 Image – Black Forest Labs](https://docs.bfl.ai/flux_3/flux3_image_bounding_boxes)\n- [FLUX 3 Image – Black Forest Labs belgeleri](https://docs.bfl.ai/flux_3/flux3_image_overview)\n- [FLUX 3 Image: Maximum control over every pixel – Black Forest Labs](https://bfl.ai/models/flux-3-image)\n- [Flux 3 Image: bounding-box layouts, precise edits, 4K output – Morphic](https://morphic.com/resources/models/flux-3-image)\n- [FLUX 3 Image Lets Developers Place Objects With Exact Coordinates – AlphaSignal](https://alphasignal.ai/news/black-forest-labs-flux-3-image-lets-developers-place-objects-with-exact)", "module": 2, "moduleName": "Görseli kontrol etmek", "n": 18, "summary": ["FLUX 3 Image ile her öğeye bir kutu çizersin; model o öğeyi tam o dikdörtgenin içine yerleştirir.", "Kutular 0–1000 ızgarasında [üst, sol, alt, sağ] sırasıyla yazılır; koordinatı bulmak için yüzdeyi 10 ile çarp.", "Prompt iki parçadır: öğeleri <etiket> ile işaretleyen sahne cümlesi ve her etiket için bir satırlık kutu listesi.", "Yerleşimi önce 768p taslakta dene, kutular oturunca 2K ya da 4K final al; her yeni oran için krokiyi yeniden çiz.", "Revizyonda değişecek öğeyi yeni, kalanları sabit yaz; başlığı ve logoyu en sonda Photoshop'ta gerçek yazıyla kur."], "title": "Kutu çizerek kompozisyon kontrolü: FLUX 3 ile yerleşimi belirlemek"}, {"checked": "Ekim 2026", "date": "8 Ekim 2026", "flow": {"edges": [{"a": "brief", "b": "claude", "k": "txt", "l": "brief"}, {"a": "claude", "b": "scenes", "k": "txt", "l": "ana şablon"}, {"a": "rule", "b": "scenes", "k": "ref", "l": "kilitli alanlar"}, {"a": "scenes", "b": "draft", "k": "txt", "l": "6 prompt"}, {"a": "sheet", "b": "draft", "k": "ref", "l": "ürün referansı"}, {"a": "draft", "b": "check", "k": "img", "l": "6 kare"}, {"a": "check", "b": "fix", "k": "f", "l": "yabancı kare"}, {"a": "check", "b": "final", "k": "f", "l": "onaylı seri"}, {"a": "fix", "b": "final", "k": "txt", "l": "düzeltilmiş şablon"}, {"a": "sheet", "b": "final", "k": "ref"}, {"a": "final", "b": "expand", "k": "img", "l": "hero"}, {"a": "expand", "b": "ps", "k": "img", "l": "3 ölçü"}, {"a": "final", "b": "ps", "k": "img", "l": "diğer 5 kare"}], "groups": [{"c1": 0, "c2": 1, "label": "Hazırlık", "r1": 0, "r2": 2}, {"c1": 2, "c2": 2, "label": "Sahne listesi", "r1": 0, "r2": 0}, {"c1": 3, "c2": 4, "label": "Taslak tur", "r1": 0, "r2": 1}, {"c1": 5, "c2": 5, "label": "Final", "r1":  soğuk su damlaları makro", "piknik: deniz kenarı, buz kovası", "el: sahilde naneli soda kutusu", "flat lay: seri tepeden, limon ve nane"], "k": "list"}, "r": 0, "s": 4, "t": "prompt", "text": "Assistant şablondan 6 prompt yazar; List, generator'ı her madde için ayrı çalıştırır.", "title": "6 sahne prompt'u", "tool": "Spaces · Assistant → List"}, {"c": 3, "chips": ["Nano Banana Pro", "4:5", "1K"], "id": "draft", "pv": {"ar": "4:5", "items": [{"m": "🍋", "tag": "hero", "tone": "yellow"}, {"m": "🍋", "tag": "stüdyo", "tone": "yellow"}, {"m": "🧊", "tag": "piknik", "tone": "sea"}, {"m": "🥫", "tag": "el", "tone": "day"}], "k": "grid"}, "r": 0, "s": 5, "t": "gen", "text": "Fikri ve seriyi görmek için ucuz çözünürlük; kalite sonra.", "title": "Taslak tur", "tool": "Image Generator"}, {"c": 4, "id": "check", "pv": {"items": ["Işık hepsinde soldan mı?", "Palet aynı mı?", "Etiketler doğru ve okunuyor mu?", "Yabancı duran kare var mı?"], "k": "list"}, "r": 0, "s": 6, "t": "compare", "text": "Kareler tek tek değil, seri olarak değerlendirilir.", "title": "Kontakt sayfası", "tool": "6 kare yan yana"}, {"c": 4, "chips": ["sadece değişen kare yeniden"], "id": "fix", "pv": {"a": {"m": "🧊", "tag": "soğuk mavi piknik", "tone": "sea"}, "b": {"m": "🧊", "tag": "+ warm 5500K sunlight", "tone": "warm"}, "k": "ba"}, "r": 1, "s": 6, "t": "adjust", "text": "Piknik karesi soğuk mavi çıktıysa eksik olan renk sıcaklığıdır; şablona eklenir.", "title": "Görseli değil şablonu düzelt"}, {"c": 5, "chips": ["aynı prompt", "aynı referans", "2K"], "id": "final", "pv": {"a": "1K", "b": "2K", "k": "up"}, "r": 0, "s": 7, "t": "gen", "text": "Seri onaylanınca aynı ayarlar yüksek çözünürlükte; ardından 10 maddelik kontrol.", "title": "Final üretim", "tool": "Image Generator"}, {"c": 6, "chips": ["9:16 story", "16:9 banner"], "id": "expand", "pv": {"items": ["4:5", "9:16", "16:9"], "k": "ratios", "m": "🍋", "tone": "yellow"}, "r": 0, "s": 8, "t": "expand", "text": "Yeni alana obje eklenmez, sadece taş yüzey, buz ve fon uzar.", "title": "Formatlara taşı", "tool": "Image Expander"}, {"c": 7, "chips": ["artboard", "vektör logo", "Precision upscale"], "end": true, "id": "ps", "pv": {"items": ["Logo (vektör, sağ alt, sabit boyut)", "Başlık: Yazın ilk yudumu (gerçek font)", "AI karesi 2K", "Dosya: kiyigazoz_yaz_01_hero_4x5"], "k": "layers"}, "r": 0, "s": 9, "t": "ps", "text": "Logo her karede aynı köşede, aynı boyutta; Space şablon olarak kaydedilir.", "title": "Logo, başlık, teslim", "tool": "Photoshop"}], "title": "Önce kural kitabını yaz, sonra sahneleri ondan türet: altı kare, tek bir dizinin bölümleri gibi"}, "genhq": false, "level": "İleri", "md": "### Hızlı tekrar\n\n1. FLUX 3'te bir öğenin kutusunu yazarken hangi ızgarayı ve hangi sırayı kullanıyorduk?\n2. Bir oran için çizdiğin kutuları başka bir oranda (ör. 4:5'ten 9:16'ya geçerken) neden aynen kullanamazsın?\n\n### Konu\n\nModül 2'nin son dersine geldik ve bu derste ders değil, iş yapıyoruz. Şimdiye kadar tek bir görseli kontrol etmeyi öğrendik: ışık, kamera, stil, referans, inpaint, expand, relight, rötuş, ürün görseli, kutuyla yerleşim. Bu derste hepsini aynı anda kullanıp bir marka için kampanya görsel seti çıkaracağız.\n\nKampanya görsel seti, bir markanın tek bir mesaj için kullandığı görsellerin ailesidir: bir ana görsel (hero ya da key visual), onun yanında stüdyo kareleri, yaşam (lifestyle) kareleri, detay kareleri ve bunların Instagram post, story ve site banner'ı için kesilmiş halleri. Ajansa gelen \"yeni ürünümüz çıkıyor, lansman yapalım\" işlerinin neredeyse hepsi budur.\n\nBurada asıl zorluk tek tek güzel görsel üretmek değil. Zor olan, altı görselin altı farklı fotoğrafçının işi gibi değil, aynı gün aynı stüdyoda çekilmiş gibi durması. Müşteri seti tek tek değil, yan yana görür. Beş görsel sıcak, güneşli tonlardayken biri soğuk mavi kalırsa, o tek kare bütün seti ucuzlatır.\n\nBenzetme: Bir dizi düşün. Her bölümün hikayesi farklıdır ama oyuncular, renkler, müzik, kamera dili aynıdır. Kanalları gezerken iki saniyede \"bu o dizi\" dersin. Kampanya seti de böyle olmalı: her karede sahne değişir, ama ışık, renk, doku ve ürün hep aynı dizinin bölümleri gibi kalır. Diziyi tutarlı yapan şey senaryo yazarlarının elindeki \"dizi kitabı\"dır (karakterler, mekanlar, kurallar). Bizim dizi kitabımız da ana prompt şablonu olacak.\n\nBu işi üç katmanlı bir sistemle kuruyoruz. Profesyonel ekiplerin marka görsellerini toplu üretirken kullandığı yöntem de aynı mantıkta:\n\n1. Kural kitabı: Marka rehberi ve ana prompt şablonu. Işık, renk paleti, kamera, doku ve ruh hali bir kere yazılır ve kilitlenir. Her görsel bu şablondan türer.\n2. Kimlik kartları: Ürün sayfası. Ders 17'de öğrendiğin gibi ürünü yazıyla tarif etmiyoruz, gerçek fotoğrafını referans veriyoruz.\n3. Sahne listesi: Şablonda sadece değişen kısımlar (sahne, ürün, kadraj) doldurularak yazılmış 6 prompt. Bunları tek tek senin yazman gerekmiyor; Claude ya da Magnific Spaces'teki Assistant kutusu şablondan türetiyor.\n\nBu sistemin bir güzel yanı daha var: hata çıkınca görseli değil şablonu düzeltirsin. Bir kare \"yabancı\" duruyorsa sebebi çoğu zaman şablonun bir yerinin boş ya da belirsiz kalmasıdır. Şablonu sıkılaştırınca bütün set birlikte düzelir.\n\nMagnific'te bu iş için Spaces (node'lu tuval) en uygun yer, çünkü her şeyi tek ekranda bağlı görürsün. Kullanacağın kutular:\n\n- Text: Ana şablonu ve brief'i tutan yazı kutusu.\n- Assistant: Şablondan sahne prompt'larını yazan yapay zeka kutusu (içinde Gemini, GPT ve Claude modelleri seçilebiliyor).\n- List: Birden fazla prompt'u ya da görseli bir arada tutan kutu. Bir Image Generator'a bağlarsan generator listedeki her madde için ayrı ayrı çalışır; yani 6 prompt'u tek tıkla 6 görsele çevirir.\n- Image Generator: Görseli üreten kutu. Bu iş için referans kabul eden bir model seç. Magnific'in listesinde ürün ve marka sadakati için Google Nano Banana Pro, genel kullanım için Seedream 5 Pro öne çıkıyor. Hızlı fikir denemek için daha ucuz Nano Banana 2 Lite var.\n- Image Expander: Görseli genişletip başka orana taşıyan kutu (Ders 13'teki expand).\n- Image Upscaler: Final büyütme. Ürün ve logo olan işlerde Precision.\n\nLogo ve kampanya başlığı ise AI'ın işi değil. Onları en sonda Photoshop'ta, her görselde aynı yere ve aynı boyutta koyacağız.\n\nNot: Karakter (aynı mankenin her karede aynı görünmesi) bir sonraki modülün konusu. Bu dersteki sette insan yüzü kullanmıyoruz; sadece ürün, mekan ve bir el. Böylece tutarlılığı önce ürün ve stil üzerinden öğreniyoruz.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Kampanya görsel seti | Aynı mesaj için üretilen, aynı ailenin üyesi gibi duran görsellerin tamamı | campaign asset set |\n| Ana görsel (KV) | Kampanyanın yüzü olan, diğer her şeyin ona göre şekillendiği görsel | key visual, hero image |\n| Marka rehberi | Markanın renk, ışık, doku, ton ve yasaklarını yazan kısa kural listesi | brand guide, style guide |\n| Ana prompt şablonu | Kilitli kısımları hep aynı kalan, sadece belli boşlukları değişen prompt kalıbı | master prompt template |\n| Kilitli alan / değişken | Şablonda hiç dokunulmayan kısım / her görselde değişen boşluk | locked field / variable |\n| Kontakt sayfası | Bütün kareleri küçük boyutta yan yana gösterip seriyi birlikte değerlendirdiğin sayfa | contact sheet |\n| Format uyarlama | Aynı görseli farklı platform ölçülerine taşımak | resizing, format adaptation |\n| Toplu üretim | Birçok prompt'u tek seferde, aynı ayarlarla üretmek | batch generation |\n\n### Uygulama\n\nSenaryo: Doğal limondan yapılan, küçük ve yerel bir içecek markası düşün; adına \"Kıyı Gazoz\" diyelim. Yaz için üç üründen oluşan bir seri çıkarıyor: klasik limonata (cam şişe), naneli limonlu soda (kutu) ve pembe greyfurtlu gazoz (cam şişe). Elinde üç ürünün telefonla çekilmiş fotoğrafları ve logonun vektör dosyası var. İstenen: Instagram için 6 görsellik lansman seti, ana görselin story (9:16) ve site banner'ı (16:9) versiyonu. Marka hissi: \"ferah, enerjik, güneşli\".\n\n1. Brief'i tek sayfaya yaz. Üç şey: marka hissi (3 kelime), renk paleti (ör. limon sarısı, nane yeşili, mercan) ve kare listesi. Kare listesi şöyle olsun: (1) ana görsel: üç ürün bir arada buzlu bir taş kaidede, üstte başlık boşluğu; (2) stüdyo: limonata şişesi tek başına, düz sarı fon; (3) doku: şişenin üzerindeki soğuk su damlacıklarının yakın planı; (4) yaşam: deniz kenarında ahşap piknik masası, buz kovasında şişeler; (5) el: güneşli bir sahilde naneli soda kutusunu tutan bir el; (6) flat lay: set tepeden, dilimlenmiş limon ve nane yapraklarıyla. Bu sayfayı Spaces'te bir Text kutusuna yapıştır.\n2. Marka rehberini ve ana şablonu Claude'a yazdır. Aşağıdaki ilk prompt'u kullan. Claude'dan iki şey iste: kısa bir marka rehberi ve tek bir ana prompt şablonu. Şablonda kilitli alanlar (ışık, palet, lens, doku, ruh hali, yasaklar) kelimesi kelimesine aynı kalacak; sadece [SAHNE], [ÜRÜN] ve [KADRAJ] boşlukları değişecek. Claude sana önce soru sorarsa cevapla; hedef kitle ve rakip markalar gibi bilgiler şablonu çok iyileştirir.\n3. Ürün sayfalarını hazırla. Ders 16 ve 17'deki gibi: üç ürünü rötuşla, Background Remover ile dekupe et ve her biri için önden, yandan ve etiket yakın planı olan bir ürün sayfası çıkar. Üretilen açıları gerçek ürünle karşılaştır. Bu üç sayfa, setteki her üretimde referans olacak.\n4. Sahne listesini ürettir. Spaces'te bir Assistant kutusu aç. İçine ana şablonu ve brief'i bağla, talimata üçüncü örnek prompt'u yaz. Assistant sana 6 prompt verecek. Her prompt'u bir Text kutusuna koy ve hepsini bir List kutusunda topla. Kontrol et: kilitli kısımlar 6 prompt'ta da birebir aynı mı? Aynı değilse Assistant'a \"kilitli alanları değiştirme\" diye tekrar söyle.\n5. Taslak turu düşük çözünürlükte yap. List kutusunu bir Image Generator'a bağla. Model: Google Nano Banana Pro, oran 4:5, çözünürlük 1K. Referans olarak sadece o karede görünen ürünün sayfasını ver (ana görsel ve flat lay'de üçü birden). Çalıştır; 6 kare gelir. Bu turun amacı fikri ve seriyi görmek, kaliteyi değil; kredi de az gider.\n6. Kontakt sayfasında seriye bak. Altı kareyi yan yana koy (Spaces'te zaten yan yana durur; istersen Photoshop'ta küçük bir pano yap). Tek tek değil, birlikte değerlendir: Işık hepsinde soldan mı geliyor? Palet aynı mı? Ürün etiketleri doğru ve okunuyor mu? Bir kare yabancı duruyorsa o kareyi tekrar tekrar üretme; şablonda neyin eksik kaldığını bul (ör. \"bright sunlight from the left\" yazıyor ama renk sıcaklığı yazmıyor) ve şablonu düzelt. Sonra sadece değişen kareleri tekrar üret.\n7. Finali aynı prompt'larla yüksek çözünürlükte üret. Seri onaylanınca aynı prompt'ları, aynı referansları ve aynı modeli 2K'da çalıştır. Upscale ile büyütmek yerine doğrudan büyük üretmek detayları daha temiz verir. Her karede 10 maddelik kalite kontrolünü hızlıca geç: etiket yazısı, marka renkleri, temas gölgesi, cam şişedeki ve kutudaki yansıma, ışık yönü.\n8. Ana görseli formatlara taşı. Hero görselini Image Expander'a bağla ve iki kopya çıkar: 9:16 (story) ve 16:9 (banner). Prompt alanına beşinci örnek prompt'u yaz ki genişleyen kısma yeni obje eklemesin, sadece yüzeyi ve fonu uzatsın. Story'de üstte ve altta platform yazılarının kapattığı bölgeleri (Ders 5'teki güvenli alan) boş bırak.\n9. Logo, başlık ve teslim. Bütün kareleri Photoshop'ta artboard'lara (çalışma yüzeyleri) yerleştir. Logoyu vektörden, her karede aynı köşeye ve aynı boyutta koy; başlığı (\"Yazın ilk yudumu\" gibi) gerçek fontla yaz. Son olarak gerekirse Precision upscale ile büyüt, dosyaları \"kiyigazoz_yaz_01_hero_4x5\" gibi adlandır. Space'i \"Kampanya seti\" adıyla şablon olarak kaydet; bir sonraki markada sadece brief'i ve ürün sayfalarını değiştirmen yeterli.\n\n### Örnek prompt'lar\n\n`You are an art director. Build a short visual brand guide for \"Kiyi Gazoz\", a small local craft lemonade and soda brand from the Turkish Black Sea coast, launching a summer range (classic lemonade glass bottle, mint lemon soda can, pink grapefruit soda glass bottle). Give: mood in 3 words, color palette with hex codes, lighting, camera and lens style, textures and props, and things to avoid. Then write ONE master image prompt template: mark locked parts with 🔒 and leave only [SCENE], [PRODUCT] and [FRAMING] as variables. Ask me up to 5 questions before you start.`\n\nKullanım yeri: Her yeni marka işinin ilk adımı. Claude'a önce marka rehberini, sonra bütün setin türeyeceği ana şablonu yazdırırsın. \"Önce bana soru sor\" kısmı, Claude'un tahmin yürütmek yerine eksik bilgiyi senden almasını sağlar.\n\n`Campaign photo for a craft lemonade brand, the lemonade bottle, mint soda can and grapefruit soda bottle from the reference images standing on a wet stone plinth surrounded by crushed ice, bright sunlight from the left, lemon yellow, mint green and coral palette, cold condensation droplets on glass and metal, 85mm lens, shallow depth of field, fresh energetic mood, clean empty space in the top third for a headline`\n\nKullanım yeri: Kampanyanın ana görseli (hero). Ürünler referanstan gelir, prompt sadece sahneyi, ışığı ve paleti söyler. \"Clean empty space in the top third\" başlık için boşluğu garantiler.\n\n`Using the master template above, write 6 scene prompts for the summer campaign: 1 hero with all three products, 1 studio shot of the lemonade bottle alone on a flat lemon yellow background, 1 macro of condensation droplets on the bottle, 1 seaside wooden picnic table with bottles in an ice bucket, 1 hand holding the mint soda can on a sunny beach, 1 flat lay of the range from above with lemon slices and mint leaves. Keep every 🔒 part word for word, change only [SCENE], [PRODUCT] and [FRAMING]. Labels must face the camera. Output only the prompts, no numbers, end each one with *`\n\nKullanım yeri: Spaces'teki Assistant kutusuna ya da Claude'a. Altı prompt'u tek tek senin yazman yerine şablondan türetir. Sondaki \"*\" kuralı, prompt'ları birbirinden ayırmayı kolaylaştırır; her birini ayrı Text kutusuna koyarsın.\n\n`Lifestyle product photo, a hand with a light linen shirt sleeve holding the moisturizer jar from the reference image next to a bright bathroom window, soft diffused window light from the left, warm cream, sage green and muted terracotta palette, 85mm lens, shallow depth of field, calm premium mood, framed from wrist up, label facing camera`\n\nKullanım yeri: Cilt bakım markası için \"el\" karesi; aynı mantık takı, kozmetik, içecek gibi elde tutulan her ürünün sosyal medya görselinde çalışır. Işık, palet, lens ve ruh hali cümleleri şablondan geldiği için seriyi bir arada tutan şey bu tekrardır; kendi setinde bu cümleleri kendi şablonundaki kilitli alanlarla değiştir.\n\n`extend the same wet stone surface, crushed ice and bright summer background, keep the sunlight from the left, no new objects, no text`\n\nKullanım yeri: Image Expander'da ana görseli 9:16 story ve 16:9 banner'a taşırken. Genişleyen alana model kendi kafasından bardak, meyve ya da yazı eklemesin diye \"no new objects, no text\" diyoruz.\n\n### Sık yapılan hatalar\n\n- **Her kareye sıfırdan prompt yazmak.** Altı ayrı prompt, altı ayrı ışık ve palet demek. Önce şablon, sonra sahneler; kilitli alanlar kelimesi kelimesine aynı kalmalı.\n- **Kareleri tek tek değerlendirmek.** Tek başına çok güzel duran bir kare seride en kötü kare olabilir. Karar her zaman kontakt sayfasında, altısı yan yana verilir.\n- **Logoyu ve başlığı AI'a bıraktırmak.** AI logoyu bir kare doğru, bir kare yamuk çizer. Logo vektörden, başlık gerçek fontla ve her karede aynı yerde, en son Photoshop'ta eklenir.\n- **Bozuk kareyi üst üste düzeltmek.** Aynı görseli defalarca düzenlemek kaliteyi düşürür ve kredi yakar. Önce şablondaki eksiği bul, sonra o kareyi temiz prompt'la yeniden üret.\n\n### Profesyonel yöntem\n\nMarkalar için toplu görsel üreten ekipler, ilk görseli üretmeden önce bir \"kural kitabı\" yazar. Bunun için bir sohbet asistanına (Claude gibi) markayı tanıtır ve ondan iki şey isterler: markanın stil rehberi (ruh hali, renkler, ışık, kamera, doku, yasaklar) ve bütün üretimi yönetecek tek bir ana prompt şablonu. Talimatın sonuna \"başlamadan bana soru sorabilirsin\" eklenir; böylece asistan hedef kitle, rakipler ya da kullanım yeri gibi eksikleri tahmin etmek yerine sorar. Neden işe yarıyor? Çünkü tutarlılık kararları bir kere, en başta ve yazılı olarak veriliyor. Sonraki her görsel bu kararları miras alıyor.\n\nŞablonun kalbi kilitli alan ve değişken ayrımıdır. Deneyimli üreticiler kilitli alanları 🔒 gibi bir işaretle belirtir ve bunlara hiç dokunmaz; sadece birkaç boşluk (konu, ürün, kadraj gibi) her görselde değişir. Bunu bir sistem prompt'u gibi düşünebilirsin: kurallar sabit, içerik değişken. Örneğin bir içecek markasında \"bright sunlight from the left\", \"lemon yellow, mint green and coral palette\" ve \"85mm lens\" kilitli kalırken, sahne bir karede piknik masası, diğerinde sahil olur. Değişkenleri ne kadar azaltırsan seri o kadar tutarlı olur.\n\nAkış genelde \"sayfa → sahne → seri\" şeklinde ilerler:\n\n1. Ürün sayfaları (ve varsa karakter sayfaları) hazırlanır; her ürün birkaç açıdan, etiketiyle birlikte sabitlenir.\n2. Bu sayfalar sahne şablonunda birleşir: aynı şablondan stüdyo, editoryal ve lifestyle kareleri türetilir.\n3. Format çoğaltma en sonda yapılır: ana görsel, genişletme (outpaint, Magnific'te Image Expander) ile story ve banner ölçülerine taşınır.\n\nToplu üretimin küçük ama önemli bir püf noktası çıktı biçimidir. Asistana \"sadece prompt'ları ver, numara koyma, her birinin sonuna * koy\" denir. Node'lu bir akış bu yıldızdan metni böler ve her prompt'u ayrı bir görsel üreticiye gönderir; Spaces'te bunu List kutusuyla yaparsın. Sahne listesini yazdırırken de her sahnenin kuralını net söyle: ürün her karede doğru açıda ve etiketi kameraya dönük görünsün, başlık boşluğu sağda ya da solda olsun, stüdyo ve doğal an kareleri dengeli dağılsın. Sektörde sık duyulan bir uyarı da şu: asistandan bir seferde çok fazla prompt istersen (ör. 10 tane) hepsini kısaltıp sıradanlaştırabilir; sonuç zayıfsa daha az sayıda ya da tek tek iste.\n\nSon olarak logo: profesyonel akışlarda logo AI'a çizdirilmez, bir birleştirme (compositor) adımıyla bütün sete aynı biçimde, aynı yere ve boyuta basılır. Biz bunu Photoshop'ta artboard'larla yapıyoruz. Aynı mantığı genişletmek istersen ürün, mekan ve kamerayı birer değişken yapıp tek akıştan onlarca tutarlı varyasyon üretebilirsin; tekrarlayan kampanya işlerinde bu ciddi zaman kazandırır.\n\n### Ödev\n\nGerçek bir marka seç: üzerinde çalıştığın ya da yakında gelecek bir işin markası, ya da sevdiğin küçük, yerel bir içecek markası (limonata, soda, şalgam, ayran, soğuk kahve). Süre 25-30 dakika.\n\n1. Claude'a ilk örnek prompt'u kendi markana uyarlayarak gönder; marka rehberini ve ana şablonu al.\n2. Sadece 3 kare planla: ana görsel, bir stüdyo karesi, bir yaşam karesi.\n3. Spaces'te ürün fotoğrafını referans verip üçünü 1K'da üret.\n4. Üçünü yan yana koy ve kendine sor: aynı çekimden çıkmış gibi mi duruyorlar? Durmuyorsa şablonu düzelt ve tekrar dene.\n5. Ana görseli Image Expander ile 9:16'ya taşı, Photoshop'ta logoyu ekle.\n\nBitirince şablonunu \"Profesyonel yöntem\" bölümündeki yapıyla karşılaştır: kilitli alanların (ışık, palet, lens, doku, ruh hali, yasaklar) hepsi sende var mı, değişken sayısı gereğinden fazla mı? Sonra üç kareyi ve story'yi Claude'a göster, \"bu seri tutarlı mı, hangi kare yabancı ve şablonda neyi değiştirmeliyim?\" diye yorum iste.\n\n### Tekrar sorularının cevapları\n\n1. FLUX 3, görselin oranı ne olursa olsun eni ve boyu 0'dan 1000'e giden bir ızgara kullanır. Kutular [üst, sol, alt, sağ] sırasıyla yazılır; bir kenarın yüzdesini 10 ile çarparak koordinatı bulursun.\n2. Çünkü ızgara orana göre esner: 0–1000, her oranda başka bir gerçek mesafeye denk gelir. Aynı sayıları kullanırsan öğeler uzar ya da yanlış yere kayar. Yeni oran için krokiyi baştan çizip kutuları yeniden yazmak gerekir.\n\nSıradaki ders: Karakter tutarlılığının temelleri", "module": 2, "moduleName": "Görseli kontrol etmek", "n": 19, "summary": ["K
