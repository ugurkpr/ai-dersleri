oğu, yakın çekim: Zincir halkaları gibi ince tekrar eden detaylar büyütmede en çok bozulan yerlerdir. Creative'de Fractality'yi düşük tut (-2 civarı), Subtle ile başla; halkalar birbirine karışıyorsa Precision Sublime'a geç.\n\n`perfume bottle on a glossy black surface, clear glass reflections, liquid inside the bottle, studio lighting, luxury product photography`\n\nParfüm ya da kozmetik ürünü: Cam ve sıvı, metal gibi yansıma isteyen yüzeylerdir. Prompt'ta \"glass reflections\" demek, AI'ın camı plastik gibi işlemesini engeller. Şişedeki marka yazısı varsa Precision kullan ya da yazıyı sonradan orijinal dosyayla yerleştir.\n\n`flat vector illustration, clean edges, smooth solid colors, no texture, no noise`\n\nMenü ya da sosyal medya illüstrasyonu: Creative, Art & Illustration, Illusio motoru, Creativity -2, Fractality -3. Amaç düz renkleri bozmadan kenarları temizlemek; doku eklemesini istemezsin.\n\n`natural portrait of a young woman, realistic skin texture, soft daylight, preserve facial features`\n\nReklam yüzü (örneğin takıyı takan model): Creative'de Soft Portrait, Creativity -2, Resemblance +5. Yüz değişirse Precision'a geç ve Portraits hazır ayarını kullan. Müşterinin modeli başka birine benzememeli.\n\n### Sık yapılan hatalar\n\n- **Her taslağı büyütmek.** Upscale en son adımdır; sadece onaylanan görseli büyüt, yoksa kredi boşa gider.\n- **Yazı, logo ve yüz içeren görsellere yüksek Creativity vermek.** AI harfleri ve yüz hatlarını \"yeniden çizer\". Bunlarda Precision ya da çok düşük yaratıcılık kullan; logoyu sonradan orijinal dosyayla yerleştir.\n- **HDR ve Sharpness'i sonuna kadar açmak.** Görsel ilk bakışta \"net\" görünür ama yakından plastik, lekeli ve halelidir. Az, kademeli artır.\n- **Sonucu uzaktan değerlendirmek.** Küçük ekranda her şey güzel görünür; %100 yakınlaştırıp el, yazı ve kenarları kontrol et.\n\n### Profesyonel yöntem\n\nProfesyonel ekipler upscale'i bir \"başlangıç\" aracı olarak değil, bitirme katmanı olarak görür. Görsel başka bir modelde üretilir, seçilir, düzeltilir; büyütme işin en sonunda, cilalama gibi yapılır. Bu derste öğrendiğin \"en son adım\" kuralı tam olarak bu.\n\nSektörde sık kullanılan üç teknik:\n\n1. **Hibrit büyütme.** Tek görselde hem zengin doku hem sadık yüz/logo istiyorsan iki kez büyütürsün: bir kez Creative ile (genel görüntü, kumaş, arka plan, metal parıltısı), bir kez Precision ile (yüz, logo, yazı). İkisini Photoshop'ta üst üste koyup Precision katmanına maske eklersin ve sadece yüzün ya da logonun olduğu bölgeyi açarsın. Böylece Creative'in güzel dokusunu alırken müşterinin tanıması gereken kısımlar bozulmaz. Takı işinde bu çok işe yarar: zincir ve kumaş Creative'den, markanın logo plakası Precision'dan gelir.\n2. **Önce ışık, sonra büyütme.** Görselin ışığını ya da arka planını değiştireceksen (Relight gibi araçlarla) bunu büyütmeden önce yaparsın, en son Precision ile keskinleştirirsin. Sıra ters olursa büyütülmüş detaylar ışık değişince yeniden bozulur.\n3. **Videoya geçmeden önce büyüt.** Bir görseli sonradan videoya çevireceksen önce büyüt. Video modelleri ne kadar net bir başlangıç karesi alırsa o kadar temiz hareket üretir; bulanık görsel, plastik görünen video demektir.\n\nTeslimden önce deneyimli üreticilerin kullandığı kısa bir kontrol listesi de var. Büyütülmüş görseli %100'de açıp şunlara bakarsın: logo bozulmamış mı, etiket yazısı okunuyor mu, metal ve camda yansımalar temiz mi, ürün keskin mi, fazladan parmak ya da eğrilmiş kenar gibi AI izi var mı, ışık yönü her yerde tutarlı mı. Bu listeyi her ürün işinde aynı sırayla uygulamak, \"neden bu fark edilmedi\" anlarını büyük ölçüde ortadan kaldırır.\n\n### Ödev\n\n1. Bir takı ürünü görseli seç (önceki derslerde ürettiğin bir görsel, ekipte çalışılan bir iş ya da hayali bir takı markası olabilir).\n2. Aynı görseli üç kez 2x büyüt: Precision Sublime (Balanced), Creative Subtle ve Creative Wild.\n3. Her birini %100 yakınlaştırıp üç not al: en doğal hangisi, hangisinde AI yeni detay uydurdu, hangisi baskıya uygun.\n4. Kazananı A3 için gereken boyuta çıkar ve ayarlarını tarif kartına ekle.\n5. İstersen hibrit yöntemi de dene: Creative ve Precision sonuçlarını Photoshop'ta birleştirip logoyu ya da taşı Precision katmanından al. Toplam 20-30 dakika. Sonuçları Claude'a göster; hangi işte hangi ayarı varsayılan yapacağına birlikte karar verebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Oran değişince görselin piksel boyutu değişir, bu da başlangıçtaki rastgele karmaşayı (gürültüyü) değiştirir. Seed aynı kalsa bile başlangıç farklı olduğu için görsel de farklı çıkar. Tekrar üretmek için model, prompt, ayarlar ve seed'in dördü de aynı kalmalı.\n2. Parça düzeltme (inpaint). Seed sabit olsa bile prompt değişince görselin geri kalanı biraz kayar. Sadece değişecek parçayı seçip düzeltmek, geri kalan her şeyi birebir korur.\n\nSıradaki ders: Mini proje: bir sosyal medya görseli baştan sona\n\n### Kaynaklar\n\n- [Magnific – Upscaler Creative API belgesi (ayarlar ve ölçekler)](https://docs.magnific.com/api-reference/image-upscaler-creative/post-image-upscaler)\n- [Magnific Blog – Best AI Image Upscalers in 2026](https://www.magnific.com/blog/ai-image-upscaler/)\n- Magnific bağlantısındaki güncel upscale modları ve hazır ayar değerleri (2 Ekim 2026)", "module": 1, "moduleName": "Temeller", "n": 7, "summary": ["AI upscale görseli büyütürken eksik detayı kendisi çizer; bu bazen güzelleştirir, bazen logo ve yüzü bozar.", "Creative yeni detay ekleyip zenginleştirir; Precision orijinale sadık kalır, gerçek fotoğraf, yüz ve logo için onu seç.", "Upscale her zaman en son adımdır; sadece onaylanmış görseli büyüt.", "Sonucu her zaman %100 yakınlaştırarak kontrol et ve HDR ile keskinliği az az artır.", "A3 baskı için 2K görseli 2x büyütmek çoğu zaman yeter."], "title": "Upscale: ne zaman, hangi ayarla"}, {"checked": "Ekim 2026", "date": "2 Ekim 2026", "flow": {"edges": [{"a": "brief", "b": "sk", "k": "f"}, {"a": "sk", "b": "draft", "k": "txt", "l": "boş alan nerede"}, {"a": "draft", "b": "dir", "k": "img", "l": "en iyi yön"}, {"a": "dir", "b": "final", "k": "txt", "l": "prompt"}, {"a": "final", "b": "upc", "k": "img", "l": "4:5"}, {"a": "final", "b": "story", "k": "img"}, {"a": "upc", "b": "ps", "k": "img"}, {"a": "story", "b": "ps", "k": "img", "l": "9:16"}, {"a": "ps", "b": "exp", "k": "f"}, {"a": "exp", "b": "card", "k": "f"}], "groups": [{"c1": 0, "c2": 1, "label": "Planla", "r1": 0, "r2": 0}, {"c1": 2, "c2": 3, "label": "Yönü bul", "r1": 0, "r2": 0}, {"c1": 4, "c2": 5, "label": "Final", "r1": 0, "r2": 1}, {"c1": 6, "c2": 8, "label": "Tasarla ve teslim et", "r1": 0, "r2": 1}], "nodes": [{"c": 0, "id": "brief", "pv": {"items": ["Konu: sonbahar üyelik kampanyası", "Duygu: enerjik, kararlı", "Ölçü: 4:5 + 9:16", "Metin: Sezonu Güçlü Aç", "Renk: gri, neon turuncu, beyaz"], "k": "list"}, "r": 0, "s": 1, "t": "brief", "title": "Brief, beş satır"}, {"c": 1, "id": "sk", "pv": {"k": "sketch"}, "r": 0, "s": 2, "t": "paper", "text": "Sporcu alt-orta, başlık üstte, logo sağ altta.", "title": "Kaba eskiz"}, {"c": 2, "chips": ["Nano Banana 2 Lite", "4:5"], "id": "draft", "pv": {"ar": "4:5", "items": [{"m": "🏋️", "tag": "", "tone": "dark"}, {"m": "🏋️", "tag": "", "tone": "warm"}, {"m": "🏋️", "tag": "", "tone": "grey"}, {"m": "🏋️", "tag": "", "tone": "dark"}], "k": "grid"}, "r": 0, "s": 3, "t": "gen", "text": "Amaç güzel görsel değil, doğru yön.", "title": "4 taslak"}, {"c": 3, "chips": ["tek değişken"], "id": "dir", "r": 0, "s": 4, "t": "prompt", "text": "Gerekirse sadece ışığı ya da sadece açıyı değiştir.", "title": "Yönü seç"}, {"c": 4, "chips": ["Seedream 5 Pro", "2K"], "id": "final", "pv": {"ar": "4:5", "k": "img", "m": "🏋️", "tag": "Seed not edildi", "tone": "dark"}, "r": 0, "s": 5, "t": "gen", "title": "Final üretim"}, {"c": 5, "id": "story", "pv": {"items": ["4:5", "9:16"], "k": "ratios", "m": "🏋️", "tone": "dark"}, "r": 1, "s": 6, "t": "expand", "text": "Yukarı ve aşağı genişlet; sporcu birebir aynı kalır.", "title": "Story versiyonu", "tool": "Expand"}, {"c": 6, "id": "ps", "pv": {"items": ["Logo", "Alt yazı", "Sezonu Güçlü Aç", "Gradient", "Görsel"], "k": "layers"}, "r": 0, "s": 7, "t": "ps", "text": "Göz önce sporcuya, sonra başlığa, en son logoya.", "title": "Yazı ve logo", "tool": "Photoshop"}, {"c": 5, "id": "upc", "r": 0, "s": 8, "t": "upscale", "text": "Instagram'a 2K yeter; afiş basılacaksa yazısız hâli upscale.", "title": "Boyut kontrolü"}, {"c": 7, "id": "exp", "pv": {"items": ["1080×1350 JPG", "1080×1920 JPG", "Instagram taslağında kontrol"], "k": "list"}, "r": 0, "s": 9, "t": "export", "title": "Dışa aktar ve test et"}, {"c": 8, "end": true, "id": "card", "pv": {"items": ["Model, prompt, seed", "Ayarlar", "Bir sonraki fitness işi buradan"], "k": "list"}, "r": 0, "s": 10, "t": "card", "title": "Tarif kartı"}], "title": "Bir gönderi brief'ten paylaşıma on adımda biter: önce yön, sonra kalite"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Müşterinin kendi çektiği bir ürün fotoğrafını A3 afiş için büyüteceksin. Creative mi seçersin, Precision mı? Neden?\n2. Upscale iş akışının hangi aşamasında yapılır ve neden orada?\n\n### Konu\n\nBu derste yeni bir teknik öğrenmiyoruz; şimdiye kadar öğrendiğin yedi parçayı tek bir gerçek işte birleştiriyoruz. Araç haritası, prompt anatomisi, prompt pratiği, model seçimi, oran ve ölçü, seed ve varyasyon, upscale. Hepsi tek tek anlamlı ama asıl değer onları doğru sırayla kullanınca ortaya çıkıyor.\n\nBenzetme: Şimdiye kadar spor salonunda her hareketi ayrı ayrı öğrendin: ısınma, ağırlık, esneme. Bu derste ilk kez baştan sona tam bir antrenman yapıyoruz. Isınmadan ağır kaldırırsan ya da esnemeyi en başa koyarsan antrenman verimsiz olur, hatta sakatlanırsın; sıra önemlidir.\n\nNeden önemli: Ajansta AI ile en çok vakit, sırasız çalışırken kaybedilir. Brief netleşmeden üretmeye başlamak, her taslağı büyütmek, yazıyı AI'a yazdırıp Türkçe harflerle boğuşmak... Bunların hepsi kredi ve saat yakar. Bir iş akışın (workflow) olunca her yeni işte aynı yolu izler, daha az denemeyle daha iyi sonuca ulaşırsın.\n\nBu dersin senaryosu: Bir mahalle spor salonu, sonbahar dönemi için yeni üyelik kampanyasını duyuruyor. Senden bir Instagram gönderisi (4:5) ve aynı görselin story versiyonu (9:16) isteniyor. Üzerinde başlık, kısa bir slogan ve salonun logosu olacak.\n\nİş akışı yedi adım:\n\n1. Brief'i çöz: kim, ne, nerede, hangi duygu, hangi ölçü, üzerinde ne yazacak.\n2. Görsel fikri ve kompozisyonu planla: yazı nereye gelecek, sporcu ya da ürün nerede duracak.\n3. Prompt'u anatomiyle yaz: özne, ortam, ışık, stil, kamera + yazı için boş alan.\n4. Hızlı ve ucuz modelle taslak üret, en iyi yönü seç.\n5. Seçtiğini kaliteli modelde netleştir, seed ve varyasyonla incele.\n6. Yazıyı ve logoyu Photoshop/Illustrator'da ekle (AI'a Türkçe yazı yazdırmak riskli).\n7. Gerekirse upscale et, dışa aktar, telefonda kontrol et.\n\nEn önemli fikir: AI görselin kendisini üretir, tasarımı sen yaparsın. Yazı, logo, hiyerarşi ve son kontrol senin işin. AI'dan \"bitmiş afiş\" değil, \"mükemmel bir arka plan ve sahne\" istemek çoğu zaman daha hızlı ve daha kontrollü sonuç verir.\n\nKompozisyonda iki kritik nokta:\n\n- Boş alan bırakmak: Prompt'a yazının geleceği yeri söylemezsen AI kadrajı doldurur, sonra başlığı koyacak yer bulamazsın. \"empty space at the top for text\" gibi bir ifade bu yüzden prompt'un parçasıdır.\n- Güvenli alan: Instagram profil ızgarasında gönderiler 3:4 kırpılarak görünür, story'de ise üstte profil bilgisi, altta yanıt kutusu yazının üstüne biner. Önemli her şeyi (sporcu, başlık, logo) ortaya yakın tut; kenarlara sadece atmosfer koy.\n\nModel seçimi (Magnific'te bu dersin hazırlandığı tarihteki güncel liste üzerinden):\n\n- Hızlı taslak için: Google Nano Banana 2 Lite ya da Recraft V4.1. Birkaç saniyede sonuç verir, ucuzdur; fikir denemek için ideal.\n- Son görsel için: Seedream 5 Pro (genel amaçlı, fotoğraf gerçekçiliği ve ürün görselinde güçlü) ya da Google Nano Banana Pro (marka ve detay sadakati gerektiğinde).\n- Görselin içinde okunur yazı gerekiyorsa: GPT 2 / GPT 2.5. Yazı, infografik ve düzen ağırlıklı tasarımda en iyisi. Yine de Türkçe karakterleri (ğ, ş, ı, İ) mutlaka harf harf kontrol et.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Brief | Müşterinin işi tarif ettiği kısa talimat: amaç, hedef kitle, ölçü, metin, teslim tarihi | brief |\n| İş akışı | Bir işi baştan sona hep aynı sırayla yapma düzeni | workflow |\n| Ruh hali panosu | Hedeflenen havayı gösteren referans görsel koleksiyonu | moodboard |\n| Boş alan | Görselde yazı ve logo için bilerek boş bırakılan bölge | negative space, copy space, empty space for text |\n| Güvenli alan | Platform arayüzünün ya da kırpmanın kapatmayacağı, önemli öğelerin durması gereken orta bölge | safe zone |\n| Görsel hiyerarşi | Gözün önce neyi, sonra neyi göreceğinin sıralaması (sporcu → başlık → logo gibi) | visual hierarchy |\n| Taslak turu | Ucuz ve hızlı üretimle fikir denediğin ilk aşama | draft, iteration |\n| Dışa aktarma | Bitmiş görseli doğru biçim ve ölçüde kaydetmek | export |\n\n### Uygulama\n\n1. Brief'i beş satıra indir (bir not dosyasına yaz): Konu: sonbahar üyelik kampanyası, kettlebell ile antrenman yapan bir sporcu. Duygu: enerjik, kararlı, motive edici. Ölçü: 4:5 gönderi (1080×1350) + 9:16 story (1080×1920). Metin: \"Sezonu Güçlü Aç\" başlığı, \"Sonbahar üyelik fırsatı başladı\" alt yazısı, logo. Renk: kömür grisi, neon turuncu, beyaz.\n2. Kompozisyonu kâğıda çiz (30 saniyelik kaba eskiz yeter): Sporcu alt-orta bölümde, başlık üstte, logo sağ altta. Bu eskiz, prompt'ta \"boş alan nerede\" sorusunun cevabıdır.\n3. Magnific'te görsel üretim ekranını aç, model olarak Google Nano Banana 2 Lite seç, oranı 4:5 yap. Aşağıdaki 1. prompt'la 4 taslak üret. Amaç güzel görsel değil, doğru yönü bulmak: ışık doğru mu, üstte boş alan var mı, sporcu doğru yerde mi?\n4. Beğendiğin yönü seç. Gerekirse prompt'ta tek bir şeyi değiştir (prompt pratiği dersindeki gibi): sadece ışık, ya da sadece kamera açısı. Her seferinde tek değişken.\n5. Yön netleşince modeli Seedream 5 Pro'ya çevir, çözünürlüğü 2K yap ve aynı prompt'la üret. Beğendiğin sonucun seed'ini not et; küçük farklar için varyasyon al. Ellerde fazladan parmak ya da kettlebell sapında garip bir bükülme gibi bir hata varsa bunu Modül 2'de öğreneceğimiz parça düzeltmeyle (inpaint) halledeceğiz; şimdilik birkaç varyasyon arasından en temizini seçmek yeterli.\n6. Story versiyonu: Aynı prompt'u 9:16 oranla üretebilirsin ama kompozisyon değişir. Alternatif olarak görseli genişletme (expand) aracıyla 4:5'i yukarı ve aşağı uzatıp 9:16'ya çevir; böylece sporcu birebir aynı kalır. (Genişletmeyi ileride ayrıca işleyeceğiz, bu derste sadece dene.)\n7. Görselleri indirip Photoshop'ta aç. Başlığı, alt yazıyı ve logoyu ekle. Hiyerarşiyi kontrol et: göz önce sporcuya, sonra başlığa, en son logoya gitmeli. Başlık okunmuyorsa altına hafif bir karartma (gradient) koy.\n8. Boyut kontrolü: 2K üretim Instagram için yeterli, upscale gerekmez. Bu görsel salonun girişine afiş olarak da basılacaksa ancak şimdi, yazı eklemeden önceki temiz hâlini upscale et (upscale dersi).\n9. 1080×1350 ve 1080×1920 olarak JPG dışa aktar, telefonuna at ve Instagram'da taslak olarak bak. Profil ızgarasında 3:4 kırpılınca başlık kesiliyor mu, story'de yazı arayüzün altında kalıyor mu kontrol et.\n10. Kullandığın model, prompt, seed ve ayarları tarif kartına (prompt kütüphanene) kaydet. Bir sonraki spor salonu ya da fitness işinde buradan başlayacaksın.\n\n### Örnek prompt'lar\n\n`A determined athlete lifting a kettlebell in a modern gym, chalk dust in the air, dramatic side light from a large window, dark concrete walls and rubber floor, orange accent lights softly blurred in the background, large empty space at the top for text, vertical 4:5 Instagram post, fitness lifestyle photography`\n\nSpor salonu kampanyası, taslak turu: Prompt anatomisinin tamamı burada: özne (sporcu), eylem (kettlebell kaldırıyor), ortam (modern salon), ışık (pencereden yan ışık), stil (fitness lifestyle fotoğrafı), kompozisyon (üstte boş alan). Nano Banana 2 Lite ile 4 taslak üret, yönü seç.\n\n`Close-up of a female athlete gripping a kettlebell handle in a gym by a large window overlooking the city at sunrise, sweat on her forearm, warm morning light, shallow depth of field, 50mm lens, charcoal gray and neon orange color palette, empty space at the top, vertical 4:5`\n\nAynı iş, ikinci tur: Yerel bir dokunuş (şehir manzarası, gün doğumu), lens bilgisi ve renk paleti eklendi. Seedream 5 Pro ile 2K üret. Renk paletini brief'teki marka renklerine göre yazmak, Photoshop'ta yazı rengini seçmeyi de kolaylaştırır.\n\n`Instagram post design for an autumn gym membership campaign, an athlete with a kettlebell at the bottom center, dark charcoal background with neon orange accents, bold condensed sans-serif headline at the top that reads \"Own the Season\", clean modern layout, 4:5`\n\nYazılı tasarım denemesi: GPT 2 / GPT 2.5 modelleri yazıyı düzgün yazabilir. İngilizce başlık genelde sorunsuzdur; Türkçe başlık denersen ğ, ş, ı harflerini tek tek kontrol et. Müşteriye gidecek işte yazıyı yine de Photoshop'ta koymak en güvenlisi; bu prompt'u daha çok yerleşim fikri almak için kullan.\n\n`A glass dropper bottle of vitamin C serum on a wet white stone, fresh orange slices and water droplets around it, soft diffused daylight, minimal clean background, generous empty space on the left side for text, vertical 4:5, skincare product photography`\n\nKozmetik ürünü: Aynı iş akışı farklı bir müşteride. Boş alan bu kez solda, çünkü başlık ve fiyat oraya gelecek. Ambalajında yazı olan ürünlerde son görseli Nano Banana Pro ile üretmek, etiket ve renk detayında daha sadık sonuç verebilir.\n\n`A juicy smash burger with melted cheese on a dark slate board, fries on the side, dramatic warm side light, smoke rising in the background, dark empty area at the top for the offer text, vertical 4:5 food poster, cinematic food photography`\n\nRestoran kampanyası: Üstteki koyu boş alana kampanya adı, fiyat ve şube bilgisi gelecek. Markanın logosunu ya da ambalaj yazısını AI'a çizdirmek yerine her zaman orijinal dosyadan sen yerleştir.\n\n### Sık yapılan hatalar\n\n- **Brief'i okumadan üretmeye başlamak.** Ölçü, metin ve renk baştan belli değilse güzel bir görsel üretip sonra \"yazı nereye sığacak\" diye uğraşırsın. Önce beş satırlık brief, sonra prompt.\n- **Prompt'ta boş alan istememek.** AI kadrajı doldurmayı sever; yazı alanını prompt'ta açıkça istemezsen başlığı sporcunun ya da ürünün üstüne koymak zorunda kalırsın.\n- **Taslak turunu pahalı modelle yapmak.** Fikir denerken hızlı ve ucuz modeli kullan; kaliteli modeli sadece yön belli olunca devreye sok.\n- **Telefonda kontrol etmeden teslim etmek.** Bilgisayar ekranında harika duran başlık, profil ızgarasında kesilebilir ya da story'de arayüzün altında kalabilir.\n\n### Profesyonel yöntem\n\nBir kampanya tek bir görselle bitmez; spor salonu bu gönderiden sonra muhtemelen \"kişisel antrenman\", \"grup dersleri\" ve \"yıllık üyelik\" görsellerini de isteyecek. Profesyonel ekipler bu yüzden işe tek bir prompt'la değil, bir **ana prompt şablonuyla** başlar. Mantık şu: kurallar bir kere yazılır, sadece içerik değişir.\n\n1. **Önce marka rehberini çıkar.** Üretime başlamadan önce Claude gibi bir sohbet asistanına markayı anlat (ya da web sitesini ver) ve kısa bir rehber yazdır: renkler, ışık tarzı, kadraj alışkanlıkları, hava (\"enerjik ama kibar\", \"sert ve iddialı\" gibi). Sonunu \"başlamadan bana soru sorabilirsin\" diye bitirmek, eksik bilgiyi ortaya çıkarır.\n2. **Ana prompt şablonunu yaz.** Rehberi sabit bir prompt iskeletine çevir: ışık, renk paleti, lens, stil ve boş alan kuralı hep aynı kalır; sadece özne ve eylem kısmı değişir. Örneğin şablon \"dramatic side light, charcoal gray and neon orange palette, 50mm lens, empty space at the top\" kısmını sabit tutar, \"[ÖZNE: kettlebell kaldıran sporcu / ip atlayan grup / antrenörle çalışan üye]\" kısmı her görselde değişir. Böylece on görsel bile aynı markanın elinden çıkmış gibi görünür.\n3. **Dört temel kareyi düşün.** Ürün ya da hizmet görsellerinde sektörde sık kullanılan dört kare tipi var: sade beyaz ya da düz fon (temiz tanıtım), stüdyo/gradyan fon (premium his), yüzey üzerinde kahraman kare (doku ve temas gölgesi), lifestyle (kullanım anı). Spor salonunda bu; sade fonda ekipman, stüdyo ışığında sporcu portresi, zeminde ekipman detayı ve antrenman anı olabilir. Kampanya setini bu dört kareden kurmak hem çeşitlilik hem tutarlılık sağlar.\n4. **Logoyu ve yazıyı AI'a bırakma.** Logo her görsele sonradan, aynı yere ve aynı boyutta basılır. AI'ın çizdiği logo her karede biraz farklı olur ve markayı bozar.\n5. **Teslimden önce kalite kontrol.** Her görselde aynı listeyi kullan: yazı okunaklı ve doğru mu, marka renkleri tutuyor mu, logo bozulmamış mı, nesneler zemine gerçekçi gölgeyle oturuyor mu, ölçek doğru mu, fazladan parmak ya da eğrilmiş kenar gibi AI izi var mı, ışık yönü tutarlı mı, ana özne keskin mi, arka plan brief'e uygun mu.\n\nNeden işe yarıyor: Şablon kararları bir kez verdirir. Her yeni görselde ışığı, rengi ve kadrajı yeniden düşünmezsin; enerjini fikre ve son kontrole harcarsın. Ekipte biri hastalandığında ya da işi başka biri devraldığında da şablon ve tarif kartı sayesinde aynı görsel dil kesintisiz devam eder.\n\n### Ödev\n\n1. Bir spor salonu, pilates stüdyosu ya da fitness markası için (gerçek bir müşteri, yakında gelecek bir iş ya da bu dersteki senaryo) beş satırlık brief yaz.\n2. Kaba kompozisyon eskizini çiz ve markanın sabit kurallarını (ışık, renk, lens, boş alan) içeren kısa bir ana prompt şablonu hazırla.\n3. Hızlı modelle 4 taslak üret, birini seçip kaliteli modelde 2K üret.\n4. Photoshop'ta başlık ve logoyu ekle, 4:5 ve 9:16 dışa aktar, telefonda kontrol et; kalite kontrol listesinden geçir.\n5. Toplam 25-30 dakika. Brief'ini, şablonunu ve bitmiş görseli Claude'a göster; kompozisyon, hiyerarşi ve prompt üzerine yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Precision (Photo ya da Sublime). Gerçek bir fotoğrafta AI'ın yeni detay uydurması (halüsinasyon) ürünün aslından farklı görünmesine yol açar; müşteri kendi ürününü tanımalı. Precision görsele olabildiğince dokunmadan büyütür.\n2. En son adımda: görsel seçilip revizyonlar ve rötuş bittikten sonra. Her taslağı büyütmek kredi yakar, büyüttükten sonra düzeltme yapmak da daha zahmetlidir.\n\nSıradaki ders: Işık dili ve terimleri\n\n### Kaynaklar\n\n- Magnific bağlantısındaki güncel görsel modeli listesi ve önerilen kullanım alanları (2 Ekim 2026)", "module": 1, "moduleName": "Temeller", "n": 8, "summary": ["Bir sosyal medya görseli brief, eskiz, ucuz taslak, kaliteli final, yazı-logo, kontrol sırasıyla yapılır.", "Önce beş satırlık brief yaz ve prompt'ta yazı için boş alanı mutlaka iste.", "Taslakları hızlı ve ucuz modelle üret, kaliteli modeli sadece yön belli olunca kullan.", "AI sahneyi üretir, tasarımı sen yaparsın: başlık, Türkçe yazı ve logo Photoshop'ta eklenir.", "Teslimden önce telefonda, profil ızgarasında ve story'de kontrol et; tarifi kaydet."], "title": "Mini proje: bir sosyal medya görseli baştan sona"}, {"checked": "Ekim 2026", "date": "3 Ekim 2026", "flow": {"edges": [{"a": "set", "b": "ctl", "k": "f"}, {"a": "ctl", "b": "l1", "k": "txt", "l": "+ ışık"}, {"a": "ctl", "b": "l2", "k": "txt", "l": "+ ışık"}, {"a": "ctl", "b": "l3", "k": "txt", "l": "+ ışık"}, {"a": "ctl", "b": "l4", "k": "txt", "l": "+ ışık"}, {"a": "l1", "b": "cmp", "k": "img"}, {"a": "l2", "b": "cmp", "k": "img"}, {"a": "l3", "b": "cmp", "k": "img"}, {"a": "l4", "b": "cmp", "k": "img"}, {"a": "cmp", "b": "rim", "k": "f", "l": "kazanan"}, {"a": "rim", "b": "fin", "k": "txt", "l": "prompt"}, {"a": "fin", "b": "card", "k": "f"}], "groups": [{"c1": 0, "c2": 1, "label": "Kontrol", "r1": 0, "r2": 0}, {"c1": 2, "c2": 2, "label": "Dört ışık", "r1": 0, "r2": 3}, {"c1": 3, "c2": 5, "label": "Seç ve güçlendir", "r1": 0, "r2": 1}], "nodes": [{"c": 0, "chips": ["Nano Banana 2 Lite", "4:5"], "id": "set", "r": 0, "s": 1, "t": "gen", "text": "Karşılaştırma turu için hızlı ve ucuz.", "title": "Hızlı model"}, {"c": 1, "id": "ctl", "pv": {"k": "txt", "v": "a glass perfume bottle with amber liquid on a stone pedestal, product photography, vertical 4:5"}, "r": 0, "s": 2, "t": "prompt", "text": "Modelin kendi seçtiği ışığı gösterir.", "title": "Işıksız temel prompt"}, {"c": 2, "id": "l1", "pv": {"ar": "4:5", "k": "img", "m": "🧴", "tag": "soft diffused daylight", "tone": "day"}, "r": 0, "s": 3, "t": "gen", "title": "Yumuşak gün ışığı"}, {"c": 2, "id": "l2", "pv": {"ar": "4:5", "k": "img", "m": "🧴", "tag": "hard direct midday sunlight", "tone": "hard"}, "r": 1, "s": 3, "t": "gen", "title": "Sert öğle güneşi"}, {"c": 2, "id": "l3", "pv": {"ar": "4:5", "k": "img", "m": "🧴", "tag": "warm golden hour side light", "tone": "gold"}, "r": 2, "s": 3, "t": "gen", "title": "Altın saat"}, {"c": 2, "id": "l4", "pv": {"ar": "4:5", "k": "img", "m": "🧴", "tag": "low-key, single spotlight", "tone": "dark"}, "r": 3, "s": 3, "t": "gen", "title": "Low-key spot"}, {"c": 3, "id": "cmp", "pv": {"items": ["Gölge nereye düşüyor?", "Sıcak mı soğuk mu?", "Pahalı mı, katalog mu?"], "k": "list"}, "r": 1, "s": 4, "t": "compare", "title": "Yan yana incele"}, {"c": 4, "id": "rim", "pv": {"k": "txt", "v": "… , rim light"}, "r": 1, "s": 5, "t": "prompt", "text": "Cam kenarında ışık çizgisi; şişe fondan ayrılır.", "title": "Kazanana ek"}, {"c": 5, "chips": ["Nano Banana Pro", "4:5", "2K"], "id": "fin", "pv": {"ar": "4:5", "k": "img", "m": "🧴", "tag": "rim light + low-key", "tone": "dark"}, "r": 1, "s": 6, "t": "gen", "title": "Final"}, {"c": 5, "end": true, "id": "card", "pv": {"items": ["soft diffused daylight", "golden hour side light", "low-key + rim light"], "k": "list"}, "r": 0, "s": 7, "t": "card", "title": "Işık sözlüğü"}], "title": "Sahne aynı, sadece ışık değişince parfüm şişesi dört farklı hikâye anlatır"}, "genhq": false, "level": "Başlangıç", "md": "### Hızlı tekrar\n\n1. Ders 8'de AI'dan neden \"bitmiş afiş\" yerine \"yazı için boş alanı olan bir sahne\" istemeyi önerdik?\n2. Taslak turunda hangi tür modeli, son görselde hangi tür modeli kullanırsın? Neden bu sırayla?\n\n### Konu\n\nModül 1'de bir görseli baştan sona üretmeyi öğrendik. Modül 2'de artık görseli kontrol etmeyi öğreniyoruz ve ilk durak ışık. Çünkü bir görselin \"ucuz\" mu \"pahalı\" mı göründüğünü çoğu zaman özne değil ışık belirler. Aynı parfüm şişesi, düz bir ışıkta katalog fotoğrafı gibi durur; yandan gelen sıcak bir ışıkta, camın içinde parlayan bir reklam afişine dönüşür.\n\nBenzetme: Işık, görselin ses tonu gibidir. Aynı cümleyi fısıldayarak da söyleyebilirsin, bağırarak da; kelimeler aynı, his tamamen farklı. Prompt'ta özneyi yazmak cümleyi kurmak, ışığı yazmak ise o cümleyi hangi tonla söyleyeceğine karar vermektir.\n\nNeden önemli: Prompt'a ışık yazmazsan model kendi \"ortalama\" ışığını seçer: genelde düz, her yeri eşit aydınlatan, biraz sıkıcı bir ışık. Işığı sen tarif edince hem havayı (sıcak, dramatik, temiz, lüks) hem de gözün nereye bakacağını sen belirlersin. Üstelik ışık terimleri fotoğrafçıların ortak dilidir; modeller milyonlarca fotoğrafın açıklamasıyla eğitildiği için bu terimleri çok iyi tanır.\n\nIşığı tarif ederken dört soru sor:\n\n1. Nereden geliyor? (yön) Önden gelen ışık her şeyi düz ve net gösterir. Yandan gelen ışık doku ve hacim çıkarır, bir taraf aydınlık bir taraf gölgede kalır. Arkadan gelen ışık öznenin kenarına parlak bir çizgi çizer, onu arka plandan ayırır. Üstten gelen ışık sert gölgeler yapar, öğle güneşi gibi.\n2. Sert mi yumuşak mı? (kalite) Küçük ve uzak bir ışık kaynağı (öğle güneşi, çıplak ampul) keskin kenarlı, koyu gölgeler yapar: sert ışık. Büyük ve yakın bir kaynak (bulutlu gökyüzü, büyük pencere, softbox) gölgeleri yumuşatır: yumuşak ışık. Parfüm, takı ve kozmetikte genelde yumuşak, spor ve dramatik işlerde sert ışık tercih edilir.\n3. Hangi renkte? (renk sıcaklığı) Gün batımı, mum ve ampul turuncu-sarıdır: sıcak. Gölge, sabah erken saat ve gece mavisi soğuktur. Odunsu ve oryantal kokular, kafe ve sonbahar işleri sıcak; ferah kokular, teknoloji ve temizlik ürünleri soğuk ışığı sever.\n4. Ne kadar karanlık, ne kadar aydınlık? (kontrast ve hava) Her yeri aydınlık, beyaz ağırlıklı, gölgesi az görsel ferah ve temizdir (high-key). Karanlık ağırlıklı, sadece önemli yerin aydınlandığı görsel gizemli ve lükstür (low-key).\n\nBunlara ek olarak işine çok yarayacak birkaç hazır ışık kalıbı var:\n\n- Altın saat (golden hour): Gün batımından hemen önceki alçak, sıcak, yumuşak güneş. Yaşam tarzı ve doğa görsellerinde en güvenli seçim.\n- Mavi saat (blue hour): Güneş battıktan hemen sonraki mavi-mor gökyüzü. Şehir manzarası, gece mekân tanıtımları için.\n- Üç nokta ışık (three-point lighting): Ana ışık + gölgeleri dolduran dolgu ışığı + arkadan kenar ışığı. Stüdyo ürün ve portre çekimlerinin klasik kurulumu.\n- Rembrandt ışığı: Yüzün bir yanı aydınlık, gölgeli yanakta küçük üçgen bir ışık kalır. Ressam Rembrandt'ın portrelerinden adını alır; ciddi, sanatsal portreler için.\n- Hacimli ışık (volumetric light / god rays): Toz, sis ya da duman içinde görünen ışık hüzmeleri. Konser, spor ve etkinlik posterlerinde sahne ya da stadyum ışığı için birebir.\n- Neon ışık: Renkli, parlak tabela ışığı. Gece hayatı, gençlik, oyun ve teknoloji işleri için.\n\nAltın kural: Prompt'a tek bir \"beautiful lighting\" yazmak yerine yönünü, kalitesini ve rengini söyle. \"warm soft side light from a window\" (pencereden gelen sıcak, yumuşak yan ışık) üç bilgiyi birden verir ve modelin tahmin etmesine yer bırakmaz.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Sert ışık | Küçük ve uzak kaynaktan gelen, keskin kenarlı koyu gölgeler yapan ışık | hard light, harsh light |\n| Yumuşak ışık | Büyük ya da dağınık kaynaktan gelen, gölgeleri yumuşak geçişli yapan ışık | soft light, diffused light |\n| Ana ışık | Sahneyi aydınlatan en güçlü, baskın ışık | key light |\n| Dolgu ışığı | Ana ışığın bıraktığı gölgeleri hafifçe açan ikinci ışık | fill light |\n| Kenar ışığı | Arkadan gelip öznenin kenarına parlak çizgi çizen, onu arka plandan ayıran ışık | rim light, backlight |\n| Renk sıcaklığı | Işığın sıcak (turuncu) ya da soğuk (mavi) tonu; Kelvin (K) ile ölçülür | color temperature, warm / cool light |\n| Aydınlık ağırlıklı / karanlık ağırlıklı | Ferah, beyaz, az gölgeli görsel / koyu, gölgeli, sadece önemli yeri aydınlık görsel | high-key / low-key lighting |\n| Hacimli ışık | Sis, toz ya da duman içinde görünen ışık hüzmeleri | volumetric light, god rays |\n\n### Görsel örnek\n\n![Yumuşak pencere ışığı](img/d09-1.jpg)\n![Sert öğle güneşi](img/d09-2.jpg)\n![Arkadan kontur (rim) ışığı](img/d09-3.jpg)\n![Low-key dramatik spot](img/d09-4.jpg)\n\nAynı parfüm şişesi, aynı kadraj; sadece ışık değişince görselin havası katalogdan lükse dönüşüyor.\n\nNasıl üretildi: Nano Banana 2 Lite, 4:5. İlk görsel: 'glass perfume bottle with amber liquid on a stone pedestal, soft diffused daylight from a large window on the left'. Diğer üçü ilk görseli referans verip 'same bottle, same framing, change only the lighting: …' ile üretildi.\n\n### Uygulama\n\nSenaryo: Bir parfüm markası yeni kokusu için Instagram gönderisi istiyor. Şişe aynı kalacak; markaya en çok yakışan ışığı bulmak için aynı sahneyi sadece ışığı değiştirerek dört kez üreteceğiz (Ders 3'teki \"her seferinde tek değişken\" kuralı). Cam şişe ışığı hem yansıttığı hem de içinden geçirdiği için ışık farkını en net gösteren ürünlerden biridir.\n\n1. Magnific'te görsel üretim ekranını aç. Model olarak Google Nano Banana 2 Lite seç (hızlı ve ucuz, karşılaştırma turu için ideal), oranı 4:5 yap.\n2. Önce ışıksız bir temel prompt yaz ve 1 görsel üret: `a glass perfume bottle with amber liquid on a stone pedestal, product photography, vertical 4:5`. Bu senin \"kontrol\" görselin: modelin kendi seçtiği ışığı gösterir.\n3. Aynı prompt'un sonuna sadece ışık ekleyerek dört versiyon üret: (a) `soft diffused daylight from a large window`, (b) `hard direct midday sunlight, strong shadows`, (c) `warm golden hour side light, long shadows`, (d) `low-key lighting, dark background, single spotlight from above`. Prompt'un geri kalanına dokunma.\n4. Beş görseli yan yana koy (Magnific'te ya da Photoshop'ta bir artboard'a dizerek). Her birine şu gözle bak: Gölgeler nereye düşüyor, keskin mi yumuşak mı? Renk sıcak mı soğuk mu? Hangisi \"pahalı\" görünüyor, hangisi \"katalog\" gibi?\n5. Kazanan ışığı seç ve şimdi tek bir ek daha dene: `rim light` ekle. Şişenin cam kenarlarında ve kapağında ince bir ışık çizgisi belirdiğini göreceksin. Bu, ürünü arka plandan ayırmanın en kolay yolu.\n6. Beğendiğin sonucu son kalite için Google Nano Banana Pro ile (4:5 destekliyor) 2K olarak yeniden üret. Seedream 5 Pro'yu kullanacaksan dikkat: 4:5 oranı yok, 3:4 seçip Photoshop'ta kırpman gerekir.\n7. En iyi ışık ifadelerini tarif kartına (prompt kütüphanene) \"Işık\" başlığı altında kaydet. Birkaç hafta içinde hangi markaya hangi ışığın yakıştığını gösteren kendi ışık sözlüğün oluşur.\n\n### Örnek prompt'lar\n\n`A crystal perfume bottle with amber liquid on a black marble surface, low-key lighting, single soft spotlight from above, subtle rim light along the glass edges, warm golden glow inside the bottle, deep dark background, luxury fragrance advertising, vertical 4:5`\n\nParfüm reklamı (lüks, akşam kokusu): Karanlık ağırlıklı (low-key) ışık lüks ve gizem hissi verir. Kenar ışığı camın hatlarını çıkarır, üstten gelen spot ışık şişenin içindeki sıvıyı parlatır. Siyah fon, üzerine altın ya da beyaz yazı koymak için de rahattır.\n\n`A pale pink perfume bottle on a bathroom vanity next to fresh peonies, warm soft side light from a large window on the left, gentle shadows falling to the right, softly blurred background, empty space at the top for text, vertical 4:5, lifestyle product photography`\n\nParfüm tanıtımı (günlük, çiçeksi koku): Işık üç bilgiyle tarif edildi: sıcak (renk), yumuşak (kalite), soldan pencereden (yön). Gölgenin sağa düştüğünü de söylemek, modelin ışığı tutarlı kurmasına yardım eder.\n\n`A football on wet stadium grass at night, dramatic floodlights from behind creating volumetric light beams through light fog, hard rim light on the ball, cool blue and white tones, dark empty area at the top for match information, vertical 4:5 sports poster, cinematic`\n\nMaç günü posteri: Arkadan gelen projektör + sis = hacimli ışık hüzmeleri. Sert kenar ışığı topu karanlıktan koparır. Takım renklerini istersen \"cool blue\" yerine \"red and white smoke\" gibi renkli dumanla verebilirsin.\n\n`A plate of grilled sea bass with lemon and greens on a rustic wooden table by the sea, golden hour sunset light from behind, warm glow on the food, soft fill light on the front of the plate, Black Sea horizon softly blurred, horizontal 16:9 restaurant banner`\n\nRestoran tanıtımı: Arkadan gelen altın saat ışığı manzarayı güzelleştirir ama tabağı karanlıkta bırakabilir. Bu yüzden \"soft fill light on the front\" (önden hafif dolgu ışığı) ekledik; yemek aydınlık kalır.\n\n`A bottle of facial serum on a white podium, bright high-key studio lighting, soft even light with almost no shadows, clean white and pale blue background, fresh and minimal, square 1:1 skincare product advertising`\n\nKozmetik ürün reklamı: Aydınlık ağırlıklı (high-key) ışık temizlik, tazelik, güven hissi verir. Gölgesiz, eşit ışık e-ticaret görsellerinde de tercih edilir.\n\n### Sık yapılan hatalar\n\n- **Işığı \"beautiful lighting\" diye geçmek.** \"beautiful lighting\" ya da \"good lighting\" yazınca model bundan bir şey anlamaz, yine ortalama ışığı seçer. Yön, kalite ve rengi ayrı ayrı söyle.\n- **Birbiriyle çelişen ışıklar istemek.** \"golden hour\" ile \"blue neon light\" ve \"bright studio lighting\" aynı prompt'ta olunca model kararsız kalır, görsel bulanık bir karışıma döner. Bir ana ışık seç, en fazla bir destek ışığı ekle.\n- **Işığı sahneyle uyumsuz kurmak.** Gece geçen bir sahnede \"midday sunlight\" ya da kapalı bir odada \"golden hour\" istersen sonuç yapay görünür. Işık, ortamın mantığına uymalı (gece ise lamba, neon, ay ışığı; iç mekânsa pencere ya da lamba).\n- **Ürünü karanlıkta bırakmak.** Arkadan ışık (backlight) çok etkileyicidir ama ürünün önü kararır. Reklamda ürün her zaman okunmalı: arkadan ışık kullanıyorsan önden bir dolgu ışığı (fill light) ekle.\n\n### Profesyonel yöntem\n\nDeneyimli görsel üreticiler ışığı her seferinde sıfırdan düşünmez; prompt'u Lego gibi parçalara ayırır ve ışığı bu parçalardan sadece biri olarak ele alır. Sık önerilen sıralama şöyle: görüntü türü (fotoğraf, illüstrasyon), özne, kadraj ve kamera, lens, ışık, renk ya da film havası, ortam ve en sonda küçük bir dokunuş (hafif gren gibi). Neden işe yarar? Çünkü her parça yerinde durunca, sonucu değiştirmek istediğinde neyi değiştireceğini bilirsin. Parfüm görselinde sadece \"ışık\" parçasını değiştirip gerisini sabit tutarsan, farkın gerçekten ışıktan geldiğinden emin olursun.\n\nİkinci alışkanlık bir \"ışık bankası\" tutmak. Beğendiğin ışık ifadelerini (örneğin \"low-key, single soft spotlight from above, subtle rim light\") bir notta toplarsın. Zamanla aynı 2-3 ifadeyi bir markanın tüm görsellerinde kullanmaya başlarsın ve o marka için bir \"imza ışık\" oluşur. Kampanyanın beş görseli farklı sahnelerde olsa bile aynı aileden görünür.\n\nÜçüncüsü: sahneyi koru, sadece ışığı değiştir. Bir mekânın ya da ürünün gündüz ve gece versiyonu gerektiğinde (örneğin parfümün \"gündüz\" ve \"akşam\" kokusu), elindeki beğendiğin görseli bir sohbet asistanına (Claude gibi) gösterip \"bu sahnenin prompt'unu çıkar, sadece ışığı akşama çevir\" diyebilirsin. Böylece kompozisyon aynı kalır, sadece hava değişir.\n\nSon olarak, teslimden önce ışığı şu kısa listeyle kontrol et:\n\n1. Işık yönü tutarlı mı? Gölgeler ve parlamalar aynı kaynaktan geliyor gibi mi?\n2. Temas gölgesi gerçekçi mi? Şişe yüzeye oturuyor mu, havada mı duruyor?\n3. Cam ve metalde yansımalar temiz mi? Garip lekeler ya da anlamsız parlamalar var mı?\n4. Ürün net ve okunur mu? Etiket ve logo ışıkta kaybolmamış mı?\n\n### Ödev\n\nÜzerinde çalıştığın ya da yakında gelecek bir işten bir ürün seç (bir parfüm, bir kozmetik ürünü ya da elindeki başka bir ürün). Uygulamadaki gibi önce ışıksız bir temel prompt yaz, sonra sadece ışığı değiştirerek en az dört versiyon üret: yumuşak pencere ışığı, sert öğle güneşi, altın saat, low-key spot ışık.\n\n1. Beş görseli tek bir artboard'a diz ve her birinin altına hangi ışığı kullandığını yaz.\n2. Bu ürün için en doğru ışığı seç ve nedenini bir cümleyle not et.\n3. Kazanan ışık ifadesini ışık bankana (tarif kartına) ekle.\n4. Toplam 20-30 dakika ayır. Karşılaştırma panosunu ve prompt'larını Claude'a göster; hangi ışığın markaya daha çok yakıştığı ve prompt'taki ışık tarifini nasıl güçlendirebileceğin üzerine yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Çünkü AI görseli üretir, tasarımı sen yaparsın. Boş alan istemezsen AI kadrajı doldurur ve başlığa yer kalmaz. Ayrıca Türkçe yazıyı AI'a yazdırmak hata riskli; yazı, logo ve hiyerarşiyi Photoshop/Illustrator'da kendin koyunca hem daha hızlı hem daha kontrollü sonuç alırsın.\n2. Taslak turunda hızlı ve ucuz bir model (ör. Google Nano Banana 2 Lite, Recraft V4.1), son görselde kaliteli bir model (ör. Seedream 5 Pro, Google Nano Banana Pro). Fikir denerken çok sayıda üretim yaparsın; pahalı modelle yaparsan kredi ve zaman yakar. Kaliteli model ancak yön belli olunca devreye girer.\n\nSıradaki ders: Kamera ve lens terimleri (geniş açı, makro, alan derinliği)\n\n### Kaynaklar\n\n- Magnific bağlantısındaki güncel görsel modeli listesi, desteklenen oranlar ve önerilen kullanım alanları (3 Ekim 2026)\n", "module": 2, "moduleName": "Görseli kontrol etmek", "n": 9, "summary": ["Bir görselin ucuz mu pahalı mı göründüğünü çoğu zaman özne değil ışık belirler.", "Işığı dört soruyla tarif et: nereden geliyor, sert mi yumuşak mı, hangi renkte, ne kadar karanlık ya da aydınlık.", "\"beautiful lighting\" yerine yön, kalite ve rengi birlikte yaz; örneğin \"warm soft side light from a window\".", "Farkı görmek için sahneyi sabit tut, sadece ışığı değiştir; arkadan ışık kullanıyorsan ürünün önüne dolgu ışığı ekle.", "Beğendiğin ışık ifadelerini bir ışık bankasında topla; aynı ifadeler bir markanın imza ışığı olur."], "title": "Işık dili ve terimleri"}, {"checked": "Ekim 2026", "date": "3 Ekim 2026", "flow": {"edges": [{"a": "set", "b": "ctl", "k": "f"}, {"a": "ctl", "b": "k1", "k": "txt", "l": "+ kamera"}, {"a": "ctl", "b": "k2", "k": "txt", "l": "+ kamera"}, {"a": "ctl", "b": "k3", "k": "txt", "l": "+ kamera"}, {"a": "ctl", "b": "k4", "k": "txt", "l": "+ kamera"}, {"a": "k1", "b": "cmp", "k": "img"}, {"a": "k2", "b": "cmp", "k": "img"}, {"a": "k3", "b": "cmp", "k": "img"}, {"a": "k4", "b": "cmp", "k": "img"}, {"a": "cmp", "b": "low", "k": "f", "l": "(b) versiyonu"}, {"a": "low", "b": "fin", "k": "txt", "l": "prompt"}, {"a": "fin", "b": "card", "k": "f"}], "groups": [{"c1": 0, "c2": 1, "label": "Kontrol", "r1": 0, "r2": 0}, {"c1": 2, "c2": 2, "label": "Dört kamera", "r1": 0, "r2": 3}, {"c1": 3, "c2": 5, "label": "Açı ve final", "r1": 0, "r2": 1}], "nodes": [{"c": 0, "chips": ["Nano Banana 2 Lite", "4:5"], "id": "set", "r": 0, "s": 1, "t": "gen", "title": "Hızlı model"}, {"c": 1, "id": "ctl", "pv": {"k": "txt", "v": "a red compact SUV parked on an empty coastal road, warm golden hour side light, automotive photography, vertical 4:5"}, "r": 0, "s": 2, "t": "prompt", "text": "Işık sabit; farkı sadece kamera yaratacak.", "title": "Kamerasız temel prompt"}, {"c": 2, "id": "k1", "pv": {"ar": "4:5", "k": "img", "m": "🚙", "tag": "wide shot, deep focus", "tone": "warm"}, "r": 0, "s": 3, "t": "gen", "title": "Geniş açı 24mm"}, {"c": 2, "id": "k2", "pv": {"ar": "4:5", "k": "img", "m": "🚙", "tag": "shallow depth, bokeh", "tone": "blur"}, "r": 1, "s": 3, "t": "gen", "title": "85mm f/1.8"}, {"c": 2, "id": "k3", "pv": {"ar": "4:5", "k": "img", "m": "🚙", "tag": "far detayı", "tone": "gold"}, "r": 2, "s": 3, "t": "gen", "title": "100mm makro"}, {"c": 2, "id": "k4", "pv": {"ar": "4:5", "k": "img", "m": "🚙", "tag": "shot from directly above", "tone": "warm"}, "r": 3, "s": 3, "t": "gen", "title": "Tepeden görünüm"}, {"c": 3, "id": "cmp", "pv": {"items": ["Arka plan ne kadar görünüyor?", "Ne kadarı net?", "Hangisi parmağı durdurur?"], "k": "list"}, "r": 1, "s": 4, "t": "compare", "title": "Yan yana incele"}, {"c": 4, "id": "low", "pv": {"k": "txt", "v": "… , low angle, camera close to the ground near the front bumper"}, "r": 1, "s": 5, "t": "prompt", "text": "Araba birden güçlü ve anıtsal durur.", "title": "85mm'ye alçak açı"}, {"c": 5, "chips": ["Nano Banana Pro", "4:5", "2K"], "id": "fin", "pv": {"ar": "4:5", "k": "img", "m": "🚙", "tag": "low angle + bokeh", "tone": "blur"}, "r": 1, "s": 6, "t": "gen", "title": "Final"}, {"c": 5, "end": true, "id": "card", "pv": {"items": ["Işık: …", "Kamera: 85mm f/1.8, low angle", "Kamera: 100mm macro"], "k": "list"}, "r": 0, "s": 7, "t": "card", "title": "Kamera başlığı"}], "title": "Lens ve açı, aynı arabayı sıradan ya da anıtsal gösterir"}, "genhq": false, "level": "Başlangıç", "md": "### Hızlı tekrar\n\n1. Ders 9'da ışığı tarif ederken sorduğumuz dört soru neydi?\n2. Arkadan gelen ışık (backlight) çok güzel duruyor ama ürünün önü kararıyor. Prompt'a ne eklersin?\n\n### Konu\n\nÖnceki derste ışığı öğrendik: görselin \"ses tonu\". Bu derste ikinci kontrol düğmesine geçiyoruz: kamera ve lens. Işık görselin havasını belirliyorsa, kamera izleyicinin nerede durduğunu ve neye baktığını belirler. Aynı araba, yerden bakan geniş açılı bir kareyle dev ve iddialı görünür; yakından, arkası flu bir far detayıyla teknolojik ve lüks görünür.\n\nBenzetme: Kamerayı, izleyiciyi sahnede bir yere oturtan bir yer gösterici gibi düşün. \"Geniş açı\" dersen onu sahnenin ortasına, her şeyi görebileceği yere koyarsın. \"Tele lens\" dersen onu uzaktaki bir koltuğa oturtup dürbün verirsin. \"Makro\" dersen burnunu ürüne değdirirsin. \"Sığ alan derinliği\" dersen de gözlerini kısmasını, sadece tek bir şeye odaklanmasını söylersin.\n\nNeden önemli: Prompt'a kamera yazmazsan model yine \"ortalama\" seçer: göz hizasından, orta mesafeden, her yeri net bir kare. Bu kare kimseyi rahatsız etmez ama kimsenin de dikkatini çekmez. Kamera terimleri fotoğrafçıların ortak dilidir; modeller milyonlarca fotoğrafın açıklamasıyla eğitildiği için \"85mm, f/1.8\" gibi ifadeleri bir görüntü tarzı olarak tanır.\n\nDürüst bir not: AI gerçek bir lens kullanmaz. \"85mm\" yazınca matematiksel olarak 85mm'lik bir çekim yapmaz; o ifadenin geçtiği fotoğrafların görünüşünü taklit eder. Bu yüzden kamera terimleri birebir ayar değil, güçlü bir yön tarifidir. Sonuç çoğu zaman beklediğine çok yakın çıkar, ama ufak sapmalar normaldir.\n\nKamerayı tarif ederken dört soru sor:\n\n1. Ne kadar yakın? (çekim mesafesi) Uzak çekim (wide shot) ortamı ve özneyi birlikte gösterir; arabayı yolda ya da mekânda göstermek için. Orta çekim (medium shot) özneyi belinden yukarı ya da ürünü çevresiyle gösterir. Yakın çekim (close-up) tek bir ürüne, bir jant ya da bir yüze odaklanır. Aşırı yakın çekim (extreme close-up / macro) dokuyu, damlayı, far içindeki LED'leri gösterir.\n2. Hangi lensle? (odak uzaklığı) Küçük mm sayısı geniş açıdır: 16-24mm sahneye çok şey sığdırır, yakındaki şeyleri büyütür, kenarları biraz esnetir. 35-50mm insan gözüne en yakın, doğal görünüştür. 85-135mm tele (dar açı) lenstir: arka planı öne yaklaştırıp sıkıştırır, portre ve ürün için çok \"pahalı\" durur. 100mm macro lens ise minik detayları devleştirir.\n3. Nereden bakıyor? (çekim açısı) Göz hizası (eye level) tarafsızdır. Alttan bakış (low angle) özneyi güçlü, kahraman gibi gösterir; araba reklamlarının ve spor posterlerinin vazgeçilmezi. Üstten bakış (high angle) özneyi küçültür. Tam tepeden bakış (top-down / flat lay) masa düzenleri, yemek ya da yukarıdan görülen bir yol için klasiktir.\n4. Ne kadarı net? (alan derinliği) Sadece öznenin net, arkanın yumuşak flu olduğu kare sığ alan derinliğidir; arka plandaki o yuvarlak ışık lekelerine bokeh denir. Her şeyin önden arkaya net olduğu kare derin alan derinliğidir. Prompt'ta bunu diyafram değeriyle de söyleyebilirsin: f/1.4 - f/2.8 arkayı flu yapar, f/8 - f/11 her şeyi net tutar.\n\nAltın kural: Tek başına \"professional photo\" yazmak yerine mesafeyi, lensi, açıyı ve netliği söyle. \"close-up, 85mm lens, f/1.8, shallow depth of field, eye level\" dört bilgiyi birden verir. Hepsini her seferinde yazmak zorunda değilsin; ama en az mesafe + netlik ikilisini yazmaya alış.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Odak uzaklığı | Lensin ne kadar geniş ya da dar gördüğünü anlatan mm değeri; küçük sayı geniş, büyük sayı dar açı | focal length (24mm, 50mm, 85mm) |\n| Geniş açı lens | Sahneye çok şey sığdıran, yakını büyütüp kenarları esneten lens | wide-angle lens |\n| Tele lens | Uzaktan çeken, arka planı sıkıştırıp özneyi öne çıkaran dar açılı lens | telephoto lens |\n| Makro | Çok küçük detayları ekranı dolduracak kadar büyük gösteren yakın çekim | macro shot, macro lens |\n| Alan derinliği | Görselde önden arkaya ne kadar alanın net göründüğü | depth of field (shallow / deep) |\n| Bokeh | Flu arka planda oluşan yumuşak, yuvarlak ışık lekeleri | bokeh |\n| Diyafram | Lensin açıklığı; küçük f sayısı arkayı flu yapar, büyük f sayısı her şeyi net tutar | aperture (f/1.8, f/8) |\n| Çekim açısı | Kameranın özneye nereden baktığı: alttan, göz hizası, üstten, tepeden | camera angle (low angle, eye level, high angle, top-down) |\n\n### Görsel örnek\n\n![24mm geniş açı, alçak kamera](img/d10-1.jpg)\n![135mm tele, sıkıştırılmış arka plan](img/d10-2.jpg)\n\nAynı kırmızı SUV: geniş açı alttan bakınca dev ve güçlü, tele lensle arka plan öne yaklaşıp sıkışıyor.\n\nNasıl üretildi: Nano Banana 2 Lite, 4:5. 1: 'red compact SUV on empty coastal road, golden hour, low angle from ground level, 24mm wide-angle'. 2: ilkini referans verip '135mm telephoto, eye level, compressed perspective, coastline appears large and blurred'.\n\n### Uygulama\n\nSenaryo: Bir otomobil bayisi yeni gelen kırmızı bir SUV için sosyal medya görselleri istiyor. Ders 9'daki gibi aynı sahneyi sadece kamerayı değiştirerek üreteceğiz. Işığı sabit tutuyoruz ki farkı sadece kamera yaratsın (her seferinde tek değişken). Araba, kamera seçiminin etkisini en net gösteren ürünlerden biridir: aynı araç bir karede aile arabası, diğerinde güç gösterisi olabilir.\n\n1. Magnific'te görsel üretim ekranını aç. Model olarak Google Nano Banana 2 Lite seç (hızlı ve ucuz, karşılaştırma turu için ideal), oranı 4:5 yap.\n2. Önce kamerasız bir temel prompt yaz ve 1 görsel üret: `a red compact SUV parked on an empty coastal road, warm golden hour side light, automotive photography, vertical 4:5`. Bu senin \"kontrol\" görselin: modelin kendi seçtiği kamerayı gösterir. Işık Ders 9'dan tanıdık.\n3. Aynı prompt'un sonuna sadece kamera ekleyerek dört versiyon üret: (a) `wide shot, 24mm wide-angle lens, the whole road and coastline visible, deep focus`, (b) `close-up, 85mm lens, f/1.8, shallow depth of field, creamy bokeh background`, (c) `extreme close-up macro shot, 100mm macro lens, focus on the headlight details`, (d) `top-down view, shot from directly above the car`. Prompt'un geri kalanına dokunma.\n4. Beş görseli Photoshop'ta bir artboard'a yan yana diz. Her birine şu gözle bak: Arka plan ne kadar görünüyor? Ne kadarı net? Araba büyük mü küçük mü duruyor? Hangisi Instagram'da kaydırırken parmağı durdurur?\n5. Şimdi açıyı dene: (b) versiyonunu alıp sonuna `low angle, camera close to the ground near the front bumper` ekle. Arabanın birden daha güçlü ve \"anıtsal\" durduğunu göreceksin. Aynı numara spor posterlerinde oyuncu ya da kupa için de işe yarar.\n6. Beğendiğin sonucu son kalite için Google Nano Banana Pro ile (4:5 destekliyor) 2K olarak yeniden üret. Seedream 5 Pro'yu kullanacaksan 4:5 oranı yok; 3:4 seçip Photoshop'ta kırp.\n7. En iyi kamera ifadelerini tarif kartına (prompt kütüphanene) \"Kamera\" başlığı altında, Ders 9'daki \"Işık\" başlığının yanına kaydet. Artık her prompt'unda ışık + kamera için hazır, denenmiş parçaların var.\n\n### Örnek prompt'lar\n\n`A black luxury sedan on wet city asphalt at night, low angle shot from ground level, 24mm wide-angle lens, the car looks powerful and towering, neon reflections on the wet road, dark sky with empty space at the top for the headline, vertical 4:5 automotive advertising, cinematic`\n\nAraba reklamı (güç ve prestij): Alttan bakış ve geniş açı birleşince araba devleşir, kahraman gibi durur. Geniş açı gökyüzünü de kadraja aldığı için üstte yazıya doğal bir boş alan kalır.\n\n`Extreme close-up of a modern LED headlight on a silver car, 100mm macro lens, f/2.8, very shallow depth of field, focus on the light details inside the headlight, the car body softly blurred, cool blue studio light, premium automotive detail shot, vertical 4:5`\n\nAraba detay görseli (teknoloji vurgusu): Makro lens ve sığ alan derinliği gözü tek noktaya, farın içine kilitler. \"focus on the light details\" demek, modelin netliği yanlış yere (örneğin kaputa) koymasını engeller. Yeni model tanıtımlarında seri gönderinin \"detay\" karesi için idealdir.\n\n`A white electric hatchback driving on a mountain road, telephoto lens, 135mm, compressed perspective, snowy mountains in the background appear large and softly blurred, golden hour light, automotive lifestyle photography, horizontal 16:9 web banner`\n\nAraba banner'ı (yol ve özgürlük hissi): Tele lens arka plandaki dağları öne yaklaştırır (sıkıştırma); araç ile manzara aynı hikâyenin parçası gibi görünür ama araba yine baskın kalır.\n\n`A woman in a beige trench coat walking past a café window in the city, medium shot, 50mm lens, f/2, shallow depth of field, street lights softly blurred with warm bokeh in the background, natural evening light, fashion lifestyle photography, vertical 9:16 story`\n\nModa tanıtımı (story): 50mm doğal, \"oradaymışsın\" hissi verir. Arkadaki flu ışık lekeleri (bokeh) şehrin havasını anlatır ama dikkati kıyafetten dağıtmaz.\n\n`Top-down flat lay of a Black Sea breakfast spread on a rustic wooden table, shot from directly above, deep focus with every plate sharp, soft even daylight, horizontal 16:9 restaurant banner, editorial food photography`\n\nRestoran tanıtımı: Tam tepeden çekimde her tabağın net olması istenir, bu yüzden sığ değil derin alan derinliği (deep focus) istedik. Tepeden kare menü ve banner'larda düzenli, grafik bir görünüm verir.\n\n### Sık yapılan hatalar\n\n- **Birbiriyle çelişen kamera istemek.** \"macro shot\" ile \"wide shot of the whole street\" ya da \"shallow depth of field\" ile \"everything in sharp focus\" aynı prompt'ta olursa model kararsız kalır. Bir mesafe ve bir netlik seç.\n- **Netliğin nerede olacağını söylememek.** Sığ alan derinliği istediğinde model neyi net tutacağını kendi seçer; bazen araba yerine arkadaki ağaç net çıkar. \"focus on the ...\" ile netliğin yerini sen belirle.\n- **Geniş açıyı yakın çekimde yüzlerde kullanmak.** 16-24mm lens yakındaki şeyi büyüttüğü için yüzlerde burnu büyük, yüzü esnemiş gösterir. Portre ve yüz için 50-85mm daha güvenli. Araba gibi büyük ürünlerde de geniş açı çok yakından kullanılırsa ön kısım orantısız büyür; bunu bilerek \"güç\" efekti için kullan, yanlışlıkla değil.\n- **Kamera marka ve model adlarına güvenmek.** \"shot on Canon EOS R5\" gibi ifadeler biraz \"fotoğraf\" havası katar ama kadrajı kontrol etmez. Asıl işi mesafe, odak uzaklığı, açı ve diyafram yapar.\n\n### Profesyonel yöntem\n\nProfesyonel ekipler kamera terimini rastgele seçmez; önce hissi düşünür, sonra terimi seçer. Brief'te \"güçlü, iddialı\" yazıyorsa alttan bakış; \"teknolojik, detaycı\" yazıyorsa makro; \"özgürlük, yol\" yazıyorsa geniş açı ya da tele lensle manzara seçilir. Yani soru \"hangi lens güzel?\" değil, \"izleyici ne hissetmeli?\" olur. Bunun için kendine bir \"his → kamera\" tablosu tutmak çok işe yarar:\n\n- Ölçek ve yalnızlık: çok geniş çekim (extreme wide shot), küçük özne, büyük manzara.\n- Güç ve kahramanlık: alttan bakış (low angle), geniş açı lens.\n- Samimiyet ve duygu: yakın çekim (close-up), 50-85mm, sığ alan derinliği.\n- Detay ve kalite: aşırı yakın çekim ya da makro, netlik tek noktada.\n- Merak ve dikkat çekme: alışılmadık bir açı; örneğin \"nesnenin içinden\" çekim (bagajın içinden dışarı bakan kamera gibi). Reklamlarda parmağı durdurmak için sık kullanılır.\n\nİkinci kural: kamera ifadesini prompt'un belli bir yerine koy ve her seferinde orada tut. Sektörde sık önerilen sıralama şöyle: görüntü türü → özne → kompozisyon → mekân → ışık → kamera ve lens. Bir kampanyadaki tüm görselleri bu sırayla yazarsan, karşılaştırması ve düzeltmesi kolaylaşır; ayrıca seri görseller aynı aileden çıkmış gibi durur.\n\nÜçüncüsü: bir kampanyanın görsellerini tek bir \"çekim listesi\" olarak düşün. Araba örneğinde dört kare genellikle yeterlidir: (1) aracın tamamını ortamıyla gösteren uzak çekim, (2) güç veren alçak açı, (3) far ya da jant gibi bir makro detay, (4) içeriden ya da sürücü gözünden bir kare. Bu dört kare hem gönderi serisi hem de video için hazır bir storyboard olur.\n\nSon olarak ilham için gerçek fotoğraflara ve film karelerine bak. Beğendiğin bir kareyi bir sohbet asistanına (Claude gibi) gösterip \"bu karenin çekim mesafesini, lensini, açısını ve netliğini tarif et\" dersen, o görünümü kendi prompt'una taşıyabileceğin hazır bir kamera ifadesi elde edersin.\n\n### Ödev\n\nÜzerinde çalıştığın ya da yakında gelecek bir işten bir ürün seç (bir araba ya da başka bir büyük ürün olabilir: bisiklet, motosiklet, mobilya). Ders 9'da bulduğun en iyi ışık tarifini sabit tut.\n\n1. Sadece kamerayı değiştirerek dört versiyon üret: uzak geniş açı, 85mm sığ alan derinliği, makro detay ve alttan ya da tepeden bir açı.\n2. Dördünü bir artboard'a diz, her birinin altına kullandığın kamera ifadesini yaz.\n3. Şu üç kullanım için hangisini seçeceğine karar ver: Instagram gönderisi, story, web banner.\n4. Toplam 20-30 dakika ayır. Panoyu ve prompt'larını Claude'a göster; hangi kadrajın hangi formata daha uygun olduğu ve kamera tarifini nasıl netleştirebileceğin üzerine yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Nereden geliyor (yön), sert mi yumuşak mı (kalite), hangi renkte (renk sıcaklığı), ne kadar karanlık ya da aydınlık (kontrast ve hava; high-key / low-key).\n2. Önden hafif bir dolgu ışığı: `soft fill light on the front of the product`. Böylece arkadan gelen ışığın etkisi kalır ama ürün okunur.\n\nSıradaki ders: Stil ve estetik terimleri, sanat akımları\n\n### Kaynaklar\n\n- Magnific bağlantısındaki güncel görsel modeli listesi, desteklenen oranlar ve önerilen kullanım alanları (3 Ekim 2026)\n", "module": 2, "moduleName": "Görseli kontrol etmek", "n": 10, "summary": ["Işık görselin havasını, kamera ise izleyicinin nerede durduğunu ve neye baktığını belirler.", "Kamerayı dört soruyla tarif et: ne kadar yakın, hangi lens, nereden bakıyor, ne kadarı net.", "Küçük mm geniş açıdır ve sahneyi büyütür; 85-135mm tele lens arka planı sıkıştırıp ürünü öne çıkarır.", "Sığ alan derinliği istiyorsan \"focus on the ...\" ile netliğin yerini mutlaka sen söyle.", "Önce izleyicinin ne hissetmesi gerektiğini düşün, sonra kamera terimini seç: güç için alttan bakış, detay için makro."], "title": "Kamera ve lens terimleri (geniş açı, makro, alan derinliği)"}, {"checked": "Ekim 2026", "date": "4 Ekim 2026", "flow": {"edges": [{"a": "set", "b": "ctl", "k": "f"}, {"a": "ctl", "b": "s1", "k": "txt", "l": "stil + prompt"}, {"a": "ctl", "b": "s2", "k": "txt", "l": "stil + prompt"}, {"a": "ctl", "b": "s3", "k": "txt", "l": "stil + prompt"}, {"a": "ctl", "b": "s4", "k": "txt", "l": "stil + prompt"}, {"a": "s1", "b": "cmp", "k": "img"}, {"a": "s2", "b": "cmp", "k": "img"}, {"a": "s3", "b": "cmp", "k": "img"}, {"a": "s4", "b": "cmp", "k": "img"}, {"a": "s4", "b": "med", "k": "f"}, {"a": "cmp", "b": "model", "k": "f"}, {"a": "model", "b": "card", "k": "f"}, {"a": "med", "b": "card", "k": "f"}], "groups": [{"c1": 0, "c2": 1, "label": "Kontrol", "r1": 0, "r2": 0}, {"c1": 2, "c2": 2, "label": "Dört stil", "r1": 0, "r2": 3}, {"c1": 3, "c2": 5, "label": "Medyum ve model", "r1": 0, "r2": 1}], "nodes": [{"c": 0, "chips": ["Nano Banana 2 Lite", "4:5"], "id": "set", "r": 0, "s": 1, "t": "gen", "title": "Hızlı model"}, {"c": 1, "id": "ctl", "pv": {"k": "txt", "v": "a woman in a long red coat walking alone on a foggy street, centered composition, plain background, vertical 4:5"}, "r": 0, "s": 2, "t": "prompt", "text": "Stil prompt'un BAŞINA eklenecek.", "title": "Stilsiz temel prompt"}, {"c": 2, "id": "s1", "pv": {"ar": "4:5", "k": "img", "m": "🧥", "tag": "altın-siyah, geometrik", "tone": "deco"}, "r": 0, "s": 3, "t": "gen", "title": "Art Deco"}, {"c": 2, "id": "s2", "pv": {"ar": "4:5", "k": "img", "m": "🧥", "tag": "ızgara, düz kırmızı-beyaz", "tone": "swiss"}, "r": 1, "s": 3, "t": "gen", "title": "Swiss style"}, {"c": 2, "id": "s3", "pv": {"ar": "4:5", "k": "img", "m": "🧥", "tag": "kalın kontur, raster nokta", "tone": "pop"}, "r": 2, "s": 3, "t": "gen", "title": "Pop Art"}, {"c": 2, "id": "s4", "pv": {"ar": "4:5", "k": "img", "m": "🧥", "tag": "teal + mercan, gren", "tone": "riso"}, "r": 3, "s": 3, "t": "gen", "title": "Risograph"}, {"c": 3, "id": "cmp", "pv": {"items": ["Lüks mü, eğlenceli mi, kurumsal mı?", "Kitap kapağına mı, moda kampanyasına mı uyar?", "Akımı mı yakaladı, sadece rengi mi?"], "k": "list"}, "r": 1, "s": 4, "t": "compare", "title": "Kapağa mı, kampanyaya mı?"}, {"c": 4, "id": "med", "pv": {"k": "txt", "v": "risograph → soft 3D clay render, pastel colors"}, "r": 2, "s": 5, "t": "prompt", "text": "Aynı sahne bambaşka bir kitap ya da marka olur.", "title": "Medyum değiştir"}, {"c": 4, "chips": ["Recraft V4.1", "Seedream 5 Pro", "Nano Banana Pro"], "id": "model", "r": 1, "s": 6, "t": "gen", "text": "İllüstrasyon için Recraft, fotoğraf gerçekçiliği için Pro modeller.", "title": "İşe uygun model"}, {"c": 5, "end": true, "id": "card", "pv": {"items": ["Işık + kamera + stil", "Art Deco: gold and black, geometric", "Risograph: duotone, grainy"], "k": "list"}, "r": 1, "s": 7, "t": "card", "title": "Stil başlığı"}], "title": "Konu sabit kalır, stil kitabın ya da markanın kime seslendiğini anlatır"}, "genhq": false, "level": "Başlangıç", "md": "### Hızlı tekrar\n\n1. Odak uzaklığında küçük mm sayısı (örneğin 24mm) ile büyük mm sayısı (örneğin 85mm) görüntüyü nasıl değiştirir?\n2. Sığ alan derinliği istedin ama ürün yerine arka plandaki bir nesne net çıktı. Prompt'a ne eklersin?\n\n### Konu\n\nIşık görselin ses tonuydu, kamera izleyicinin oturduğu yerdi. Bu derste üçüncü kontrol düğmesine geçiyoruz: stil. Stil, görselin \"nasıl yapılmış gibi\" göründüğüdür. Kırmızı paltolu, sisli bir sokakta yürüyen bir kadın; bir fotoğraf, bir suluboya, bir 1920'ler afişi ya da parlak bir 3D çizim olabilir. Konu aynı kalır; hissettirdiği şey, hitap ettiği kitle ve markanın sesi tamamen değişir. Aynı sahne bir polisiye romanın kapağı da olabilir, bir moda markasının sonbahar kampanyası da; aradaki farkı büyük ölçüde stil belirler.\n\nBenzetme: Stili bir şarkının düzenlemesi gibi düşün. Aynı şarkıyı akustik gitarla, senfoni orkestrasıyla ya da elektronik olarak çalabilirsin. Notalar (konu, ışık, kamera) aynı; ama düzenleme (stil) dinleyene bambaşka bir dünya açar. Prompt'ta stil yazmazsan model \"standart pop düzenlemesi\" seçer: biraz parlak, biraz dijital, herkese benzeyen bir görsel.\n\nNeden önemli: Bir grafik tasarımcı olarak zaten stillerle düşünüyorsun; Bauhaus'u, Swiss stili, retro afişi görünce tanıyorsun. Sorun, bunları modele doğru kelimelerle söylemek. Modeller milyonlarca görselin açıklamasıyla eğitildi; o açıklamalarda \"Art Deco poster\", \"risograph print\", \"Swiss style\" gibi ifadeler sıkça geçiyor. Doğru terimi yazınca modele uzun uzun tarif etmek yerine tek kelimeyle koca bir görsel dünyayı açmış olursun.\n\nStili dört katmanda düşün:\n\n1. Ne ile yapılmış? (medyum) Fotoğraf mı, 3D render mı, suluboya mı, yağlı boya mı, vektör çizim mi, kolaj mı, risograph baskı mı? Bu ilk ve en güçlü karardır; görselin \"malzemesini\" belirler.\n2. Hangi akım ya da dönem? (sanat akımı) Art Deco, Bauhaus, Swiss stil, Pop Art, Memphis, minimalizm, 70'ler retro, Y2K gibi. Akım; şekil dilini, kompozisyonu ve renk alışkanlıklarını bir paket olarak getirir.\n3. Nasıl bir his? (estetik) Lüks ve sade, sinematik, rüya gibi, sert ve kirli (gritty), editoryal dergi havası, samimi ve el yapımı. Bu katman aynı akımın içinde bile tonu ayarlar.\n4. Renk ve doku: Renk paleti (pastel, toprak tonları, iki renkli duotone, neon) ve yüzey dokusu (film greni, kâğıt dokusu, halftone noktalar, baskı hataları). Görseli \"dijital\" olmaktan çıkarıp elle tutulur yapan genelde bu katmandır.\n\nAjans işlerinde en çok işine yarayacak akımlar:\n\n| Akım | Görünüşü | Ajans işinde nerede |\n| --- | --- | --- |\n| Art Deco | Simetri, altın çizgiler, geometrik süsleme, 1920'ler lüksü | Takı, parfüm, gala, dönem romanı kapağı |\n| Bauhaus | Basit geometrik şekiller, ana renkler, düzenli ızgara | Etkinlik afişi, modern marka, kültür ve deneme kitabı kapağı |\n| Swiss stil (International Typographic Style) | Güçlü ızgara, büyük sans-serif yazı, bol boşluk, sade fotoğraf | Spor posteri, kurumsal duyuru, festival, moda lookbook kapağı |\n| Pop Art | Kalın kontur, halftone noktalar, canlı düz renkler | Kampanya, indirim, genç kitleye sosyal medya |\n| Memphis | Oyuncak gibi şekiller, zikzaklar, pastel ve canlı renk karışımı | Kafe, tatlıcı, çocuk kitabı ve eğlence markaları |\n| Minimalizm | Az nesne, çok boşluk, sakin renk | Premium ürün, kozmetik, teknoloji, minimal moda markası |\n| 70'ler retro | Sıcak turuncu-kahve tonlar, yuvarlak yazılar, gren | Vintage moda koleksiyonu, burger, nostaljik kampanya |\n| Y2K | Krom, parlak plastik, 2000'ler dijital havası | Moda, müzik, genç kitleye ürün |\n\nDürüst bir not: Yaşayan sanatçıların ya da illüstratörlerin adını prompt'a yazmak (\"in the style of \\[sanatçı adı\\]\") hem etik hem ticari açıdan riskli; müşteri işinde bu yoldan uzak dur. Akım ve teknik adları (Art Deco, risograph, suluboya) ise herkesin ortak dili; güvenle kullanabilirsin. Üstelik tarif ederek yazdığın stil, bir isme yaslanan stilden daha kontrol edilebilir olur.\n\nAltın kural: Önce medyumu, sonra akımı, sonra rengi söyle. \"Art Deco style\" tek başına bazen Art Deco bir bina fotoğrafı üretir; \"Art Deco poster illustration, gold and black palette\" ise tam istediğin afişi verir. En fazla bir ana akım + bir yardımcı estetik kullan; üç akımı karıştırmak çorba yapar.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Stil | Görselin nasıl yapılmış gibi göründüğü: malzemesi, akımı, hissi | style |\n| Medyum | Görselin yapıldığı malzeme ya da teknik: fotoğraf, suluboya, 3D, vektör | medium (photograph, watercolor, 3D render, vector illustration) |\n| Sanat akımı | Belli bir dönemde ortak şekil ve renk dili kullanan tasarım ya da sanat hareketi | art movement (Art Deco, Bauhaus, Pop Art) |\n| Estetik | Görselin verdiği genel his ve tavır | aesthetic (luxury minimal, cinematic, editorial) |\n| Renk paleti | Görselde kullanılan sınırlı renk grubu | color palette (muted earth tones, pastel palette) |\n| Doku | Yüzeye elle tutulur his veren gren, kâğıt, baskı izi | texture (film grain, paper texture) |\n| Duotone | Görselin sadece iki renkle basılmış gibi görünmesi | duotone |\n| Halftone | Baskıda tonları küçük noktalarla oluşturan teknik; Pop Art'ın imzası | halftone dots |\n\n### Görsel örnek\n\n![Art Deco](img/d11-1.jpg)\n![Swiss stil](img/d11-2.jpg)\n![Risograph baskı](img/d11-3.jpg)\n\nAynı 'kırmızı paltolu kadın' sahnesi; sadece stil kelimesi değişince bambaşka bir kitleye konuşuyor.\n\nNasıl üretildi: Nano Banana 2 Lite, 4:5. Temel: 'a woman in a long red coat walking alone on a foggy street, centered, plain background, no text'. Başına sırayla: 'Art Deco poster, gold and black, geometric ornaments', 'Swiss style poster, strict grid, flat red and white', 'risograph print, teal and coral duotone, grainy paper, misregistration'.\n\n### Uygulama\n\nSenaryo: Bir yayınevi yeni bir roman için kapak görseli arıyor; aynı hafta bir moda markası da sonbahar koleksiyonu için kampanya görseli istiyor. İki işin ortak noktası: ikisinde de stil, kitlenin \"bu bana göre mi?\" sorusunu ilk bakışta cevaplıyor. Ders 9 ve 10'daki gibi tek değişken kuralını uyguluyoruz: konu, ışık ve kamera sabit, sadece stil değişiyor. Sonunda hangi stilin kitap kapağına, hangisinin moda kampanyasına yakıştığına karar vereceğiz.\n\n1. Magnific'te görsel üretim ekranını aç. Model olarak Google Nano Banana 2 Lite seç (hızlı ve ucuz, karşılaştırma için ideal), oranı 4:5 yap.\n2. Önce stilsiz bir temel prompt yaz ve 1 görsel üret: `a woman in a long red coat walking alone on a foggy street, centered composition, plain background, vertical 4:5`. Bu senin \"kontrol\" görselin: modelin kendi seçtiği \"standart\" stili gösterir.\n3. Aynı prompt'un başına sadece stil ekleyerek dört versiyon üret: (a) `Art Deco poster illustration, gold and black palette, geometric ornaments,` (b) `Swiss style poster, strict grid, bold sans-serif shapes, flat red and white,` (c) `Pop Art illustration, thick black outlines, halftone dots, bright flat colors,` (d) `risograph print, two-color duotone in teal and coral, grainy paper texture, slight misregistration,`. Prompt'un geri kalanına dokunma.\n4. Beş görseli Photoshop'ta bir artboard'a yan yana diz. Her birine şu gözle bak: Hangisi lüks, hangisi eğlenceli, hangisi kurumsal duruyor? Hangisi bir roman kapağına, hangisi bir moda kampanyasına uyar? Model akımı mı yakaladı, yoksa sadece rengini mi?\n5. Şimdi katmanları dene: (d) versiyonunu alıp medyumu değiştir: `risograph` yerine `soft 3D clay render, pastel colors`. Aynı sahnenin bir çocuk kitabına ya da bambaşka bir markaya dönüştüğünü göreceksin.\n6. İllüstrasyon tarzı sonuçlar için Recraft V4.1'i de dene; illüstrasyon ve tipografide güçlü ve çok hızlı. Fotoğraf gerçekçiliğinde son kalite için Seedream 5 Pro ya da Google Nano Banana Pro ile 2K yeniden üret. Seedream 5 Pro'da 4:5 yok; 3:4 seçip Photoshop'ta kırp.\n7. En iyi stil ifadelerini tarif kartına (prompt kütüphanene) \"Stil\" başlığı altında, \"Işık\" ve \"Kamera\" başlıklarının yanına kaydet. Artık her prompt'unda üç hazır parça var: ışık + kamera + stil.\n\n### Örnek prompt'lar\n\n`Art Deco book cover illustration for a 1920s mystery novel, a woman in a long evening gown standing on the steps of a grand hotel, symmetrical composition, black background with thin gold geometric lines and fan motifs, large empty area at the top for the title, vertical 3:4`\n\nKitap kapağı (dönem romanı): Art Deco dönemin lüksünü ve gizemini tek bakışta anlatır; altın-siyah palet ve simetri kapağı rafta öne çıkarır. \"book cover illustration\" yazmak sonucun fotoğraf değil kapak illüstrasyonu olmasını sağlar; başlığı yine sen Photoshop ya da InDesign'da eklersin.\n\n`Risograph print illustration for a poetry book cover, a lone figure sitting by a window with rain outside, two-color duotone in coral and teal, grainy paper texture, slight misregistration, hand-made indie zine aesthetic, empty space at the bottom for the title, vertical 3:4`\n\nKitap kapağı (şiir ya da bağımsız yayın): Risograph baskının iki rengi, greni ve hafif kaymış baskı izi (misregistration) \"el yapımı, samimi\" bir his verir. Küçük yayınevleri ve şiir kitapları için çok uygun.\n\n`Y2K aesthetic fashion campaign, a model in a metallic silver puffer jacket and wide-leg jeans, glossy chrome shapes floating around her, holographic pastel gradient background, playful 2000s digital look, vertical 4:5 social media post`\n\nModa kampanyası (genç kitle): Y2K'nın krom, parlak plastik ve holografik renkleri 2000'ler nostaljisini çağırır; genç kitleye yönelik giyim markalarında akışta hemen fark edilir.\n\n`Minimalist editorial fashion photography of a camel wool coat on a model standing in an empty concrete room, lots of negative space, soft beige and grey tones, subtle film grain, calm and luxurious editorial aesthetic, vertical 4:5`\n\nModa kampanyası (premium marka): Minimalizm \"az ama pahalı\" der. Boşluk (negative space), sakin toprak tonları ve hafif gren kıyafeti bir dergi sayfasındaymış gibi gösterir.\n\n`Memphis design style illustration of a dessert plate with colorful macarons and a slice of cake, playful geometric shapes, squiggles and zigzags around, pastel pink, yellow and mint with black accents, flat vector look, square 1:1 social media post`\n\nTatlıcı tanıtımı: Memphis eğlenceli ve dikkat çekicidir; zikzaklar ve oyuncak gibi şekiller ürünün etrafını doldurup akışta parmağı durdurur.\n\n### Sık yapılan hatalar\n\n- **Çok fazla akımı karıştırmak.** \"Art Deco, Bauhaus, Pop Art, cyberpunk\" aynı prompt'ta olursa model hepsinden biraz alır, hiçbirini tam yapmaz. Bir ana akım + bir yardımcı estetik yeter.\n- **Medyumu söylemeden akım yazmak.** \"Art Deco\" tek başına bir bina ya da iç mekân fotoğrafı getirebilir. \"Art Deco poster illustration\" ya da \"Art Deco book cover illustration\" gibi medyumla birlikte yaz.\n- **Boş süs kelimelerine güvenmek.** \"beautiful, aesthetic, trending, masterpiece\" stili tarif etmez. Yerine somut terim koy: palet, doku, akım.\n- **Yaşayan sanatçı adı kullanmak.** Müşteri işinde risklidir ve kontrolü azaltır. Stili akım, teknik, renk ve doku ile tarif et.\n\n### Profesyonel yöntem\n\nDeneyimli üreticilerin ortak görüşü şu: Bugün herkes \"güzel\" görsel üretebiliyor; farkı yaratan şey zevk, yani neyi seçtiğin, neyi referans aldığın ve nasıl bitirdiğin. Bu yüzden profesyoneller prompt yazmadan önce havayı tek bir cümleyle yazar: \"Sisli bir şehirde yalnız ama kararlı bir kadın; eski bir polisiye kadar gizemli.\" Bu cümle hem stil seçimini yönlendirir hem de sonradan \"bu görsel doğru mu?\" diye bakarken ölçü olur.\n\nİkinci alışkanlık: prompt'u Lego gibi parçalara bölmek. Sık önerilen parçalar şunlar: stil ya da görüntü türü, özne, kadraj ve kamera, lens, ışık, renk ya da film havası, ortam ve son dokunuş (gren gibi). Neden işe yarar? Çünkü stili değiştirmek istediğinde sadece o parçayı değiştirirsin, gerisi sabit kalır; Uygulama'daki karşılaştırmayı yapmak da bu yüzden kolaydı.\n\nÜçüncüsü: bir \"stil bankası\" tutmak. Beğendiğin stil ifadelerini, dokuları ve film havalarını bir notta topla. Fotoğraf işlerinde film adları hızlı bir hava kısayoludur; örneğin \"Kodak Portra\" yumuşak ten tonları ve doğal renk, \"Ilford HP5\" grenli siyah-beyaz belgesel havası, \"Kodak Aerochrome\" ise sürreal kırmızı-pembe tonlar çağırır. Ama aynı anda beş renk ya da beş film adı ekleme, birini seç. Zamanla aynı 2-3 ifadeyi bir markada sürekli kullanınca o markanın imza stili oluşur.\n\nDördüncüsü: ilhamı çözümleyerek biriktirmek. Dergilerden, kitap raflarından, moda çekimlerinden beğendiğin görselleri ışık, malzeme ve kompozisyon için ayrı panolarda topla. Bir görseli bir sohbet asistanına (Claude gibi) gösterip \"bunun medyumunu, akımını, paletini ve dokusunu tarif et\" diyebilirsin; böylece beğendiğin bir havayı, sanatçı adı kullanmadan kendi kelimelerinle prompt'a taşırsın.\n\n### Ödev\n\nÜzerinde çalıştığın ya da yakında gelecek bir işten bir konu seç; bir kitap kapağı ya da bir moda kampanyası olabilir. Konuyu, ışığı ve kamerayı sabit tut.\n\n1. Dört farklı stilde birer görsel üret: biri fotoğraf, biri bir sanat akımı (tablodan seç), biri 3D render, biri baskı tekniği (risograph ya da halftone).\n2. Dördünü bir artboard'a diz, her birinin altına kullandığın stil ifadesini yaz.\n3. Kendine sor: Markanın ya da kitabın sesine hangisi uyuyor? Neden? Cevabı bir cümleyle not et.\n4. Toplam 20-30 dakika ayır. Panoyu ve prompt'larını Claude'a göster; hangi stilin işe daha uygun olduğu ve stil tarifini nasıl netleştirebileceğin üzerine yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Küçük mm sayısı (16-24mm) geniş açıdır: sahneye çok şey sığdırır, yakındakini büyütür, kenarları esnetir. Büyük mm sayısı (85-135mm) tele lenstir: dar açıyla arka planı sıkıştırır, özneyi öne çıkarır, portre ve ürün için \"pahalı\" durur.\n2. Netliğin yerini söyle: `focus on the product` gibi bir ifade ekle. Böylece model sığ alan derinliğinde neyi net tutacağını kendi seçmez.\n\nSıradaki ders: Referans görsel: görselden görsel, stil referansı\n\n### Kaynaklar\n\n- Magnific bağlantısındaki güncel görsel modeli listesi, desteklenen oranlar ve önerilen kullanım alanları (4 Ekim 2026)\n", "module": 2, "moduleName": "Görseli kontrol etmek", "n": 11, "summary": ["Stil, görselin nasıl yapılmış gibi göründüğüdür; aynı konu stile göre bambaşka bir kitleye seslenir.", "Stili dört katmanda düşün: medyum, sanat akımı, estetik his, renk ve doku.", "Önce medyumu, sonra akımı, sonra rengi yaz; \"Art Deco style\" yerine \"Art Deco poster illustration\" de.", "En fazla bir ana akım ve bir yardımcı estetik kullan; yaşayan sanatçı adı yerine stili tarif et.", "Beğendiğin stil ifadelerini bir stil bankasında topla; aynı 2-3 ifade bir markanın imza stili olur."], "title": "Stil ve estetik terimleri, sanat akımları"}, {"checked": "Ekim 2026", "date": "4 Ekim 2026", "flow": {"edges": [{"a": "ctl", "b": "st", "k": "f"}, {"a": "sty", "b": "st", "k": "ref", "l": "Style"}, {"a": "ctl", "b": "ob", "k": "f"}, {"a": "prd", "b": "ob", "k": "ref", "l": "Object"}, {"a": "ob", "b": "mix", "k": "ref", "l": "ürün"}, {"a": "st", "b": "mix", "k": "ref", "l": "stil"}, {"a": "col", "b": "re", "k": "img", "l": "kolaj"}, {"a": "re", "b": "mid", "k": "img"}, {"a": "mid", "b": "card", "k": "f"}, {"a": "mix", "b": "card", "k": "f"}], "groups": [{"c1": 0, "c2": 0, "label": "Kaynaklar", "r1": 0, "r2": 2}, {"c1": 1, "c2": 3, "label": "Referans türleri", "r1": 0, "r2": 2}, {"c1": 1, "c2": 3, "label": "Kolajdan görsel", "r1": 3, "r2": 3}], "nodes": [{"c": 0, "id": "sty", "pv": {"ar": "4:5", "k": "img", "m": "📸", "tag": "sıcak, filmli, toprak tonu sokak çekimi", "tone": "warm"}, "r": 0, "s": 1, "t": "ref", "text": "Pinterest ya da Magnific kütüphanesi.", "title": "(a) Stil kaynağı"}, {"c": 0, "id": "prd", "pv": {"ar": "4:5", "k": "img", "m": "🧥", "tag": "düz fonda kot ceket", "tone": "white"}, "r": 1, "s": 1, "t": "ref", "text": "Müşteri işinde lisanslı ya da kendi görselin.", "title": "(b) Ürün kaynağı"}, {"c": 1, "chips": ["Nano Banana 2 Lite", "4:5"], "id": "ctl", "pv": {"ar": "4:5", "k": "img", "m": "🧥", "tag": "referanssız", "tone": "day"}, "r": 0, "s": 2, "t": "gen", "title": "Kontrol görseli"}, {"c": 2, "chips": ["References → Style"], "id": "st", "pv": {"ar": "4:5", "k": "img", "m": "🧥", "tag": "renk, ışık, gren geldi mi?", "tone": "warm"}, "r": 0, "s": 3, "t": "gen", "text": "Bina, kıyafet kopyalandıysa yanlış referans türü.", "title": "Stil referansı"}, {"c": 2, "chips": ["Object / Product"], "id": "ob", "pv": {"ar": "4:5", "k": "img", "m": "🧥", "tag": "kesim, dikiş, renk korundu mu?", "tone": "day"}, "r": 1, "s": 4, "t": "gen", "title": "Ürün referansı"}, {"c": 3, "chips": ["Seedream 5 Pro", "Nano Banana Pro"], "end": true, "id": "mix", "pv": {"ar": "4:5", "k": "img", "m": "🧥", "tag": "bizim ürün + bu hava", "tone": "warm"}, "r": 0, "s": 5, "t": "gen", "title": "Ürün + stil"}, {"c": 0, "id": "col", "pv": {"k": "sketch"}, "r": 3, "s": 6, "t": "ps", "text": "Manken silüeti, ceket, sokak; 5 dakika.", "title": "Kaba kolaj", "tool": "Photoshop"}, {"c": 1, "id": "re", "pv": {"items": [["Strength", 0.3], ["Strength", 0.8]], "k": "sl"}, "r": 3, "s": 6, "t": "variation", "text": "Düşükte kolaj kalır, yüksekte model özgürleşir.", "title": "Reimagine"}, {"c": 2, "id": "mid", "pv": {"ar": "4:5", "k": "img", "m": "🧥", "tag": "yerleşim senin, kalite modelin", "tone": "warm"}, "r": 3, "s": 6, "t": "gen", "title": "Orta yol: 0.5-0.6"}, {"c": 3, "id": "card", "pv": {"items": ["Model", "Referans türü", "Güç ayarı"], "k": "list"}, "r": 3, "s": 7, "t": "card", "title": "Referans başlığı"}], "title": "Stil referansı havayı, ürün referansı ceketin kendisini taşır"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Stili düşünürken ilk karar olan \"medyum\" nedir ve neden \"Art Deco style\" yerine \"Art Deco poster illustration\" yazmak daha iyi sonuç verir?\n2. Müşteri işinde yaşayan bir illüstratörün adını prompt'a yazmak yerine ne yapmalısın?\n\n### Konu\n\nŞimdiye kadar modele her şeyi kelimeyle anlattık: ışık, kamera, stil. Ama bazı şeyler kelimeye sığmaz. Müşterinin \"şu Pinterest görselindeki hava olsun\" dediği bir moodboard, markanın kendi ürün fotoğrafı ya da bir önceki kampanyanın rengi... Bunları yazıyla tarif etmeye çalışmak, birine telefonda bir yüzü tarif etmeye benzer. Referans görsel ise fotoğrafı doğrudan eline vermektir.\n\nBenzetme: Kuaföre gidip \"kısa ama çok kısa değil, yanlar biraz açık\" demek yerine telefondan bir fotoğraf gösterdiğini düşün. Kuaför fotoğrafa bakar ama senin yüzüne uygular. Referans görsel de aynı şeyi yapar: model senin prompt'unu yine dinler, ama görselden bir şey \"ödünç alır\". Önemli olan, modele neyi ödünç alacağını doğru söylemek: saç modelini mi, saç rengini mi, yoksa yüzün kendisini mi?\n\nNeden önemli: Ajans işinde neredeyse hiçbir şey sıfırdan başlamaz. Müşterinin ürünü vardır, markanın bir görsel dili vardır, art direktörün bir moodboard'u vardır. Moda işlerinde bu daha da belirgindir: ceketin dikişi, kumaşın rengi, etiketin yeri müşteri için tartışılmaz. Referans kullanmayı bilmek, AI'ı \"rastgele güzel görsel üreten makine\"den \"bizim markaya uygun görsel üreten araca\" çevirir. Modül 3'teki tutarlılık derslerinin de temeli budur.\n\nReferansın üç temel kullanımı var:\n\n1. Görselden görsel (image to image): Bir görseli başlangıç noktası olarak verirsin; model onun kompozisyonunu, yerleşimini ve renklerini koruyarak yeniden çizer. Kaba bir eskizi, telefonla çektiğin bir fotoğrafı ya da Photoshop'ta yaptığın hızlı bir kolajı bitmiş bir görsele çevirmek için kullanılır. Burada en önemli ayar \"ne kadar uzaklaşsın\" ayarıdır (strength / güç).\n2. Stil referansı (style reference): Modele \"bu görselin içeriğini değil, görünüşünü al
