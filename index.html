, "pv": {"k": "txt", "v": "matte black wireless headphones on a concrete block, soft side light, dark grey background, shallow depth of field, clean tech product advertising look"}, "r": 1, "s": 3, "t": "prompt", "text": "Kulaklık, zemin, ışık ve tarz artık senin kararın.", "title": "Detaylı tarif"}, {"c": 2, "id": "g2", "pv": {"ar": "4:5", "k": "img", "m": "🎧", "tag": "Beton blok, yumuşak yan ışık", "tone": "warm"}, "r": 1, "s": 3, "t": "gen", "title": "Tarif edilen sahne"}, {"c": 3, "id": "mA", "pv": {"ar": "4:5", "k": "img", "m": "🎧", "tag": "Model A'nın yorumu", "tone": "warm"}, "r": 0, "s": 4, "t": "gen", "text": "Aynı prompt, ilk model.", "title": "Model A"}, {"c": 3, "id": "mB", "pv": {"ar": "4:5", "k": "img", "m": "🎧", "tag": "Model B'nin yorumu", "tone": "day"}, "r": 1, "s": 4, "t": "gen", "text": "Aynı prompt, ikinci model.", "title": "Model B"}, {"c": 4, "end": true, "id": "cmp", "pv": {"items": ["Hangisi tarife daha sadık?", "Işık hangisinde doğal?", "Detaylar (kafa bandı, yastıklar) düzgün mü?"], "k": "list"}, "r": 0, "s": 4, "t": "compare", "title": "Kıyasla ve not al"}], "title": "Tarif kısaldıkça model tahmin eder, uzadıkça senin dediğin olur"}, "genhq": false, "level": "Başlangıç", "md": "### Konu\n\nAI görsel modeli, milyonlarca görseli ve o görsellerin yazılı açıklamalarını görerek \"kelime ile görüntü arasındaki bağı\" öğrenmiş bir sistemdir. Görsel üretirken aslında çizmez: tamamen karışık bir gürültüyle (televizyondaki karıncalanma gibi) başlar ve senin yazdığın metne bakarak bu gürültüyü adım adım temizleyip bir görüntüye dönüştürür.\n\nBenzetme: Buğulu bir camın arkasındaki manzarayı, birine tarif ederek sildirdiğini düşün. Tarifin ne kadar netse, cam silindiğinde çıkan manzara da o kadar istediğin gibi olur. Prompt o tarif, model de camı silen el.\n\nBu yüzden AI \"anlamaz\", tahmin eder. Yazmadığın her şeyi kendi alışkanlığına göre doldurur. İyi sonuç almanın sırrı, önemli olan her şeyi söylemek ve önemsizleri modele bırakmaktır.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Model | Görseli üreten \"beyin\"; her modelin tarzı ve güçlü yanı farklı | model |\n| Prompt | Modele verdiğin yazılı tarif | prompt |\n| Diffusion | Gürültüden görüntüye adım adım temizleme yöntemi | diffusion |\n| Yazıdan görsel | Sadece metinle görsel üretmek | text-to-image |\n| Görselden görsel | Bir görseli temel alıp yenisini üretmek | image-to-image |\n| Referans | Modele \"buna benzesin\" diye verdiğin görsel | reference image |\n| Kredi | Platformlarda her üretimde harcanan birim | credits |\n\n### Araç haritası\n\n- **Hepsi bir arada platformlar:** Magnific/Freepik, Higgsfield, Krea. Tek hesapta birçok görsel ve video modeli.\n- **Model sahiplerinin kendi araçları:** Midjourney, Google (Gemini, Veo), OpenAI, Adobe Firefly, Runway, Kling.\n- **Node'lu tuvaller:** Magnific Spaces, Figma Weave, Flora. Adımları kutular ve oklarla birbirine bağlarsın.\n- **Ses ve müzik:** ElevenLabs, Suno.\n- **Asistan ve agent:** Claude. Prompt yazar, planlar, bağlı olduğu araçlarda işi senin yerine yürütür.\n\n### Uygulama\n\nSenaryo: Bir elektronik markası yeni kablosuz kulaklığı için sosyal medya görseli istiyor. Aynı fikrin önce tek kelimeyle, sonra detaylı tarifle nasıl değiştiğini görelim.\n\n1. Magnific'te görsel üretme ekranını aç.\n2. Tek kelimelik bir prompt dene: \"headphones\". Ne çıktığına bak; model boşlukları kendi doldurdu.\n3. Şimdi tarif et: kulaklığın rengi, zemin, ışık, açı. Farkı karşılaştır.\n4. Aynı prompt'u iki farklı modelde dene; aynı tarifin farklı \"ellerde\" nasıl değiştiğini gör.\n\n### Örnek prompt'lar\n\n`headphones`\n\nModel her şeyi kendi seçer; kulaklığın türü, rengi, zemini ve ışığı rastgele olur, sonuç sıradan çıkar.\n\n`matte black wireless headphones on a concrete block, soft side light, dark grey background, shallow depth of field, clean tech product advertising look`\n\nElektronik ürün reklamı: ürün, zemin, ışık ve görüntü tarzı söylendi; sonuç reklam görseline yaklaşır.\n\n`a glass serum bottle with a dropper on a pale stone surface, soft diffused daylight, beige background, minimal skincare product photo, close-up`\n\nKozmetik ürün görseli: temiz zemin ve yumuşak ışıkla sade, güven veren bir his.\n\n`a modern hotel lobby with tall windows at golden hour, warm light on marble floors, wide shot, architectural photography`\n\nOtel ya da mekan tanıtımı: saat, ışık ve geniş açı birlikte verilince mekanın havası kurulur.\n\n### Sık yapılan hatalar\n\n- **Çok kısa prompt.** Tek kelime yazıp modelin tahminine kalmak; yazmadığın her şeyi model kendi alışkanlığıyla doldurur.\n- **Tek modele takılmak.** Bazı işler başka bir modelde çok daha iyi çıkar; farklı modelleri denemekten çekinme.\n- **İlk sonucu nihai sanmak.** AI'da üretim, deneme ve seçme işidir; birkaç sonuç alıp en iyisini seç.\n- **Önce aracı düşünmek.** Önce ne istediğini netleştir, sonra işe uygun aracı seç.\n\n### Ödev\n\n1. Üzerinde çalıştığın ya da yakında gelecek bir iş seç (ör. bir ürün gönderisi, bir mekan tanıtımı ya da kampanya görseli).\n2. Aynı fikri önce 1 kelimeyle, sonra 1 cümleyle, sonra 3 cümlelik detaylı tarifle üret.\n3. Üç sonucu yan yana koy; sonucu Claude'a gösterip yorum isteyebilirsin.", "module": 1, "moduleName": "Temeller", "n": 1, "summary": ["AI görsel modeli çizmez; karışık bir gürültüyle başlar ve senin yazdığın tarife bakarak onu adım adım bir görüntüye dönüştürür.", "Model anlamaz, tahmin eder: prompt'a yazmadığın her şeyi kendi alışkanlığıyla doldurur.", "Kural: önemli olan her şeyi (ürün, zemin, ışık, açı) açıkça yaz, önemsiz ayrıntıları modele bırak.", "Aynı prompt farklı modellerde farklı sonuç verir; tek modele takılma, birkaçını dene.", "İlk sonuç nihai değildir; birkaç üretim alıp en iyisini seçmek işin doğal parçasıdır."], "title": "AI görsel üretimi nasıl çalışır + araç haritası"}, {"checked": "Eylül 2026", "date": "30 Eylül 2026", "flow": {"edges": [{"a": "s", "b": "tr", "k": "f"}, {"a": "o", "b": "tr", "k": "f"}, {"a": "i", "b": "tr", "k": "f"}, {"a": "st", "b": "tr", "k": "f"}, {"a": "k", "b": "tr", "k": "f"}, {"a": "tr", "b": "join", "k": "txt", "l": "5 ifade"}, {"a": "join", "b": "g1", "k": "txt", "l": "prompt"}, {"a": "g1", "b": "swap", "k": "f"}, {"a": "swap", "b": "g2", "k": "txt", "l": "yeni prompt"}], "groups": [{"c1": 0, "c2": 0, "label": "Parçaları yaz", "r1": 0, "r2": 4}, {"c1": 1, "c2": 2, "label": "Birleştir", "r1": 0, "r2": 1}, {"c1": 3, "c2": 4, "label": "Tek parça değiştir", "r1": 0, "r2": 1}], "nodes": [{"c": 0, "id": "s", "pv": {"k": "txt", "v": "a glass serum bottle with a golden dropper"}, "r": 0, "s": 1, "t": "brief", "text": "Ne görünüyor?", "title": "Özne"}, {"c": 0, "id": "o", "pv": {"k": "txt", "v": "on a wet stone surface surrounded by fresh green leaves"}, "r": 1, "s": 1, "t": "brief", "text": "Nerede?", "title": "Ortam"}, {"c": 0, "id": "i", "pv": {"k": "txt", "v": "soft diffused morning light"}, "r": 2, "s": 1, "t": "brief", "text": "Işık nereden, nasıl?", "title": "Işık"}, {"c": 0, "id": "st", "pv": {"k": "txt", "v": "clean skincare advertising photography"}, "r": 3, "s": 1, "t": "brief", "text": "Ne tür bir görüntü?", "title": "Stil"}, {"c": 0, "id": "k", "pv": {"k": "txt", "v": "close-up at eye level"}, "r": 4, "s": 1, "t": "brief", "text": "Nereden bakıyoruz?", "title": "Kamera"}, {"c": 1, "id": "tr", "pv": {"items": ["yumuşak sabah ışığı → soft diffused morning light", "göz hizasında yakın çekim → close-up at eye level"], "k": "list"}, "r": 0, "s": 2, "t": "note", "text": "Her parçayı kısa bir İngilizce ifadeye çevir.", "title": "Türkçe → İngilizce"}, {"c": 1, "id": "join", "pv": {"k": "txt", "v": "a glass serum bottle with a golden dropper on a wet stone surface surrounded by fresh green leaves, soft diffused morning light, clean skincare advertising photography, close-up at eye level"}, "r": 1, "s": 3, "t": "prompt", "text": "Özne → ortam → ışık → stil → kamera, virgülle.", "title": "Sırayla birleştir"}, {"c": 2, "id": "g1", "pv": {"ar": "4:5", "k": "img", "m": "🧴", "tag": "Islak taşta serum, yumuşak ışık", "tone": "day"}, "r": 1, "s": 4, "t": "gen", "title": "İlk üretim"}, {"c": 3, "chips": ["tek değişken"], "id": "swap", "pv": {"k": "txt", "v": "… golden hour sunlight …"}, "r": 1, "s": 4, "t": "prompt", "text": "Diğer dört parça aynen kalır.", "title": "Sadece ışığı değiştir"}, {"c": 4, "end": true, "id": "g2", "pv": {"a": {"m": "🧴", "tag": "soft diffused light", "tone": "day"}, "b": {"m": "🧴", "tag": "golden hour", "tone": "gold"}, "k": "ba"}, "r": 1, "s": 4, "t": "compare", "text": "Değişen tek şey ışık; farkın kaynağını biliyorsun.", "title": "Farkı gör"}], "title": "Beş parçayı ayrı yazarsan her birini tek tek kontrol edersin"}, "genhq": false, "level": "Başlangıç", "md": "### Hızlı tekrar\n\n1. AI görsel modeli görseli nereden başlayarak üretir?\n2. Magnific, Higgsfield ve Krea hangi araç grubuna girer?\n\n### Konu\n\nİyi bir prompt rastgele kelime yığını değil, belli parçalardan oluşan bir tariftir. Bir fotoğraf çekimine hazırlanırken ekibe verdiğin brief'i düşün: ne çekilecek, nerede, nasıl bir ışıkla, hangi tarzda, hangi açıdan. Prompt da aynı brief, sadece modele yazılıyor.\n\nBeş ana parça:\n\n1. **Özne:** Görselin kahramanı kim ya da ne? Ne yapıyor, nasıl görünüyor?\n2. **Ortam:** Nerede? Arka planda ne var, günün hangi saati?\n3. **Işık:** Yumuşak mı sert mi, nereden geliyor, sıcak mı soğuk mu?\n4. **Stil:** Fotoğraf mı, illüstrasyon mu, 3D mi? Renk paleti, his.\n5. **Kamera:** Yakın çekim mi, geniş açı mı, yukarıdan mı, göz hizasından mı?\n\nKural: en önemli şey başa yazılır. Modeller genelde baştaki kelimelere daha çok önem verir; özneyi hep en başa koy.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Özne | Görselin ana konusu | subject |\n| Ortam | Mekan ve arka plan | setting, environment |\n| Altın saat | Gün batımı öncesi sıcak, alçak ışık | golden hour |\n| Stüdyo ışığı | Kontrollü, temiz ürün ışığı | studio lighting |\n| Yakın çekim | Konuya çok yakın kadraj | close-up |\n| Geniş çekim | Mekanın tamamını gösteren kadraj | wide shot |\n| Kuşbakışı | Tam yukarıdan bakış | top-down, flat lay |\n| Sinematik | Film karesi gibi dramatik görünüm | cinematic |\n\n### Uygulama\n\nSenaryo: Bir cilt bakımı markası yeni yüz serumu için ürün görseli istiyor. Prompt'u beş parçaya ayırıp tek tek kuruyoruz.\n\n1. İşi seç ve beş parçayı Türkçe olarak ayrı ayrı yaz (ör. özne: damlalıklı cam serum şişesi; ortam: ıslak taş, etrafında taze yeşil yapraklar).\n2. Her parçayı İngilizce kısa bir ifadeye çevir.\n3. Parçaları özne → ortam → ışık → stil → kamera sırasıyla virgülle birleştir.\n4. Magnific'te üret, sonra tek bir parçayı (mesela sadece ışığı) değiştirip tekrar üret. Her parçanın sonucu ne kadar etkilediğini böyle öğrenirsin.\n\n### Örnek prompt'lar\n\n`a glass serum bottle with a golden dropper on a wet stone surface surrounded by fresh green leaves, soft diffused morning light, clean skincare advertising photography, close-up at eye level`\n\nSerum ürün görseli: özne, ortam, ışık, stil ve kamera sırayla veriliyor; doğal ve temiz bir cilt bakımı hissi.\n\n`a woman applying a few drops of face serum in a bright minimal bathroom, gentle window light from the side, fresh beauty editorial style, medium close-up`\n\nCilt bakımı sosyal medyası: ürün kullanım anında; yan ışık cildi yumuşak gösterir, orta yakın kadraj hem yüzü hem eli alır.\n\n`a football striker in a dark stadium tunnel, stormy clouds above the pitch, dramatic rim light, cinematic sports poster style, low angle shot`\n\nMaç günü posteri: aynı beş parça bambaşka bir işte; alttan açı ve kenar ışığı gücü ve dramı anlatıyor.\n\n`flat lay of breakfast dishes on a rustic table, morning daylight, vibrant food photography, top-down view`\n\nRestoran sosyal medyası: kuşbakışı açı, menü görselleri için klasik bir kadraj.\n\n### Sık yapılan hatalar\n\n- **Özneyi sona gömmek.** Model baştaki kelimelere daha çok önem verir; görselin kahramanı prompt'un sonunda kalırsa gözden kaçabilir.\n- **Çelişen kelimeler.** \"Minimal\" ve \"çok detaylı\" gibi birbirine zıt istekleri aynı prompt'a koymak modeli kararsız bırakır.\n- **Boş sıfatlar.** \"Güzel\", \"harika\" gibi kelimelerden model bir şey anlamaz; ne gördüğünü tarif et.\n- **Işığı yazmamak.** Görselin kalitesini en çok ışık belirler; ışığı hiç söylemezsen model sıradan bir ışık seçer.\n\n### Profesyonel yöntem\n\nProfesyonel ekiplerin sık kullandığı yöntem, prompt'u bir burger gibi katman katman kurmaktır. Bu derste öğrendiğin beş parçanın biraz daha ayrıntılı hali altı katmandır: **görüntü türü → özne → aksiyon → ortam → stil → teknik detaylar.** Her katman bir öncekinin üstüne oturur; biri eksik kalınca görsel \"yarım\" hissettirir, hepsi üst üste binince tarif tamamlanır.\n\nNeden işe yarıyor? Modelin aklında bütün görsel kavramlar devasa bir harita gibi dizilidir. Senin kelimelerin o haritada bir GPS tarifi gibi çalışır: ilk kelimeler hangi bölgeye gidileceğini (fotoğraf mı, 3D mi, illüstrasyon mu), sonrakiler hangi sokağa, hangi kapıya varılacağını söyler. Tarif sırasız olursa model yanlış mahalleye sapar. Bu yüzden önce genel çerçeve, sonra ayrıntı gelir.\n\nKatmanlar serum örneğinde şöyle dolar:\n\n1. **Görüntü türü:** \"product photograph\" (tek-iki kelime; özne hemen arkasından geldiği için hâlâ en baştadır).\n2. **Özne:** damlalıklı cam serum şişesi.\n3. **Aksiyon:** damlalıktan tek bir damla süzülüyor. Durağan ürünlerde bile küçük bir hareket görsele hayat katar.\n4. **Ortam:** ıslak taş, taze yapraklar, sabah serinliği.\n5. **Stil:** temiz cilt bakımı reklamı, yeşil ve krem tonları, ferah his.\n6. **Teknik detaylar:** yakın çekim, göz hizası, sığ alan derinliği (arka planın flu olması).\n\nDengeye dikkat et: tarif ne çok belirsiz ne de aşırı yüklü olmalı. Bir duygu, günün saati ya da hava durumu eklemek görseli güçlendirir; ama her katmana beş sıfat doldurursan model neyin önemli olduğunu kestiremez. Her katmanda en fazla bir-iki net ifade yeterli.\n\nSon olarak çalışma ritmi: **üret → bak → tek şeyi değiştir.** Bir katmanı değiştir, tekrar üret, farkı not et. Küçük bir kelime bile sonucu çok değiştirebildiği için her seferinde yalnızca bir katmana dokunmak, neyin işe yaradığını öğrenmenin en kısa yoludur.\n\n### Ödev\n\n1. Üzerinde çalıştığın ya da yakında gelecek bir iş seç ve onun için beş parçalı (istersen altı katmanlı) bir prompt yaz.\n2. Aynı prompt'un üç versiyonunu üret: önce sadece ışığı, sonra sadece kamerayı, sonra sadece stili değiştir.\n3. Dört sonucu yan yana koy; sonucu Claude'a gösterip hangisinin neden daha iyi olduğu hakkında yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Tamamen karışık bir gürültüden; metne bakarak onu adım adım temizler.\n2. Hepsi bir arada platformlar: tek hesapta birçok model.", "module": 1, "moduleName": "Temeller", "n": 2, "summary": ["İyi bir prompt, çekim brief'i gibi beş parçadan oluşur: özne, ortam, ışık, stil ve kamera.", "Modeller baştaki kelimelere daha çok önem verdiği için özneyi her zaman prompt'un en başına yaz.", "Işığı mutlaka yaz; görselin kalitesini en çok ışık belirler.", "Güzel, harika gibi boş sıfatlar yerine ne gördüğünü tarif et ve birbiriyle çelişen kelimeleri birlikte kullanma.", "Her denemede yalnızca bir parçayı değiştir; böylece farkın nereden geldiğini görürsün."], "title": "Prompt'un anatomisi"}, {"checked": "Eylül 2026", "date": "30 Eylül 2026", "flow": {"edges": [{"a": "idea", "b": "set", "k": "f"}, {"a": "set", "b": "a", "k": "f"}, {"a": "set", "b": "b", "k": "f"}, {"a": "set", "b": "c", "k": "f"}, {"a": "set", "b": "d", "k": "f"}, {"a": "a", "b": "cmp", "k": "img", "l": "görsel"}, {"a": "b", "b": "cmp", "k": "img", "l": "görsel"}, {"a": "c", "b": "cmp", "k": "img", "l": "görsel"}, {"a": "d", "b": "cmp", "k": "img", "l": "görsel"}, {"a": "cmp", "b": "imp", "k": "f"}, {"a": "cmp", "b": "syn", "k": "f"}, {"a": "cmp", "b": "neg", "k": "f"}, {"a": "imp", "b": "note", "k": "txt", "l": "kelimeler"}, {"a": "syn", "b": "note", "k": "f"}, {"a": "neg", "b": "note", "k": "f"}], race"], "k": "list"}, "r": 2, "s": 7, "t": "prompt", "text": "Aynı isteği iki şekilde söyle.", "title": "Olumsuz mu, olumlu mu?"}, {"c": 5, "end": true, "id": "note", "pv": {"items": ["İşe yarayan kelimeler", "En iyi yazım biçimi", "Olumlu ifade daha güvenli"], "k": "list"}, "r": 1, "s": 7, "t": "card", "title": "Not defteri"}], "title": "Aynı fikir dört yazım biçiminde dört farklı görsel verir"}, "genhq": false, "level": "Başlangıç", "md": "### Hızlı tekrar\n\n1. Prompt'un beş ana parçası nelerdir?\n2. Özneyi neden prompt'un en başına yazarız?\n\n### Konu\n\nÖnceki derste prompt'un parçalarını öğrendik. Bu derste aynı fikri farklı biçimlerde yazmayı çalışıyoruz. Çünkü AI'da tek bir \"doğru prompt\" yoktur: aynı görsel fikri dört farklı şekilde yazarsan dört farklı sonuç alırsın. Hangi yazım biçiminin hangi modelde ve hangi işte daha iyi çalıştığını bilmek, deneme sayını ve kredi harcamanı ciddi şekilde azaltır.\n\nBenzetme: Aynı burger siparişini üç farklı garsona üç farklı şekilde söylediğini düşün. Biri \"cheeseburger, orta pişmiş, ekstra turşu\" gibi kısa listeyi sever, biri cümleyle anlatınca daha iyi anlar, biri de \"şöyle sulu olsun, peyniri kenarlardan taşsın\" diye tarif edince tam istediğini getirir. Modeller de böyle: bazısı kelime listesini, bazısı düzgün cümleyi daha iyi anlar.\n\nDört ana yazım biçimi:\n\n1. **Anahtar kelime tarzı:** Virgülle ayrılmış kısa ifadeler. Hızlıdır, eski ve bazı stil odaklı modellerde iyi çalışır. Ama kelimeler arasındaki ilişkiyi (ne nerede, kim neyi tutuyor) kaçırabilir.\n2. **Doğal cümle tarzı:** Birine anlatır gibi düzgün cümleler. Yeni nesil modeller cümleyi çok iyi anlar; özellikle birden fazla nesne ve konum ilişkisi varsa en güvenli yol budur.\n3. **Sahne/hikaye tarzı:** Görselin amacını ve hissini anlatırsın: \"Bir burger restoranının yaz kampanyası için, enerjik ve iştah açıcı...\" Model boşlukları bu hisse göre doldurur. Atmosfer işlerinde güçlüdür.\n4. **Başlıklı (yapılandırılmış) tarz:** \"Subject: … / Lighting: … / Style: …\" diye parçaları etiketleyerek yazmak. Aynı kampanyada onlarca görsel üreteceksen şablon gibi kullanılır; sadece bir satırı değiştirip seri üretirsin.\n\nBunun yanında üç küçük teknik var:\n\n- **Eş anlamlı değiştirme:** \"soft light\" yerine \"diffused light\", \"luxury\" yerine \"high-end\" gibi. Tek kelime bazen bütün havayı değiştirir.\n- **Olumlu ifade:** \"no people\" (insan olmasın) yazınca model bazen tam tersine insan çizer, çünkü \"people\" kelimesini görür. Bunun yerine \"empty street\" (boş sokak) gibi ne istediğini söyle.\n- **Tek değişken kuralı:** Karşılaştırma yaparken model, oran ve seed (başlangıç sayısı, ileride göreceğiz) sabit kalsın; sadece yazım biçimini değiştir. Yoksa farkın nereden geldiğini anlayamazsın.\n\nSon olarak Magnific'te prompt'u senin yerine zenginleştiren bir \"prompt'u iyileştir\" (Improve Prompt) özelliği var. Bunu sihirli değnek gibi değil, öğretmen gibi kullan: senin kısa prompt'una neler eklediğini oku, beğendiğin kelimeleri kendi kütüphanene al.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Anahtar kelime prompt'u | Virgülle ayrılmış kısa ifadelerden oluşan prompt | keyword prompt, tag-style prompt |\n| Doğal dil prompt'u | Düzgün, anlatır gibi yazılmış cümle prompt | natural language prompt |\n| Yapılandırılmış prompt | Parçaları başlıklarla etiketlenmiş şablon prompt | structured prompt |\n| Eş anlamlı değiştirme | Bir kelimeyi yakın anlamlısıyla değiştirip farkı görmek | synonym swap |\n| Negatif prompt | Görselde olmasını istemediğin şeyleri ayrı yazdığın alan | negative prompt |\n| Prompt iyileştirme | Aracın kısa prompt'unu otomatik olarak detaylandırması | prompt enhancement, improve prompt |\n| Yineleme | Sonuca bakıp prompt'u küçük adımlarla düzeltmek | iteration |\n| Karşılaştırma testi | Tek şeyi değiştirip iki sonucu yan yana koymak | A/B test |\n\n### Uygulama\n\n1. Bir fikir seç: \"Bir burger restoranının yeni menüsü için yaz kampanyası görseli\".\n2. Magnific'te görsel üretme ekranını aç. Bir model ve 4:5 oran seç; bu ders boyunca ikisini de değiştirme.\n3. Fikri dört yazım biçiminde yaz (anahtar kelime, doğal cümle, sahne/hikaye, başlıklı) ve her birini üret.\n4. Dört sonucu yan yana koy. Hangisi fikre en yakın? Hangisi en temiz ışığı verdi? Kısa not al.\n5. En kısa prompt'unu \"prompt'u iyileştir\" özelliğiyle zenginleştir. Eklenen kelimeleri oku; işine yarayanları not defterine yaz.\n6. En iyi sonucu veren prompt'ta sadece bir kelimeyi eş anlamlısıyla değiştir (mesela \"warm\" yerine \"amber\") ve tekrar üret.\n7. Bir de olumsuz bir istek dene: önce \"no people\" yaz, sonra aynı şeyi \"empty terrace\" diye olumlu söyle. Farkı gör.\n\n### Örnek prompt'lar\n\nAynı burger kampanyası fikri, dört farklı yazımla:\n\n`smash burger, melted cheddar, brioche bun, fries, wooden board, warm light, fast casual restaurant ad, close-up`\n\nAnahtar kelime tarzı: hızlı ve kısa, ama patateslerin burgerin neresinde durduğunu ve ışığın nereden geldiğini modele bırakıyor.\n\n`A double smash burger with melted cheddar dripping over the edge, served on a wooden board next to a paper cup of crispy fries, lit by warm light from the left, photographed as a close-up fast casual restaurant advertisement.`\n\nDoğal cümle tarzı: nesnelerin ilişkisi (tahtanın üstünde, patates yanında, ışık soldan) net; yeni modellerde genelde daha isabetli.\n\n`A summer campaign image for a lively burger joint: the feeling of a long, sunny weekend lunch with friends, a juicy smash burger and cold drinks on a sunlit counter, energetic and mouth-watering.`\n\nSahne/hikaye tarzı: amacı ve hissi anlatıyor; model ışık ve kompozisyonu bu hisse göre kuruyor.\n\n`Subject: double smash burger with melted cheddar on a wooden board. Lighting: warm light from the left. Style: fast casual restaurant advertising photo. Camera: close-up, slightly low angle. Mood: bold and appetizing.`\n\nBaşlıklı tarz: seri üretimde işe yarar; sadece \"Subject\" satırını tavuk burgerle ya da milkshake ile değiştirip aynı kampanyanın ikinci görselini alırsın.\n\n`an empty football stadium at night before kickoff, floodlights glowing through light fog, wet green pitch, cinematic match day poster, wide shot`\n\nMaç günü posteri: \"no people\" yerine \"empty stadium\" yazarak istenmeyen kalabalığı olumlu ifadeyle engelliyor.\n\n### Sık yapılan hatalar\n\n- **Birden fazla şeyi değiştirmek.** Karşılaştırma yaparken modeli ya da oranı da değiştirirsen fark nereden geldi, anlaşılmaz.\n- **Olumsuz cümleyi ana prompt'a yazmak.** \"No text\", \"without people\" gibi ifadelerde model o kelimeyi görüp tam tersini yapabilir. Olumlu söyle ya da varsa negatif prompt alanını kullan.\n- **İyileştirilmiş prompt'u okumadan kullanmak.** \"Prompt'u iyileştir\" bazen istemediğin bir stil ya da renk ekler; ne eklendiğine mutlaka bak.\n- **Tek yazım biçimine takılmak.** Bir model cümleyi, başka bir model kelime listesini daha iyi anlayabilir.\n\n### Profesyonel yöntem\n\nDeneyimli üreticilerin önerisi şu: prompt'u boş sayfadan sen yazma, bir sohbet asistanına (ör. Claude) yazdır ve sen yönet. Elindeki şey genelde tek cümlelik bir fikirdir, buna \"tohum\" diyebiliriz: \"yaz menüsü için iştah açıcı bir burger görseli\". Asistandan bu tohumu, sabit bir sırayla dizilmiş katmanlı bir prompt'a çevirmesini istersin: görüntü türü, özne, aksiyon, ortam, stil ve teknik detaylar. Böylece her seferinde aynı iskeleti alırsın ve hangi katmanın eksik olduğunu bir bakışta görürsün.\n\nNeden işe yarıyor? Çünkü bu dersteki dört yazım biçimini elle yazmak zaman alır; asistan aynı tohumdan dördünü de saniyeler içinde çıkarır. Sen yazmak yerine seçmeye ve düzeltmeye odaklanırsın. Ayrıca asistan her katman için doğru İngilizce terimi önerir; \"sulu, peyniri taşan burger\" gibi Türkçe bir tarifi modelin anlayacağı kelimelere çevirmek onun işi olur.\n\nİkinci güçlü teknik ters prompt'tur (reverse prompting): beğendiğin bir görseli, örneğin rakip bir restoranın kampanya fotoğrafını ya da bir film karesini asistana verip \"bunun prompt'unu katman katman çıkar\" dersin. Ortaya çıkan tarif sana o görüntünün ışığını, kadrajını ve renk dilini kelimelerle gösterir. O kelimeleri kendi fikrine uyarlarsın; görseli kopyalamazsın, dilini öğrenirsin.\n\nÇalışma sırası şöyle:\n\n1. Fikrini tek cümleyle yaz (tohum).\n2. Asistandan bunu katmanlı bir prompt'a ve istersen dört yazım biçimine çevirmesini iste.\n3. Üret, sonuca bak, sadece bir kelimeyi ya da tek bir katmanı değiştir. Küçük bir kelime bile sonucu çok değiştirebilir.\n4. Beğendiğin bir referans görsel varsa ters prompt'la onun kelimelerini çıkar ve kendi prompt'una ekle.\n5. İşe yarayan kelimeleri kendi not defterine kaydet; zamanla kendi prompt kütüphanen oluşur.\n\n### Ödev\n\n1. Üzerinde çalıştığın ya da yakında gelecek bir iş seç (sosyal medya gönderisi, ürün reklamı ya da restoran tanıtımı).\n2. Aynı fikri dört yazım biçiminde yaz ve aynı model, aynı oranla üret.\n3. En iyi çıkanda bir kelimeyi eş anlamlısıyla değiştirip beşinci versiyonu al. Toplam 20-30 dakika.\n4. Beş görseli ve prompt'ları Claude'a gösterip hangi yazım biçiminin senin işlerine daha uygun olduğu hakkında yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Özne, ortam, ışık, stil, kamera.\n2. Modeller genelde baştaki kelimelere daha çok önem verir; özne başta olunca görselin kahramanı gözden kaçmaz.\n\nSıradaki ders: Modeller: hangisi neyde iyi (Magnific'teki modeller üzerinden)\n\n### Kaynaklar\n\n- [Magnific API – Improve Prompt](https://docs.magnific.com/api-reference/improve-prompt/overview)", "module": 1, "moduleName": "Temeller", "n": 3, "summary": ["Tek bir doğru prompt yoktur; aynı fikri dört biçimde yazabilirsin: anahtar kelime, doğal cümle, sahne/hikaye ve başlıklı şablon.", "Birden fazla nesne ve konum ilişkisi varsa doğal cümle en güvenli yoldur; seri üretimde başlıklı şablon zaman kazandırır.", "Karşılaştırırken model ve oranı sabit tut, sadece yazım biçimini değiştir.", "\"No people\" gibi olumsuz ifadeler ters tepebilir; ne istediğini olumlu söyle, örneğin \"empty terrace\".", "Prompt'u iyileştirme aracını ve sohbet asistanını öğretmen gibi kullan; eklediği kelimeleri okuyup işe yarayanları sakla."], "title": "Prompt pratiği: aynı fikri farklı şekillerde yazmak"}, {"checked": "Ekim 2026", "date": "1 Ekim 2026", "flow": {"edges": [{"a": "menu", "b": "ar", "k": "f"}, {"a": "ar", "b": "pp", "k": "f"}, {"a": "pp", "b": "m1", "k": "txt", "l": "aynı prompt"}, {"a": "pp", "b": "m2", "k": "txt", "l": "aynı prompt"}, {"a": "pp", "b": "m3", "k": "txt", "l": "aynı prompt"}, {"a": "pp", "b": "m4", "k": "txt", "l": "aynı prompt"}, {"a": "m1", "b": "notes", "k": "img"}, {"a": "m2", "b": "notes", "k": "img"}, {"a": "m3", "b": "notes", "k": "img"}, {"a": "m4", "b": "notes", "k": "img"}, {"a": "notes", "b": "card", "k": "f"}, {"a": "txt", "b": "card", "k": "f", "l": "harf doğruluğu"}, {"a": "vec", "b": "card", "k": "f", "l": "temiz şekiller"}, {"a": "m2", "b": "txt", "k": "f"}], "groups": [{"c1": 0, "c2": 0, "label": "Hazırlık", "r1": 0, "r2": 1}, {"c1": 1, "c2": 2, "label": "Fotoğraf testi", "r1": 0, "r2": 3}, {"c1": 3, "c2": 4, "label": "Yazı ve vektör", "r1": 0, "r2": 1}, {"c1": 5, "c2": 5, "label": "Sonuç", "r1": 0, "r2": 0}], "nodes": [{"c": 0, "id": "menu", "r": 0, "s": 1, "t": "gen", "text": "Her modelin yanında kısa açıklama ve tahmini süre var.", "title": "Model menüsünü incele", "tool": "Image Generator"}, {"c": 0, "chips": ["4:5"], "id": "ar", "r": 1, "s": 2, "t": "gen", "text": "Sadece model değişecek.", "title": "Oran 4:5, sabit"}, {"c": 1, "id": "pp", "pv": {"k": "txt", "v": "A pair of white and neon orange running shoes mid-stride on a wet asphalt road at sunrise, water droplets splashing…"}, "r": 1, "s": 3, "t": "prompt", "title": "Ayakkabı prompt'u"}, {"c": 2, "id": "m1", "pv": {"ar": "4:5", "k": "img", "m": "👟", "tag": "Auto", "tone": "warm"}, "r": 0, "s": 3, "t": "gen", "title": "Auto"}, {"c": 2, "id": "m2", "pv": {"ar": "4:5", "k": "img", "m": "👟", "tag": "Seedream 5 Pro", "tone": "gold"}, "r": 1, "s": 3, "t": "gen", "title": "Seedream 5 Pro"}, {"c": 2, "id": "m3", "pv": {"ar": "4:5", "k": "img", "m": "👟", "tag": "Nano Banana 2", "tone": "day"}, "r": 2, "s": 3, "t": "gen", "title": "Nano Banana 2"}, {"c": 2, "id": "m4", "pv": {"ar": "4:5", "k": "img", "m": "👟", "tag": "Z-Image", "tone": "warm"}, "r": 3, "s": 3, "t": "gen", "title": "Z-Image"}, {"c": 3, "id": "notes", "pv": {"items": ["Işık doğal mı?", "Dikiş, bağcık, taban düzgün mü?", "Süre?", "Kaç kredi?"], "k": "list"}, "r": 0, "s": 4, "t": "note", "title": "Her sonuca not"}, {"c": 3, "chips": ["Seedream 5 Pro", "GPT 2", "Ideogram 4"], "id": "txt", "pv": {"ar": "4:5", "k": "img", "m": "🏃", "tag": "RUN THE CITY harfleri doğru mu?", "tone": "pop"}, "r": 1, "s": 5, "t": "gen", "title": "Yazı testi: RUN THE CITY"}, {"c": 4, "chips": ["Recraft V4.1"], "id": "vec", "pv": {"ar": "4:5", "k": "img", "m": "🎽", "tag": "Spor ikonları → ileride SVG", "tone": "pastel"}, "r": 1, "s": 6, "t": "gen", "title": "Vektör testi"}, {"c": 5, "end": true, "id": "card", "pv": {"items": ["Gerçek fotoğraf → …", "Yazılı poster → …", "İllüstrasyon → …", "Hızlı taslak → …"], "k": "list"}, "r": 0, "s": 7, "t": "card", "title": "Model kartı"}], "title": "Her işin kendi modeli var; testleri yapıp kendi model kartını çıkar"}, "genhq": false, "level": "Başlangıç", "md": "### Hızlı tekrar\n\n1. Anahtar kelime tarzı ile doğal cümle tarzı arasındaki temel fark ne; birden fazla nesne ve konum ilişkisi varsa hangisi daha güvenli?\n2. Ana prompt'a \"no people\" yazmak neden ters tepebilir, yerine ne yaparsın?\n\n### Konu\n\nŞimdiye kadar prompt'u nasıl yazacağımızı çalıştık. Bu derste o prompt'u kime vereceğimizi konuşuyoruz. Magnific'in görsel üretme ekranında tek bir \"AI\" yok; arkada farklı şirketlerin yaptığı onlarca model var. Model, görseli üreten \"beyin\" demek. Her biri farklı verilerle, farklı amaçlarla eğitildiği için aynı prompt'a farklı cevap verir: biri gerçek fotoğraf gibi ışıkta usta, biri görselin içine düzgün yazı yazmada, biri vektör illüstrasyonda.\n\nBenzetme: Ajansında bir çekim için ekip kurduğunu düşün. Ürün fotoğrafı için ürün fotoğrafçısını, afiş yazısı için tipografi bilen tasarımcıyı, çocuk kitabı çizimi için illüstratörü çağırırsın. Hepsine aynı brief'i versen de en iyi işi, o alanın uzmanı çıkarır. Modeller de böyle. Doğru modeli seçmek, prompt'u yeniden yazmaktan çoğu zaman daha hızlı sonuç verir.\n\nNeden önemli: Modeller hem kalite hem hız hem de harcadığı kredi bakımından farklıdır. Hızlı modeller birkaç saniyede sonuç verir ve genelde daha ucuzdur; en güçlü modeller bir dakikayı bulabilir ve daha çok kredi yer. Yani akıllı yol şu: fikri hızlı ve ucuz modelde dene, beğendiğin yönü güçlü modelde final kaliteye taşı.\n\nMagnific'teki başlıca model aileleri ve en iyi oldukları işler (Ekim 2026 itibarıyla):\n\n1. **Auto (otomatik):** Magnific prompt'una bakıp modeli kendisi seçer. Ne istediğini tam bilmediğin ilk denemelerde iyi bir başlangıç.\n2. **Seedream 5 (ByteDance):** Şu an Magnific'in genel amaçlı varsayılan önerisi. Fotoğraf gerçekliği, ürün ve reklam görselleri, referanslı işler. Pro sürümü kalite, Flash ve Lite sürümleri hız ya da yüksek çözünürlük için.\n3. **Nano Banana 2 / Pro / Lite (Google):** Gerçekçi fotoğraf ve karakterlerde çok güçlü. Pro, referans görselle düzenleme ve markaya sadık kalma işinde en titiz olanı; Lite ise ucuz ve hızlı taslak modeli.\n4. **GPT 2 ve GPT 2.5 (OpenAI):** Görselin içinde okunur yazı, infografik, düzen ağırlıklı tasarım, arayüz taslağı. Şeffaf arka planlı çıktı da verebilir. Saf fotoğraf gerçekliği değil, \"tasarım\" gerektiren işlerde öne çıkar.\n5. **Ideogram 4:** Tipografi uzmanı. Poster, afiş, logo denemesi gibi yazının merkezde olduğu işler.\n6. **Recraft V4.1:** Vektör ve illüstrasyon. Düz renkli ikon, menü çizimi, marka illüstrasyonu gibi işler; sonradan Illustrator'a taşımaya en uygun aile.\n7. **Flux.2 (Pro, Max, Flex, Klein) ve Flux Kontext:** Konsept, storyboard, referansla düzenleme. Klein çok hızlı taslak için, Max en yüksek kalite için.\n8. **Mystic 2.5:** Magnific'in kendi modeli; fotoğraf estetiğinde uzun süre öne çıktı. Bugün daha yeni modeller var ama belli bir \"Magnific havası\" için hâlâ denenebilir.\n9. **Hızlı ve ucuz grup (Z-Image, Classic Fast, Nano Banana 2 Lite, Flux.2 Klein):** Saniyeler içinde sonuç; fikir avı ve çok sayıda deneme için.\n\nModel listesinde \"beta\" etiketli olanlar yeni ve deneme aşamasındadır; keşif için güzel ama müşteri işinde sonucu iyice kontrol et.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Model | Görseli üreten yapay zeka \"beyni\"; her birinin güçlü olduğu iş farklı | model |\n| Model ailesi | Aynı şirketin farklı sürümleri (ör. Flux.2 Pro, Max, Klein) | model family |\n| Otomatik seçim | Aracın prompt'una göre modeli senin yerine seçmesi | auto mode |\n| Fotoğraf gerçekliği | Görselin gerçek fotoğraftan ayırt edilemeyecek kadar doğal olması | photorealism, photorealistic |\n| Metin işleme | Modelin görselin içine harfleri doğru ve okunur yazabilmesi | text rendering |\n| Referans görsel | Modele \"buna benzesin\" diye verdiğin örnek resim (stil, karakter, ürün) | reference image |\n| Taslak / final | Hızlı ucuz denemeler ile teslim edilecek yüksek kaliteli sonuç ayrımı | draft / final |\n| Kredi | Platformda her üretimin harcadığı birim; güçlü modeller genelde daha çok harcar | credits |\n\n### Uygulama\n\nSenaryo: Bir spor giyim markası yeni koşu ayakkabısı koleksiyonu için kampanya hazırlıyor. Ürün fotoğrafı, yazılı bir etkinlik afişi ve mağaza için basit ikon illüstrasyonları lazım. Her iş için hangi modelin daha iyi olduğunu test ederek bulacağız.\n\n1. Magnific'te görsel üretme ekranını (Image Generator) aç. Prompt kutusunun yanındaki model menüsüne tıkla ve listeye göz gezdir; her modelin yanında kısa bir açıklama ve tahmini süre görürsün.\n2. Oranı 4:5 yap ve bu ders boyunca değiştirme (oranları bir sonraki derste detaylı göreceğiz).\n3. Fotoğraf testi: Aşağıdaki koşu ayakkabısı prompt'unu sırasıyla Auto, Seedream 5 Pro, Nano Banana 2 ve Z-Image ile üret. Prompt'a hiç dokunma; sadece modeli değiştir (Ders 3'teki tek değişken kuralı).\n4. Her sonuç için kısa not al: ışık doğal mı, ayakkabının dikişleri, bağcıkları ve taban dokusu gibi detaylar düzgün mü, ne kadar sürdü, kaç kredi gitti.\n5. Yazı testi: Koşu etkinliği afişi prompt'unu (içinde \"RUN THE CITY\" yazısı olan) önce Seedream 5 Pro, sonra GPT 2 ve Ideogram 4 ile üret. Harflerin doğruluğunu karşılaştır.\n6. Vektör testi: Spor ikonları illüstrasyonu prompt'unu Recraft V4.1 ile üret. Beğenirsen bunu ileride SVG'ye çevirip Illustrator'da açacağız.\n7. Kendi \"model kartını\" yaz: \"Gerçek fotoğraf → …, yazılı poster → …, illüstrasyon → …, hızlı taslak → …\". Bu kart senin kişisel kısayolun olacak.\n\n### Örnek prompt'lar\n\n`A pair of white and neon orange running shoes mid-stride on a wet asphalt road at sunrise, water droplets splashing around the sole, low angle close-up, natural sports photography, shallow depth of field`\n\nSpor ayakkabı ürün fotoğrafı: saf fotoğraf işi. Seedream 5 Pro ya da Nano Banana 2 burada parlar; aynı prompt'u Z-Image ile üretip hız ve kalite farkını gör.\n\n`A bold poster for a city night run event: a runner silhouette in motion under orange street lights, black and neon orange color scheme, large headline text \"RUN THE CITY\" at the top, small text \"SUNDAY 08:00\" at the bottom, modern sports graphic design`\n\nKoşu etkinliği afişi: yazı merkezde. GPT 2 ya da Ideogram 4 seç. Türkçe karakterler (ş, ğ, ı) bazen bozulur; başlıkları önce İngilizce ya da düz harflerle dene, Türkçe metni gerekirse sonra Photoshop'ta ekle.\n\n`A clean product photo of a frosted glass skincare bottle with a silver pump on a light travertine surface, soft diffused studio light, subtle reflections, minimal composition, high-end beauty advertising`\n\nKozmetik ürün reklamı: elinde gerçek ürün fotoğrafı varsa Nano Banana Pro'ya referans olarak ver; ürünün şeklini, etiketini ve rengini en sadık koruyan aile bu.\n\n`Flat vector illustration set of sportswear icons: a running shoe, a training t-shirt, a water bottle and a gym bag, limited black and orange color palette, clean shapes, no gradients, sports store signage style`\n\nSpor mağazası ikonları: Recraft V4.1 ile düz renkli, temiz çizgili sonuç alırsın. (Buradaki \"no gradients\" bir stil tarifi olduğu için genelde sorun çıkarmaz; yine de \"flat colors\" demek daha güvenli.)\n\n`quick concept sketch, sneaker product ad on a neon-lit city street at night, dynamic low angle, rain reflections`\n\nHızlı taslak: Nano Banana 2 Lite ya da Flux.2 Klein ile 4-5 varyasyon çıkar, beğendiğin yönü güçlü modelde final kalitede tekrar üret.\n\n### Sık yapılan hatalar\n\n- **Her işe aynı modeli kullanmak.** Bir model bir işte kötü sonuç verince \"AI bunu yapamıyor\" demek; çoğu zaman sadece yanlış uzman seçilmiştir.\n- **Yazılı posterde fotoğraf modeli seçmek.** Fotoğraf odaklı modelle harflerle boğuşma; yazı varsa GPT 2 ya da Ideogram 4'ü dene.\n- **Fikir aşamasında pahalı modeli kullanmak.** En pahalı modelle deneme yapıp krediyi bitirme; önce hızlı modelde yön bul, sonra güçlü modele geç.\n- **Tek denemeyle yargılamak.** Her model aynı prompt'tan farklı sonuçlar çıkarır; en az 2-3 deneme sonra karar ver.\n\n### Profesyonel yöntem\n\nProfesyonel ekipler model seçimini tahmine bırakmaz; küçük bir \"yarışma\" düzenler ve işi iki aşamaya ayırır: **ucuz taslak, pahalı final.**\n\n1. **Yan yana dene.** Aynı prompt'u aynı oranla 3-4 modele birden verirler. Magnific Spaces gibi node'lu bir tuvalde bu çok kolaydır: tek bir prompt kutusunu birkaç üretim kutusuna bağlarsın, hepsi aynı anda çalışır ve sonuçlar yan yana dizilir. Neden işe yarar? Karşılaştırma aynı ekranda ve aynı koşullarda olduğu için farkın tamamen modelden geldiğini bilirsin.\n2. **Taslağı hızlı modelde yap.** Fikir arama aşamasında Z-Image, Nano Banana 2 Lite ya da Flux.2 Klein ile çok sayıda varyasyon çıkarılır. Amaç güzel görsel değil, doğru yönü bulmak: kadraj mı tuttu, renk mi, ayakkabının açısı mı?\n3. **Yönü bulunca güçlü modele geç.** Seçilen yön Seedream 5 Pro ya da Nano Banana Pro gibi bir modelde final kalitede yeniden üretilir. Böylece kredinin büyük kısmı sadece teslim edilecek görsele harcanır.\n4. **Gerçek ürün varsa referansla çalış.** Müşterinin ürünü (ayakkabının rengi, logosu, taban deseni) birebir doğru çıkmalıysa ürün fotoğrafı referans olarak verilir ve sadakatte titiz bir model seçilir. Ürün üzerindeki yazının okunaklı olması, marka renklerinin doğru çıkması ve logonun bozulmaması teslimden önce mutlaka kontrol edilir.\n5. **Sonucu kayda geçir.** Her testte hangi modelin hangi işte kazandığı not edilir. Bu notlar zamanla ekibin ortak \"model kartı\"na dönüşür; yeni gelen biri de hangi işte hangi modelle başlayacağını bilir.\n\nBu yöntemin asıl kazancı şu: model seçimi kişisel alışkanlık olmaktan çıkar, ölçülmüş bir karar olur. Örneğin bir spor giyim kampanyasında ürün fotoğrafı için bir model, afiş için başka bir model, ikon seti için üçüncü bir model kazanabilir; hepsini aynı akışta kullanmak gayet normaldir.\n\n### Ödev\n\n1. Üzerinde çalıştığın ya da yakında gelecek bir işi seç (ürün reklamı, sosyal medya gönderisi ya da yazılı bir afiş).\n2. Aynı prompt ve aynı 4:5 oranla dört modelde üret: Auto, Seedream 5 Pro, Nano Banana 2 ve işin türüne göre seçtiğin bir uzman model (yazı varsa Ideogram 4, illüstrasyonsa Recraft V4.1).\n3. Her biri için süreyi, harcanan krediyi ve bir cümlelik yorumunu küçük bir tabloya yaz.\n4. En sonda \"bu işte kazanan\" modeli seç. Toplam 20-30 dakika. Dört görseli ve tablonu Claude'a gösterip seçimin ve prompt'un hakkında yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Anahtar kelime tarzı virgülle ayrılmış kısa ifadelerdir, kelimeler arası ilişkiyi kaçırabilir. Doğal cümle tarzı \"ne nerede, kim neyi tutuyor\" ilişkisini net anlatır; birden fazla nesne ve konum varsa daha güvenlidir.\n2. Model \"people\" kelimesini görüp tam tersine insan çizebilir. Ne istediğini olumlu söylersin (\"empty street\", \"empty terrace\") ya da varsa negatif prompt alanını kullanırsın.\n\nSıradaki ders: En-boy oranı, çözünürlük, sosyal medya ölçüleri\n\n### Kaynaklar\n\n- [Magnific – AI Image Generator (model önerileri)](https://www.magnific.com/ai/image-generator)\n- Magnific uygulamasındaki güncel model listesi (1 Ekim 2026)", "module": 1, "moduleName": "Temeller", "n": 4, "summary": ["Magnific'te tek bir AI yok; her model farklı işte uzman: biri gerçek fotoğrafta, biri yazıda, biri vektör illüstrasyonda.", "Ürün fotoğrafına Seedream 5 Pro ya da Nano Banana 2, yazılı afişe GPT 2 ya da Ideogram 4, illüstrasyona Recraft V4.1 ile başla.", "Fikri hızlı ve ucuz modelde dene, beğendiğin yönü güçlü modelde final kalitede üret; kredi böyle korunur.", "Modelleri karşılaştırırken prompt ve oranı sabit tut, sadece modeli değiştir ve her modele 2-3 deneme hakkı ver.", "Testlerin sonunda hangi işte hangi modelin kazandığını yazan kendi model kartını çıkar."], "title": "Modeller: hangisi neyde iyi (Magnific'teki modeller üzerinden)"}, {"checked": "Ekim 2026", "date": "1 Ekim 2026", "flow": {"edges": [{"a": "brief", "b": "set", "k": "f"}, {"a": "set", "b": "g45", "k": "txt", "l": "prompt"}, {"a": "set", "b": "g916", "k": "txt", "l": "prompt"}, {"a": "set", "b": "g169", "k": "txt", "l": "prompt"}, {"a": "g916", "b": "fit", "k": "f"}, {"a": "g169", "b": "fit", "k": "f"}, {"a": "g45", "b": "res", "k": "img"}, {"a": "fit", "b": "safe", "k": "img", "l": "9:16 görsel"}], "groups": [{"c1": 0, "c2": 1, "label": "Brief ve ayar", "r1": 0, "r2": 0}, {"c1": 2, "c2": 3, "label": "Üç oran", "r1": 0, "r2": 2}, {"c1": 4, "c2": 5, "label": "Kontrol", "r1": 0, "r2": 1}], "nodes": [{"c": 0, "id": "brief", "pv": {"items": ["Instagram gönderisi 4:5", "Story 9:16", "Yatay ekran 16:9"], "k": "list"}, "r": 0, "s": 1, "t": "brief", "title": "Konser kampanyası"}, {"c": 1, "chips": ["Nano Banana 2", "4:5", "2K"], "id": "set", "r": 0, "s": 2, "t": "gen", "title": "Ayarlar", "tool": "Image Generator"}, {"c": 2, "id": "g45", "pv": {"ar": "4:5", "k": "img", "m": "🎤", "tag": "Sanatçı alt-orta, üstte boşluk", "tone": "dark"}, "r": 0, "s": 3, "t": "gen", "text": "Başlık için üstte boşluk kaldı mı?", "title": "4:5 gönderi"}, {"c": 2, "id": "g916", "pv": {"ar": "9:16", "k": "img", "m": "🎤", "tag": "Sahne yeniden kuruldu", "tone": "dark"}, "r": 1, "s": 4, "t": "gen", "title": "Aynı prompt, 9:16"}, {"c": 2, "id": "g169", "pv": {"ar": "16:9", "k": "img", "m": "🎤", "tag": "Kırpma değil, yeni sahne", "tone": "dark"}, "r": 2, "s": 4, "t": "gen", "title": "Aynı prompt, 16:9"}, {"c": 3, "id": "fit", "pv": {"items": ["9:16 → subject in the center, empty space at the top", "16:9 → subject on the right third, empty space on the left for text"], "k": "list"}, "r": 1, "s": 5, "t": "prompt", "title": "Orana göre ek"}, {"c": 4, "id": "res", "pv": {"a": {"m": "🎤", "tag": "2K", "tone": "dark"}, "b": {"m": "🎤", "tag": "4K", "tone": "dark"}, "k": "ba"}, "r": 0, "s": 6, "t": "compare", "text": "Süre, kredi ve %100 yakınlaştırma; sonra telefonda bak.", "title": "4K mı, 2K mı?"}, {"c": 4, "end": true, "id": "safe", "pv": {"k": "safe"}, "r": 1, "s": 7, "t": "ps", "text": "9:16'da üstte ve altta 250-350 px arayüz payı.", "title": "Güvenli alan şeritleri", "tool": "Photoshop"}], "title": "Oran değişince model sahneyi baştan kurar; prompt'u da orana göre yaz"}, "genhq": false, "level": "Başlangıç", "md": "### Hızlı tekrar\n\n1. Görselin içinde okunur bir başlık yazısı olan bir poster için Magnific'te hangi modelleri seçersin?\n2. Fikir arama aşamasında neden hızlı ve ucuz modelle başlıyoruz?\n\n### Konu\n\nBir görseli üretmeden önce iki karar verirsin: şekli ve boyutu. En-boy oranı görselin şeklidir, yani genişliğin yüksekliğe oranı: 1:1 kare, 4:5 hafif dik, 9:16 telefon ekranı kadar dik, 16:9 televizyon ve YouTube gibi yatay. Çözünürlük ise aynı şeklin kaç pikselle, yani ne kadar detayla çizildiğidir: 1080×1350 ile 2160×2700 aynı şekil ama ikincisi iki kat net.\n\nBenzetme: Oran tuvalin şekli, çözünürlük tuvalin büyüklüğü. Bir ressama önce \"dikey mi, yatay mı\" dersin, sonra \"kartpostal mı, duvar posteri mi\". Kartpostala yapılmış resmi duvar boyutuna büyütürsen bulanıklaşır; yatay tuvale yapılmış manzarayı dik çerçeveye sokarsan kenarlarını kesersin.\n\nNeden önemli: AI'da oran sadece kırpma değildir, kompozisyonu baştan belirler. 9:16 seçince model boylu boyunca bir sahne kurar, 16:9 seçince geniş bir sahne. Kare üretip sonra 9:16'ya kırparsan sahnedeki sanatçının ya da ürünün yarısı gider. Kural: önce görselin nerede yayınlanacağına karar ver, oranı ona göre seç, sonra prompt'u yaz.\n\nÇözünürlük: Magnific'te bazı modellerde 1K, 2K, 4K gibi seçenekler var. Kabaca 1K uzun kenarda 1000 piksel civarı, 2K 2000, 4K 4000 demek. Sosyal medya 1080 piksel genişlik ister, yani 2K genelde fazlasıyla yeter. 4K daha çok kredi ve süre harcar; baskı ve büyük ekran içindir. Daha büyük boyut gerekiyorsa çoğu zaman akıllı yol 2K üretip sonra büyütmektir (upscale, iki ders sonra).\n\nModel uyarısı (Magnific, Ekim 2026): Her model her oranı vermiyor. Nano Banana 2, Nano Banana Pro ve Ideogram 4'te 4:5 var; Seedream 5 Pro ile GPT 2'de 4:5 yok, en yakını 3:4. Önceki derste \"4:5 seç\" demiştik; menüde 4:5 görmezsen 3:4 seç. İyi haber: Instagram artık profil ızgarasını 3:4 gösteriyor ve 1080×1440 yüklemeyi destekliyor, yani 3:4 de birinci sınıf bir seçenek.\n\nBaskı: Baskıda ölçü DPI'dır. Yakından bakılan baskı için 300 DPI hedeflenir: A4 için 2480×3508 piksel gerekir. AI'dan bu boyutu doğrudan almak zor; 2K-4K üretip büyütürsün. Uzaktan bakılan billboard daha düşük DPI ile idare eder. Konser ve etkinlik afişleri çoğu zaman hem sosyal medyaya hem baskıya gider; bu yüzden bu ders özellikle afiş işlerinde işine yarar.\n\nÖlçü kartı (Ekim 2026):\n\n| Nerede | Oran | Piksel | Not |\n| --- | --- | --- | --- |\n| Instagram gönderi (dik) | 4:5 | 1080×1350 | Akışta en çok yer kaplar, reklamlarda standart |\n| Instagram gönderi (ızgara uyumlu) | 3:4 | 1080×1440 | Profil ızgarasında kesilmeden görünür |\n| Kare gönderi | 1:1 | 1080×1080 | Hâlâ çalışır ama akışta küçük kalır |\n| Story, Reels, TikTok, Shorts | 9:16 | 1080×1920 | Üst ve altta arayüz var, önemli şeyleri ortada tut |\n| YouTube video, sunum, ekran | 16:9 | 1920×1080 | YouTube kapak görseli 1280×720 |\n| Bağlantı görseli (Facebook, LinkedIn) | 1.91:1 | 1200×628 | Yatay paylaşımlar için |\n| A4 baskı (300 DPI) | yaklaşık 1:1.41 | 2480×3508 | 2:3 ya da 3:4 üret, kırp veya genişlet, sonra büyüt |\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| En-boy oranı | Görselin genişliğinin yüksekliğine oranı, yani şekli | aspect ratio |\n| Çözünürlük | Görselin kaç pikselden oluştuğu; detay ve netlik miktarı | resolution |\n| Piksel | Dijital görseli oluşturan en küçük renkli nokta | pixel |\n| Dikey / yatay / kare | Görselin duruşu | portrait / landscape / square |\n| Güvenli alan | Arayüz ya da kırpma yüzünden kapanmayacak, önemli şeyleri koyduğun orta bölge | safe zone |\n| DPI | Baskıda bir inçe düşen nokta sayısı; baskı netliğinin ölçüsü | DPI (dots per inch) |\n| Kırpma | Görselin kenarlarını kesip oranını değiştirmek | crop |\n| Yazı boşluğu | Başlık ya da logo için bilerek sade bıraktığın bölge | negative space, copy space |\n\n### Uygulama\n\n1. Bu dersin senaryosu: bir açık hava konseri için üç format üreteceğiz: Instagram gönderisi, story ve yatay ekran görseli (mekândaki LED ekran ya da etkinlik sayfası banner'ı).\n2. Magnific'te Image Generator'ı aç, model olarak Nano Banana 2'yi seç (oran listesi en geniş olanlardan). Oranı 4:5, çözünürlüğü 2K yap.\n3. Aşağıdaki 1. prompt'u üret. Kompozisyona bak: sanatçı ve sahne nerede, üstte konser adı ve tarih için boşluk kaldı mı?\n4. Prompt'a dokunmadan oranı 9:16 yap, üret; sonra 16:9 yap, üret. Modelin görseli kırpmadığını, sahneyi her oran için yeniden kurduğunu gör.\n5. Şimdi prompt'u orana göre uyarla: 9:16 için \"subject in the center, empty space at the top\", 16:9 için \"subject on the right third, empty space on the left for text\" ekle. Tekrar üret, farkı karşılaştır.\n6. Çözünürlük testi: 4:5 görseli bir de 4K ile üret. Süreyi ve krediyi not et, Photoshop'ta %100 yakınlaştırıp karşılaştır, sonra ikisini telefonda aç. Farkı görebiliyor musun?\n7. Photoshop'ta 9:16 görselin üstünden ve altından yaklaşık 250-350 piksellik şerit çiz (kılavuz çizgisiyle). Story ve Reels'te kullanıcı adı, açıklama ve butonlar buraya oturur; konser tarihi ve bilet bilgisi bu şeritlere girmesin.\n\n### Örnek prompt'lar\n\n`Outdoor summer concert poster background: a singer on stage seen from behind, raising one arm towards a huge crowd, warm orange stage lights and haze, confetti in the air, vertical composition, performer in the lower center, clean dark empty sky at the top for the event name and date, live music photography`\n\nKonser Instagram gönderisi (4:5): \"empty space at the top\" ile konser adı ve tarihe yer açarsın; sanatçıyı alta indirmek dik formatı dengeler ve kalabalık hissini korur.\n\n`Vertical story background for a jazz night: a saxophone player under a single blue spotlight on a small club stage, smoky atmosphere, musician centered in the middle of the frame, plain dark background at the top and bottom, moody cinematic photography`\n\nEtkinlik story'si (9:16): müzisyen tam ortada, üst ve alt sade; Instagram arayüzü oraya oturur ve sanatçıyı kapatmaz. Prompt'a \"vertical\" yazmak oranı ayarlamaz, asıl oranı menüden seçersin; kelime sadece kompozisyona yardım eder.\n\n`Wide cinematic banner of an open-air music festival at sunset, a big stage with light beams on the right side, crowd silhouettes with raised hands, colorful flags, dark empty sky on the left side for text, energetic festival atmosphere`\n\nFestival yatay görseli (16:9): YouTube kapağı, mekândaki LED ekran ya da bilet satış sayfası banner'ı için. Sol taraf sanatçı listesi ve tarih yazısına ayrıldı.\n\n`Top-down flat lay of a Turkish breakfast spread on a rustic table, square composition, plates arranged in a circle around the center, bright natural daylight, food photography for a restaurant menu`\n\nRestoran kare görseli (1:1): dairesel düzen kareyi dengeli doldurur; kare için en doğal kompozisyonlardan biri. Konser dışı bir örnek, ama \"kare = merkezde toplanan düzen\" mantığı her sektörde aynı.\n\n`Product advertisement for a premium sneaker floating above a concrete surface, vertical poster layout, sneaker in the middle third, studio lighting with soft shadow, clean light gray background, space at the bottom for logo and price`\n\nÜrün reklamı (3:4): Seedream 5 Pro ya da GPT 2 ile çalışırken 4:5 yoksa 3:4 seç; Instagram ızgarasıyla da birebir uyumlu. Alttaki boşluk logo ve fiyat için.\n\n### Sık yapılan hatalar\n\n- **Kare üretip sonradan 9:16'ya kırpmak.** Sanatçının ya da ürünün kafası kesilir. Baştan doğru oranda üret; zorunda kalırsan kesmek yerine genişlet (expand, Modül 2'de).\n- **Oranı sadece prompt'a yazıp menüden seçmemek.** Oranı menü belirler, prompt'taki kelime sadece kompozisyonu destekler.\n- **Her işe 4K seçmek.** Kredi ve süre gider, sosyal medya zaten 1080'e küçültür. 2K yeter; gerekirse sonradan büyüt.\n- **Story ve Reels'te yazıyı en üste ya da en alta koymak.** Arayüz kapatır. Carousel'de de slaytların oranını karıştırma: hepsi ilk slaytın oranına kırpılır.\n\n### Profesyonel yöntem\n\nDeneyimli üreticiler oranı bir \"ayar\" olarak değil, hikayenin bir parçası olarak görür. Aynı konser sahnesi karede derli toplu ve sakin, dikeyde yükselen ve kişisel, yatayda ise geniş ve görkemli bir his verir. Bu yüzden önce \"bu görsel izleyiciye ne hissettirmeli ve nerede görülecek\" sorusunu cevaplarlar, oranı ona göre seçerler, prompt'u da en son yazarlar.\n\nPrompt'u yazarken sabit bir sıra kullanmak işi hızlandırır. Sektörde sık önerilen düzen şöyle:\n\n1. Görüntü türü: fotoğraf mı, afiş mi, illüstrasyon mu (\"live music photography\", \"festival poster\").\n2. Özne: kim ya da ne (sahnedeki şarkıcı, saksafoncu).\n3. Eylem: ne yapıyor (kolunu kaldırıyor, çalıyor).\n4. Ortam: nerede (açık hava sahnesi, küçük caz kulübü).\n5. Stil: hangi hava (sinematik, enerjik, karanlık ve dumanlı).\n6. Teknik detaylar: ışık, kompozisyon, boş alanın yeri (\"dark empty sky at the top\").\n\nOran bu listenin en sonundaki \"kompozisyon\" kısmını doğrudan değiştirir. Aynı altı katmanı koruyup sadece son kısmı orana göre yazarsın: 4:5'te \"özne altta, üstte boşluk\", 9:16'da \"özne ortada, üst ve alt sade\", 16:9'da \"özne sağda, solda yazı alanı\". Katmanlar sabit kaldığı için üç format aynı kampanyanın parçası gibi görünür; sadece yerleşim değişir.\n\nNeden işe yarıyor: Model, prompt'taki kelimelerle kafasındaki görsel \"haritada\" bir noktaya gider. Yapı her seferinde aynı olunca hangi kelimenin neyi değiştirdiğini görürsün ve her denemede tek şeyi değiştirebilirsin. Uzun ama dağınık bir prompt yerine kısa ama düzenli bir prompt hem daha tutarlı sonuç verir hem de ekipte başkası tarafından kolayca uyarlanır.\n\n### Ödev\n\nGerçek ya da hayali bir etkinlik (konser, festival, stand-up gösterisi ya da tiyatro oyunu) için tek bir kampanya fikrini üç formatta üret: 4:5 ya da 3:4 gönderi, 9:16 story ve 16:9 banner.\n\n1. Prompt'u yukarıdaki altı katmanla yaz; her formatta sadece kompozisyon kısmını o orana göre uyarla: sanatçı nerede, yazı boşluğu nerede.\n2. Üç görseli 2K üret.\n3. Photoshop'ta her birine etkinlik adını, tarihi ve mekânı ekle; story'de güvenli alan kontrolü yap.\n4. Hangi oranda prompt'u ne kadar değiştirmen gerektiğini kısaca not al.\n5. Toplam 20-30 dakika. Üç görseli Claude'a göster; kompozisyonu ve prompt'ları birlikte değerlendirebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. GPT 2 (ya da GPT 2.5) ve Ideogram 4: görselin içine doğru ve okunur yazı yazmada en güçlü modeller. Türkçe karakter riski varsa başlığı sonra Photoshop'ta eklemek de bir seçenek.\n2. Hızlı modeller saniyeler içinde ve az krediyle sonuç verir; yön bulmak için çok deneme gerekir. Beğendiğin yönü sonra güçlü modelde final kaliteye taşırsın, böylece kredi boşa gitmez.\n\nSıradaki ders: Seed, varyasyon, tekrar üretilebilirlik\n\n### Kaynaklar\n\n- [Linearity – Instagram size guide 2026](https://www.linearity.io/blog/instagram-size-guide/)\n- Magnific uygulamasındaki model listesi ve oran seçenekleri (1 Ekim 2026)", "module": 1, "moduleName": "Temeller", "n": 5, "summary": ["En-boy oranı görselin şeklidir, çözünürlük ise ne kadar detaylı olduğudur; ikisine üretmeden önce karar verilir.", "Oranı görselin yayınlanacağı yere göre menüden seç; model her oran için sahneyi baştan kurar, sonradan kırpmak ürünü ya da kişiyi keser.", "Prompt'un kompozisyon kısmını orana göre yaz: dikeyde özne ortada, yatayda bir yanda, yazı için boş alanı açıkça iste.", "Sosyal medya için 2K yeter; 4K kredi yakar, baskı gerekiyorsa 2K üretip sonra büyüt.", "Story ve Reels'te üst ve alttaki 250-350 piksellik şeritlere yazı koyma, arayüz kapatır."], "title": "En-boy oranı, çözünürlük, sosyal medya ölçüleri"}, {"checked": "Ekim 2026", "date": "1 Ekim 2026", "flow": {"edges": [{"a": "brief", "b": "set", "k": "f"}, {"a": "set", "b": "four", "k": "txt", "l": "prompt"}, {"a": "four", "b": "seed", "k": "img", "l": "beğenilen"}, {"a": "seed", "b": "swap", "k": "f"}, {"a": "swap", "b": "res", "k": "txt", "l": "yeni prompt"}, {"a": "four", "b": "var", "k": "img", "l": "seed yoksa"}, {"a": "res", "b": "card", "k": "f"}, {"a": "var", "b": "card", "k": "f"}], "groups": [{"c1": 0, "c2": 2, "label": "Üret", "r1": 0, "r2": 0}, {"c1": 3, "c2": 4, "label": "Tekrar üret", "r1": 0, "r2": 1}, {"c1": 3, "c2": 4, "label": "Seed yoksa", "r1": 2, "r2": 2}], "nodes": [{"c": 0, "id": "brief", "pv": {"k": "txt", "v": "“Aynısı, ama fincan mat siyah olsun.”"}, "r": 0, "s": 1, "t": "brief", "title": "Müşteri isteği"}, {"c": 1, "chips": ["Seedream 5 Pro", "3:4", "2K", "4 görsel"], "id": "set", "pv": {"k": "txt", "v": "Specialty coffee product shot: a white ceramic cup of flat white with simple latte art…"}, "r": 0, "s": 2, "t": "gen", "title": "Ayarlar"}, {"c": 2, "id": "four", "pv": {"ar": "3:4", "items": [{"m": "☕", "tag": "seed 1", "tone": "white"}, {"m": "☕", "tag": "seed 2", "tone": "warm"}, {"m": "☕", "tag": "seed 3", "tone": "day"}, {"m": "☕", "tag": "seed 4", "tone": "white"}], "k": "grid"}, "r": 0, "s": 3, "t": "gen", "text": "Prompt aynı; fark tamamen seed'den.", "title": "Dört görsel, dört seed"}, {"c": 3, "id": "seed", "pv": {"k": "seed", "v": "48213907"}, "r": 0, "s": 4, "t": "seed", "text": "Seed kutusuna gir, görsel sayısını 1 yap, aynı prompt'la üret.", "title": "Seed'i tekrarla"}, {"c": 4, "chips": ["aynı seed"], "id": "swap", "pv": {"k": "txt", "v": "white ceramic cup → matte black ceramic cup"}, "r": 0, "s": 5, "t": "prompt", "title": "Tek değişken"}, {"c": 5, "id": "res", "pv": {"a": {"m": "☕", "tag": "beyaz fincan", "tone": "white"}, "b": {"m": "☕", "tag": "mat siyah fincan", "tone": "dark"}, "k": "ba"}, "r": 0, "s": 5, "t": "compare", "text": "Sonra seed'i rastgele yapıp aynı prompt'la karşılaştır.", "title": "Kompozisyon korundu mu?"}, {"c": 3, "chips": ["Subtle", "Wild"], "id": "var", "pv": {"ar": "3:4", "items": [{"m": "☕", "tag": "Subtle", "tone": "warm"}, {"m": "☕", "tag": "Wild", "tone": "riso"}], "k": "grid"}, "r": 2, "s": 6, "t": "variation", "text": "Seed kutusu olmayan modellerde yakın versiyon almanın yolu.", "title": "Variations / Reimagine"}, {"c": 6, "end": true, "id": "card", "pv": {"items": ["Model", "Prompt", "Oran ve çözünürlük", "Seed: 48213907"], "k": "list"}, "r": 0, "s": 7, "t": "card", "title": "Tarif kartı"}], "title": "Seed'i not edersen aynı görsele geri dönebilir, tek şeyi değiştirebilirsin"}, "genhq": false, "level": "Başlangıç", "md": "### Hızlı tekrar\n\n1. Story (9:16) görselinde başlığı neden en üste ya da en alta koymamalısın?\n2. Seedream 5 Pro'da 4:5 seçeneği yoksa hangi oranı seçersin ve bu neden sorun değil?\n\n### Konu\n\nAynı prompt'u iki kez yazıp üretince iki farklı görsel çıkar. Bunun sebebi seed. AI bir görseli çizmeye boş bir tuvalden değil, karlı televizyon ekranı gibi rastgele bir noktalar karmaşasından (gürültü) başlar ve bu karmaşayı adım adım temizleyerek görsele dönüştürür. Seed, o başlangıç karmaşasını belirleyen numaradır. Numara değişirse başlangıç değişir, görsel de değişir.\n\nBenzetme: Seed bir iskambil destesinin karıştırma numarası gibi. Prompt oyunun kuralları, seed de destenin hangi sırayla dağıtıldığı. Aynı kurallarla aynı numaralı karıştırmayı yaparsan eline aynı kartlar gelir. Numarayı değiştirirsen kurallar aynı kalsa da el bambaşka olur.\n\nNeden önemli: Ajans işinde en sık duyduğun cümle \"Bu çok güzel, sadece şunu değiştirelim\". Seed'i bilmezsen her yeni üretim zar atmaya döner ve beğenilen görseli bir daha yakalayamazsın. Seed'i not edip sabit tutarsan aynı başlangıçtan yola çıkarsın; prompt'ta küçük bir şeyi değiştirdiğinde kompozisyon büyük ölçüde korunur. Buna tekrar üretilebilirlik denir: aynı tarifle aynı kahveyi tekrar demleyebilmek.\n\nTekrar üretmek için dört şeyin aynı kalması gerekir: model, prompt, ayarlar (oran, çözünürlük, kalite) ve seed. Biri değişirse sonuç da değişir. Farklı bir model aynı seed ile bambaşka bir görsel verir; seed bir modelden diğerine taşınmaz.\n\nDürüst uyarı: Seed sihirli değnek değildir. Prompt'ta bir kelime değiştirdiğinde görsel de biraz kayar; ne kadar değiştirirsen o kadar kayar. Bazı yeni büyük modeller seed'i tam uygulamaz, aynı numarayla bile küçük farklar çıkabilir. Görselin geri kalanı piksel piksel aynı kalsın, sadece bir parça değişsin istiyorsan doğru araç seed değil, parça düzeltmedir (inpaint, Modül 2).\n\nVaryasyon üretmenin dört yolu var:\n\n1. Aynı prompt, farklı seed: görsel sayısını 4 yaparsın, her biri farklı seed ile çıkar. Fikir ararken en hızlı yol.\n2. Sabit seed, tek değişiklik: beğendiğin görselin seed'ini sabit tutup prompt'ta yalnızca bir şeyi değiştirirsin (renk, ışık, mevsim). Revizyon için en kontrollü yol.\n3. Görselden varyasyon: beğendiğin görseli Magnific'te Variations ya da Reimagine'e gönderirsin. Reimagine'de Subtle (hafif), Vivid (belirgin), Wild (çılgın) seviyeleri farkın büyüklüğünü belirler.\n4. Hayal gücü ayarı: Image Generator'daki Imagination level, AI'ın prompt'a ne kadar sadık kalacağını, ne kadar kendinden katacağını ayarlar. Düşük = söz dinleyen, yüksek = yaratıcı ama sürprizli.\n\nMagnific notu (Ekim 2026): Magnific'in Image Generator ekranında tek seferde 1-4 görsel üretebilirsin, sonuçların üzerinden Variations ile yeni yorumlar alabilirsin. Seed kutusu her modelde ekranda görünmeyebilir; bazı modellerin gelişmiş ayarlarında çıkar. Görmüyorsan iki yolun var: sonuçtan varyasyon almak ya da Claude'a Magnific bağlantısı üzerinden \"şu prompt'u şu seed ile üret\" demek; Claude üretimde seed numarasını ayarlayabiliyor ve sonucun seed'ini okuyabiliyor.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Seed (tohum numarası) | Görselin başlangıçtaki rastgele karmaşasını belirleyen sayı; aynı numara aynı başlangıç | seed |\n| Gürültü | AI'ın çizime başladığı karlı ekran gibi rastgele nokta karmaşası | noise |\n| Varyasyon | Bir fikrin ya da görselin farklı yorumları | variation |\n| Tekrar üretilebilirlik | Aynı ayarlarla aynı sonucu yeniden alabilmek | reproducibility |\n| Sabit seed | Seed numarasını değiştirmeden tutmak | fixed seed, locked seed |\n| Rastgele seed | Her üretimde yeni bir numara verilmesi (varsayılan durum) | random seed |\n| Hayal gücü seviyesi | AI'ın prompt'a ne kadar sadık kalacağı, ne kadar kendinden katacağı | imagination level, creativity |\n| Tek değişken testi | Her denemede yalnızca bir şeyi değiştirip farkı görmek | A/B test, one variable at a time |\n\n### Uygulama\n\n1. Bu dersin senaryosu: bir kahve markası için yeni fincan serisinin ürün görselini üretiyoruz. Müşteri ilk sunumda birini beğeniyor ve \"Aynısı, ama fincan mat siyah olsun\" diyor.\n2. Magnific'te Image Generator'ı aç. Model olarak Seedream 5 Pro ya da Nano Banana 2'yi seç, oranı 3:4 (ya da 4:5), çözünürlüğü 2K, görsel sayısını 4 yap.\n3. Aşağıdaki 1. prompt'u üret. Dört görsel çıkar: prompt aynı, seed'ler farklı. Aralarındaki farka bak; işte seed'in gücü bu.\n4. En beğendiğini seç ve detayını aç. Seed numarası görünüyorsa bir yere not et. Modelin ayarlarında Seed kutusu varsa numarayı gir, görsel sayısını 1 yap ve aynı prompt'la tekrar üret. Aynı ya da çok benzer görsel gelmeli.\n5. Tek değişken testi: Seed aynı kalsın, prompt'ta sadece \"white ceramic cup\" yerine \"matte black ceramic cup\" yaz ve üret. Kompozisyon, ışık ve arka plan ne kadar korundu? Sonra bir kez de seed'i rastgeleye çevirip aynı prompt'u üret; farkı karşılaştır.\n6. Seed kutusu yoksa: beğendiğin görselde Variations'a bas ya da görseli Reimagine'e gönder. Önce Subtle, sonra Wild dene. Farkın büyüklüğü nasıl değişti?\n7. Tarif kartı: Beğenilen her görsel için şunları bir nota yaz: model, prompt, oran, çözünürlük, seed. Revizyon geldiğinde bu kart seni kurtarır.\n\n### Örnek prompt'lar\n\n`Specialty coffee product shot: a white ceramic cup of flat white with simple latte art on a smooth beige stone, coffee beans scattered beside it, soft window light from the left, gentle shadow, warm neutral background, shallow depth of field, editorial product photography`\n\nKahve markası, temel prompt: önce görsel sayısını 4 yapıp seed avına çık. Beğendiğinin seed'ini sabitle, sonra sadece \"white ceramic cup\" kısmını \"matte black ceramic cup\" ya da \"terracotta cup\" yap. Müşteriye aynı sahnede üç fincan seçeneği sunarsın.\n\n`A cozy corner of a small cafe with a cappuccino and a slice of cheesecake on a marble table, morning sunlight through the window, plants in the background, warm inviting mood, lifestyle photography`\n\nKafe tanıtımı: aynı seed ile \"morning sunlight\" yerine \"evening warm lamp light\" yaz. Sabah menüsü ve akşam menüsü için aynı köşenin iki saatini elde edersin.\n\n`Concert poster: a guitarist playing on a dark stage, strong red backlight and haze, low angle, dramatic live music photography, empty dark area at the top for the artist name and date`\n\nKonser afişi serisi: seed'i sabit tutup sadece ışık rengini değiştirirsen (\"red backlight\" yerine \"blue backlight\") her şehir ya da her tarih için aynı yerleşimde ama farklı renkte bir afiş çıkar. Seri hissi verir.\n\n`Product advertisement for a white running sneaker floating above a concrete block, studio lighting, soft shadow under the shoe, clean light gray background, sharp details, commercial photography`\n\nÜrün reklamı: renk seçenekleri (colorway) için ideal. Seed sabit, sadece \"white\" yerine \"black\" ya da \"neon green\" yaz. Değiştikçe ayakkabının açısı biraz kayabilir; bunu görmek de dersin parçası.\n\n`Top-down photo of a Turkish breakfast table with simit, cheese, olives, tomatoes and tea glasses, bright natural daylight, rustic wooden table, food photography for a restaurant menu`\n\nRestoran menüsü: burada amaç keşif. Görsel sayısını 4 yap, seed'i rastgele bırak, Imagination level'ı bir düşük bir yüksek dene. Yüksekte AI kendi masa düzenini katar; bazen müşterinin aklına gelmeyen iyi bir fikir çıkar.\n\n### Sık yapılan hatalar\n\n- **Seed'i sabit tutup modeli ya da oranı değiştirmek.** Seed sadece aynı model ve aynı ayarlarla işe yarar; oranı değiştirmek başlangıç karmaşasını da değiştirir.\n- **Seed'i \"görsel hiç değişmeyecek\" garantisi sanmak.** Prompt değiştikçe görsel de kayar. Sadece bir parçayı değiştirmek istiyorsan parça düzeltmeyi (inpaint) kullan.\n- **Tek seferde birçok şeyi değiştirmek.** Renk, ışık ve arka planı aynı anda değiştirirsen hangisinin neyi bozduğunu anlayamazsın. Her denemede tek değişiklik.\n- **Beğenilen görselin tarifini kaydetmemek.** Müşteri bir hafta sonra \"o ilk versiyon\" dediğinde model, prompt ve seed elinde yoksa baştan aramaya başlarsın ve kredi yanar.\n\n### Profesyonel yöntem\n\nDeneyimli üreticiler prompt'u tek parça bir cümle gibi değil, Lego gibi parçalardan kurulmuş bir yapı gibi düşünür: stil ya da görüntü türü, özne, kadraj ve kamera, lens, ışık, renk ya da film havası, ortam ve son dokunuş (gren, hafif parlama). Her parça ayrı bir \"yuva\"dır. Seed ile birlikte kullanınca bu yapı çok güçlü bir test aracına dönüşür.\n\nYöntem şöyle işler:\n\n1. Prompt'u parçalara ayrılmış şekilde yaz ve 4'lü üret.\n2. En iyisini seç, seed'ini kilitle.\n3. Sadece tek bir parçayı değiştir (örneğin sadece ışık: \"soft window light\" yerine \"warm evening lamp light\") ve üret.\n4. Eski ve yeni görseli yan yana koy. Fark tamamen o tek kelimeden geldiği için, o kelimenin görsele ne yaptığını kesin olarak öğrenmiş olursun.\n\nNeden işe yarıyor: Seed sabit olduğu için başlangıç noktası aynı kalır; değişen tek şey senin kelimendir. Bu, fotoğrafçının aynı sahnede sadece ışığı değiştirip iki kare çekmesine benzer. Müşteri revizyonunda da aynı mantık geçerli: \"fincan siyah olsun\" dediğinde sadece renk parçasını değiştirirsin, kalan her şey yerinde durur.\n\nİkinci profesyonel alışkanlık \"kelime bankası\" tutmak. Beğendiğin ışık kurulumlarını, lensleri, renk havalarını ve dokuları (örneğin \"soft window light\", \"50mm lens\", \"warm film tones\") bir notta biriktirirsin. Her işte bunlardan 2-3 tanesini kullandıkça ekibin ya da markanın tanınan bir imza stili oluşur. Burada bir uyarı: aynı prompt'a beş farklı renk ya da hava kelimesi yığma; birini seç, gerisini çıkar. Fazla kelime modeli kararsız bırakır.\n\nSon olarak tarif kartı, ekipte paylaşılabilir bir kayıt olmalı. Model, prompt, oran, çözünürlük ve seed'i ortak bir klasörde ya da Magnific Spaces sayfasında tutarsanız, işi başka biri devraldığında aynı görsele dakikalar içinde geri dönebilir.\n\n### Ödev\n\n1. Bir kahve ya da kafe markası için (gerçek bir müşteri, yakında gelecek bir iş ya da hayali bir marka) bir ürün görseli seç ve prompt'u parça parça yazarak 4'lü üret.\n2. En iyisini seç, tarif kartını yaz (model, prompt, oran, çözünürlük, seed).\n3. Aynı seed ile üç tek değişkenli revizyon yap: fincan rengi, ışık ve arka plan, her seferinde sadece biri.\n4. Beğendiğin görseli Reimagine'de Subtle ile bir kez daha yorumlat.\n5. Hangi değişikliğin kompozisyonu en çok bozduğunu not al. Toplam 20-30 dakika. Görselleri ve tarif kartını Claude'a göster; hangi yolun revizyona daha uygun olduğunu birlikte değerlendirebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Instagram story ve Reels ekranında üstte kullanıcı adı ve ilerleme çubuğu, altta açıklama, yanıt kutusu ve butonlar durur. Yazıyı oraya koyarsan arayüz kapatır. Önemli her şey orta bölgede, yani güvenli alanda durmalı.\n2. 3:4 seçersin. Instagram profil ızgarası artık 3:4 gösteriyor ve 1080×1440 yüklemeyi destekliyor; yani 3:4 hem akışta hem ızgarada kesilmeden düzgün görünür.\n\nSıradaki ders: Upscale: ne zaman, hangi ayarla\n\n### Kaynaklar\n\n- [Magnific – Your first AI image (Image Generator ayarları)](https://www.magnific.com/ai/docs/your-first-ai-image)\n- [Magnific – Reimagine](https://www.magnific.com/ai/reimagine)\n- Magnific uygulamasındaki model listesi ve üretim ayarları (1 Ekim 2026)", "module": 1, "moduleName": "Temeller", "n": 6, "summary": ["Seed, AI'ın çizime başladığı rastgele karmaşayı belirleyen numaradır; aynı seed aynı başlangıç demektir.", "Aynı görseli tekrar almak için model, prompt, ayarlar ve seed'in dördü de aynı kalmalı.", "Revizyonda seed'i sabitle ve prompt'ta her seferinde sadece tek bir şeyi değiştir.", "Görselin geri kalanı birebir aynı kalsın istiyorsan seed yetmez, parça düzeltme (inpaint) gerekir.", "Beğenilen her görsel için model, prompt, oran, çözünürlük ve seed'i bir tarif kartına yaz."], "title": "Seed, varyasyon, tekrar üretilebilirlik"}, {"checked": "Ekim 2026", "date": "2 Ekim 2026", "flow": {"edges": [{"a": "src", "b": "send", "k": "img", "l": "görsel"}, {"a": "send", "b": "cr", "k": "img"}, {"a": "send", "b": "pr", "k": "img"}, {"a": "cr", "b": "zoom", "k": "img"}, {"a": "pr", "b": "zoom", "k": "img"}, {"a": "zoom", "b": "test", "k": "f"}, {"a": "test", "b": "x4", "k": "f", "l": "seçilen ayar"}, {"a": "x4", "b": "ps", "k": "img", "l": "4x görsel"}], "groups": [{"c1": 0, "c2": 1, "label": "Kaynak", "r1": 0, "r2": 0}, {"c1": 2, "c2": 2, "label": "İki mod", "r1": 0, "r2": 1}, {"c1": 3, "c2": 4, "label": "Karşılaştır ve test et", "r1": 0, "r2": 1}, {"c1": 5, "c2": 6, "label": "Baskı", "r1": 0, "r2": 0}], "nodes": [{"c": 0, "id": "src", "pv": {"ar": "3:4", "k": "img", "m": "💍", "tag": "2K, Instagram'a hazır", "tone": "gold"}, "r": 0, "s": 1, "t": "image", "text": "Aynı görsel A3 vitrin afişine de gidecek.", "title": "Onaylı yüzük görseli"}, {"c": 1, "id": "send", "r": 0, "s": 2, "t": "upscale", "text": "Kendi fotoğrafını da yükleyebilirsin.", "title": "Upscaler'a gönder", "tool": "Magnific Upscaler"}, {"c": 2, "chips": ["2x", "Subtle", "Film & Photography", "Automatic"], "id": "cr", "pv": {"k": "txt", "v": "luxury gold ring with a round diamond, crisp metal reflections, sharp diamond facets…"}, "r": 0, "s": 3, "t": "upscale", "title": "Creative"}, {"c": 2, "chips": ["Sublime", "2x", "Balanced"], "id": "pr", "r": 1, "s": 4, "t": "upscale", "text": "Prompt yok; orijinale sadık kalır.", "title": "Precision"}, {"c": 3, "id": "zoom", "pv": {"a": {"m": "💍", "tag": "Creative: zengin", "tone": "gold"}, "b": {"m": "💍", "tag": "Precision: sadık", "tone": "white"}, "k": "ba"}, "r": 0, "s": 5, "t": "compare", "text": "Taş kenarı, metal yansıması, arka plan dokusu.", "title": "%100 yakınlaştır"}, {"c": 4, "id": "test", "pv": {"items": [["Creativity", 3], ["HDR", 4]], "k": "sl"}, "r": 0, "s": 6, "t": "upscale", "text": "Yeni detay uydurdu mu? Plastikleşme nerede başlıyor?", "title": "Tek değişken testi", "tool": "Creative"}, {"c": 5, "id": "x4", "pv": {"a": "2K", "b": "4x", "k": "up"}, "r": 0, "s": 7, "t": "upscale", "title": "A3 için 4x"}, {"c": 6, "end": true, "id": "ps", "pv": {"items": ["A3 = 297 × 420 mm", "300 dpi'da yetiyor mu?", "Ayarları tarif kartına yaz"], "k": "list"}, "r": 0, "s": 7, "t": "ps", "title": "Image Size kontrolü", "tool": "Photoshop"}], "title": "Creative zenginleştirir, Precision sadık kalır; farkı %100 zoom'da görürsün"}, "genhq": false, "level": "Başlangıç", "md": "### Hızlı tekrar\n\n1. Beğendiğin bir görselin seed'ini sabitledin ama oranı 1:1'den 4:5'e çevirdin. Neden aynı görseli alamazsın?\n2. Müşteri \"Her şey birebir aynı kalsın, sadece üründeki tek bir parçanın rengi değişsin\" diyor. Seed mi kullanırsın, parça düzeltme (inpaint) mi?\n\n### Konu\n\nUpscale, bir görseli büyütüp daha yüksek çözünürlüğe çıkarmak demek. AI modelleri genelde 1K-2K boyutunda görsel üretir. Instagram için bu yeter ama A3 afiş, vitrin giydirme, billboard ya da yakın kırpma gerektiğinde piksel yetmez; görsel bulanık ve kırık görünür.\n\nPhotoshop'taki klasik Image Size büyütmesi var olan pikselleri sadece esnetir; yeni bilgi eklemez, görsel yumuşar. AI upscale ise görsele bakar, \"burada kumaş var, burada metal var\" diye anlar ve büyütürken eksik detayı kendisi çizer. Bu yeni detay uydurmaya halüsinasyon denir. Bazen harika bir şeydir (deri dokusu, kumaş lifleri belirir), bazen tehlikelidir (logo harfleri değişir, yüz başka birine benzer).\n\nBenzetme: Klasik büyütme, küçük bir fotoğrafı fotokopi makinesinde büyütmek gibidir; büyür ama bulanıklaşır. AI upscale ise o fotoğrafı usta bir ressama verip \"bunu dev boyutta yeniden çiz\" demektir. Ressam detayları güzelleştirir ama ona ne kadar serbestlik verdiğine dikkat etmezsen kendi yorumunu da katar.\n\nNe zaman upscale: her zaman EN SON adımda. Önce görseli seç, revizyonları bitir, parça düzeltme ve rötuşu yap, en son büyüt. Her taslağı büyütmek kredi yakar; büyüttükten sonra düzeltme yapmak da daha zahmetlidir. Sadece Instagram'a gidecek, 2K üretilmiş bir görsel için çoğu zaman upscale gerekmez.\n\nMagnific'te iki ana yol var:\n\n1. Creative (yaratıcı) upscale: Detayı kendisi uydurur, görseli zenginleştirir. AI üretimi görseller, illüstrasyonlar, \"daha zengin görünsün\" denen işler için. 2x, 4x, 8x ve 16x büyütür.\n2. Precision (sadık) upscale: Görsele olabildiğince dokunmadan büyütür. Gerçek ürün fotoğrafları, yüzler, müşterinin kendi çektiği fotoğraflar için. İçinde dört çeşit var: Sublime (en çok yönlü, 4x'te en iyi sonucu verir, 16x'e kadar çıkar), Photo (en sadık, sıfır yaratıcılık, 2x), Photo Denoiser (karanlıkta çekilmiş karıncalı fotoğrafları temizler, 2x) ve v1 (eski sürüm, sert ve parlak bir görünüm, kenarlarda hale yapabilir, 2x).\n\nCreative'in ayarları (hepsi -10 ile +10 arası):\n\n- Creativity (yaratıcılık): AI ne kadar yeni detay ekleyecek. Düşük = orijinale yakın, yüksek = zengin ama sürprizli.\n- Resemblance (benzerlik): Orijinale ne kadar benzeyecek. Yüksek = sadık ama bazen lekeli, düşük = özgür ama sapabilir.\n- HDR: Netlik ve kontrast. Çok yükselirse yapay, plastik ve lekeli görünür.\n- Fractality (detay yoğunluğu): Her santimetrekareye ne kadar ince detay sığacağı. Düşük = sade, daha az hata; yüksek = karmaşık, sanatsal doku.\n- Hazır ayarlar: Subtle (hafif: yaratıcılık -3, benzerlik +3), Vivid (belirgin), Wild (çılgın). Kararsızsan Subtle ile başla.\n- Optimized for (neye göre ayarlı): Standard, Soft Portrait (yumuşak portre), Hard Portrait (sert, detaylı portre), Art & Illustration, Nature & Landscapes, Film & Photography, 3D Renders, Video Game Assets, Science Fiction & Horror. Görselin türünü seçmek sonucu ciddi şekilde iyileştirir.\n- Engine (motor): Automatic varsayılan. Illusio illüstrasyonlarda iyidir ve JPEG bozulmalarını temizler; Sharpy fotoğrafta en keskinidir ama bozulmayı artırabilir; Sparkle ikisinin dengesidir.\n- Prompt: Görselde ne olduğunu kısa yazarsan AI doğru detayı uydurur. \"Bu bir altın yüzük\" bilgisi, metali taş dokusuyla karıştırmasını engeller.\n\nPrecision'ın ayarları (0-100 arası): Sharpness (keskinlik), Grain (gren, film tanesi; gerçekçi fotoğraf için 7-12, düz vektörel görsel için 0) ve Ultra Detail (ince detay; Sublime'da yok). Kısayol olarak Balanced (dengeli), Portraits (portre) ve Grainy Analog (analog film) hazır ayarları var.\n\nKarar tablosu:\n\n| İş | Hangi mod | Başlangıç ayarı |\n| --- | --- | --- |\n| AI ile üretilmiş ürün/takı görseli, afiş | Creative | Subtle, Film & Photography, Sharpy |\n| Gerçek ürün fotoğrafı (müşterinin çektiği) | Precision Photo ya da Sublime | Balanced |\n| Yüz, model, portre | Precision (Portraits) ya da Creative Soft Portrait | Creativity düşük, Resemblance yüksek |\n| Karanlık, karıncalı fotoğraf | Precision Photo Denoiser | Balanced |\n| İllüstrasyon, düz renkli çizim | Creative | Art & Illustration, Illusio, Fractality düşük |\n| Üzerinde yazı/logo olan görsel | Precision | Grain 0, Sharpness düşük |\n| Büyük baskı (A3, vitrin) | Precision Sublime 4x ya da Creative 4x | Önce 2x ile ayarı bul |\n\nBoyut hesabı: Baskıda kalite genelde 300 DPI (inç başına nokta) ile ölçülür. A3 afiş için yaklaşık 3500×5000 piksel gerekir. 2K üretilmiş 3:4 bir görsel 2x büyütülünce yaklaşık 3000×4000 olur; bu A3 için çoğu zaman yeterlidir. Uzaktan bakılan billboard gibi işlerde DPI ihtiyacı çok düşer, devasa büyütmeye gerek kalmaz. Çıktının bir üst boyut sınırı da var; bu yüzden 16x her görselde seçilemez.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Büyütme | Görseli daha yüksek çözünürlüğe çıkarmak | upscale, upscaling |\n| Halüsinasyon | AI'ın büyütürken orijinalde olmayan detayı kendisinin uydurması | hallucination |\n| Yaratıcılık | Upscale'de AI'ın ne kadar yeni detay ekleyeceği | creativity |\n| Benzerlik | Sonucun orijinale ne kadar sadık kalacağı | resemblance |\n| Detay yoğunluğu | Birim alana düşen ince detay miktarı | fractality |\n| Keskinlik | Kenarların ve dokuların ne kadar net görüneceği | sharpness |\n| Gren | Fotoğrafa doğallık veren ince film tanesi | grain, film grain |\n| Bozulma (artefakt) | Sıkıştırmadan ya da AI'dan kalan kare kare lekeler, hale, garip desenler | artifacts, JPEG artifacts |\n\n### Görsel örnek\n\n!ba[Önce: 1K orijinal (yakın kırpım)|Sonra: Creative upscale 2x](img/d07-once.jpg|img/d07-sonra.jpg)\n\nAynı yüzüğün taş ve metal detayı: AI upscale büyütürken eksik detayı (pırlanta faset, metal yansıma) kendisi çiziyor.\n\nNasıl üretildi: Nano Banana 2 Lite, 1:1, 1K: 'luxury yellow gold ring with a round brilliant-cut diamond on smooth beige stone, macro, crisp metal reflections'. Sonra Magnific Upscale: Creative, 2x, Subtle, Film & Photography, Sharpy motoru, aynı prompt.\n\n### Uygulama\n\n1. Senaryo: Bir takı markası için üretilen yüzük görselini müşteri beğendi; hem Instagram'da hem de mağaza vitrininde A3 afiş olarak kullanılacak.\n2. Magnific'te görseli aç ve Upscale (Upscaler) aracına gönder. Kendi bilgisayarındaki bir fotoğrafı da yükleyebilirsin.\n3. Önce Creative'i seç: ölçek 2x, hazır ayar Subtle, Optimized for = Film & Photography, Engine = Automatic. Prompt kutusuna aşağıdaki 1. prompt'u yaz ve büyüt.\n4. Aynı görseli bu kez Precision Sublime ile 2x, Balanced ayarıyla büyüt.\n5. İki sonucu yan yana koy ve %100 yakınlaştır. Uzaktan bakınca hepsi güzel görünür; farklar yakından görünür. Taşın kenarlarına, metal yansımalarına ve arka plan dokusuna bak. Creative daha zengin ama daha \"uydurulmuş\", Precision daha sade ama orijinale sadık olmalı.\n6. Tek değişken testi (önceki dersteki gibi): Creative'de sadece Creativity'yi +3'e çıkar ve tekrar büyüt. Neler değişti, yeni bir şey ortaya çıktı mı? Sonra HDR'ı +4 yap ve plastikleşmeye başladığı noktayı gör.\n7. Seçtiğin ayarla A3 için 4x büyüt. Photoshop'ta açıp Image Size'dan boyutun A3'e yetip yetmediğini kontrol et. Beğendiğin ayarları tarif kartına ekle: mod, ölçek, hazır ayar, kaydırıcılar.\n\n### Örnek prompt'lar\n\n`luxury gold ring with a round diamond, crisp metal reflections, sharp diamond facets, smooth beige stone surface, clean high-end product photography`\n\nTakı reklamı: Creative, Subtle, Film & Photography, Sharpy motoru. Prompt'ta \"metal\" ve \"diamond facets\" demek, AI'ın yansımaları doğru yerde keskinleştirmesini sağlar.\n\n`delicate silver necklace with a small pearl pendant on dark velvet, fine chain links, soft pearl sheen, macro jewelry photography`\n\nTakı katal
