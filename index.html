\" dersin. Renk paleti, doku, ışık havası, çizim tekniği alınır; içindeki nesneler alınmaz. Bir markanın Instagram akışındaki ya da lookbook'undaki havayı yeni görsellere taşımak için idealdir.\n3. İçerik referansı (karakter ve ürün referansı): Modele \"bu nesnenin kendisini sahneye koy\" dersin. Müşterinin ceketi, çantası, parfüm şişesi ya da maskot karakteri yeni bir ortama yerleştirilir. Ürünün şekli ve detayları korunmaya çalışılır.\n\nMagnific'te bunlar nerede? Görsel üretim ekranında prompt kutusunun altında Referanslar (References) bölümü var. \"+ Add\" ile referans türünü seçiyorsun: Stil (Style), Karakter (Character), Nesne/Ürün (Object), Renk (Color), Kamera (Camera) ve Efekt (Effects). Hazır ön ayarlardan seçebilir ya da kendi görselini yükleyebilirsin. Birden fazla referansı aynı üretimde birleştirebilirsin; örneğin ürün + stil + renk paleti.\n\nModel seçimi burada çok önemli, çünkü her model her referans türünü desteklemiyor:\n\n| Model | Desteklediği referanslar | Ne zaman |\n| --- | --- | --- |\n| Seedream 5 Pro | Stil, karakter, ürün, görsel | Ürün ve karakter referanslı işlerde varsayılan seçim, gerçekçi sonuç |\n| Google Nano Banana Pro | Stil, karakter, ürün, görsel | Markaya ve ürüne en sadık son teslim görseli |\n| Google Nano Banana 2 Lite | Stil, karakter, ürün, görsel | Hızlı ve ucuz deneme turları |\n| GPT 2 / GPT 2.5 | Stil, karakter, ürün, görsel | Yazılı, infografik ya da tasarım ağırlıklı referanslı işler |\n| Recraft V4.1 | Sadece stil | İllüstrasyon ve vektör havasını bir referanstan taşımak |\n\nBir de üretimden sonra kullanılan iki yardımcı araç var: Restyle (yeniden stillendirme) bir görselin konusunu ve yerleşimini koruyup sadece görünüşünü değiştirir; stil kaynağı olarak bir görsel, bir renk paleti ya da kütüphanendeki bir stil verebilirsin. Reimagine (yeniden yorumlama) ise aynı kompozisyonun yeni bir versiyonunu çizer; ne kadar uzaklaşacağını \"strength\" ayarıyla belirlersin.\n\nAltın kural: Referans + prompt bir ekip çalışmasıdır. Referans \"nasıl görünsün\"ü taşır, prompt ise \"ne olsun\"u. Prompt'ta referansla çelişen şeyler yazarsan (referans pastel, prompt \"dark neon\") model ikisinin arasında kalır. Ve her zaman şunu kendine sor: Bu görselden tam olarak ne almak istiyorum?\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Referans görsel | Modele yazının yanında örnek olarak verilen görsel | reference image |\n| Görselden görsel | Var olan bir görseli başlangıç noktası yapıp yeniden üretmek | image to image (img2img) |\n| Stil referansı | Görselin içeriğini değil, görünüşünü (renk, doku, teknik) ödünç almak | style reference |\n| Karakter / ürün referansı | Görseldeki kişiyi ya da nesnenin kendisini yeni sahneye taşımak | character reference / product (object) reference |\n| Güç / etki | Referansın sonuca ne kadar karışacağını ya da sonucun ondan ne kadar uzaklaşacağını belirleyen ayar | strength / influence |\n| Kompozisyon | Görseldeki öğelerin yerleşimi ve düzeni | composition, layout |\n| Moodboard | Bir işin havasını gösteren örnek görseller panosu | moodboard |\n| Yeniden stillendirme | Konuyu koruyup sadece görünüşü değiştirmek | restyle |\n\n### Uygulama\n\nSenaryo: Bir giyim markası yeni kot ceketi için sosyal medya görselleri istiyor. Elimizde ceketin düz fonda çekilmiş bir ürün fotoğrafı ve markanın sevdiğimiz bir eski kampanya görseli var. Aynı ceket görselini üç farklı referans türüyle üretip farklarını kendi gözünle göreceksin. Yine tek değişken kuralı: her adımda sadece referans değişiyor.\n\n1. Hazırlık: İki görsel bul. (a) Stil kaynağı: Pinterest'ten ya da Magnific kütüphanesinden havasını sevdiğin bir moda çekimi (örneğin sıcak, filmli, toprak tonlu bir sokak fotoğrafı). (b) Ürün kaynağı: Müşterinin ürün fotoğrafı ya da düz arka planda çekilmiş bir kot ceket. Telif açısından, müşteri işinde stil kaynağı olarak kendi ya da lisanslı görsellerini kullanmaya alış.\n2. Magnific'te görsel üretim ekranını aç, model olarak Google Nano Banana 2 Lite seç (deneme turu için hızlı ve ucuz), oranı 4:5 yap. Referanssız bir kontrol görseli üret: `a young woman wearing a denim jacket on a city street, morning light, vertical 4:5`.\n3. Stil referansı: References bölümünden \"+ Add\" → Style → (a) görselini yükle. Prompt'a dokunmadan üret. Sonuca bak: Renkler, ışık ve gren referanstan mı geldi? İçindeki nesneler (bina, bisiklet, kıyafetler) de kopyalandı mı? Kopyalandıysa stil yerine yanlış türde referans eklemişsindir.\n4. Ürün referansı: Stil referansını kaldır. Bu sefer Object/Product olarak (b) görselini ekle ve prompt'u şöyle değiştir: `a young woman wearing the denim jacket from the reference on a city street, morning light, white sneakers and a canvas tote bag, vertical 4:5`. Ceketin kesimi, dikişleri, düğmeleri ve rengi korundu mu? Kontrol et.\n5. Birleştir: Ürün referansı kalsın, (a) stil referansını da ekle. Artık \"bizim ürün + bu marka havası\" var. Son teslim kalitesi için aynı ayarlarla modeli Seedream 5 Pro ya da Google Nano Banana Pro'ya çevirip yeniden üret (Seedream 5 Pro'da 4:5 yok, 3:4 seçip Photoshop'ta kırp).\n6. Görselden görsel denemesi: Photoshop'ta 5 dakikalık kaba bir kolaj yap (bir manken silüeti, ceketi ve bir sokak arka planını kabaca yerleştir). Bunu Magnific'te Reimagine ile aç; önce strength'i düşük (0.3 civarı) sonra yüksek (0.8 civarı) dene. Düşükte kolajın aynen kaldığını, yüksekte modelin özgürleştiğini göreceksin. Ajans işinde \"yerleşim benim, kalite modelin\" demek için ortası (0.5-0.6) genelde iyidir.\n7. En iyi sonucu veren referans + prompt ikilisini tarif kartına \"Referans\" başlığı altında kaydet: hangi model, hangi referans türü, hangi güç ayarı.\n\n### Örnek prompt'lar\n\n`Fashion campaign photo of a model wearing the wool coat from the reference, walking across a cobblestone street in autumn, soft overcast light, fallen leaves, 85mm lens, shallow depth of field, focus on the coat, editorial fashion photography, vertical 4:5`\n\nModa kampanyası (ürün referansıyla): Kabanın kendisi referanstan gelir; prompt sadece sahneyi, ışığı ve kamerayı kurar. \"from the reference\" demek modele ürünü yeniden icat etmemesini hatırlatır. \"focus on the coat\" netliği ürüne kilitler; Ders 10'daki kamera bilgisini burada kullanıyorsun.\n\n`Instagram post for a streetwear brand: a model in an oversized hoodie sitting on concrete steps, match the colors, grain and lighting of the style reference, square 1:1`\n\nModa markası akışı (stil referansıyla): Markanın daha önce paylaştığı en sevilen bir gönderiyi stil referansı olarak verirsin; yeni görsel akışta \"aynı elden çıkmış\" gibi durur. Prompt içeriği söyler, referans havayı.\n\n`Flat lay of the leather handbag from the reference on a beige linen surface, styled with sunglasses and a silk scarf, shot from directly above, soft even daylight, e-commerce lifestyle photography, square 1:1`\n\nModa aksesuarı (ürün referansıyla): Çantanın deri dokusu, tokası ve dikişleri referanstan gelir; aksesuarlar ve ışık prompt'tan. E-ticarette ürün sayfasının \"lifestyle\" karesi için kullanılır.\n\n`Product shot of the perfume bottle from the reference on a wet black marble surface, soft golden rim light, dark moody background, water droplets, luxury advertising photography, vertical 4:5`\n\nParfüm reklamı (ürün referansıyla): Şişenin kendisi referanstan gelir; prompt sadece sahneyi kurar. Ürünün şekli değiştiyse Seedream 5 Pro ya da Nano Banana Pro ile yeniden dene.\n\n`Turn this rough collage into a polished restaurant menu photo: grilled salmon with lemon and herbs on a white plate, natural daylight, keep the same layout`\n\nRestoran tanıtımı (görselden görsel / Reimagine ile): Photoshop'ta yaptığın kaba kolajı yükleyip bu prompt'la yeniden çizdirirsin. \"keep the same layout\" yerleşimi korur; strength ayarı ne kadar özgür olacağını belirler.\n\n### Sık yapılan hatalar\n\n- **Yanlış referans türü seçmek.** Havasını istediğin görseli ürün ya da görsel referansı olarak eklersen model içindeki nesneleri de kopyalar; mankenin üzerindeki kıyafet bile yeni görsele taşınabilir. Sadece havayı istiyorsan Style seç.\n- **Prompt ile referansın çatışması.** Referans pastel ve aydınlıkken prompt'a \"dark neon night\" yazarsan model arada kalır, bulanık bir sonuç çıkar. Ya referansı değiştir ya prompt'u referansla uyumlu yaz.\n- **Ürünü referans verip prompt'ta yeniden tarif etmek.** \"a light blue denim jacket with silver buttons\" yazmak, referanstaki gerçek ceketle çelişebilir. Ürünü \"the jacket from the reference\" diye çağır, tarifi referansa bırak.\n- **Görselden görselde gücü uçta kullanmak.** Çok düşük güç hiçbir şey değiştirmez, çok yüksek güç kolajını çöpe atar. Ortadan başla, ikişer adımla ayarla.\n\n### Profesyonel yöntem\n\nProfesyonel ekipler ürünü tek bir fotoğrafla referans vermez; önce bir \"ürün sayfası\" (product reference sheet) hazırlar. Ürün sayfası, ürünün tek bir görselde birkaç açıdan göründüğü bir kolajdır. Model ürünü sadece önden görürse arkasını, yanını ve detaylarını tahmin eder; tahmin ettiği yerde de hata yapar. Birkaç açıyı birden görünce ürünü \"her yönüyle\" tanır ve farklı sahnelerde daha tutarlı çizer. Sık kullanılan yerleşim beş karedir:\n\n1. Etiket ya da detay karesi: düz yatırılmış (flat lay), yazılar ve etiket okunur şekilde. Giyimde yaka etiketi, düğme, deri yama gibi detaylar.\n2. Kuşbakışı: üstten görünüm.\n3. Alttan ya da iç görünüm: ürünün altı ya da ceketin iç astarı.\n4. Boydan önden: ürünün tamamı önden.\n5. Boydan arkadan: ürünün tamamı arkadan.\n\nElindeki ürün fotoğrafından başla; eksik açıları (arka, iç, detay) yine AI ile üret, sonra hepsini düz ve beyaz bir fonda tek kolajda birleştir. Beyaz fon önemlidir: arka plan kalabalıksa model mekânı da ürünün bir parçası sanar. Bu sayfayı bir kere düzgün hazırlarsan, sonraki bütün sahnelerde ürün referansı olarak onu kullanırsın. Şablonu kendi ürününe uyarla: bir çanta için \"iç bölme\", bir ayakkabı için \"taban\" karesi daha anlamlı olabilir.\n\nİkinci alışkanlık: sahne prompt'larını hep aynı sırayla yazmak. Sektörde sık önerilen sıra şöyle: görüntü türü → kompozisyon → mekân → ışık → kamera ve lens. Ürün referanstan gelir; sen sadece bu beş parçayı doldurursun. Böylece bir kampanyanın bütün görselleri aynı aileden çıkmış gibi durur.\n\nÜçüncüsü: beğendiğin bir kompozisyonu çözümle. Hoşuna giden bir moda çekimini bir sohbet asistanına (Claude gibi) gösterip \"bunun prompt'unu çıkar\" dersen, tekrar kullanabileceğin bir sahne tarifi elde edersin. Ürünü referanstan, sahneyi bu tariften alırsın.\n\nDördüncüsü: kaliteyi korumak için hep temiz ana görselden yola çık. Aynı görseli üst üste düzenledikçe kalite düşer. Bir sahnenin varyasyonlarını üreteceksen, her seferinde bir önceki düzenlenmiş görseli değil, temiz ürün sayfasını ve ana sahneyi referans ver. Logo ve yazı içeren ürünlerde de AI yazıyı bozabilir; logoyu net görünmüyorsa sonradan Photoshop'ta eklemek en güvenli yoldur.\n\n### Ödev\n\nÜzerinde çalıştığın ya da yakında gelecek bir işten bir giyim ya da aksesuar ürünü seç (ceket, elbise, çanta, ayakkabı). Markanın daha önce yayınlanmış en sevdiğin bir görselini stil referansı, ürününü de ürün referansı olarak kullan.\n\n1. 3 yeni sosyal medya görseli üret: biri 1:1 gönderi, biri 4:5 gönderi, biri 9:16 story. Üçünde de referanslar aynı kalsın, sadece sahne değişsin.\n2. Yan yana koyup kendine sor: Üçü aynı markadan çıkmış gibi mi duruyor? Ürün (kesim, renk, dikiş, etiket) her birinde aynı mı?\n3. Ürün bir görselde bozulduysa, ürünün en az üç açısını içeren basit bir ürün sayfası hazırlayıp o görseli yeniden üret ve farkı not et.\n4. Toplam 20-30 dakika ayır. Üç görseli, kullandığın referansları ve prompt'ları Claude'a göster; tutarlılık ve ürün sadakati üzerine yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Medyum, görselin yapıldığı malzeme ya da tekniktir: fotoğraf, suluboya, 3D render, vektör, risograph baskı. Sadece \"Art Deco style\" yazınca model Art Deco bir bina fotoğrafı da üretebilir; \"poster illustration\" medyumu eklenince sonucun afiş olacağı netleşir.\n2. Stili akım, teknik, renk paleti ve doku ile tarif etmelisin. Bu hem etik ve ticari açıdan daha güvenli, hem de sonucu daha kontrol edilebilir yapar.\n\nSıradaki ders: Parça düzeltme (inpaint)\n\n### Kaynaklar\n\n- [Magnific: How to generate AI images (referans türleri ve kullanımı)](https://www.magnific.com/ai/docs/your-first-ai-image)\n- Magnific bağlantısındaki güncel görsel modeli listesi, desteklenen referans türleri ve Restyle/Reimagine araçları (4 Ekim 2026)\n", "module": 2, "moduleName": "Görseli kontrol etmek", "n": 12, "summary": ["Referans görsel, kelimeye sığmayan şeyleri (marka havası, ürünün kendisi) modele doğrudan göstermenin yoludur.", "Stil referansı görünüşü, ürün referansı nesnenin kendisini, görselden görsel ise yerleşimi taşır.", "Ürünü prompt'ta yeniden tarif etme; \"the jacket from the reference\" diye çağır, tarifi referansa bırak.", "Görselden görselde güç ayarına ortadan (0.5-0.6) başla; çok düşük hiçbir şey değiştirmez, çok yüksek kolajı bozar.", "Ürünü birkaç açıdan gösteren beyaz fonlu bir ürün sayfası hazırlarsan model ürünü her sahnede daha tutarlı çizer."], "title": "Referans görsel: görselden görsel, stil referansı"}, {"checked": "Ekim 2026", "date": "5 Ekim 2026", "flow": {"edges": [{"a": "src", "b": "nap", "k": "img", "l": "görsel"}, {"a": "nap", "b": "bg", "k": "img"}, {"a": "bg", "b": "ph", "k": "img"}, {"a": "ph", "b": "fix", "k": "img"}, {"a": "fix", "b": "cmp", "k": "img"}, {"a": "cmp", "b": "up", "k": "f"}], "groups": [{"c1": 0, "c2": 0, "label": "Hazırlık", "r1": 0, "r2": 0}, {"c1": 1, "c2": 2, "label": "Sil", "r1": 0, "r2": 0}, {"c1": 3, "c2": 4, "label": "Değiştir ve düzelt", "r1": 0, "r2": 0}, {"c1": 5, "c2": 6, "label": "Kontrol", "r1": 0, "r2": 0}], "nodes": [{"c": 0, "chips": ["Nano Banana 2", "4:5"], "id": "src", "pv": {"ar": "4:5", "k": "img", "m": "🍰", "tag": "telefon, peçete, arkada kişi", "tone": "marble"}, "r": 0, "s": 1, "t": "gen", "text": "Hatalar bilerek konuldu.", "title": "Kusurlu pastane görseli"}, {"c": 1, "chips": ["Lasso", "Erase / Auto", "prompt yok"], "id": "nap", "pv": {"k": "mask", "m": "🧻", "shape": "lasso", "tag": "gölgesiyle birlikte seç", "tone": "marble"}, "r": 0, "s": 2, "t": "retouch", "title": "Peçeteyi sil"}, {"c": 2, "chips": ["Brush", "prompt yok"], "id": "bg", "pv": {"k": "mask", "m": "🚶", "shape": "brush", "tag": "bulanık arka plan", "tone": "blur"}, "r": 0, "s": 3, "t": "retouch", "title": "Arkadaki kişiyi sil"}, {"c": 3, "chips": ["Lasso", "Nano Banana Pro"], "id": "ph", "pv": {"k": "txt", "v": "a small glass vase with fresh pink tulips"}, "r": 0, "s": 4, "t": "retouch", "text": "Işığı ve gölgesi uyan sonucu seç.", "title": "Telefonu değiştir"}, {"c": 4, "chips": ["Brush", "Pro model"], "id": "fix", "pv": {"k": "txt", "v": "a clean silver dessert fork with four even tines"}, "r": 0, "s": 5, "t": "retouch", "text": "Çatal dişi, kulp, el ve yazı en sık bozulan yerler.", "title": "Bozuk yeri düzelt"}, {"c": 5, "id": "cmp", "pv": {"a": {"m": "🍰", "tag": "önce", "tone": "marble"}, "b": {"m": "🍰", "tag": "sonra", "tone": "marble"}, "k": "ba"}, "r": 0, "s": 6, "t": "compare", "text": "Pencere ışığı ve cheesecake aynı kaldı mı?", "title": "İlk ve son"}, {"c": 6, "end": true, "id": "up", "pv": {"items": ["Silme: Lasso + Erase", "Değiştirme: Lasso + Pro", "Düzeltme: Brush + Pro"], "k": "list"}, "r": 0, "s": 7, "t": "upscale", "title": "Bitir", "tool": "Upscaler + tarif kartı"}], "title": "Inpaint her seferinde tek bölgeye dokunur, gerisi olduğu gibi kalır"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Stil referansı ile ürün (içerik) referansı arasındaki fark nedir? Bir markanın Instagram akışındaki genel havayı yeni bir görsele taşımak için hangisini seçersin?\n2. Reimagine'de strength (güç) ayarını çok düşük ve çok yüksek yapınca ne olur? Ajans işi için genelde hangi aralık iyidir?\n\n### Konu\n\nŞimdiye kadar hep bütün görseli üretiyorduk. Ama ajans hayatında en sık yaşanan durum şu: görsel yüzde 90 harika, bir yeri bozuk. Modelin eli altı parmaklı, pasta kutusunun üstünde anlamsız bir yazı var, ya da müşteri \"tezgâhtaki telefonu kaldıralım, yerine bir vazo çiçek koyalım\" diyor. Her şeyi baştan üretirsen o güzel yüzde 90'ı da kaybedersin. İnpaint (parça düzeltme), görselin sadece seçtiğin bölgesini yeniden ürettirip geri kalanına dokunmamaktır.\n\nBenzetme: Duvarın bir köşesinde leke var diye bütün evi yeniden boyamazsın. Lekenin çevresine maskeleme bandı yapıştırırsın, sadece o kısmı boyarsın, sonra bandı sökersin. Inpaint'te de maske bandın, prompt ise o köşeye süreceğin boyanın tarifidir. İyi usta, yeni boyanın eski duvarla aynı tonda olmasına dikkat eder; AI da bunu çevredeki ışığa ve renge bakarak yapmaya çalışır.\n\nNeden önemli: Photoshop kullanıyorsan Generative Fill'i (üretken doldurma) biliyorsundur; mantık aynı. Bu beceri sana iki şey kazandırır: zaman (küçük bir hata yüzünden 20 kez yeniden üretmezsin) ve kontrol (müşteri revizyonlarını görselin geri kalanını bozmadan yaparsın). Üretim yapan herkesin en çok kullandığı araçlardan biridir.\n\nInpaint'in üç temel işi var:\n\n1. Kaldırmak (erase / silme): Seçtiğin şeyi yok eder, arkasını çevreye uygun şekilde doldurur. Prompt yazmana gerek yoktur. Fotoğraftaki kablo, arka plandaki yabancı kişi, bozuk yazı için.\n2. Değiştirmek (replace / yerine koyma): Seçtiğin bölgeye yeni bir şey koyar. \"Telefonun yerine bir vazo çiçek\", \"düz saç yerine dalgalı saç\", \"boş duvara çerçeveli tablo\".\n3. Düzeltmek (fix / onarma): Aynı şeyi daha düzgün haliyle yeniden çizdirmek. Bozuk el, eğri çatal, akmış logo. Prompt'a olması gerekeni yazarsın: \"a natural relaxed hand holding a cake box\".\n\nMagnific'te bu iş Image Editor (görsel düzenleyici) içindeki Retouch aracında yapılıyor. Bir görseli açınca sol tarafta araçlar çıkıyor; Retouch'u seçip maske (değişecek yeri gösteren seçim) çiziyorsun. Üç maske aracı var:\n\n- Click (tıkla/kutu): Dikdörtgen sürükleyerek geniş alanları seçersin; gökyüzü, duvar, tezgâh yüzeyi için.\n- Lasso (kement): Serbest çizgiyle şeklin çevresini dolaşırsın; insan, hayvan, şişe gibi düzensiz nesneler için.\n- Brush (fırça): Boyutunu ayarlayıp boyarsın; küçük yazılar, logolar, parmak gibi ince detaylar için.\n\nBunları aynı seçimde birleştirebilirsin: önce Lasso ile kabaca seç, sonra Brush ile kenarı düzelt. Ayrıca \"Include Image\" ile maskeli bölgeye bir referans görsel koydurabilirsin (Ders 12'deki ürün referansı mantığı, ama sadece o bölge için).\n\nRetouch'ta model seçimi de var ve modeller iki gruba ayrılıyor: Precise (titiz) olanlar çevreye çok sadık kalır, küçük ve görünmez düzeltmeler yapar; Creative (yaratıcı) olanlar maskenin içine daha serbest, daha zengin yeni şeyler çizer.\n\n| Model | Türü | Ne zaman |\n| --- | --- | --- |\n| Auto | İkisi de | Emin değilsen buradan başla; Magnific işe göre seçer |\n| Erase | Titiz, sadece silme | Nesne, kablo, yazı, leke kaldırmak |\n| Pro | Titiz, silme + değiştirme | Ürün fotoğrafında temiz ve görünmez düzeltme |\n| Classic | Titiz, değiştirme | Hızlı, basit değişiklikler |\n| Google Nano Banana 2 | Yaratıcı | Hızlı deneme turları, 4K'ya kadar |\n| Google Nano Banana Pro | Yaratıcı | Son teslimde yeni nesne eklemek, en sadık ışık uyumu |\n| Seedream 5 Pro (beta) | Yaratıcı, silme + değiştirme | Gerçekçi sahnelere yeni öğe yerleştirmek |\n| Ideogram Character | Titiz, değiştirme | Bir karakterin yüzünü/kendisini sahneye taşımak |\n\nBir de maskesiz yol var: Image Editor'daki Edit aracı. Burada seçim yapmadan \"make the sky a warm sunset\" gibi yazıyla değişiklik istersin, ya da görselin üstüne ok ve işaret çizip modele gösterirsin (Visual mode). Hızlıdır ama model bazen istemediğin yerlere de dokunur. Kural basit: değişiklik bütün görseli ilgilendiriyorsa (ışık, saat, mevsim) Edit; tek bir noktaysa Retouch.\n\nAltın kural: Maskenin içine ne olacağını yaz, bütün sahneyi değil. Prompt'a \"a bakery counter with a vase of tulips, morning light, cozy pastry shop\" yazarsan model maskenin içine küçük bir pastane sahnesi sığdırmaya çalışır. Sadece \"a small glass vase with fresh pink tulips\" yaz; ışığı ve ortamı model zaten çevreden okur. Bir de maskeyi nesneden biraz büyük çiz ve gölgesini mutlaka dahil et; gölgesi kalan nesne silinmiş sayılmaz.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Parça düzeltme | Görselin sadece seçili bölgesini yeniden ürettirmek | inpainting |\n| Maske | Değişecek bölgeyi gösteren seçim; beyaz yer değişir, siyah yer korunur | mask |\n| Silme | Seçili nesneyi kaldırıp arkasını doldurmak | erase, remove object |\n| Yerine koyma | Seçili bölgeye prompt'taki yeni şeyi koymak | replace |\n| Kement | Serbest çizgiyle şeklin etrafını dolaşarak seçmek | lasso |\n| Fırça | Boyayarak ince ve küçük alanları seçmek | brush |\n| Yumuşak kenar | Maskenin kenarını yumuşatıp yeni parçayı eskisine kaynaştırmak | feather, blend |\n| Üretken doldurma | Photoshop'taki inpaint aracının adı | Generative Fill |\n\n### Görsel örnek\n\n![Önce: tezgâhta telefon](img/d13-once.jpg)\n![Sonra: telefon yerine lale vazosu](img/d13-sonra.jpg)\n\nGörselin sadece bir bölgesini değiştirip geri kalanını korumak: telefon gitti, yerine pembe laleli vazo geldi.\n\nNasıl üretildi: Nano Banana 2 Lite, 4:5: 'strawberry cheesecake and croissant on marble bakery counter, black smartphone next to the plate, morning light'. Sonra Reimagine (Nano Banana modu, prompt odaklı): 'replace only the smartphone with a small glass vase with fresh pink tulips, keep everything else the same'. Sitede maskeli Retouch ile de yapılabilir.\n\nNot: Bu örnekte hızlı olsun diye Reimagine kullanıldı, o yüzden sahnenin geri kalanında küçük farklar var. Gerçek işte maskeyle (Inpaint) sadece o bölgeyi boyarsan geri kalan piksel piksel aynı kalır.\n\n### Uygulama\n\nSenaryo: Bir pastane, vitrin tezgâhında çekilmiş gibi duran bir tanıtım görseli istiyor. Bu derste tek bir pastane görseli üzerinde inpaint'in üç işini (sil, değiştir, düzelt) sırayla yapacaksın. Tek değişken kuralı burada da geçerli: her adımda sadece bir bölgeye dokun.\n\n1. Hazırlık: Magnific'te Google Nano Banana 2 ile bir görsel üret, oran 4:5: `a slice of strawberry cheesecake and a croissant on a marble bakery counter, a smartphone and a crumpled napkin on the counter, dessert fork next to the plate, morning light, a person blurred in the background`. Telefon, peçete ve arkadaki kişi bilerek konuldu; bunları düzelteceğiz.\n2. Görseli aç → Retouch. Silme: Lasso ile buruşuk peçeteyi seç, gölgesini de dahil et. Model olarak Erase ya da Auto seç, prompt yazmadan Generate. Tezgâhın mermer deseni düzgün devam ediyor mu? Leke ya da bulanık bir iz kaldıysa maskeyi biraz büyütüp tekrar dene.\n3. Arka plan temizliği: Brush ile arkadaki bulanık kişiyi boya, yine prompt'suz sil. Arka planlar bulanık olduğu için genelde ilk denemede temiz çıkar.\n4. Değiştirme: Lasso ile telefonu seç. Model Google Nano Banana Pro (ya da Auto), prompt: `a small glass vase with fresh pink tulips`. Birkaç sonuç gelecek; ışığın yönü ve gölgesi tezgâhtaki diğer nesnelerle uyumlu olanı seç.\n5. Düzeltme: Tatlı çatalına ve kruvasanın kenarlarına yakından bak; AI'ın en sık bozduğu yerler çatal dişleri, kulplar, eller ve yazılardır. Bozuk bir yer varsa Brush ile sadece o kısmı boya, prompt'a doğrusunu yaz: `a clean silver dessert fork with four even tines`. Titiz bir model (Pro) seç.\n6. Karşılaştır: İlk görselle son görseli yan yana koy. Değişmesini istemediğin yerler (pencere ışığı, cheesecake) aynı mı kaldı? Kalmadıysa maskeyi fazla geniş çizmişsin demektir.\n7. Son teslim kalitesi istiyorsan sonucu Ders 7'deki gibi upscale et. Tarif kartına \"Inpaint\" başlığı aç: hangi iş için hangi maske aracı ve hangi model iyi çalıştı, not al.\n\n### Örnek prompt'lar\n\n`a small glass vase with fresh pink tulips`\n\nPastane tanıtımı (değiştirme): Tezgâhtaki telefonun yerine konulacak şey. Kısa ve sadece maskenin içini anlatıyor. \"morning light, bakery\" gibi sahne bilgisini yazmadık, çünkü model onu çevreden okuyor.\n\n`a light dusting of powdered sugar on top of the tart`\n\nPastane ürün görseli (ekleme): Tartın sadece üst yüzeyini Brush ile boyayıp pudra şekeri ekletiyorsun. Tabağı ve tezgâhı maskeye alma; yoksa model tabağa da şeker serpebilir.\n\n`a single drop of water running down the side of the glass bottle, catching the light`\n\nİçecek ya da parfüm reklamı (ekleme): Şişenin sadece kenarını Brush ile boyayıp tazelik hissi veren bir damla ekletiyorsun. Ürünün etiketine maske değmesin, yoksa model yazıyı bozar.\n\n`a natural relaxed female hand with five fingers, short nude manicure, holding the paper shopping bag`\n\nModa / mağaza kampanyası (düzeltme): AI'ın bozduğu eli düzeltmek için. \"five fingers\" demek modele ne kontrol edeceğini hatırlatır. Maskeye çantayı değil, sadece eli al; çantadaki logo olduğu gibi kalsın.\n\n`a light wisp of steam rising from the soup`\n\nRestoran tanıtımı (ekleme): Tabağın hemen üstündeki boşluğu Brush ile boyayıp sıcaklık hissi veren buhar ekletiyorsun. Buhar gibi yarı saydam şeyler için maskeyi biraz geniş tut ki yumuşak dağılsın.\n\n### Sık yapılan hatalar\n\n- **Maskeyi nesneye tam yapıştırmak ya da gölgeyi unutmak.** Nesne gider, gölgesi ya da ince bir hayalet çizgisi kalır. Maskeyi her taraftan biraz taşır, gölgeyi de seç.\n- **Prompt'a bütün sahneyi yazmak.** Model maskenin içine minik bir sahne sıkıştırır. Sadece maskenin içinde olacak şeyi yaz.\n- **Çok büyük bir alanı inpaint etmeye çalışmak.** Görselin yarısını maskeliyorsan aslında yeniden üretim yapıyorsundur; o zaman Ders 12'deki Reimagine ya da yeni bir üretim daha doğru olur.\n- **Ürünün üstüne maske taşırmak.** Logo, etiket ve yazı maskenin içine girerse model onları yeniden çizer ve bozar. Ürüne yakın çalışırken Brush'ı küçült, ürünü maskenin dışında bırak.\n\n### Profesyonel yöntem\n\nDeneyimli üreticiler bir görseli düzeltmeye maske çizerek başlamaz; önce \"bozukluk planı\" çıkarır. Sebep basit: göze ilk batan hatayı düzeltip ötekileri unutmak, ya da her hataya aynı aracı kullanmak zaman ve kredi kaybettirir. Plan, her kusur için baştan doğru yolu seçmeni sağlar.\n\n1. Teşhis turu: Görseli yüzde 100 büyütmede (gerçek boyutunda) baştan sona gez ve gördüğün her kusuru kısa bir listeye yaz: \"çatal dişleri eğri\", \"kutudaki yazı anlamsız\", \"arka planda yabancı kişi\". İstersen görseli Claude'a gösterip listeyi birlikte çıkarabilirsin.\n2. Her kusura bir karar ver: Silinecek mi (Erase), başka bir şeyle değiştirilecek mi (Retouch + kısa prompt), aynı şeyin düzgünü mü çizilecek (Retouch + titiz model), yoksa elle mi yamanacak? Çok küçük lekeler ve tek bir pikselde kalan hatalar için Photoshop'taki Clone Stamp (damga) ya da Content-Aware Fill (içeriğe duyarlı doldurma) çoğu zaman AI'dan hızlı ve daha kontrollüdür.\n3. Logo ve yazıyı AI'a bırakma: Görselde bozuk bir marka adı ya da logo varsa onu inpaint ile \"düzeltmeye\" uğraşma. Bölgeyi temiz bir yüzey olarak sil, gerçek logoyu ya da yazıyı Photoshop'ta sonradan koy. Böylece bütün kampanya setinde logo birebir aynı kalır.\n4. Her işlemi ayrı sürüm olarak kaydet ve aynı bölgeyi üst üste defalarca üretme. Aynı görsel tekrar tekrar düzenlendikçe kalite yavaş yavaş düşer. İki-üç denemede olmuyorsa maskeyi ya da prompt'u değiştir, gerekirse bir önceki temiz sürüme dön.\n5. Hataları gizlemek için alan derinliğinden (arka planın bulanık olmasından) yararlan: Arka plandaki küçük bozukluklar bulanık bir zeminde çoğu zaman görünmez. Bu yüzden düzeltme sırası önce ana nesne ve ön plan, en son arka plan olmalı.\n\nSon adımda kısa bir kalite kontrol yap: parmak ve çatal dişi sayısı doğru mu, yazı ve logo temiz mi, eklenen nesnenin ışığı ve gölgesi sahneyle aynı yönde mi? Bu kontrol listesini her işte aynı sırayla uygulamak, \"bir yeri gözümden kaçmış\" sürprizlerini büyük ölçüde bitirir.\n\n### Ödev\n\nÜzerinde çalıştığın ya da yakında gelecek bir işten bir görsel seç; elinde uygun bir görsel yoksa yukarıdaki gibi kusurlu bir pastane vitrin görseli üret (pasta, kurabiye kutusu, tezgâh, arkada bir müşteri).\n\n1. Önce teşhis turu yap ve kusur listesini çıkar; her kusura sil, değiştir, düzelt ya da elle yama kararı ver.\n2. Üç inpaint işlemi yap: bir şeyi sil, bir şeyi başka bir şeyle değiştir, bir hatayı düzelt. Her işlem için ayrı bir sürüm kaydet.\n3. Aynı \"değiştir\" işini bir de maskesiz Edit aracıyla yazıyla iste ve iki sonucu karşılaştır: hangisi görselin geri kalanını daha iyi korudu?\n4. Toplam 20-30 dakika ayır. Önceki ve sonraki hallerini, kullandığın prompt'ları Claude'a göster; maskenin doğru çizilip çizilmediği ve birleşme yerlerinin belli olup olmadığı üzerine yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Stil referansı görselin görünüşünü (renk, ışık, doku, teknik) alır, içindeki nesneleri almaz. Ürün referansı ise nesnenin kendisini yeni sahneye taşır. Bir akışın genel havasını taşımak için stil referansı seçilir.\n2. Çok düşük güç neredeyse hiçbir şeyi değiştirmez, kolaj olduğu gibi kalır; çok yüksek güç ise modeli serbest bırakır ve yerleşimin kaybolur. Ajans işinde \"yerleşim benim, kalite modelin\" demek için 0.5-0.6 civarı iyi bir başlangıçtır.\n\nSıradaki ders: Görseli genişletme (outpaint/expand)\n\n### Kaynaklar\n\n- [Magnific: Image Editor rehberi (Edit, Retouch, maske araçları)](https://www.magnific.com/ai/docs/image-editor)\n- [Magnific Blog: Retouch ile gerçek zamanlı inpaint](https://www.magnific.com/blog/freepik-retouch/)\n- Magnific'teki güncel Retouch model listesi ve modlar (5 Ekim 2026)\n", "module": 2, "moduleName": "Görseli kontrol etmek", "n": 13, "summary": ["Inpaint, görselin sadece seçtiğin bölgesini yeniden üretir; geri kalanı olduğu gibi kalır.", "Üç temel işi vardır: bir şeyi silmek, başka bir şeyle değiştirmek ve bozuk bir yeri düzeltmek.", "Prompt'a sadece maskenin içinde olacak şeyi yaz; ışığı ve ortamı model çevreden okur.", "Maskeyi nesneden biraz büyük çiz ve gölgesini de dahil et, logo ve etiketi ise maskenin dışında bırak.", "Değişiklik bütün görseli ilgilendiriyorsa maskesiz Edit, tek bir noktaysa Retouch kullan."], "title": "Parça düzeltme (inpaint)"}, {"checked": "Ekim 2026", "date": "5 Ekim 2026", "flow": {"edges": [{"a": "src", "b": "st", "k": "img", "l": "görsel"}, {"a": "src", "b": "bn", "k": "img", "l": "görsel"}, {"a": "bn", "b": "bp", "k": "f", "l": "tekrar dene"}, {"a": "bp", "b": "fix", "k": "img", "l": "16:9"}, {"a": "bn", "b": "fx", "k": "f", "l": "karşılaştır"}, {"a": "fx", "b": "fix", "k": "f"}, {"a": "fx", "b": "step", "k": "f"}, {"a": "st", "b": "up", "k": "img", "l": "9:16"}, {"a": "fix", "b": "up", "k": "img", "l": "16:9"}, {"a": "step", "b": "up", "k": "f"}], "groups": [{"c1": 0, "c2": 0, "label": "Onaylı post", "r1": 0, "r2": 0}, {"c1": 1, "c2": 2, "label": "Genişlet", "r1": 0, "r2": 2}, {"c1": 3, "c2": 4, "label": "Düzelt ve bitir", "r1": 0, "r2": 1}], "nodes": [{"c": 0, "chips": ["Nano Banana 2"], "id": "src", "pv": {"ar": "4:5", "k": "img", "m": "🛋️", "tag": "kanepe ortada, kenarlardan uzak", "tone": "white"}, "r": 0, "s": 1, "t": "gen", "title": "Onaylı 4:5 post"}, {"c": 1, "chips": ["Ideogram", "prompt yok"], "id": "st", "pv": {"items": ["4:5", "9:16"], "k": "ratios", "m": "🛋️", "tone": "white"}, "r": 0, "s": 2, "t": "expand", "text": "Yukarı ve aşağı; tavan ve parke mantıklı mı?", "title": "Story 9:16"}, {"c": 1, "chips": ["sola yasla"], "id": "bn", "pv": {"items": ["4:5", "16:9"], "k": "ratios", "m": "🛋️", "tone": "white"}, "r": 1, "s": 3, "t": "expand", "text": "Sağa yeni mobilya geldiyse boş alanı tarif et.", "title": "Web banner 16:9"}, {"c": 2, "id": "bp", "pv": {"k": "txt", "v": "empty light grey wall and continuing oak parquet floor, soft daylight, plenty of empty space"}, "r": 1, "s": 3, "t": "prompt", "title": "Boş alan tarifi"}, {"c": 2, "id": "fx", "pv": {"a": {"m": "🛋️", "tag": "Ideogram", "tone": "white"}, "b": {"m": "🛋️", "tag": "Flux", "tone": "gold"}, "k": "ba"}, "r": 2, "s": 4, "t": "expand", "text": "Birleşme çizgisine ve parke çizgilerine bak.", "title": "Aynısı Flux ile"}, {"c": 3, "id": "fix", "r": 1, "s": 5, "t": "retouch", "text": "Sadece bozuk bölgeyi inpaint et.", "title": "Ek yerini düzelt", "tool": "Retouch"}, {"c": 3, "id": "step", "pv": {"items": ["4:5 → 21:9 tek seferde", "4:5 → 16:9 → 21:9 iki adımda"], "k": "list"}, "r": 2, "s": 6, "t": "expand", "title": "Kademeli deneme"}, {"c": 4, "end": true, "id": "up", "pv": {"items": ["Story: Ideogram, prompt yok", "Banner: prompt'lu", "Geniş oran: iki adım"], "k": "list"}, "r": 1, "s": 7, "t": "upscale", "title": "Bitir", "tool": "Upscaler + tarif kartı"}], "title": "Tek onaylı mekân görselinden story ve banner çıkar; ana kare hiç değişmez"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Bir nesneyi inpaint ile sildin ama yerinde soluk bir gölge, hayalet gibi bir iz kaldı. Maskeyi çizerken neyi yanlış yaptın?\n2. Bir nesnenin yerine yenisini koyarken prompt'a neden ışık ve mekân bilgisi (\"morning light, cozy interior\" gibi) yazmıyoruz? Ve değişiklik bütün görseli ilgilendiriyorsa (ışık, mevsim) Retouch yerine hangi aracı seçersin?\n\n### Konu\n\nÖnceki derste görselin içindeki bir parçayı değiştirdik. Bu derste görselin dışına çıkıyoruz. Genişletme (outpaint ya da expand), tuvali büyütüp yeni açılan boş alanı AI'a doldurtmaktır. Orijinal görsel olduğu gibi kalır; model kenarlara bakıp sahnenin \"çerçevenin dışında nasıl devam ettiğini\" tahmin eder ve çizer.\n\nBenzetme: Bir dizinin tek karesini düşün. Kamera biraz geri çekilseydi kadrajın dışında ne görürdük? Salonun devamı, duvarın kalanı, tavan, parkenin geri kalanı. Outpaint, AI'a \"kamerayı geri çek ve göremediğimiz kısmı tamamla\" demektir. İyi bir set tasarımcısı gibi, model de var olan duvarın rengini, zeminin desenini ve ışığın yönünü devam ettirmeye çalışır.\n\nNeden önemli: Ajans işinde en sık gelen cümle \"bunun story'sini de yapalım\" ya da \"bunu web banner'ına da uyarlayalım\". Elindeki görsel 4:5 Instagram postu; ama 9:16 story, 16:9 YouTube kapağı, çok geniş bir LED ekran ya da billboard lazım. Kırparsan (crop) ürün ya da mekânın önemli kısmı kadraja sığmaz. Yeniden üretirsen müşterinin onayladığı görsel kaybolur. Expand ile onaylı görsel aynen kalır, sadece etrafı büyür. İkinci büyük kullanım: yazı için boş alan (copy space) açmak. Görsel güzel ama başlık koyacak yer yok; sağa doğru genişletip sade bir alan açarsın.\n\nKırpma ile genişletme farkı: Kırpma görselden piksel atar, hiç yeni şey üretmez. Genişletme görsele piksel ekler ve bunları AI üretir. Bu yüzden genişletme kredi harcar, kırpma harcamaz. Yeni format istendiğinde önce \"kırparak çıkar mı?\" diye bak; çıkmıyorsa genişlet.\n\nMagnific'te bu iş Image Editor (görsel düzenleyici) içindeki Resize (yeniden boyutlandır) aracında. Resize'ın iki sekmesi var: Crop (kırp) ve Expand (genişlet). Expand'de şunları yapıyorsun:\n\n1. Oran seç: 1:1, 16:9, 9:16 gibi hazır oranlar ya da Instagram, YouTube, TikTok ölçü hazır ayarları (preset).\n2. Kenar tutamaçlarını dışarı sürükle: Görselin yeni çerçevede nerede duracağını sen belirlersin. Ana nesneyi sola yaslayıp sağda yazı alanı açmak gibi.\n3. İstersen prompt yaz: Yeni alana ne geleceğini tarif edersin. Boş bırakırsan model sahneyi doğal haliyle devam ettirir. Magnific'in kendi önerisi de genelde boş bırakmak.\n4. Export: İndir, Upscale et ya da tasarım/mockup araçlarına gönder.\n\nModel seçimi: Magnific'in Expand'inde şu an üç seçenek görünüyor: Ideogram (varsayılan), Flux ve Classic. Kabaca: Ideogram dengeli ve sahneyi temiz devam ettirir, ilk tercih olarak başla. Flux gerçekçi fotoğraflarda (ürün, mekân, yemek) dokuyu ve ışığı iyi taşır. Classic daha hızlı ve basit, sade arka planlar için yeter. Hangisinin daha iyi olduğu görsele göre değişir; önemli bir işte aynı genişletmeyi ikisiyle deneyip karşılaştır.\n\nÖnemli teknik nokta: Genişletme sonucunda çıkan görsel genelde orijinalinden daha büyük bir çözünürlükte gelmez; Magnific'in genişletme motoru sonucu yaklaşık 1.6 megapiksel civarına getiriyor (kabaca 1260×1260 piksel). Yani 4K bir görseli genişlettiğinde sonuç küçülebilir. Çözüm: Önce genişlet, sonra Ders 7'deki gibi upscale et. Teslim edilecek iş için bu sırayı ezberle: üret → düzelt (inpaint) → genişlet → upscale.\n\nBir de Magnific'te Auto Resize (otomatik yeniden boyutlandırma) var: Bir tasarımı aynı anda birçok sosyal medya ölçüsüne uyarlıyor, metin ve görsel katmanlarını ayrı tutarak. Elinde sadece bir fotoğraf varsa Expand; içinde yazı ve logo olan bitmiş bir tasarımın beş ölçüsü lazımsa Auto Resize'a bakmaya değer. Photoshop'ta ise aynı işin karşılığı Crop aracındaki Generative Expand (üretken genişletme): kırpma çerçevesini görselin dışına çekip Generate'e basıyorsun.\n\nAltın kural: Az az genişlet. Görselin boyutunu tek seferde üç katına çıkarmaya çalışırsan model, kenardan çok uzaktaki alanı uydurmaya başlar; anlamsız nesneler, tekrar eden desenler, bükülmüş perspektif çıkar. Büyük bir genişletme lazımsa iki-üç adımda yap: her adımda yeni alan, eski görselin yarısını çok geçmesin. Bir de genişletilecek kenarda kesik bir nesne olmasın (yarım kesilmiş bir yüz, mobilyanın yarısı); model o yarıyı tamamlamaya çalışırken genelde bozar.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Görseli genişletme | Tuvali büyütüp yeni alanı AI'a doldurtmak | outpainting, expand |\n| Kırpma | Görselden kenar atarak oranı değiştirmek; yeni piksel üretmez | crop |\n| Tuval | Görselin üzerinde durduğu çalışma alanı; genişletince büyüyen şey | canvas |\n| Yazı alanı | Başlık ve metin koymak için bırakılan sade, boş alan | copy space, negative space |\n| Hazır ölçü | Instagram, TikTok gibi platformların hazır oran ayarları | preset |\n| Birleşme yeri | Orijinal görselle üretilen alanın buluştuğu çizgi; belli olmamalı | seam |\n| Perspektif | Uzaklaştıkça çizgilerin bir noktaya doğru daralması; genişletmede bozulmaması gereken şey | perspective, vanishing point |\n| Üretken genişletme | Photoshop'taki genişletme özelliğinin adı | Generative Expand |\n\n### Görsel örnek\n\n![Önce: 4:5 Instagram postu](img/d14-once.jpg)\n![Sonra: 16:9 genişletilmiş banner](img/d14-sonra.jpg)\n\nOnaylı salon görseli aynen kalıyor; AI sadece kenarlara duvar ve parkeyi devam ettirerek 16:9'a büyütüyor.\n\nNasıl üretildi: Nano Banana 2 Lite, 4:5: 'bright modern living room, light grey sofa centered, round oak coffee table, large window, floor lamp, soft daylight'. Sonra Expand: 16:9, Ideogram, prompt 'empty light grey wall and continuing oak parquet floor, soft daylight, plenty of empty space'.\n\n### Uygulama\n\nSenaryo: Bir iç mimarlık stüdyosu (ya da emlak ofisi) yeni bitirdiği bir salonun 4:5 Instagram postunu onayladı; şimdi aynı görselden story ve web sitesi için banner istiyor. Bu derste tek bir onaylı görselden üç farklı format çıkaracaksın. Mekân görsellerinde parke, pencere ve tavan çizgileri perspektifi çok belli ettiği için genişletmenin iyi olup olmadığını burada çok net göreceksin.\n\n1. Hazırlık: Magnific'te Google Nano Banana 2 ya da sevdiğin bir modelle 4:5 bir görsel üret: `a bright modern living room with a light grey sofa, a round oak coffee table and a large window, a floor lamp on the left, soft daylight, interior design photography`. Bu senin \"müşterinin onayladığı post\"un. Kanepenin kadrajın ortasında, kenarlardan uzak olmasına dikkat et.\n2. Story (9:16): Görseli aç → Resize → Expand. Preset'ten Instagram Story ya da 9:16 seç. Görseli ortada bırak, yukarı ve aşağı doğru genişlet. Prompt'u boş bırak, model Ideogram. Üretilen alanda duvar ve zemin doğal devam ediyor mu? Üstte tavan ve spot lambalar, altta parke ya da halı gibi mantıklı şeyler mi gelmiş?\n3. Yazı alanlı web banner (16:9): Yeni bir Expand aç, 16:9 seç ve görseli sola yasla; genişlemenin çoğu sağa gelsin. Önce prompt'suz dene. Model sağ tarafa yeni koltuklar, sehpalar koyduysa ikinci denemede prompt'a sadece boş alanın tarifini yaz: `empty light grey wall and continuing oak parquet floor, soft daylight, plenty of empty space`.\n4. Model karşılaştırması: Aynı 16:9 genişletmeyi bir kez de Flux ile yap. Parke dokusu ve ışık geçişi hangisinde daha doğal? Birleşme yerine (eski görselin bittiği çizgi) yakından bak; parke çizgileri kayıyor mu, renk ya da keskinlik farkı görünüyor mu?\n5. Düzeltme: Genişletilen alanda bozuk bir nesne ya da belli olan bir birleşme yeri varsa, önceki dersteki Retouch ile sadece o bölgeyi düzelt. Expand + inpaint birlikte çalışan bir ikilidir.\n6. Kademeli deneme: Bir de 21:9 gibi çok geniş bir oranı tek seferde dene, sonra aynı işi iki adımda (önce 16:9, sonra 21:9) yap. Tek seferdekinde kenarlarda tuhaflık ya da bükülen duvar çizgileri çıkıyor mu, fark et.\n7. Bitir: En iyi story ve banner'ı upscale et (Ders 7). Tarif kartına \"Expand\" başlığı aç: hangi oran için hangi model ve prompt'lu mu prompt'suz mu iyi çalıştı, not al.\n\n### Örnek prompt'lar\n\nExpand'de prompt sahnenin tamamını değil, sadece yeni açılacak alanı anlatır. Çoğu zaman en iyi prompt boş prompt'tur; aşağıdakiler model istemediğin şeyler eklediğinde ya da alanın ne olacağını sen belirlemek istediğinde işe yarar.\n\n`empty light grey wall and continuing oak parquet floor, soft daylight, plenty of empty space`\n\nİç mimari / emlak (16:9 banner): Sağ tarafa yazı alanı açarken. \"empty\" ve \"plenty of empty space\" modele yeni mobilya koymamasını söylüyor; sade duvar da başlığın okunmasını kolaylaştırır.\n\n`continuation of the white ceiling with recessed spotlights, clean and minimal`\n\nİç mimari (dikey story'ye uyarlama): Görseli yukarı doğru uzatırken tavanın ne olacağını sen belirliyorsun. Yazmazsan model bazen avize, kiriş gibi tasarıma uymayan şeyler ekler.\n\n`clear blue sky and well-kept front lawn continuing, no extra buildings`\n\nEmlak ilanı (dış cephe fotoğrafını yatay banner'a çevirme): Satılık evin iki yanına gökyüzü ve bahçe açarken. \"no extra buildings\" modelin yan tarafa hayali komşu evler çizmesini engeller; ilan görselinde var olmayan bir şeyi göstermek yanıltıcı olur.\n\n`seamless continuation of the soft beige studio backdrop with a gentle shadow gradient`\n\nÜrün reklamı (parfüm ya da kozmetik, story'ye uyarlama): Stüdyo çekimli ürün görselini yukarı ve aşağı uzatırken. \"seamless continuation\" sahnenin aynı fon olarak devam etmesini istiyor; gölge geçişi de fonun düz ve cansız görünmesini önler.\n\n`rustic wooden table continuing with a few scattered herbs and a linen napkin`\n\nRestoran tanıtımı (yemek fotoğrafını yatay menü görseline uyarlama): Burada bilerek birkaç küçük öğe istiyoruz ki yeni alan boş ve yapay durmasın. Ana tabağı ya da ikinci bir yemeği yazmıyoruz; dikkat asıl tabakta kalmalı.\n\n### Sık yapılan hatalar\n\n- **Tek seferde çok fazla genişletmek.** Kenardan uzaklaştıkça model uydurmaya başlar; tekrar eden desenler, bükük çizgiler çıkar. Büyük genişletmeyi iki-üç adıma böl.\n- **Prompt'a bütün sahneyi yazmak.** \"a modern living room with a grey sofa...\" yazarsan model yeni alana ikinci bir kanepe çizer. Sadece yeni alanda olacak şeyi yaz ya da boş bırak.\n- **Genişletmeden sonra upscale'i unutmak.** Sonuç orijinalden küçük çözünürlükte gelebilir; teslimden önce mutlaka boyutuna bak ve upscale et.\n- **Kesik nesnelerin olduğu kenarı genişletmek.** Kenarda yarım bir yüz, yarım bir logo ya da mobilyanın bir kısmı varsa model tamamlamaya çalışır ve genelde bozar. O kenarı ya hiç genişletme ya da sonra inpaint ile düzelt; logo ve yazıyı her zaman Photoshop'ta sonradan koy.\n\n### Profesyonel yöntem\n\nProfesyonel ekipler genişletmeyi \"son dakika kurtarma\" olarak değil, bir kampanyanın planlı adımı olarak kullanır. Sık önerilen yaklaşım şu: tek bir ana kare onaylanır, bütün formatlar (post, story, banner, LED ekran) o kareden \"format ailesi\" olarak türetilir. Böylece her ölçüde aynı mekân, aynı ışık, aynı his olur; müşteri her formatı ayrı ayrı onaylamak zorunda kalmaz.\n\n1. Ana kareyi genişletmeyi düşünerek üret: Daha ilk üretimde ana nesneyi (kanepe, bina, ürün) ortaya ve kenarlardan uzağa koy. Kenarda kesik nesne olmasın. Bu, sonraki her genişletmeyi kolaylaştırır.\n2. Format listesini baştan yaz: Hangi ölçüler lazım, her birinde ana nesne nerede duracak, yazı hangi tarafa gelecek? Örneğin story'de başlık üstte, banner'da sağda. Genişletme yönünü bu listeye göre seçersin; yazı alanını sonradan \"nereye sığar\" diye aramazsın.\n3. Kademeli ve kontrollü genişlet: Her formatı ana kareden, gerekirse iki-üç adımda çıkar. Her adımdan sonra birleşme yerine ve perspektif çizgilerine (parke, pencere, tavan, ufuk çizgisi) bak. Mekân görsellerinde çizgilerin bükülmesi en hızlı fark edilen hatadır.\n4. Logo ve yazıyı en sona ve her formata aynı şekilde koy: AI'ın ürettiği görsel katmanı ile tasarım katmanı (logo, başlık, iletişim bilgisi) ayrı kalmalı. Logoyu Photoshop'ta ya da tasarım aracında sonradan, her formatta aynı boyut ve konumda basmak, setin tutarlı görünmesini sağlar.\n5. En son upscale ve yan yana kontrol: Bütün formatları upscale ettikten sonra yan yana koy ve renk, ışık, keskinlik bakımından bir aile gibi görünüp görünmediklerine bak.\n\nBu yöntemin en büyük faydası revizyonda ortaya çıkar: müşteri ana karede küçük bir değişiklik isterse, tüm formatları aynı sırayla yeniden türetmek dakikalar sürer.\n\n### Ödev\n\nÜzerinde çalıştığın ya da yakında gelecek bir işten bir görsel seç; uygun bir görsel yoksa bir iç mekân ya da satılık ev görseli üret (salon, mutfak, yatak odası ya da dış cephe).\n\n1. Bu görselden üç format çıkar: 9:16 story, yazı alanı açılmış bir 16:9 banner ve 1:1 kare.\n2. Her birinde önce prompt'suz, sonra prompt'lu dene; en az birinde iki modeli (Ideogram ve Flux) karşılaştır.\n3. Seçtiğin banner'ı Photoshop'a al ve açtığın yazı alanına gerçek bir başlık koy (örneğin \"3+1 Deniz Manzaralı Daire\" ya da stüdyonun proje adı): alan gerçekten işe yarıyor mu?\n4. Toplam 20-30 dakika ayır. Orijinal görseli, üç sonucu ve kullandığın prompt'ları Claude'a göster; birleşme yerlerinin belli olup olmadığı, perspektifin bozulup bozulmadığı ve yazı alanının yeterli olup olmadığı üzerine yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Maskeyi nesneye çok yakın çizmiş ve gölgesini dahil etmemişsin. Maskeyi her taraftan biraz taşırmak ve gölgeyi de seçmek gerekir; gölgesi kalan nesne silinmiş sayılmaz.\n2. Çünkü model ışığı ve ortamı maskenin çevresinden zaten okur; sahne bilgisini yazarsan maskenin içine minik bir sahne sıkıştırmaya çalışır. Değişiklik bütün görseli ilgilendiriyorsa maskesiz Edit aracı seçilir; tek bir noktaysa Retouch.\n\nSıradaki ders: Arka plan kaldırma/değiştirme, ışığı değiştirme (relight)\n\n### Kaynaklar\n\n- [Magnific: Image Editor rehberi (Resize: Crop ve Expand)](https://www.magnific.com/ai/docs/image-editor)\n- [Magnific API: Image Expand (genişletme sınırları ve çıktı boyutu)](https://docs.magnific.com/api-reference/image-expand/overview)\n- [Adobe: Photoshop'ta Generative Expand](https://helpx.adobe.com/photoshop/desktop/create-open-import-images/create-images/explore-beyond-the-canvas-with-generative-expand.html)\n- Magnific'teki güncel Expand model seçenekleri ve Auto Resize (5 Ekim 2026)\n", "module": 2, "moduleName": "Görseli kontrol etmek", "n": 14, "summary": ["Genişletme, tuvali büyütüp yeni alanı AI'a doldurtur; onaylı görsel olduğu gibi kalır.", "Story, banner ya da yazı alanı gerektiğinde önce kırpma yeter mi diye bak, yetmiyorsa genişlet.", "Prompt'u çoğu zaman boş bırak; yazacaksan sadece yeni açılan alanı tarif et.", "Az az genişlet: büyük oran değişikliklerini iki-üç adımda yap, kesik nesneli kenarı genişletme.", "Genişletme sonucu küçük çözünürlükte gelebilir; teslim sırası üret, düzelt, genişlet, upscale."], "title": "Görseli genişletme (outpaint/expand)"}, {"checked": "Ekim 2026", "date": "6 Ekim 2026", "flow": {"edges": [{"a": "src", "b": "rm", "k": "img", "l": "görsel"}, {"a": "rm", "b": "ec", "k": "img", "l": "saydam PNG"}, {"a": "ec", "b": "sh", "k": "img"}, {"a": "rm", "b": "cp", "k": "img", "l": "saydam PNG"}, {"a": "cp", "b": "rl", "k": "img", "l": "kompozit"}, {"a": "cp", "b": "rr", "k": "img", "l": "kompozit"}, {"a": "rl", "b": "chk", "k": "img"}, {"a": "rr", "b": "chk", "k": "img"}, {"a": "chk", "b": "up", "k": "img"}], "groups": [{"c1": 0, "c2": 1, "label": "Müşteri fotoğrafı", "r1": 0, "r2": 0}, {"c1": 2, "c2": 3, "label": "E-ticaret", "r1": 0, "r2": 0}, {"c1": 2, "c2": 5, "label": "Kampanya", "r1": 1, "r2": 2}], "nodes": [{"c": 0, "id": "src", "pv": {"ar": "4:5", "k": "img", "m": "🎧", "tag": "dağınık çalışma masası", "tone": "grey"}, "r": 0, "s": 1, "t": "gen", "text": "Gerçek fotoğraf yoksa bilerek üret.", "title": "Kötü müşteri fotoğrafı"}, {"c": 1, "id": "rm", "pv": {"k": "cutout", "m": "🎧"}, "r": 0, "s": 2, "t": "bg", "text": "Kafa bandının altı ve kenarlar temiz mi?", "title": "Arka planı kaldır", "tool": "Background Remover"}, {"c": 2, "id": "ec", "pv": {"ar": "4:5", "k": "img", "m": "🎧", "tag": "açık gri / beyaz", "tone": "white"}, "r": 0, "s": 3, "t": "bg", "title": "Düz fon", "tool": "Change Background"}, {"c": 3, "id": "sh", "pv": {"ar": "4:5", "k": "img", "m": "🎧", "tag": "e-ticaret formülü", "tone": "white"}, "r": 0, "s": 3, "t": "ps", "text": "Altına yumuşak koyu elips, bulanıklaştır.", "title": "Temas gölgesi", "tool": "Photoshop"}, {"c": 2, "id": "cp", "pv": {"k": "txt", "v": "dark concrete surface, soft spotlight from above, subtle cool blue neon glow, tech product launch mood"}, "r": 1, "s": 4, "t": "bg", "text": "Sonuç “yapıştırılmış” durur.", "title": "AI arka plan"}, {"c": 3, "chips": ["Change background açık", "strength orta"], "id": "rl", "pv": {"k": "txt", "v": "soft spotlight from above, cool blue rim light on the headphones, dark moody background"}, "r": 1, "s": 5, "t": "relight", "title": "Relight"}, {"c": 3, "id": "rr", "pv": {"ar": "4:5", "k": "img", "m": "🔊", "tag": "teknoloji reklamının sadece ışığı", "tone": "dark"}, "r": 2, "s": 6, "t": "relight", "text": "Prompt mu, referans mı daha iyi?", "title": "Referansla relight"}, {"c": 4, "id": "chk", "pv": {"items": ["Hâlâ mat siyah mı?", "Şekil ve logo aynı mı?", "Değiştiyse strength düşür"], "k": "list"}, "r": 1, "s": 7, "t": "ps", "title": "Ürün değişti mi?", "tool": "Photoshop maske"}, {"c": 5, "end": true, "id": "up", "pv": {"ar": "4:5", "k": "img", "m": "🎧", "tag": "kampanya görseli", "tone": "dark"}, "r": 1, "s": 8, "t": "upscale", "title": "Bitir", "tool": "Upscaler + tarif kartı"}], "title": "Dekupe ürünü düz fona koymak kolay; sahneye oturtan relight'tır"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Bir postu story'ye genişletirken prompt'a görselde zaten olan ana nesneyi ve sahneyi baştan yazdın. Yeni açılan alanda ne olmasını beklersin, neden?\n2. Genişletilmiş bir görseli müşteriye teslim etmeden önce mutlaka yapman gereken adım ne, neden?\n\n### Konu\n\nŞimdiye kadar görselin bir parçasını değiştirdik (inpaint) ve dışına doğru büyüttük (expand). Bu derste görseli ikiye ayırıyoruz: ana nesne (ürün, kişi, tabak) ve arkasındaki her şey. Arka plan kaldırma, AI'ın ana nesneyi otomatik tanıyıp etrafını silmesidir; geriye arkası saydam bir görsel kalır. Arka plan değiştirme, o boşluğa yeni bir fon koymaktır. Işığı değiştirme (relight) ise ana nesnenin üzerine düşen ışığı yeni sahneye göre baştan hesaplatmaktır.\n\nBenzetme: Bir ürünü fotoğraf stüdyosundan alıp başka bir sete taşıdığını düşün. Arka plan kaldırma, ürünü masadan kaldırmak. Arka plan değiştirme, yeni sete koymak. Ama yeni sette ışık farklıdır: gün batımı turuncusu, gece konser ışığı, stüdyo softbox'ı. Ürünün üzerine o ışık düşmezse \"buraya yapıştırılmış\" gibi durur. Relight, ışıkçıyı çağırıp yeni sete göre ışığı yeniden kurdurmaktır.\n\nNeden önemli: Ajans işlerinin büyük kısmı tam olarak bu. Müşteri telefonla çekilmiş, arkasında dağınık raf olan bir ürün fotoğrafı gönderir; sen bunu temiz bir e-ticaret görseline, sonra da şık bir kampanya görseline çevirirsin. Sanatçı fotoğrafını konser afişine, tabağı restoranın menü görseline koyarsın. Photoshop'ta saatler süren dekupe (nesneyi kenarından kesip çıkarma) artık saniyeler sürüyor. Ama asıl fark relight'ta: eskiden kesip yapıştırdığın her görsel \"montaj\" gibi dururdu; şimdi ışığı ve gölgeyi sahneye uydurabiliyorsun.\n\nÜç işin farkını net tut:\n\n- Arka plan kaldırma: Sadece siler. Çıktı saydam PNG'dir. Photoshop'ta katman olarak kullanırsın. Kredi derdi yok denecek kadar ucuz; Magnific ücretsiz hesapta bile günde bir kez izin veriyor.\n- Arka plan değiştirme: Siler ve yerine bir şey koyar: düz renk, degrade, stok fotoğraf, kendi yüklediğin görsel ya da AI'ın prompt'la ürettiği bir sahne. Magnific'te bunun ayrı bir aracı var (Change Background / Background Changer).\n- Relight: Nesneyi yerinde bırakır, üzerindeki ışığı değiştirir. İstersen arka planı da yeni ışığa göre yeniden üretir. Kesip yapıştırmanın \"montaj\" görüntüsünü yok eden adım budur.\n\nMagnific'te Relight nasıl düşünür: Işığı üç yoldan tarif edebilirsin. Birincisi prompt: \"warm golden hour light from the left\" gibi. İkincisi referans görsel (ışık aktarımı / light transfer): beğendiğin bir fotoğrafın ışığını alıp senin görseline uygular. \"Bu reklamdaki gibi ışık olsun\" demenin en kolay yolu. Üçüncüsü ışık haritası (light map): siyah zemin üzerine renkli lekeler çizdiğin basit bir görsel; nerede renkli leke varsa ışık oradan gelir. Referans görsel ile ışık haritası birlikte kullanılmıyor, ikisinden birini seçersin.\n\nRelight'ta bilmen gereken ayarlar:\n\n- Light transfer strength (ışık aktarım gücü): Yeni ışık ne kadar baskın olsun. Düşük değer orijinale yakın kalır, yüksek değer tamamen dönüştürür. Ürün işlerinde orta değerlerden başla; çok yüksekte ürünün rengi ve etiketi değişebilir.\n- Change background (arka planı değiştir): Açıksa arka planı da yeni ışığa göre yeniden üretir; ürün ve portrede işe yarar. Mekân ve manzara fotoğraflarında kapat, yoksa mekânın kendisi değişir.\n- Style (stil): Daha karanlık ama gerçekçi, temiz, yumuşak, daha parlak, kontrastlı/HDR gibi hazır yönler. Önce standard ile başla.\n- Engine (motor): Farklı içerik türleri için hazır ayarlar (dengeli, gerçekçi, soğuk, masalsı vb.). Fotoğraf işinde dengeli ya da gerçekçi seçenek güvenli başlangıç.\n- Fixed generation (sabit üretim): Aynı ayarlarla hep aynı sonucu verir. Ders 6'daki seed mantığı: ayarları tek tek değiştirip farkı görmek için aç.\n- Vurgu yazımı: Prompt'ta bir ifadeyi parantez ve sayıyla güçlendirebilirsin: `(dark scene:1.3)`. 1 ile 1.4 arası kullan; daha fazlası görseli bozar.\n\nPhotoshop tarafı: Photoshop'ta Remove Background (arka planı kaldır) tek tık ile maskeli bir katman verir; Generate Background (arka plan üret) prompt'la fon üretir. Yeni gelen Harmonize (uyumlandır) ise bir nesneyi başka bir fotoğrafa koyduğunda renk, ışık ve gölgesini o sahneye otomatik uydurur. Yani Photoshop'ta çalışırken Relight'ın küçük kardeşi Harmonize. Ajans pratiğinde iyi bir akış: AI'da kaldır/değiştir/relight yap, son dokunuşu (logo, yazı, temas gölgesi) Photoshop'ta ver.\n\nAltın kural: Işık yönü ve gölge. İnsan gözü bir montajı en çok iki şeyden yakalar: ışığın yanlış taraftan gelmesi ve nesnenin altında gölge olmaması. Arka planda güneş soldaysa üründeki parlama da solda olmalı. Ürün bir yüzeye oturuyorsa altında koyu, kısa bir temas gölgesi olmalı; yoksa havada uçar.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Arka plan kaldırma | Ana nesneyi tanıyıp etrafındaki her şeyi silmek | background removal, remove bg |\n| Saydam PNG | Arkası boş (transparan) görsel; JPG saydamlığı taşıyamaz | transparent PNG, alpha channel |\n| Dekupe / kenar ayırma | Nesneyi kenarından temizce kesmek; en zor yerleri saç, tüy, cam | cutout, matting, edge refinement |\n| Kompozit | Farklı görsellerden parçaları tek sahnede birleştirmek | composite |\n| Yeniden ışıklandırma | Görseldeki ışığın yönünü, rengini, sertliğini değiştirmek | relight, relighting |\n| Işık aktarımı | Bir referans görselin ışığını kendi görseline uygulamak | light transfer, lighting reference |\n| Işık haritası | Işığın nereden ve hangi renkte geleceğini gösteren basit renk lekeli görsel | light map |\n| Temas gölgesi | Nesnenin yüzeye değdiği yerde oluşan kısa, koyu gölge | contact shadow, ground shadow |\n\n### Görsel örnek\n\n![1: Düz fonda ürün](img/d15-1.jpg)\n![2: Arka plan değişti (montaj hissi)](img/d15-2.jpg)\n![3: Relight ile ışık sahneye uydu](img/d15-3.jpg)\n\nKulaklık önce düz fonda, sonra karanlık beton sahnede; relight mavi kontur ışığını ekleyince 'yapıştırılmış' görüntü kayboluyor.\n\nNasıl üretildi: Nano Banana 2 Lite, 4:5: önce düz açık gri fonda mat siyah kulaklık. Sonra bu görseli referans verip 'dark concrete surface, soft spotlight from above, subtle cool blue neon glow' ile yeni sahneye yerleştirildi. En son Relight ile üstten yumuşak ışık ve arkadan mavi kontur eklendi.\n\n### Uygulama\n\nSenaryo: Bir elektronik markası, yeni kablosuz kulaklığının telefonla çekilmiş bir fotoğrafını gönderdi. Kulaklık mat siyah, kulak kapağında küçük bir logo var; arkasında masa örtüsü, kablolar ve dağınık eşyalar görünüyor. Senden iki şey istiyor: e-ticaret sitesi için temiz bir ürün görseli ve Instagram için şık bir kampanya görseli.\n\n1. Hazırlık: Elinde gerçek bir ürün fotoğrafı yoksa Magnific'te üret: `matte black over-ear wireless headphones with a small silver logo on the ear cup, on a messy desk with cables and papers, phone photo, flat indoor lighting`. Bu bilerek kötü bir \"müşteri fotoğrafı\".\n2. Arka planı kaldır: Görseli Background Remover'a ver. Çıkan saydam PNG'yi büyüterek incele: kafa bandının altındaki boşluk (içinden masanın göründüğü yer) temizlenmiş mi? Kulak yastıklarının kenarları kesilmiş mi? İç boşluklar AI'ın en sık atladığı yerdir.\n3. E-ticaret görseli: Change Background'da düz açık gri ya da beyaz bir fon seç. Görsele bak: kulaklık havada mı duruyor? Duruyorsa Photoshop'ta altına yumuşak, koyu bir elips çizip bulanıklaştırarak temas gölgesi ekle. E-ticarette sade fon + temas gölgesi standart formüldür.\n4. Kampanya görseli: Aynı saydam kulaklığı bu kez AI ile üretilmiş bir arka plana koy. Arka plan prompt'u: `dark concrete surface, soft spotlight from above, subtle cool blue neon glow, tech product launch mood`. Sonuç muhtemelen \"yapıştırılmış\" duracak: kulaklık düz ışıklı, fon ise dramatik.\n5. Relight ile birleştir: Kompozit görseli Relight'a ver. Prompt: `soft spotlight from above, cool blue rim light on the headphones, dark moody background`. Change background açık olsun, strength'i ortadan başlat. Kulaklığın kenarlarında arkadan gelen mavi bir parlama ve fonla uyumlu ışık görüyor musun?\n6. Referans ile dene: İnternette beğendiğin bir teknoloji ürünü reklamını referans görsel olarak yükle (sadece ışığını alıyoruz, görüntüsünü kopyalamıyoruz). Aynı görseli bir de bu referansla relight et. Prompt'la mı, referansla mı daha iyi sonuç aldın?\n7. Kontrol et: Kulaklık hâlâ mat siyah mı, parlak ya da gri olmuş mu? Logo ve kulaklığın şekli değişmiş mi? Relight bazen ürünün kendisini de \"yeniden yorumlar\". Değiştiyse strength'i düşür ya da Photoshop'ta orijinal ürünü maskeyle geri getir.\n8. Bitir: En iyi sonucu upscale et (Ders 7). Tarif kartına \"Relight\" başlığı aç: hangi strength, hangi stil, prompt mu referans mı daha iyi çalıştı, not al.\n\n### Örnek prompt'lar\n\nRelight prompt'u sahnedeki nesneyi değil, ışığı ve ortamı anlatır. Ürünü yeniden tarif etmene gerek yok, o zaten görselde.\n\n`(soft diffused studio light:1.2), clean light grey seamless background, subtle contact shadow`\n\nElektronik / e-ticaret: Temiz ürün sayfası görseli. \"diffused\" sert parlamaları yumuşatır, \"seamless background\" köşesiz düz fon ister, vurgu (1.2) yumuşak ışığı öne çıkarır. Mat siyah ürünlerde yumuşak ışık, yüzey dokusunun kaybolmasını da önler.\n\n`portable speaker lit by dramatic rim light from behind, wet black stone surface, dark moody studio, soft reflections`\n\nElektronik kampanya (taşınabilir hoparlör): Arkadan gelen kenar ışığı (rim light) hoparlörün hatlarını parlatır, ıslak taş yansıma yaratır. Lansman görseli için klasik \"premium teknoloji\" havası.\n\n`warm golden hour sunlight from the left, long soft shadows, blurred café terrace in the background`\n\nKafe tanıtımı: İçeride çekilmiş bir kahve fincanını açık hava terasına taşırken. Işığın yönünü (\"from the left\") yazmak gölgenin tutarlı düşmesini sağlar.\n\n`concert stage lights at night, strong cool white backlight, purple smoke haze, dark crowd silhouettes`\n\nKonser / etkinlik afişi: Gün ışığında çekilmiş düz ışıklı bir sanatçı fotoğrafını konser gecesi atmosferine sokmak. Etkinliğin renk paletini dumana vermek afişi markaya bağlar.\n\n`(warm candlelight:1.2) from the right, cozy dim restaurant interior, bokeh lights in the background`\n\nRestoran tanıtımı: Gün ışığında çekilmiş bir tabağı akşam yemeği havasına çevirmek. Bokeh (arka plandaki yuvarlak bulanık ışıklar) sıcaklık ve derinlik katar.\n\n### Sık yapılan hatalar\n\n- **Kenarlara bakmamak.** Saç, tüy, cam bardak, kulaklık bandının altı gibi yerler en sık bozulan kısımlardır. Kaldırma sonrası görseli büyütüp mutlaka kontrol et; gerekirse Photoshop'ta maskeyle düzelt.\n- **Saydam görseli JPG olarak kaydetmek.** JPG saydamlığı taşımaz, arka plan beyaz ya da siyah olur. Saydam görsel her zaman PNG.\n- **Gölgesiz ve ışığı uyuşmayan kompozit.** Fonda ışık soldan gelirken ürün sağdan aydınlanmışsa ya da ürünün altında gölge yoksa göz hemen montajı yakalar. Relight ya da Photoshop'ta Harmonize ile ışığı eşitle, temas gölgesini ekle.\n- **Relight'ta ürünü kaybetmek.** Strength çok yüksekse ürünün rengi, etiketi ya da şekli değişebilir. Müşterinin ürünü değişmemeli: strength'i düşür, sonucu orijinalle yan yana kontrol et; logo ve yazıyı her zaman orijinalden ya da Photoshop'tan geri getir.\n\n### Profesyonel yöntem\n\nÜrün görseli üreten profesyonel ekipler tek bir \"güzel görsel\" yerine, aynı üründen planlı bir set çıkarır. Sektörde sık önerilen set dört temel kareden oluşur ve bu dersteki arka plan + relight becerisi tam olarak bu seti kurmaya yarar:\n\n1. Beyaz fon: E-ticaretin ana görseli. Sade fon, yumuşak ışık, altta temas gölgesi.\n2. Degrade / stüdyo fonu: Premium his. Fonda yumuşak bir renk geçişi, üründe kontrollü stüdyo ışığı.\n3. Yüzey / kahraman karesi: Ürün bir yüzeyin (taş, ahşap, beton) üstünde, dokuyla ve net bir temas gölgesiyle. Kampanyanın ana görseli genelde budur.\n4. Kullanım anı (lifestyle): Ürün gerçek hayatta, örneğin kulaklık birinin boynunda ya da masada bir laptopun yanında.\n\nBu seti kurarken deneyimli üreticilerin önerdiği sıra şöyle: Önce ürünü olabildiğince temiz bir hâle getir. Relight en iyi sonucu iyi aydınlatılmış, beyaz ya da sade fonlu bir ürün görselinde verir; dağınık ve karanlık bir fotoğrafı doğrudan dramatik sahneye sokmaya çalışmak yerine, önce arka planı kaldırıp düz fonlu temiz bir sürüm çıkar, sonra onu relight'a ver. Araçta ürün detayını koruma seçeneği (Preserve Details gibi) varsa açık tut. Işığı değiştirdikten sonra keskinliği Precision upscale ile geri kazan: önce ışık, sonra netlik. Bu sıra ters olursa upscale'in eklediği detaylar relight sırasında yeniden yorumlanabilir.\n\nSon olarak her kareyi teslimden önce kısa bir kontrol listesinden geçir: ışık yönü fonla tutarlı mı, temas gölgesi gerçekçi mi, ölçek doğru mu (kulaklık masadaki kupaya göre dev gibi durmuyor mu), cam ve metal yüzeylerde yansıma temiz mi, logo ve renkler orijinal ürünle aynı mı? Bu beş soru, \"montaj gibi duruyor\" yorumlarının neredeyse hepsini teslimden önce yakalar.\n\n### Ödev\n\nÜzerinde çalıştığın ya da yakında gelecek bir işten bir ürün fotoğrafı seç; uygun bir görsel yoksa Magnific'te kulaklık, hoparlör ya da akıllı saat gibi bir elektronik ürünün kötü çekilmiş bir fotoğrafını üret.\n\n1. Bundan iki görsel çıkar: sade fonlu, temas gölgeli bir e-ticaret görseli ve AI üretilmiş bir sahnede, relight ile ışığı eşitlenmiş bir kampanya görseli.\n2. Relight'ı en az üç farklı şekilde dene: sadece prompt ile, bir referans görselle ve iki farklı strength değeriyle.\n3. Kampanya görselini Photoshop'a al ve aynı kompoziti bir de Harmonize ile dene; Magnific Relight ile karşılaştır.\n4. Toplam 20-30 dakika ayır. Orijinal fotoğrafı, iki sonucu ve ayarlarını Claude'a göster; ışık yönünün tutarlı olup olmadığı, kenarların temizliği ve ürünün bozulup bozulmadığı üzerine yorum isteyebilirsin.\n\n### Tekrar sorularının cevapları\n\n1. Model yeni açılan alana ana nesnenin ikinci bir kopyasını çizer. Çünkü expand prompt'u sadece yeni alanı anlatır; sahnenin tamamını yazarsan model onu boş alana tekrar koymaya çalışır. Ya sadece yeni alanı tarif et ya da boş bırak.\n2. Upscale. Genişletme sonucu genelde orijinalden küçük çözünürlükte gelir (yaklaşık 1.6 megapiksel). Teslim sırası: üret → düzelt → genişlet → upscale.\n\nSıradaki ders: Rötuş ve ürün fotoğrafı iyileştirme\n\n### Kaynaklar\n\n- [Magnific API: Relight parametreleri](https://docs.magnific.com/api-reference/image-relight/post-image-relight)\n- [Magnific: Background Remover](https://www.magnific.com/ai/background-remover)\n- [Magnific: Background Changer](https://www.magnific.com/ai/change-background)\n- [Adobe: Photoshop'ta Harmonize](https://helpx.adobe.com/photoshop/desktop/repair-retouch/remove-objects-fill-space/blend-subjects-with-harmonize.html)\n", "module": 2, "moduleName": "Görseli kontrol etmek", "n": 15, "summary": ["Arka plan kaldırma ürünü saydam PNG olarak ayırır, arka plan değiştirme ona yeni bir fon verir.", "Relight, ürünün üzerindeki ışığı yeni sahneye göre yeniden kurar ve montaj görüntüsünü ortadan kaldırır.", "Montajı en çok yanlış yönden gelen ışık ve eksik temas gölgesi ele verir.", "Relight'ta strength'i ortadan başlat; çok yüksek değer ürünün rengini, şeklini ve logosunu değiştirebilir.", "Saydam görseli her zaman PNG kaydet, son dokunuşları ve logoyu Photoshop'ta ver."], "title": "Arka plan kaldırma/değiştirme, ışığı değiştirme (relight)"}, {"checked": "Ekim 2026", "date": "6 Ekim 2026", "flow": {"edges": [{"a": "src", "b": "dx", "k": "f"}, {"a": "dx", "b": "er", "k": "f", "l": "kusur listesi"}, {"a": "er", "b": "rt", "k": "img"}, {"a": "rt", "b": "adj", "k": "img"}, {"a": "adj", "b": "up", "k": "img"}, {"a": "skin", "b": "up", "k": "img"}, {"a": "up", "b": "ps", "k": "img"}, {"a": "ps", "b": "ba", "k": "img"}], "groups": [{"c1": 0, "c2": 1, "label": "Teşhis", "r1": 0, "r2": 0}, {"c1": 2, "c2": 3, "label": "Temizle", "r1": 0, "r2": 0}, {"c1": 4, "c2": 4, "label": "Renk ve cilt", "r1": 0, "r2": 1}, {"c1": 5, "c2": 7, "label": "Netlik ve kontrol", "r1": 0, "r2": 0}], "nodes": [{"c": 0, "id": "src", "pv": {"ar": "4:5", "k": "img", "m": "☕", "tag": "toz, parmak izi, sarı ışık", "tone": "yellow"}, "r": 0, "s": 1, "t": "gen", "text": "Orijinali ayrı klasöre koy, kopyada çalış.", "title": "Kusurlu kupa fotoğrafı"}, {"c": 1, "id": "dx", "pv": {"items": ["Toz noktaları", "Parmak izleri", "Kil kırıntıları", "Sarı renk", "Bulanıklık"], "k": "list"}, "r": 0, "s": 2, "t": "claude", "title": "Teşhis", "tool": "Claude / kendi gözün"}, {"c": 2, "chips": ["Eraser", "prompt yok"], "id": "er", "pv": {"k": "mask", "m": "☕", "shape": "brush", "tag": "kusurun biraz dışına taş", "tone": "yellow"}, "r": 0, "s": 3, "t": "retouch", "text": "Bir seferde tek bölge.", "title": "Temizlik"}, {"c": 3, "chips": ["Retouch", "Lasso"], "id": "rt", "pv": {"k": "txt", "v": "clean glossy glaze surface, no fingerprints"}, "r": 0, "s": 4, "t": "retouch", "text": "Seçim el damgasına taşmasın.", "title": "Yerine koy"}, {"c": 4, "id": "adj", "pv": {"items": [["Sıcaklık", -12], ["Pozlama", 6], ["Kontrast", 5]], "k": "sl"}, "r": 0, "s": 5, "t": "adjust", "text": "Beyaz örtü temiz beyaz, sırın rengi aynı.", "title": "Işık ve renk", "tool": "Adjust · kredi yok"}, {"c": 4, "id": "skin", "pv": {"a": {"m": "✋", "tag": "Faithful", "tone": "warm"}, "b": {"m": "✋", "tag": "Flexible", "tone": "warm"}, "k": "ba"}, "r": 1, "s": 6, "t": "skin", "text": "Grain düşük ama sıfır değil.", "title": "El fotoğrafı", "tool": "Skin Enhancer"}, {"c": 5, "chips": ["Precision"], "id": "up", "pv": {"a": "1x", "b": "2x", "k": "up"}, "r": 0, "s": 7, "t": "upscale", "text": "Creative damgayı ve sır desenini yeniden yorumlayabilir.", "title": "Netlik"}, {"c": 6, "id": "ps", "pv": {"items": ["Damga maskesi", "Rötuşlu", "Orijinal"], "k": "layers"}, "r": 0, "s": 8, "t": "ps", "text": "Damga birebir aynı mı? Değilse orijinalden geri al.", "title": "Son kontrol", "tool": "Photoshop"}, {"c": 7, "end": true, "id": "ba", "pv": {"a": {"m": "☕", "tag": "önce", "tone": "yellow"}, "b": {"m": "☕", "tag": "sonra", "tone": "white"}, "k": "ba"}, "r": 0, "s": 9, "t": "compare", "title": "Önce / sonra"}], "title": "Önce temizlik, sonra renk, sonra güzelleştirme, en son upscale"}, "genhq": false, "level": "Orta", "md": "### Hızlı tekrar\n\n1. Relight'ta \"Change background\" seçeneğini hangi tür fotoğraflarda kapatırsın, neden?\n2. Bir kompozit görselde montajı göze en çok ele veren iki şey nedir?\n\n### Konu\n\nRötuş, bir fotoğrafı yeniden üretmeden temizlemek ve güzelleştirmektir. Toz, çizik, parmak izi, leke, kırışık etiket, kadraja girmiş bir kablo, yanlış renk, donuk ışık, yumuşak (net olmayan) kenarlar... Hepsini düzeltirsin ama ürün aynı ürün olarak kalır. Bugüne kadar öğrendiklerimizle (inpaint, expand, arka plan, relight) görseli değiştiriyorduk. Rötuşta amaç değiştirmek değil, aynı fotoğrafın en iyi hâline ulaşmak.\n\nBenzetme: Rötuş, bir arabayı satışa çıkarmadan önce oto kuaföre götürmek gibi. Araba aynı araba: modeli, rengi, plakası değişmiyor. Ama yıkanıyor, çizikleri pastayla alınıyor, farları parlatılıyor, iç döşemesi temizleniyor. Kuaför arabanın rengini değiştirirse bu artık bakım değil, başka bir araba olur. Ürün rötuşunda da sınır bu: kusuru gider, ürünü değiştirme.\n\nNeden önemli: Müşteriden gelen fotoğrafların çoğu telefonla, kötü ışıkta, tozlu bir masada çekilir. Özellikle küçük e-ticaret markaları ve el yapımı ürün satan atölyeler profesyonel çekime bütçe ayıramaz. Rötuşu iyi yapan tasarımcı, yeni çekim gerekmeden bu fotoğrafı e-ticarete, sosyal medyaya, hatta baskıya hazır hâle getirir. Bir de AI'ın kendi ürettiği görseller var: onlar da sık sık plastik gibi parlak cilt, bozuk küçük detaylar ve fazla pürüzsüz yüzeylerle gelir. Rötuş, AI görselini \"gerçek fotoğraf\" gibi gösteren son dokunuştur.\n\nRötuşu üç kat olarak düşün:\n\n1. Temizlik: Toz, çizik, parmak izi, leke, kırıntı, kablo, istenmeyen nesneler. Görselin küçük parçalarına dokunursun.\n2. Düzeltme: Işık, renk, beyaz dengesi, kontrast. Görselin tamamını etkiler.\n3. Güzelleştirme: Cilt, yansıma, parlaklık, netlik, doku. Ürünü ve kişiyi \"reklam kalitesine\" taşır.\n\nMagnific'te bu işlerin karşılığı Image Editor (görsel düzenleyici) içinde:\n\n- Eraser / Edit (silgi): Bir alanı seçip prompt yazmadan üretirsin; AI boşluğu çevresine bakarak doldurur. Toz, leke, kırıntı, kablo gibi küçük kusurlar için en hızlı yol.\n- Retouch: Bir alanı maskeleyip (seçip) oraya ne olması gerektiğini yazarsın. Üç seçim yolu var: click (tıkla, geniş alanlar için), lasso (kement, düzensiz şekiller için), brush (fırça, ince detaylar için). Silmek yerine \"yerine şunu koy\" demek istediğinde bunu kullan: parmak izli sır yerine temiz, parlak sır gibi. Bazı modellerde \"precise\" (aslına sadık) ve \"creative\" (daha serbest) tercihleri görürsün; ürün rötuşunda her zaman sadık olan tarafı seç.\n- Adjust (ayarlar) paneli: Pozlama, parlaklık, kontrast, doygunluk, sıcaklık (sarı-mavi dengesi), ton (yeşil-pembe dengesi) ve grain. Kredi harcamaz. Işık ve renk düzeltmesini burada ya da Photoshop'ta yap; bunun için AI üretimine gerek yok.\n- Skin Enhancer (cilt iyileştirici): Fotoğrafta insan varsa (ürünü tutan el, ürünü kullanan model) cildi gerçekçi hâle getirir. Üç modu var: Faithful (sadık, en az değişiklik), Flexible (dengeli, gündelik portreler için iyi başlangıç), Creative (daha stilize, güzellik ve sanatsal işler). Üç ayarı var: Sharpness (netlik), Grain (doku/gren, plastik görüntüyü kırar), Detail (gözenek, ince çizgi gibi mikro detaylar).\n- Upscale (Ders 7): Rötuşun son adımı. Precision modu ürünü değiştirmeden netleştirir.\n\nPhotoshop tarafı: Remove tool (kaldırma aracı) fırçayla boyadığın şeyi siler; kablo, insan ve küçük kusurlar için. Generative AI seçeneğini açıp kapatabilirsin: kapalıyken klasik içerik farkındalıklı doldurma (Content-Aware Fill, çevreden kopyalama) çalışır, açıkken AI yeni piksel üretir. Ayrıca kablo ve arka plandaki insanları otomatik bulan \"distraction removal\" (dikkat dağıtan şeyleri kaldırma) seçenekleri var. Işık ve renk için Camera Raw filtresi hâlâ en güvenilir yer.\n\nAltın kural: Önce temizlik, sonra ışık ve renk, sonra güzelleştirme, en son upscale. Upscale'i başa alırsan tozu ve çiziği de büyütür ve netleştirirsin, sonra daha büyük bir dosyada uğraşırsın. Ve her zaman orijinal dosyayı sakla; rötuşu kopyası üzerinde yap.\n\n### Terimler\n\n| Terim | Ne demek | İngilizcesi |\n| --- | --- | --- |\n| Rötuş | Fotoğrafı değiştirmeden kusurlarını gidermek, güzelleştirmek | retouching, photo retouch |\n| Leke / toz temizleme | Küçük kusurları (toz, leke, parmak izi) silmek | spot removal, dust removal, blemish removal |\n| Maske | Düzenlenecek alanı seçmek; AI sadece o alana dokunur | mask, selection |\n| Beyaz dengesi | Beyazın gerçekten beyaz görünmesi; sarı ya da mavi kaymayı düzeltmek | white balance, color temperature |\n| Pozlama | Görselin genel aydınlık seviyesi | exposure |\n| Keskinleştirme | Kenarları ve detayları netleştirmek | sharpening, clarity |\n| Doku / gren | Yüzeydeki ince doğal pürüzler; plastik görüntüyü kırar | texture, film grain, skin pores |\n| Plastik cilt | Aşırı pürüzsüzleştirilmiş, yapay görünen cilt | plastic skin, over-smoothed skin |\n\n### Görsel örnek\n\n![Önce: tozlu, parmak izli telefon fotoğrafı](img/d16-once.jpg)\n![Sonra: rötuşlanmış, el yapımı dokusu korunmuş](img/d16-sonra.jpg)\n\nRötuş ürünü değiştirmeden temizler: toz, parmak izi ve kırıntılar gidiyor, sır akıntısı gibi el yapımı izler kalıyor.\n\nNasıl üretildi: Nano Banana 2 Lite, 4:5: 'handmade blue glazed ceramic mug with glaze drips on white linen, fingerprints and dust on glaze, clay crumbs, warm yellow light, slightly soft phone photo'. Sonra Reimagine (Nano Banana modu): 'remove fingerprints, dust and crumbs, clean glossy glaze, neutral white balance; keep same mug, color and handmade glaze drips'.\n\nNot: Bu örnekte Reimagine kullanıldı; görsel yeniden çizildiği için ufak farklar var. Müşteri ürününde önce Retouch ve maskeli düzenlemeyi dene, ürünün şekli ve rengi birebir korunmalı.\n\n### Uygulama\n\nSenaryo: El yapımı seramik üreten küçük bir atölye, online mağazası için yeni sırlı kupasının telefonla çekilmiş bir fotoğrafını gönderdi. Kupanın sırında toz ve parmak izi var, masada kil kırıntıları var, ışık sarı, fotoğraf biraz bulanık. Kupanın yan tarafında atölyenin küçük el damgası (logosu) var. Bir de kupayı tutan bir el fotoğrafı var; el cildi pürüzsüz değil, ama çok da \"filtreli\" görünsün istemiyorlar. Önemli bir ayrıntı: el yapımı ürünün küçük düzensizlikleri (sır akıntısı, hafif asimetri) kusur değil, ürünün kendisi. Hedef: Instagram ve e-ticaret için temiz, net, gerçekçi bir ürün fotoğrafı.\n\n1. Hazırlık: Elinde gerçek fotoğraf yoksa Magnific'te bilerek kötü bir fotoğraf üret: `a handmade glazed ceramic mug with a small stamped logo on the side, on a white linen tablecloth, fingerprints and dust on the glaze, clay crumbs on the table, warm yellow indoor light, slightly blurry phone photo`. Orijinali ayrı bir klasöre kaydet; bundan sonra hep kopyası üzerinde çalış.\n2. Teşhis: Görseli büyütüp bak ve kusurların listesini çıkar: toz noktaları, parmak izleri, kil kırıntıları, sarı renk, bulanıklık. Sır akıntısı ve el yapımı izler listeye girmesin. İstersen Claude'a gösterip \"bu fotoğraftaki rötuş gereken yerleri listele\" de. Liste olmadan başlarsan bir kusuru düzeltirken ötekini unutursun.\n3. Temizlik (Eraser): Image Editor'da masadaki kil kırıntılarını ve sırdaki toz noktalarını fırçayla seç, prompt yazmadan üret. Kusurun biraz dışına taşan bir seçim yap: AI çevreyi görünce daha iyi doldurur. Bir seferde tek bölge temizle; tüm görseli tek seferde boyama.\n4. Yerine koyma (Retouch): Parmak izi olan sır yüzeyini lasso ile seç, prompt'a ne olması gerektiğini yaz: `clean glossy glaze surface, no fingerprints`. El damgasının üzerine seçim taşmamasına dikkat et: AI logoya dokunursa harfleri ve çizgileri bozar.\n5. Işık ve renk (Adjust): Sıcaklığı biraz soğuta çekip sarılığı al, beyaz keten örtü gerçekten beyaz görünsün. Pozlamayı ve kontrastı az az artır. Bu adım kredi harcamaz, rahatça dene. Kural: örtüdeki beyaz bir alan grimsi ya da sarımsı değil, temiz beyaz görünmeli; ama sırın gerçek rengi (örneğin toprak tonu ya da mavi) kaymamalı.\n6. El fotoğrafı (Skin Enhancer): Kupayı tutan el görselini Skin Enhancer'a ver. Faithful modla başla, Grain'i düşük ama sıfır olmayan bir değerde bırak. Sonra aynı görseli Flexible ile dene ve yan yana karşılaştır. Hangisi \"gerçek el\" gibi?\n7. Netlik (Upscale): Temizlenmiş, rengi düzeltilmiş görseli Precision upscale'den geçir. Ürün fotoğrafında Creative mod damgayı ve sır desenini \"yeniden yorumlayabilir\"; Precision güvenlidir.\n8. Photoshop'ta son kontrol: Sonucu Photoshop'ta orijinalin üstüne katman olarak koy. El damgası ve sır deseni birebir aynı mı? Bozulduysa orijinal katmandan maskeyle damgayı geri getir. Kalan küçük kusurlar için Remove tool'u bir kez Generative AI kapalı, bir kez açık dene.\n9. Önce/sonra: İki görseli yan yana koy. Tarif kartına \"Rötuş\" başlığı aç: hangi adım kaç kredi harcadı, hangi araç hangi kusurda iyi çalıştı, not al.\n\n### Örnek prompt'lar\n\nRötuş prompt'u bir sahne anlatmaz. Sadece seçtiğin küçük alanda ne olması gerektiğini kısa ve net söyler. Nesneyi yeniden tarif etme; seçimin dışındaki her şey zaten yerinde.\n\n`clean glossy glaze surface, no fingerprints, no dust`\n\nEl yapımı seramik (e-ticaret): Kupanın, tabağın ya da vazonun sırındaki izler için. \"no fingerprints\" gibi olumsuz ifadeleri kısa tut; asıl iş \"clean glossy glaze\" kısmında. Mat sırlı ürünlerde \"glossy\" yerine \"matte\" yaz, yoksa ürünün yüzeyi değişir.\n\n`seamless white linen tablecloth, no clay crumbs`\n\nEl yapımı seramik (ürün fotoğrafı): Ürünün etrafındaki kırıntı ve dağınıklık için. Yüzeyin malzemesini (\"white linen\") yazmak, AI'ın yanlış dokuyla doldurmasını engeller.\n\n`natural skin texture, visible pores, even skin tone`\n\nEl yapımı seramik (ürünü tutan el): Kupayı tutan elde küçük lekeler ve kızarıklıklar için. Gözenek (pores) yazmak, plastik cildin önüne geçer.\n\n`clean smooth glass surface, no fingerprints, no dust`\n\nKozmetik (serum ya da parfüm şişesi): Cam şişedeki izler için. Etiketin üzerine seçim taşırma; cam temizlenirken yazı bozulmasın.\n\n`smooth brushed aluminum surface, no scratches`\n\nElektronik (hoparlör, laptop, saat kasası): Metal yüzeydeki çizik ve lekeler için. \"brushed\" (fırçalanmış) yazmak, metalin kendine özgü ince çizgili dokusunu korur; yazmazsan AI ayna gibi pürüzsüz bir yüzey çizebilir.\n\n### Sık yapılan hatalar\n\n- **Ürünü değiştirmek.** Logo, etiket yazısı, ürün rengi ve şekli rötuşta değişmemeli; değişirse bu artık rötuş değil, müşteriyi ve son tüketiciyi yanıltan bir görsel olur. Seçimi etikete taşırma, son kontrolü orijinalle yan yana yap.\n- **Aşırı rötuş.** Her pürüzü silmek ürünü ve cildi plastik gibi gösterir. Biraz doku ve gren bırak; insan gözü \"fazla mükemmel\" görseli yapay bulur. El yapımı ürünlerde sır akıntısı ve küçük düzensizlikler ürünün değeridir, silme.\n- **Büyük alanı tek seferde boyamak.** AI geniş seçimde çevreyi anlayamaz ve tuhaf şeyler uydurur. Küçük, kusurun biraz dışına taşan seçimlerle tek tek ilerle.\n- **Sırayı karıştırmak.** Önce upscale yaparsan kusurları da büyütürsün. Önce temizlik, sonra ışık ve renk, sonra güzelleştirme, en son upscale.\n\n### Profesyonel yöntem\n\nProfesyonel rötuşçular işi \"gözüme batanı düzelteyim\" diye değil, sabit bir kontrol listesiyle bitirir. Çünkü rötuşta en büyük risk, bir kusuru düzeltirken başka bir şeyi bozmak ya da küçük ama önemli bir hatayı gözden kaçırmaktır. Sektörde ürün görselleri için sık kullanılan teslim öncesi kontrol lis
